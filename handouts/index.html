const CONTENT_VERSION='3.22.1';
const app=document.getElementById('app');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HL=c=>c==='zh'?'zh-Hant-TW':c;
let lang=(()=>{const n=(navigator.language||'en').toLowerCase();return n.startsWith('es')?'es':n.startsWith('zh')?'zh':(n.startsWith('kea')||n==='pt-cv')?'kea':'en'})();
function parse(){const m=location.hash.replace('#','').match(/^([a-z]+)?(?:-(en|es|kea|zh))?$/);if(m&&m[2])lang=m[2];return m&&ALL.some(h=>h.id===m[1])?m[1]:null}
function setHash(id){const h=id?`#${id}-${lang}`:(lang!=='en'?'#-'+lang:'');try{history.replaceState(null,'',location.pathname+location.search+h)}catch(e){}}
const isWarn=t=>/911|^Call us|^Llámenos|^Llame|^Txoma|^出現以下情況請致電/.test(t);
const ICON={ext:['🩸','🧊','🥤','🚭','🧂','🥣','💊','⚠️','💊','🤢','ℹ️','📞','🚑'],imp:['🩸','🧊','✋','🥣','🫧','🦷','ℹ️','🤧','🚭','💊','⚠️','💊','📞','🚑'],arch:['🧊','🦷','🥣','🪥','🚭','💊','⚠️','🗣️','📞','📅'],presed:['🍽️','🥤','💊','🚭','🚗','👕','🤒'],sed:['🧑‍🤝‍🧑','🚗','👶','🥤','🛏️','💉','🚑']};
function items(h,l){const xs=h.i[l].map((t,k)=>({t,ic:(ICON[h.id]||[])[k]||'',w:isWarn(t)}));return[...xs.filter(x=>x.w),...xs.filter(x=>!x.w)]}
function render(){const id=parse(),u=UI[lang];document.documentElement.lang=HL(lang);
 const top=`<header><h1>${u.title}</h1><div class="lang" role="group" aria-label="Language">${LANGS.map(([c,n])=>`<button data-l="${c}" lang="${HL(c)}" aria-pressed="${lang===c}">${n}</button>`).join('')}</div></header><p class="note" lang="${HL(lang)}">OMS Compass v${CONTENT_VERSION} · ${lang}<br>${esc(PATIENT_UI[lang].draft)}${lang==='en'?'':'<br>'+esc(PATIENT_UI[lang].translation)}</p>`;
 const call=`<a class="call top" href="tel:${TEL}">📞 ${u.call} · ${PHONE}</a>`,all=`<a class="all" href="#-${lang}" data-home>${u.all} ›</a>`;
 const rev=SITE.u?`<p class="revs"><a href="${esc(SITE.u)}" target="_blank" rel="noopener">★ ${esc(u.revBtn)} ↗</a></p>`:'';
 const L=faqL(lang),cards=(xs,l)=>`<div class="list">${xs.map(h=>`<a class="card" href="#${h.id}-${lang}"${l!==lang?` lang="${HL(l)}"`:''}>${esc(h.t[l])}<span>›</span></a>`).join('')}</div>`,only=L!==lang?`<p class="note" style="margin:0 0 8px">${u.faqOnly}</p>`:'';
 if(!id){document.title=u.title;app.innerHTML=`${top}${call}<h3 class="sec">${u.secHo}</h3>${cards(HO,lang)}<h3 class="sec">${u.secProc}</h3>${only}${cards(FAQ.filter(f=>f.k==='proc'),L)}<h3 class="sec">${u.secDx}</h3>${only}${cards(FAQ.filter(f=>f.k==='dx'),L)}<h3 class="sec">${OG_UI[lang].h}</h3>${cards(OG,lang)}<p class="note">${u.note}</p>${rev}`;return}
 const g=OG.find(x=>x.id===id);
 if(g){document.title=g.t[lang];app.innerHTML=`${top}${call}<button class="back" data-home>${u.back}</button><h2>${esc(g.t[lang])}</h2><div class="og">${g.r[lang].map(([q,a])=>`<h3>${esc(q)}</h3>${g.o[lang].map((o,k)=>`<p><b class="ogl ogl${k}">${esc(o)}</b> ${esc(a[k])}</p>`).join('')}`).join('')}</div><p class="note">${esc(OG_UI[lang].c)}</p><div class="row"><button class="btn" data-share>${u.share} ↗</button><button class="btn" data-print>${u.print}</button></div>${all}<p class="note">${u.note}</p>`;window.scrollTo(0,0);return}
 const f=FAQ.find(x=>x.id===id);
 if(f){document.title=f.t[L];app.innerHTML=`${top}${call}<button class="back" data-home>${u.back}</button>${only}<h2 lang="${HL(L)}">${esc(f.t[L])}</h2><div class="qa" lang="${HL(L)}">${f.i[L].map(([q,a])=>`<h3>${esc(q)}</h3><p${/911/.test(a)?' class="warn"':''}>${esc(a)}</p>`).join('')}</div><div class="row"><button class="btn" data-share>${u.share} ↗</button><button class="btn" data-print>${u.print}</button></div>${all}<p class="note">${u.note}</p>`;window.scrollTo(0,0);return}
 const h=HO.find(x=>x.id===id);document.title=h.t[lang];
 app.innerHTML=`${top}${call}<button class="back" data-home>${u.back}</button><h2>${esc(h.t[lang])}</h2><ul class="hol">${items(h,lang).map(x=>`<li${x.w?' class="warn"':''}><span class="ic" aria-hidden="true">${x.ic}</span><span>${esc(x.t)}</span></li>`).join('')}</ul><div class="row"><button class="btn" data-share>${u.share} ↗</button><button class="btn" data-print>${u.print}</button></div>${all}<p class="note">${u.note}</p>`;
 window.scrollTo(0,0)}
app.addEventListener('click',async e=>{const b=e.target.closest('button,a[data-home]');if(!b)return;if(b.tagName==='A')e.preventDefault();
 if(b.dataset.l){const id=parse();lang=b.dataset.l;setHash(id);render();return}
 if(b.hasAttribute('data-home')){setHash(null);render();return}
 if(b.hasAttribute('data-print')){window.print();return}
 if(b.hasAttribute('data-share')){const id=parse(),h=ALL.find(x=>x.id===id),url=location.href.split('#')[0]+`#${id}-${lang}`;
  try{if(navigator.share){await navigator.share({title:h.t[lang]||h.t.en,url});return}}catch(x){if(x&&x.name==='AbortError')return}
