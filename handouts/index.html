{id:"ext",t:{"en":"After tooth removal","es":"Después de una extracción dental","kea":"Dipôs di tira denti","zh":"拔牙后须知"},i:{
en:["Bite firmly on the gauze for 30 minutes. Some oozing for 1–2 days is normal.","Heavy bleeding: fold clean gauze, place it on the site and bite firmly for 30–60 minutes. Still bleeding? Bite on a moistened black tea bag for 30 minutes. Sit upright and rest. Still bleeding? Call us.","Ice the cheek 20 minutes on, 20 minutes off, for the first 36 hours. After that, use moist heat (a warm, damp cloth). Swelling is worst on day 2–3.","Keep your head raised on pillows for 2 nights. Sit up for 1 minute before standing, to avoid dizziness.","First 24 hours: no rinsing, spitting or straws. They can pull out the blood clot.","Do not smoke or vape for at least 72 hours, ideally 1 week. Smoking slows healing and raises the risk of a painful dry socket.","From day 2: rinse gently with warm salt water (½ teaspoon in 1 cup) after meals and at bedtime, 4–6 times a day. Brush your teeth gently. If we grafted the socket with Augma Shield, skip the salt water and use only the rinse we prescribed.","Soft foods for 2 weeks. No hard, crunchy or seedy food (nuts, chips, popcorn, seeds) for 3 weeks. Choose high-protein foods, do not skip meals, and drink plenty of fluids.","Pain (adults): ibuprofen (Advil, Motrin) 400 mg — 2 tablets of 200 mg — every 6 hours with food for 2–3 days, plus Tylenol 500–1,000 mg every 6 hours. You can take them at the same time. No more than 3,000 mg of Tylenol a day. Start before the numbness wears off.","Skip ibuprofen if you have kidney disease or stomach ulcers, take a blood thinner, are pregnant, or are allergic to aspirin or ibuprofen. Skip Tylenol if you have liver disease or drink heavily. If your prescription pain pill contains acetaminophen (for example, Percocet), do not also take Tylenol. Use a prescribed opioid only if this is not enough.","Finish any antibiotic we prescribed. If you get a rash or other reaction, stop it and call us.","No alcohol for 24 hours, or while taking opioid pain medicine.","Nausea: take nothing by mouth for 1 hour, then slowly sip ginger ale or tea. Eat and take your medicine once it settles.","Normal for a few days: bruising (often appears on day 2–3), jaw stiffness, a sore throat, and sharp bony edges you can feel with your tongue. Keep dry, cracked lip corners moist with Vaseline.","Stitches dissolve on their own. If one comes loose, you can throw it away. The socket fills in over about 1 month.","Dry socket: throbbing pain at the site or toward the ear that starts on day 2–3. Call us — it is easy to treat.","Call us: bleeding that will not stop with pressure; pain or swelling getting worse after day 3; fever over 100.4°F (38°C); bad taste or pus; numb lip, chin or tongue the next day.","Trouble breathing or swallowing: call 911."],
es:["Muerda firmemente la gasa durante 30 minutos. Es normal un poco de sangrado leve por 1–2 días.","Sangrado abundante: doble una gasa limpia, colóquela sobre la herida y muerda firme por 30–60 minutos. ¿Sigue sangrando? Muerda una bolsita de té negro humedecida por 30 minutos. Siéntese derecho y descanse. ¿Sigue sangrando? Llámenos.","Aplique hielo en la mejilla 20 minutos sí y 20 minutos no durante las primeras 36 horas. Después, use calor húmedo (un paño tibio y húmedo). La hinchazón es mayor el día 2–3.","Duerma con la cabeza elevada sobre almohadas durante 2 noches. Siéntese 1 minuto antes de ponerse de pie para evitar mareos.","Primeras 24 horas: no se enjuague, no escupa y no use popotes (pajillas). Esto puede desprender el coágulo.","No fume ni use cigarrillos electrónicos (vapeo) por al menos 72 horas, idealmente 1 semana. Fumar retrasa la cicatrización y aumenta el riesgo de alveolitis seca, que es muy dolorosa.","Desde el día 2: enjuáguese suavemente con agua tibia con sal (½ cucharadita en 1 taza) después de comer y al acostarse, 4–6 veces al día. Cepíllese los dientes con cuidado. Si injertamos el alvéolo con Augma Shield, no use agua con sal; use solo el enjuague recetado.","Comidas blandas por 2 semanas. Nada duro, crujiente ni con semillas (nueces, papitas, palomitas, semillas) por 3 semanas. Elija alimentos ricos en proteína, no se salte comidas y tome muchos líquidos.","Dolor (adultos): ibuprofeno (Advil, Motrin) 400 mg —2 tabletas de 200 mg— cada 6 horas con comida por 2–3 días, más Tylenol 500–1,000 mg cada 6 horas. Puede tomarlos al mismo tiempo. No tome más de 3,000 mg de Tylenol al día. Empiece antes de que se pase la anestesia.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado o bebe mucho alcohol. Si su analgésico recetado contiene acetaminofén (por ejemplo, Percocet), no tome Tylenol además. Use un opioide recetado solo si esto no es suficiente.","Termine el antibiótico si se lo recetamos. Si le sale un sarpullido u otra reacción, suspéndalo y llámenos.","No tome alcohol por 24 horas, ni mientras tome analgésicos opioides.","Náuseas: no tome nada por la boca durante 1 hora; luego tome sorbos lentos de ginger ale o té. Coma y tome sus medicinas cuando se le pase.","Es normal por unos días: moretones (suelen aparecer el día 2–3), rigidez de la mandíbula, dolor de garganta y bordes de hueso filosos que siente con la lengua. Si las comisuras de los labios se secan o agrietan, póngase vaselina.","Los puntos se disuelven solos. Si uno se suelta, puede tirarlo. El alvéolo se rellena en aproximadamente 1 mes.","Alveolitis seca: dolor pulsátil en la zona o hacia el oído que empieza el día 2–3. Llámenos; se trata fácilmente.","Llámenos si tiene: sangrado que no para con presión; dolor o hinchazón que empeora después del día 3; fiebre de más de 100.4°F (38°C); mal sabor o pus; labio, mentón o lengua adormecidos al día siguiente.","Dificultad para respirar o tragar: llame al 911."],
kea:["Morde firmi na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal.","Si sangi txeu: dobra un gaza linpu, poi-l riba di ferida i morde firmi pa 30–60 minutu. Inda sa ta sangra? Morde un saketa di xá pretu moladu pa 30 minutu. Senta direitu i diskansa. Inda sa ta sangra? Txoma-nu.","Poi jelu na fasi 20 minutu, tira 20 minutu, duranti 36 purmeru ora. Dipôs, uza kalor úmidu (un panu mornu i moladu). Inxason ta fika más grandi na dia 2–3.","Dormi ku kabesa altu na almofada pa 2 noti. Senta 1 minutu antis di labanta, pa ka bu xinti tontura.","Purmeru 24 ora: ka bu lava boka, ka bu kuspi i ka bu uza palinha. Es kuzas pode tira kuágulu di sangi.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 72 ora, midjór 1 simana. Fuma ta atraza kura i ta aumenta risku di alvéolu seku, ki ta dói txeu.","A partir di dia 2: lava boka divagarinhu ku agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi i óra di bai dormi, 4–6 bes pa dia. Skova denti ku kuidadu. Si nu poi enxertu na buraku ku Augma Shield, ka bu uza agu ku sal; uza só rémédiu di lava boka ki nu pasa-bu.","Kumida mol pa 2 simana. Nada duru, ki ta stala o ku simenti (nozis, xips, pipoka, simenti) pa 3 simana. Skodje kumida ku txeu proteína, ka bu salta kumida i bebe txeu líkidu.","Dor (adultu): ibuprofénu (Advil, Motrin) 400 mg — 2 kumprimidu di 200 mg — di 6 en 6 ora ku kumida pa 2–3 dia, i Tylenol 500–1,000 mg di 6 en 6 ora. Bu pode toma es dos na mesmu óra. Ka bu toma más di 3,000 mg di Tylenol pa dia. Kumesa antis di anestezia pasa.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma rémédiu pa sangi ka fika gros (anti-koagulanti), si bu sta grávida, o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu o si bu ta bebe txeu. Si bu rémédiu di dor di reseita ten asetaminofénu (pur izénplu Percocet), ka bu toma Tylenol tanbe. Uza opioidi di reseita só si kel-li ka sta txiga.","Si nu pasa-bu antibiótiku, toma-l ti kaba. Si bu tene manxa na pele o otu reason, para di toma-l i txoma-nu.","Ka bu bebe álkool pa 24 ora, nen enkuantu bu sta ta toma rémédiu pa dor opioidi.","Nóziu: ka bu po nada na boka pa 1 ora; dipôs bebe golinhu divagar di ginger ale o xá. Kumi i toma rémédiu kantu pasa.","Normal pa uns dia: manxa roxu (txeu bes ta aparse na dia 2–3), kexada duru, garganta dodu, i pontas di osu fínu ki bu ta xinti ku língua. Si kantu di boka seka o raxa, poi vazelina.","Pontu ta dizolve sozinhu. Si un sai, bu pode djoga-l fora. Buraku ta intxi na más o menus 1 mês.","Alvéolu seku: dor ki ta latejá na lugar o pa ladu di orelha, ki ta kumesa na dia 2–3. Txoma-nu; ta trata fásil.","Txoma-nu si: sangi ki ka ta para ku prison; dor o inxason ki sta ta piora dipôs di dia 3; febri más di 100.4°F (38°C); gostu mau o pus; lábiu, kexu o língua dormenti na dia sigínti.","Si bu tene difikuldadi di rispira o di ingoli: txoma 911."],
zh:["用力咬住纱布30分钟。1–2天内有少量渗血属正常现象。","出血较多时：将干净纱布折叠，放在伤口上用力咬住30–60分钟。仍在出血？咬住一个浸湿的红茶包30分钟，坐直休息。仍在出血？请致电我们。","头36小时在脸颊冷敷，敷20分钟、停20分钟。之后改为湿热敷（温湿毛巾）。肿胀在第2–3天最明显。","睡觉时用枕头垫高头部，持续2晚。起身前先坐1分钟，以免头晕。","头24小时内：不要漱口、吐口水或用吸管，以免血块脱落。","至少72小时内不要吸烟或吸电子烟，最好1周。吸烟会减慢愈合，并增加疼痛的干槽症风险。","从第2天起：饭后和睡前用温盐水（1杯水加½茶匙盐）轻轻漱口，每天4–6次。轻轻刷牙。如果我们在拔牙窝植入了Augma Shield，请不要用盐水，只用我们开的漱口水。","吃软食2周。3周内不要吃硬的、脆的或有籽的食物（坚果、薯片、爆米花、种子）。多吃高蛋白食物，不要不吃饭，多喝水。","止痛（成人）：布洛芬（Advil、Motrin）400毫克（200毫克片剂2片），每6小时一次，随餐服用，持续2–3天；同时服用泰诺（Tylenol）500–1,000毫克，每6小时一次。两种药可以同时服用。泰诺每天不超过3,000毫克。在麻药消退前开始服用。","以下情况不要服用布洛芬：肾病、胃溃疡、正在服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。有肝病或大量饮酒者不要服用泰诺。如果您的处方止痛药含有对乙酰氨基酚（例如Percocet），不要再另外服用泰诺。只有在以上方法止痛不够时才服用处方阿片类药物。","如果我们开了抗生素，请服完全程。如出现皮疹或其他反应，请停药并致电我们。","24小时内不要饮酒；服用阿片类止痛药期间也不要饮酒。","恶心：1小时内不要经口进食任何东西；之后慢慢小口喝姜汁汽水或茶。好转后再进食和服药。","以下情况几天内属正常：淤青（常在第2–3天出现）、下颌僵硬、喉咙痛，以及用舌头能摸到的尖锐骨边。嘴角干裂时可涂凡士林。","缝线会自行溶解。如有一根松脱，可以直接丢掉。拔牙窝大约1个月会长满。","干槽症：第2–3天开始在伤口处或向耳朵方向出现跳痛。请致电我们，很容易处理。","出现以下情况请致电我们：按压后仍止不住的出血；第3天后疼痛或肿胀加重；发烧超过100.4°F（38°C）；口中有异味或有脓；第二天嘴唇、下巴或舌头仍然麻木。","呼吸或吞咽困难：请拨打911。"]}},
{id:"imp",t:{"en":"After implant, bone graft or sinus lift surgery","es":"Después de implantes, injerto óseo o elevación de seno","kea":"Dipôs di implanti, enxertu di osu o levantamentu di seiu","zh":"种植牙、植骨或上颌窦提升术后须知"},i:{
en:["Bite on the gauze for 30 minutes. Some oozing for 1–2 days is normal.","Ice 20 minutes on, 20 off, for the first 36 hours, then use moist heat. Keep your head raised for 2 nights.","Do not touch the site with your tongue or fingers, or pull your lip to look.","Do not chew on the implant side for 3–4 weeks, or longer if we tell you. Implants on both sides: soft foods for 3–4 weeks. No hard or crunchy food.","Day of surgery: no rinsing or spitting. From the next morning: use the prescribed rinse (Peridex) twice a day — swish gently for 30 seconds, then spit — and rinse with warm salt water (½ teaspoon in 1 cup) after meals. Brush your other teeth normally and the surgery area gently.","If we grafted with Augma Shield: do not rinse with salt water. Use only the rinse we prescribed.","Denture or flipper: leave it out as much as possible and wear it mainly for appearance. Do not eat with it until we adjust it at your follow-up. It must not press on the surgery site.","Small sand-like graft granules may come out for a few days. This is normal.","Sinus lift: do not blow your nose for at least 1 week. Sneeze with your mouth open. No flying for 2 weeks. No straws.","Do not smoke or vape for at least 2 weeks. Quitting for good is best. Smoking raises the risk that the implant or graft fails.","Pain (adults): ibuprofen (Advil, Motrin) 400 mg — 2 tablets of 200 mg — every 6 hours with food for 2–3 days, plus Tylenol 500–1,000 mg every 6 hours. You can take them at the same time. No more than 3,000 mg of Tylenol a day. Start before the numbness wears off.","Skip ibuprofen if you have kidney disease or stomach ulcers, take a blood thinner, are pregnant, or are allergic to aspirin or ibuprofen. Skip Tylenol if you have liver disease or drink heavily. If your prescription pain pill contains acetaminophen (for example, Percocet), do not also take Tylenol. Use a prescribed opioid only if this is not enough.","Finish any antibiotic we prescribed. If you get a rash or other reaction, stop it and call us.","Call us: bleeding that will not stop; pain or swelling getting worse after day 3; fever; pus; a loose healing cap; exposed graft or membrane; air or fluid passing between your mouth and nose; numbness the next day."],
es:["Muerda la gasa durante 30 minutos. Es normal un poco de sangrado leve por 1–2 días.","Hielo 20 minutos sí y 20 no durante las primeras 36 horas; después, calor húmedo. Duerma con la cabeza elevada por 2 noches.","No toque la zona con la lengua ni los dedos, ni jale el labio para mirar.","No mastique del lado del implante por 3–4 semanas, o más si se lo indicamos. Implantes en ambos lados: comidas blandas por 3–4 semanas. Nada duro ni crujiente.","Día de la cirugía: no se enjuague ni escupa. Desde la mañana siguiente: use el enjuague recetado (Peridex) dos veces al día —enjuague suavemente por 30 segundos y escupa— y enjuáguese con agua tibia con sal (½ cucharadita en 1 taza) después de comer. Cepille sus otros dientes normalmente y la zona operada con cuidado.","Si usamos un injerto Augma Shield: no se enjuague con agua con sal. Use solo el enjuague recetado.","Dentadura o puente removible: déjelo fuera lo más posible y úselo sobre todo por apariencia. No coma con él hasta que lo ajustemos en su cita de control. No debe presionar la zona operada.","Pueden salir pequeños gránulos del injerto, como arena, por unos días. Es normal.","Elevación de seno: no se suene la nariz por al menos 1 semana. Estornude con la boca abierta. No viaje en avión por 2 semanas. No use popotes.","No fume ni use cigarrillos electrónicos (vapeo) por al menos 2 semanas. Lo mejor es dejar de fumar por completo. Fumar aumenta el riesgo de que fallen el implante o el injerto.","Dolor (adultos): ibuprofeno (Advil, Motrin) 400 mg —2 tabletas de 200 mg— cada 6 horas con comida por 2–3 días, más Tylenol 500–1,000 mg cada 6 horas. Puede tomarlos al mismo tiempo. No tome más de 3,000 mg de Tylenol al día. Empiece antes de que se pase la anestesia.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado o bebe mucho alcohol. Si su analgésico recetado contiene acetaminofén (por ejemplo, Percocet), no tome Tylenol además. Use un opioide recetado solo si esto no es suficiente.","Termine el antibiótico si se lo recetamos. Si le sale un sarpullido u otra reacción, suspéndalo y llámenos.","Llámenos si tiene: sangrado que no para; dolor o hinchazón que empeora después del día 3; fiebre; pus; un tornillo de cicatrización flojo; injerto o membrana expuestos; paso de aire o líquido entre la boca y la nariz; adormecimiento al día siguiente."],
kea:["Morde na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal.","Jelu 20 minutu, tira 20, duranti 36 purmeru ora; dipôs, kalor úmidu. Dormi ku kabesa altu pa 2 noti.","Ka bu toka na lugar ku língua o ku dedu, nen ka bu puxa lábiu pa djobe.","Ka bu mastiga di ladu di implanti pa 3–4 simana, o más si nu fla-bu. Implanti na dos ladu: kumida mol pa 3–4 simana. Nada duru nen ki ta stala.","Dia di sirurjia: ka bu lava boka nen ka bu kuspi. A partir di palmanhan sigínti: uza rémédiu di lava boka ki nu pasa-bu (Peridex) 2 bes pa dia — bate divagar na boka pa 30 sigundu i kuspi — i lava boka ku agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi. Skova kes otu denti normal i lugar di sirurjia ku kuidadu.","Si nu poi enxertu ku Augma Shield: ka bu lava boka ku agu ku sal. Uza só rémédiu di lava boka ki nu pasa-bu.","Dentadura o ponti di tira-poi: dexa-l fora más ki bu pode i uza-l más pa aparénsia. Ka bu kumi ku el ti nu djusta-l na bu konsulta di kontrolu. E ka debe karga riba di lugar di sirurjia.","Pode sai pedasinhu pikinoti di enxertu, sima areia, duranti uns dia. É normal.","Levantamentu di seiu: ka bu asua naris pa pelo menus 1 simana. Spirra ku boka abertu. Ka bu bua di avion pa 2 simana. Ka bu uza palinha.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 2 simana. Midjór é dexa di fuma di bes. Fuma ta aumenta risku di implanti o enxertu fadja.","Dor (adultu): ibuprofénu (Advil, Motrin) 400 mg — 2 kumprimidu di 200 mg — di 6 en 6 ora ku kumida pa 2–3 dia, i Tylenol 500–1,000 mg di 6 en 6 ora. Bu pode toma es dos na mesmu óra. Ka bu toma más di 3,000 mg di Tylenol pa dia. Kumesa antis di anestezia pasa.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma rémédiu pa sangi ka fika gros (anti-koagulanti), si bu sta grávida, o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu o si bu ta bebe txeu. Si bu rémédiu di dor di reseita ten asetaminofénu (pur izénplu Percocet), ka bu toma Tylenol tanbe. Uza opioidi di reseita só si kel-li ka sta txiga.","Si nu pasa-bu antibiótiku, toma-l ti kaba. Si bu tene manxa na pele o otu reason, para di toma-l i txoma-nu.","Txoma-nu si: sangi ki ka ta para; dor o inxason ki sta ta piora dipôs di dia 3; febri; pus; tanpa di kikatrizason mole; enxertu o membrana diskubertu; ar o líkidu ta pasa entri boka ku naris; dormensia na dia sigínti."],
zh:["咬住纱布30分钟。1–2天内有少量渗血属正常现象。","头36小时冷敷，敷20分钟、停20分钟；之后改为湿热敷。睡觉时垫高头部，持续2晚。","不要用舌头或手指碰触伤口，也不要拉开嘴唇查看。","3–4周内不要用种植体一侧咀嚼；如我们另有指示，时间更长。两侧都有种植体：吃软食3–4周。不要吃硬的或脆的食物。","手术当天：不要漱口或吐口水。从第二天早上起：每天2次使用我们开的漱口水（Peridex），轻轻含漱30秒后吐掉；饭后用温盐水（1杯水加½茶匙盐）漱口。其他牙齿照常刷，手术部位轻轻刷。","如果我们使用了Augma Shield植骨：不要用盐水漱口，只用我们开的漱口水。","假牙或临时活动牙：尽量不要戴，主要在需要外观时佩戴。在复诊时我们调整好之前，不要戴着它吃东西。它不能压到手术部位。","几天内可能会有像细沙一样的小颗粒植骨材料掉出来，这是正常的。","上颌窦提升术：至少1周内不要擤鼻涕。打喷嚏时张开嘴。2周内不要乘坐飞机。不要用吸管。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体或植骨失败的风险。","止痛（成人）：布洛芬（Advil、Motrin）400毫克（200毫克片剂2片），每6小时一次，随餐服用，持续2–3天；同时服用泰诺（Tylenol）500–1,000毫克，每6小时一次。两种药可以同时服用。泰诺每天不超过3,000毫克。在麻药消退前开始服用。","以下情况不要服用布洛芬：肾病、胃溃疡、正在服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。有肝病或大量饮酒者不要服用泰诺。如果您的处方止痛药含有对乙酰氨基酚（例如Percocet），不要再另外服用泰诺。只有在以上方法止痛不够时才服用处方阿片类药物。","如果我们开了抗生素，请服完全程。如出现皮疹或其他反应，请停药并致电我们。","出现以下情况请致电我们：出血不止；第3天后疼痛或肿胀加重；发烧；有脓；愈合帽松动；植骨材料或膜外露；口腔与鼻腔之间有空气或液体相通；第二天仍有麻木。"]}},
{id:"arch",t:{"en":"After full-arch (fixed teeth same day) surgery","es":"Después de cirugía de arcada completa (dientes fijos el mismo día)","kea":"Dipôs di sirurjia di arkada interu (denti fixu na mesmu dia)","zh":"全口种植（当天固定牙）术后须知"},i:{
en:["First 2 days: gauze, ice and head raised, as for any oral surgery.","Your new teeth are temporary and fixed in place. Do not try to remove them.","Pain (adults): ibuprofen (Advil, Motrin) 400 mg — 2 tablets of 200 mg — every 6 hours with food for 2–3 days, plus Tylenol 500–1,000 mg every 6 hours. You can take them at the same time. No more than 3,000 mg of Tylenol a day. Start before the numbness wears off.","Skip ibuprofen if you have kidney disease or stomach ulcers, take a blood thinner, are pregnant, or are allergic to aspirin or ibuprofen. Skip Tylenol if you have liver disease or drink heavily. If your prescription pain pill contains acetaminophen (for example, Percocet), do not also take Tylenol. Use a prescribed opioid only if this is not enough.","Diet: liquids and very soft food for the first 2 weeks, then fork-tender food until we clear you (usually about 3 months). Do not bite into hard food with your front teeth.","Clean under the bridge twice a day with a water flosser on its lowest setting, starting about day 7. Use the rinse we prescribed.","Do not smoke or vape for at least 2 weeks. Quitting for good is best. Smoking raises the risk that the implants fail.","Your speech and bite will feel different for a few weeks. This is normal.","Wear your night guard every night if we gave you one.","Call us: a loose, cracked or moving bridge; a bite that feels uneven or hurts on one spot; swelling, pus or fever.","Keep every follow-up visit. They protect the implants while they heal."],
es:["Primeros 2 días: gasa, hielo y cabeza elevada, como en cualquier cirugía oral.","Sus dientes nuevos son provisionales y están fijos. No intente quitarlos.","Dolor (adultos): ibuprofeno (Advil, Motrin) 400 mg —2 tabletas de 200 mg— cada 6 horas con comida por 2–3 días, más Tylenol 500–1,000 mg cada 6 horas. Puede tomarlos al mismo tiempo. No tome más de 3,000 mg de Tylenol al día. Empiece antes de que se pase la anestesia.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado o bebe mucho alcohol. Si su analgésico recetado contiene acetaminofén (por ejemplo, Percocet), no tome Tylenol además. Use un opioide recetado solo si esto no es suficiente.","Dieta: líquidos y comida muy blanda las primeras 2 semanas; después, comida que se pueda partir con un tenedor hasta que le demos el alta (por lo general unos 3 meses). No muerda comida dura con los dientes de enfrente.","Limpie debajo del puente dos veces al día con un irrigador de agua en su nivel más bajo, a partir del día 7 aproximadamente. Use el enjuague recetado.","No fume ni use cigarrillos electrónicos (vapeo) por al menos 2 semanas. Lo mejor es dejar de fumar por completo. Fumar aumenta el riesgo de que fallen los implantes.","Su forma de hablar y su mordida se sentirán diferentes por unas semanas. Es normal.","Use su protector nocturno todas las noches si le dimos uno.","Llámenos si: el puente está flojo, roto o se mueve; la mordida se siente dispareja o duele en un punto; tiene hinchazón, pus o fiebre.","Asista a todas sus citas de control. Protegen los implantes mientras sanan."],
kea:["Purmeru 2 dia: gaza, jelu i kabesa altu, sima na kualker sirurjia di boka.","Bu denti novu é provizóriu i é fixu. Ka bu tenta tira-s.","Dor (adultu): ibuprofénu (Advil, Motrin) 400 mg — 2 kumprimidu di 200 mg — di 6 en 6 ora ku kumida pa 2–3 dia, i Tylenol 500–1,000 mg di 6 en 6 ora. Bu pode toma es dos na mesmu óra. Ka bu toma más di 3,000 mg di Tylenol pa dia. Kumesa antis di anestezia pasa.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma rémédiu pa sangi ka fika gros (anti-koagulanti), si bu sta grávida, o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu o si bu ta bebe txeu. Si bu rémédiu di dor di reseita ten asetaminofénu (pur izénplu Percocet), ka bu toma Tylenol tanbe. Uza opioidi di reseita só si kel-li ka sta txiga.","Kumida: líkidu i kumida mutu mol duranti 2 purmeru simana; dipôs, kumida ki garfu ta parti fásil ti nu da-bu alta (normalmenti uns 3 mês). Ka bu morde kumida duru ku denti di frenti.","Linpa baxu di ponti 2 bes pa dia ku un irigador di agu na nível más baxu, a partir más o menus di dia 7. Uza rémédiu di lava boka ki nu pasa-bu.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 2 simana. Midjór é dexa di fuma di bes. Fuma ta aumenta risku di implanti fadja.","Bu manera di papia i bu mordida ta xinti diferenti pa algun simana. É normal.","Uza bu protetor di noti tudu noti si nu da-bu un.","Txoma-nu si: ponti sta mole, rakadu o ta mexe; mordida ta xinti dizigual o ta dói na un pontu; inxason, pus o febri.","Ben pa tudu bu konsulta di kontrolu. Es ta proteje implantis enkuantu es ta kura."],
zh:["头2天：与其他口腔手术一样，咬纱布、冷敷并垫高头部。","您的新牙是临时的，并且是固定的。不要试图自行取下。","止痛（成人）：布洛芬（Advil、Motrin）400毫克（200毫克片剂2片），每6小时一次，随餐服用，持续2–3天；同时服用泰诺（Tylenol）500–1,000毫克，每6小时一次。两种药可以同时服用。泰诺每天不超过3,000毫克。在麻药消退前开始服用。","以下情况不要服用布洛芬：肾病、胃溃疡、正在服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。有肝病或大量饮酒者不要服用泰诺。如果您的处方止痛药含有对乙酰氨基酚（例如Percocet），不要再另外服用泰诺。只有在以上方法止痛不够时才服用处方阿片类药物。","饮食：头2周吃流质和非常软的食物；之后吃用叉子就能轻松分开的软食，直到我们通知您可以恢复正常饮食（通常约3个月）。不要用前牙咬硬的食物。","大约从第7天起，每天2次用冲牙器（调到最低档）清洁牙桥下方。使用我们开的漱口水。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体失败的风险。","几周内您说话和咬合的感觉会有所不同，这是正常的。","如果我们给了您夜间护牙套，请每晚佩戴。","出现以下情况请致电我们：牙桥松动、破裂或移动；咬合不平或某一点疼痛；肿胀、有脓或发烧。","请按时参加每次复诊。复诊可在愈合期间保护种植体。"]}},
{id:"presed",t:{"en":"Before IV sedation","es":"Antes de la sedación intravenosa","kea":"Antis di sedason na veia","zh":"静脉镇静前须知"},i:{
en:["Food: no solid food, milk or gum for 8 hours before your appointment.","Clear liquids are OK until 2 hours before: water, apple juice, clear sports drinks, black coffee or tea (no milk or cream). Nothing at all after that.","Medicines: ask us before surgery which of your usual medicines to take. Take the approved ones with a sip of water.","Tell us before surgery if you take a weekly diabetes or weight-loss injection (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity) or a blood thinner.","No smoking for at least 12 hours before, and no cannabis (smoked, vaped or edible) for 3 days before.","A responsible adult must come with you, stay in the office during the procedure, and drive you home. No driving or machinery until the next morning.","Wear loose clothes with sleeves that roll up above the elbow, and flat shoes.","Remove contact lenses, jewelry and dentures before surgery. No lipstick, heavy makeup or nail polish.","If you get sick before your appointment (cold, sore throat, fever, vomiting or diarrhea), call us.","Read “After IV sedation” for what to expect afterward."],
es:["Comida: nada de comida sólida, leche ni chicle durante 8 horas antes de su cita.","Puede tomar líquidos claros hasta 2 horas antes: agua, jugo de manzana, bebidas deportivas claras, café o té negro (sin leche ni crema). Después, nada.","Medicinas: pregúntenos antes de la cirugía cuáles de sus medicinas habituales debe tomar. Tome las aprobadas con un sorbo de agua.","Avísenos antes de la cirugía si usa una inyección semanal para la diabetes o para bajar de peso (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity) o un anticoagulante.","No fume por al menos 12 horas antes, y no use cannabis (fumado, vapeado o comestible) por 3 días antes.","Un adulto responsable debe acompañarlo, quedarse en la oficina durante el procedimiento y llevarlo a casa. No maneje ni use maquinaria hasta la mañana siguiente.","Use ropa holgada con mangas que se puedan subir por encima del codo, y zapatos bajos.","Quítese lentes de contacto, joyas y dentaduras antes de la cirugía. No use lápiz labial, mucho maquillaje ni esmalte de uñas.","Si se enferma antes de su cita (resfriado, dolor de garganta, fiebre, vómitos o diarrea), llámenos.","Lea “Después de la sedación intravenosa” para saber qué esperar después."],
kea:["Kumida: nada di kumida sólidu, leti o txikleti duranti 8 ora antis di bu konsulta.","Líkidu klaru é dretu ti 2 ora antis: agu, sumu di masan, bebida di desportu klaru, kafé o xá pretu (sen leti nen kreme). Dipôs di kel-li, nada.","Rémédiu: purgunta-nu antis di sirurjia kal di bu rémédiu di kada dia ki bu debe toma. Toma kes ki nu aprova ku un golinhu di agu.","Fla-nu antis di sirurjia si bu ta toma un injeson di simana pa diabetis o pa perde pézu (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity) o rémédiu pa sangi (anti-koagulanti).","Ka bu fuma pa pelo menus 12 ora antis, i ka bu uza kanábis (fumadu, vape o kumida) pa 3 dia antis.","Un adultu rasponsável ten ki ben ku bu, fika na ofisina duranti prusedimentu i leba-bu kasa. Ka bu kondus nen uza mákina ti palmanhan sigínti.","Bisti ropa largu ku manga ki ta subi riba di kotovelu, i sapatu baxu.","Tira lenti di kontatu, joia i dentadura antis di sirurjia. Ka bu uza batom, txeu maquiaji nen verniz di unha.","Si bu fika duenti antis di bu konsulta (konstipason, garganta dodu, febri, vómitu o diarreia), txoma-nu.","Lei “Dipôs di sedason na veia” pa sabe kuzê ki ta kontise dipôs."],
zh:["饮食：预约前8小时内不要吃固体食物、不要喝牛奶、不要嚼口香糖。","术前2小时之前可以喝清澈的液体：水、苹果汁、清澈的运动饮料、黑咖啡或清茶（不加牛奶或奶油）。之后什么都不要喝。","药物：手术前请先问我们，您平时服用的药物中哪些可以照常服用。用一小口水送服获准的药物。","如果您每周注射一次治疗糖尿病或减重的药物（Ozempic、Wegovy、Mounjaro、Zepbound、Trulicity），或服用抗凝血药，请在手术前告诉我们。","术前至少12小时内不要吸烟；术前3天内不要使用大麻（吸食、电子烟或食用）。","必须由一名负责任的成年人陪同前来，在手术期间留在诊所，并开车送您回家。到第二天早上之前不要开车或操作机器。","穿宽松的衣服，袖子要能卷到手肘以上，穿平底鞋。","手术前请取下隐形眼镜、首饰和假牙。不要涂口红、浓妆或指甲油。","如果您在预约前生病（感冒、喉咙痛、发烧、呕吐或腹泻），请致电我们。","术后注意事项请阅读《静脉镇静后须知》。"]}},
{id:"sed",t:{"en":"After IV sedation","es":"Después de la sedación intravenosa","kea":"Dipôs di sedason na veia","zh":"静脉镇静后须知"},i:{
en:["A responsible adult must take you home and stay with you for the rest of the day (at least 4 hours).","Until tomorrow morning: no driving, machinery, cooking on the stove, or important decisions or signing documents.","No alcohol for 24 hours. Do not drive while taking opioid pain medicine.","Do not care for young children alone today.","Start with sips of clear fluids, then light food. For nausea, take small sips; ginger ale can help.","Rest with your head raised. You may feel sleepy or forgetful today.","A small bruise at the IV site is normal. Call us for a red, painful streak or swelling in the arm.","Call 911: trouble breathing, cannot be woken, or chest pain."],
es:["Un adulto responsable debe llevarlo a casa y quedarse con usted el resto del día (al menos 4 horas).","Hasta mañana por la mañana: no maneje, no use maquinaria, no cocine en la estufa, ni tome decisiones importantes o firme documentos.","No tome alcohol por 24 horas. No maneje mientras tome analgésicos opioides.","No cuide solo a niños pequeños hoy.","Empiece con sorbos de líquidos claros y luego comida ligera. Si tiene náuseas, tome sorbos pequeños; el ginger ale puede ayudar.","Descanse con la cabeza elevada. Puede sentirse con sueño u olvidadizo hoy.","Es normal un pequeño moretón donde estuvo el suero. Llámenos si hay una línea roja y dolorosa o hinchazón en el brazo.","Llame al 911 si: le cuesta respirar, no se puede despertar o tiene dolor en el pecho."],
kea:["Un adultu rasponsável ten ki leba-bu kasa i fika ku bu resta di dia (pelo menus 4 ora).","Ti amanhan di palmanhan: ka bu kondus, ka bu uza mákina, ka bu kuzinha na fogon, nen ka bu toma disizon importanti o sina dokumentu.","Ka bu bebe álkool pa 24 ora. Ka bu kondus enkuantu bu sta ta toma rémédiu pa dor opioidi.","Oji ka bu toma konta di mininu pikinoti sozinhu.","Kumesa ku golinhu di líkidu klaru, dipôs kumida leve. Si bu sta ku nóziu, bebe golinhu pikinoti; ginger ale pode djuda.","Diskansa ku kabesa altu. Oji bu pode xinti ku sonu o skesedu.","Un manxa roxu pikinoti na lugar di soru é normal. Txoma-nu si bu tene un risku burmedju ki ta dói o inxason na brasu.","Txoma 911 si: difikuldadi di rispira, ka ta kunsigi korda, o dor na pextu."],
zh:["必须由一名负责任的成年人送您回家，并在当天余下时间陪伴您（至少4小时）。","到明天早上之前：不要开车、操作机器、用炉灶做饭，也不要做重要决定或签署文件。","24小时内不要饮酒。服用阿片类止痛药期间不要开车。","今天不要独自照顾幼儿。","先小口喝清澈的液体，再吃清淡的食物。如有恶心，请小口慢喝；姜汁汽水可能有帮助。","休息时垫高头部。今天您可能会感到困倦或健忘。","静脉输液处有小块淤青是正常的。如手臂出现发红、疼痛的条纹或肿胀，请致电我们。","请拨打911：呼吸困难、叫不醒，或胸痛。"]}}];
const LANGS=[['en','English'],['es','Español'],['kea','Kriolu'],['zh','中文']];
const UI={en:{title:'After your surgery',pick:'Choose your procedure',call:'Call the office',back:'‹ All instructions',share:'Share',print:'Print',copied:'Link copied',rev:'{biz} would love your feedback. Post a review to our profile.',revBtn:'Leave a Google review',note:'General instructions. If your surgeon told you something different, follow your surgeon. Emergencies: call 911.'},
es:{title:'Después de su cirugía',pick:'Elija su procedimiento',call:'Llamar a la oficina',back:'‹ Todas las instrucciones',share:'Compartir',print:'Imprimir',copied:'Enlace copiado',rev:'A {biz} le encantaría conocer su opinión. Publique una reseña en nuestro perfil.',revBtn:'Dejar una reseña en Google',note:'Instrucciones generales. Si su cirujano le indicó algo diferente, siga sus indicaciones. Emergencias: llame al 911.'},
kea:{title:'Dipôs di bu sirurjia',pick:'Skodje bu prusedimentu',call:'Txoma ofisina',back:'‹ Tudu instruson',share:'Partilha',print:'Inprimi',copied:'Link kopiadu',rev:'{biz} ta gosta txeu di obi bu opinion. Poi un komentáriu na nos perfil.',revBtn:'Dexa un komentáriu na Google',note:'Instruson jeral. Si bu sirurjion fla-bu otu kuza, sigi bu sirurjion. Emerjénsia: txoma 911.'},
zh:{title:'术后须知',pick:'请选择您的手术',call:'致电诊所',back:'‹ 所有须知',share:'分享',print:'打印',copied:'链接已复制',rev:'{biz} 期待您的反馈。欢迎在我们的主页上发表评价。',revBtn:'在 Google 上发表评价',note:'一般性说明。如果您的医生另有指示，请遵从医生的指示。紧急情况：请拨打911。'}};
const app=document.getElementById('app');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=(()=>{const n=(navigator.language||'en').toLowerCase();return n.startsWith('es')?'es':n.startsWith('zh')?'zh':(n.startsWith('kea')||n==='pt-cv')?'kea':'en'})();
function parse(){const m=location.hash.replace('#','').match(/^([a-z]+)?(?:-(en|es|kea|zh))?$/);if(m&&m[2])lang=m[2];return m&&HO.some(h=>h.id===m[1])?m[1]:null}
function setHash(id){const h=id?`#${id}-${lang}`:(lang!=='en'?'#-'+lang:'');try{history.replaceState(null,'',location.pathname+location.search+h)}catch(e){}}
const isWarn=t=>/911|^Call us|^Llámenos|^Llame|^Txoma|^出现以下情况请致电/.test(t);
function render(){const id=parse(),u=UI[lang];document.documentElement.lang=lang;
 const top=`<header><h1>${u.title}</h1><div class="lang" role="group" aria-label="Language">${LANGS.map(([c,n])=>`<button data-l="${c}" lang="${c}" aria-pressed="${lang===c}">${n}</button>`).join('')}</div></header>`;
 const call=`<a class="call" href="tel:${TEL}">📞 ${u.call} · ${PHONE}</a>`;
 const rev=`<div class="rev"><p>${esc(u.rev.replace('{biz}',SITE.n))}</p><a href="${esc(SITE.u)}" target="_blank" rel="noopener">★ ${esc(u.revBtn)} ↗</a></div>`;
 if(!id){document.title=u.title;app.innerHTML=`${top}<p style="margin:0 0 12px;color:var(--muted)">${u.pick}</p><div class="list">${HO.map(h=>`<a class="card" href="#${h.id}-${lang}">${esc(h.t[lang])}<span>›</span></a>`).join('')}</div>${call}${rev}<p class="note">${u.note}</p>`;return}
 const h=HO.find(x=>x.id===id);document.title=h.t[lang];
 app.innerHTML=`${top}<button class="back" data-home>${u.back}</button><h2>${esc(h.t[lang])}</h2><ol>${h.i[lang].map(t=>`<li${isWarn(t)?' class="warn"':''}>${esc(t)}</li>`).join('')}</ol>${call}<div class="row"><button class="btn" data-share>${u.share} ↗</button><button class="btn" data-print>${u.print}</button></div>${rev}<p class="note">${u.note}</p>`;
 window.scrollTo(0,0)}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){const id=parse();lang=b.dataset.l;setHash(id);render();return}
 if(b.hasAttribute('data-home')){setHash(null);render();return}
 if(b.hasAttribute('data-print')){window.print();return}
 if(b.hasAttribute('data-share')){const id=parse(),h=HO.find(x=>x.id===id),url=location.href.split('#')[0]+`#${id}-${lang}`;
  try{if(navigator.share){await navigator.share({title:h.t[lang],url});return}}catch(x){if(x&&x.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);b.textContent=UI[lang].copied}catch(x){prompt('',url)}}});
addEventListener('hashchange',render);render();
</script>
</body>
</html>
