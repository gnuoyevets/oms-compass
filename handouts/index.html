<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>After Your Surgery</title>
<meta name="description" content="Post-operative instructions in English and Spanish.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f7f3">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--bg:#f5f7f3;--surface:#fff;--ink:#17312e;--muted:#5a6b67;--line:#dfe5de;--accent:#0f6a5e;--accent-ink:#fff;--red-bg:#fbece8;--red-line:#ebc1b5;--red-ink:#8b3322;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--accent:#4fb8a5;--accent-ink:#06211d;--red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px}
h1{font-size:24px;line-height:1.25;margin:0}
h2{font-size:22px;line-height:1.3;margin:0 0 12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);color:var(--muted);font:600 15px inherit;font-family:inherit;padding:8px 12px;min-height:44px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:64px;font:600 18px/1.35 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.card span{color:var(--accent);font-size:24px}
.call{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;margin:16px 0}
ol{padding-left:24px;margin:0}
li{margin:0 0 12px}
li.warn{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:10px;padding:10px 12px;list-style-position:inside;margin-left:-24px;font-weight:600}
.back{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:10px;min-height:44px;padding:0 14px;font:600 16px inherit;font-family:inherit;cursor:pointer;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px inherit;font-family:inherit;cursor:pointer}
.note{font-size:14px;color:var(--muted);margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media print{body{background:#fff;color:#000;font-size:13pt}.lang,.back,.row,.noprint{display:none!important}.call{background:none;color:#000;justify-content:flex-start;margin:8px 0;padding:0;min-height:0}li.warn{background:none;color:#000;border:1px solid #000}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Patient handouts — same text as OMS Compass (Post-op tab). Edit both together. */
const PHONE='(401) 273-7802',TEL='+14012737802';
const HO=[
{id:'ext',t:{en:'After tooth removal',es:'Después de una extracción dental'},i:{
en:['Bite firmly on the gauze for 30 minutes. Some oozing for 1–2 days is normal.','Heavy bleeding: fold clean gauze, place it on the site and bite firmly for 1 hour. Still bleeding? Call us.','Ice the cheek 20 minutes on, 20 minutes off, for the first 2 days. Swelling is worst on day 2–3.','Keep your head raised on pillows for 2 nights.','First 24 hours: no rinsing, spitting, straws or smoking. They can pull out the blood clot.','From day 2: rinse gently with warm salt water (½ teaspoon in 1 cup) after meals. If we grafted the socket with Augma Shield, skip the salt water and use only the rinse we prescribed.','Soft foods for 3 days. No hard or crunchy food for 5 days. Drink plenty of fluids.','Take pain medicine as directed. Start before the numbness wears off. Finish any antibiotic.','No alcohol for 24 hours, or while taking opioid pain medicine.','Call us: bleeding that will not stop with pressure; pain or swelling getting worse after day 3; fever over 100.4°F (38°C); bad taste or pus; numb lip, chin or tongue the next day.','Trouble breathing or swallowing: call 911.'],
es:['Muerda firmemente la gasa durante 30 minutos. Es normal un poco de sangrado leve por 1–2 días.','Sangrado abundante: doble una gasa limpia, colóquela sobre la herida y muerda firme por 1 hora. ¿Sigue sangrando? Llámenos.','Aplique hielo en la mejilla 20 minutos sí y 20 minutos no durante los primeros 2 días. La hinchazón es mayor el día 2–3.','Duerma con la cabeza elevada sobre almohadas durante 2 noches.','Primeras 24 horas: no se enjuague, no escupa, no use popotes (pajillas) y no fume. Esto puede desprender el coágulo.','Desde el día 2: enjuáguese suavemente con agua tibia con sal (½ cucharadita en 1 taza) después de comer. Si injertamos el alvéolo con Augma Shield, no use agua con sal; use solo el enjuague recetado.','Comidas blandas por 3 días. Nada duro ni crujiente por 5 días. Tome muchos líquidos.','Tome el medicamento para el dolor según las indicaciones. Empiece antes de que se pase la anestesia. Termine el antibiótico si se lo recetaron.','No tome alcohol por 24 horas, ni mientras tome analgésicos opioides.','Llámenos si tiene: sangrado que no para con presión; dolor o hinchazón que empeora después del día 3; fiebre de más de 100.4°F (38°C); mal sabor o pus; labio, mentón o lengua adormecidos al día siguiente.','Dificultad para respirar o tragar: llame al 911.']}},
{id:'imp',t:{en:'After implant, bone graft or sinus lift surgery',es:'Después de implantes, injerto óseo o elevación de seno'},i:{
en:['Bite on the gauze for 30 minutes. Some oozing for 1–2 days is normal.','Ice 20 minutes on, 20 off, for 2 days. Keep your head raised for 2 nights.','Do not chew on the surgery side. Do not touch the site with your tongue or fingers, or pull your lip to look.','Soft foods until we tell you otherwise. No hard or crunchy food.','Brush your other teeth normally. Use the rinse we prescribed, or warm salt water from day 2.','If we grafted with Augma Shield: do not rinse with salt water. Use only the rinse we prescribed.','Wear a denture or flipper only as we instructed. It must not press on the surgery site.','Small sand-like graft granules may come out for a few days. This is normal.','Sinus lift: do not blow your nose for at least 1 week. Sneeze with your mouth open. No flying for 2 weeks. No straws.','Do not smoke. Smoking raises the risk that the implant or graft fails.','Call us: bleeding that will not stop; pain or swelling getting worse after day 3; fever; pus; a loose healing cap; exposed graft or membrane; air or fluid passing between your mouth and nose; numbness the next day.'],
es:['Muerda la gasa durante 30 minutos. Es normal un poco de sangrado leve por 1–2 días.','Hielo 20 minutos sí y 20 no durante 2 días. Duerma con la cabeza elevada por 2 noches.','No mastique del lado de la cirugía. No toque la zona con la lengua ni los dedos, ni jale el labio para mirar.','Comidas blandas hasta que le indiquemos lo contrario. Nada duro ni crujiente.','Cepille sus otros dientes normalmente. Use el enjuague recetado, o agua tibia con sal desde el día 2.','Si usamos un injerto Augma Shield: no se enjuague con agua con sal. Use solo el enjuague recetado.','Use su dentadura o puente removible solo como le indicamos. No debe presionar la zona operada.','Pueden salir pequeños gránulos del injerto, como arena, por unos días. Es normal.','Elevación de seno: no se suene la nariz por al menos 1 semana. Estornude con la boca abierta. No viaje en avión por 2 semanas. No use popotes.','No fume. Fumar aumenta el riesgo de que fallen el implante o el injerto.','Llámenos si tiene: sangrado que no para; dolor o hinchazón que empeora después del día 3; fiebre; pus; un tornillo de cicatrización flojo; injerto o membrana expuestos; paso de aire o líquido entre la boca y la nariz; adormecimiento al día siguiente.']}},
{id:'arch',t:{en:'After full-arch (fixed teeth same day) surgery',es:'Después de cirugía de arcada completa (dientes fijos el mismo día)'},i:{
en:['First 2 days: gauze, ice and head raised, as for any oral surgery.','Your new teeth are temporary and fixed in place. Do not try to remove them.','Diet: liquids and very soft food for the first 2 weeks, then fork-tender food until we clear you (usually about 3 months). Do not bite into hard food with your front teeth.','Clean under the bridge twice a day with a water flosser on its lowest setting, starting about day 7. Use the rinse we prescribed.','Your speech and bite will feel different for a few weeks. This is normal.','Wear your night guard every night if we gave you one.','Call us: a loose, cracked or moving bridge; a bite that feels uneven or hurts on one spot; swelling, pus or fever.','Keep every follow-up visit. They protect the implants while they heal.'],
es:['Primeros 2 días: gasa, hielo y cabeza elevada, como en cualquier cirugía oral.','Sus dientes nuevos son provisionales y están fijos. No intente quitarlos.','Dieta: líquidos y comida muy blanda las primeras 2 semanas; después, comida que se pueda partir con un tenedor hasta que le demos el alta (por lo general unos 3 meses). No muerda comida dura con los dientes de enfrente.','Limpie debajo del puente dos veces al día con un irrigador de agua en su nivel más bajo, a partir del día 7 aproximadamente. Use el enjuague recetado.','Su forma de hablar y su mordida se sentirán diferentes por unas semanas. Es normal.','Use su protector nocturno todas las noches si le dimos uno.','Llámenos si: el puente está flojo, roto o se mueve; la mordida se siente dispareja o duele en un punto; tiene hinchazón, pus o fiebre.','Asista a todas sus citas de control. Protegen los implantes mientras sanan.']}},
{id:'sed',t:{en:'After IV sedation',es:'Después de la sedación intravenosa'},i:{
en:['A responsible adult must take you home and stay with you for the rest of the day (at least 4 hours).','Until tomorrow morning: no driving, machinery, cooking on the stove, or important decisions or signing documents.','No alcohol for 24 hours. Do not drive while taking opioid pain medicine.','Do not care for young children alone today.','Start with sips of clear fluids, then light food. For nausea, take small sips; ginger ale can help.','Rest with your head raised. You may feel sleepy or forgetful today.','A small bruise at the IV site is normal. Call us for a red, painful streak or swelling in the arm.','Call 911: trouble breathing, cannot be woken, or chest pain.'],
es:['Un adulto responsable debe llevarlo a casa y quedarse con usted el resto del día (al menos 4 horas).','Hasta mañana por la mañana: no maneje, no use maquinaria, no cocine en la estufa, ni tome decisiones importantes o firme documentos.','No tome alcohol por 24 horas. No maneje mientras tome analgésicos opioides.','No cuide solo a niños pequeños hoy.','Empiece con sorbos de líquidos claros y luego comida ligera. Si tiene náuseas, tome sorbos pequeños; el ginger ale puede ayudar.','Descanse con la cabeza elevada. Puede sentirse con sueño u olvidadizo hoy.','Es normal un pequeño moretón donde estuvo el suero. Llámenos si hay una línea roja y dolorosa o hinchazón en el brazo.','Llame al 911 si: le cuesta respirar, no se puede despertar o tiene dolor en el pecho.']}}];
const UI={en:{title:'After your surgery',pick:'Choose your procedure',call:'Call the office',back:'‹ All instructions',share:'Share',print:'Print',copied:'Link copied',note:'General instructions. If your surgeon told you something different, follow your surgeon. Emergencies: call 911.'},
es:{title:'Después de su cirugía',pick:'Elija su procedimiento',call:'Llamar a la oficina',back:'‹ Todas las instrucciones',share:'Compartir',print:'Imprimir',copied:'Enlace copiado',note:'Instrucciones generales. Si su cirujano le indicó algo diferente, siga sus indicaciones. Emergencias: llame al 911.'}};
const app=document.getElementById('app');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=(navigator.language||'en').toLowerCase().startsWith('es')?'es':'en';
function parse(){const m=location.hash.replace('#','').match(/^([a-z]+)?(?:-(en|es))?$/);if(m&&m[2])lang=m[2];return m&&HO.some(h=>h.id===m[1])?m[1]:null}
function setHash(id){const h=id?`#${id}-${lang}`:(lang==='es'?'#-es':'');try{history.replaceState(null,'',location.pathname+location.search+h)}catch(e){}}
const isWarn=t=>/911|^Call us|^Llámenos|^Llame/.test(t);
function render(){const id=parse(),u=UI[lang];document.documentElement.lang=lang;
 const top=`<header><h1>${u.title}</h1><div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="${lang==='en'}">English</button><button data-l="es" aria-pressed="${lang==='es'}">Español</button></div></header>`;
 const call=`<a class="call" href="tel:${TEL}">📞 ${u.call} · ${PHONE}</a>`;
 if(!id){document.title=u.title;app.innerHTML=`${top}<p style="margin:0 0 12px;color:var(--muted)">${u.pick}</p><div class="list">${HO.map(h=>`<a class="card" href="#${h.id}-${lang}">${esc(h.t[lang])}<span>›</span></a>`).join('')}</div>${call}<p class="note">${u.note}</p>`;return}
 const h=HO.find(x=>x.id===id);document.title=h.t[lang];
 app.innerHTML=`${top}<button class="back" data-home>${u.back}</button><h2>${esc(h.t[lang])}</h2><ol>${h.i[lang].map(t=>`<li${isWarn(t)?' class="warn"':''}>${esc(t)}</li>`).join('')}</ol>${call}<div class="row"><button class="btn" data-share>${u.share} ↗</button><button class="btn" data-print>${u.print}</button></div><p class="note">${u.note}</p>`;
 window.scrollTo(0,0)}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){const id=parse();lang=b.dataset.l;setHash(id);render();return}
 if(b.hasAttribute('data-home')){setHash(null);render();return}
 if(b.hasAttribute('data-print')){window.print();return}
 if(b.hasAttribute('data-share')){const id=parse(),h=HO.find(x=>x.id===id),url=location.href.split('#')[0]+`#${id}-${lang}`;
  try{if(navigator.share){await navigator.share({title:h.t[lang],url});return}}catch(x){if(x&&x.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);b.textContent=UI[lang].copied}catch(x){prompt('',url)}}});
addEventListener('hashchange',render);render();
</script>
</body>
</html>
