<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>.cw-card{border:1px solid var(--line,#ccd7d3);border-radius:14px;padding:12px;margin:12px 0;background:var(--card,#fff)}.cw-warn{color:var(--warn-ink,#8b4220)}@media print{.cw-card{break-inside:avoid}}</style>
</head><body>
<title>OMS Compass</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f7f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a19" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: one phone column. Home = grouped decision list. Module = red flags → inputs → yes/no path → plan card → collapsed look-fors and sources. */
:root{
 --bg:#f5f7f3;--surface:#ffffff;--ink:#17312e;--muted:#5a6b67;--line:#dfe5de;--soft:#e9f0e8;
 --accent:#0f6a5e;--accent-ink:#ffffff;--chip:#dcebe3;--chip-ink:#1f5245;
 --warn-bg:#fff4e2;--warn-line:#ecd2a6;--warn-ink:#6f4f1c;
 --red-bg:#fbece8;--red-line:#ebc1b5;--red-ink:#8b3322;
 --ok-bg:#e8f3ea;--ok-line:#c4dcc8;--ok-ink:#25563a;
 --display:'Manrope','DM Sans',system-ui,-apple-system,sans-serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--soft:#1d2f2d;
 --accent:#4fb8a5;--accent-ink:#06211d;--chip:#21403a;--chip-ink:#bfe3d7;
 --warn-bg:#2e2412;--warn-line:#5a4520;--warn-ink:#f0cf92;
 --red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;
 --ok-bg:#16301f;--ok-line:#2c5539;--ok-ink:#a9dcb7;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--soft:#1d2f2d;
 --accent:#4fb8a5;--accent-ink:#06211d;--chip:#21403a;--chip-ink:#bfe3d7;
 --warn-bg:#2e2412;--warn-line:#5a4520;--warn-ink:#f0cf92;
 --red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;
 --ok-bg:#16301f;--ok-line:#2c5539;--ok-ink:#a9dcb7;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.3px;text-wrap:balance;margin:0}
.lab{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

/* Home */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 14px}
.top h1{font-size:24px;font-weight:800}
.top h1 span{color:var(--accent)}
.group{margin:16px 0 6px}
.mods{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;min-height:56px}
.mod:first-child{border-top:0}
.mod:hover{background:var(--soft)}
.mod b{display:block;font:700 15.5px var(--display)}
.mod span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.mod i{font-style:normal;color:var(--accent);font-size:18px}
.foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6}

/* Module */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar h2{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h2 .dtag{white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;padding:0 12px;color:var(--accent);font-weight:600;font-size:13px}
.icon-btn.back,.icon-btn.homebtn{font-size:20px;padding:0}
.top .homebtn{flex:none;min-width:40px;height:40px;align-self:center;margin-right:-4px}
.top:has(.homebtn){align-items:center}
.top:has(.homebtn) h1{flex:1;min-width:0;white-space:nowrap;font-size:22px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0 12px}.pct{display:block;font-size:17px;margin-bottom:10px}.pcall{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;margin-bottom:10px}.plink{margin:8px 0 0;color:var(--accent);font-weight:600}.pmeds{margin:8px 0 0;font-weight:600}.qrwrap{text-align:center;margin:4px 0 12px}.qrwrap svg.qr{width:min(220px,70vw);height:auto;display:block;margin:0 auto 6px;border-radius:8px}.oph input{min-height:44px;font-size:16px;width:12em;max-width:100%}.ophset{margin-top:10px}
.red{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.red b{font-weight:700}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.box>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:46px;font-weight:600;font-size:14px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:'+';color:var(--accent);font-size:18px;line-height:1}
details.box[open]>summary::after{content:'−'}
details.box>summary em{font-style:normal;font-weight:600;font-size:12px;color:var(--accent);margin-left:auto}
.inner{padding:0 14px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:7px 11px;font-size:13px;min-height:36px;color:var(--muted)}
.tg.on{background:var(--chip);border-color:var(--chip);color:var(--chip-ink);font-weight:700}
.calc{margin-top:10px;font-size:13px;font-weight:600;color:var(--chip-ink);background:var(--chip);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}

.path{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.step .qt{font-size:13px;line-height:1.4;color:var(--muted)}
.step .qt small{display:inline-block;margin-left:4px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.notechip{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.cur{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px}
.cur .q{font:700 17px/1.4 var(--display);margin:4px 0 6px}
.cur .h{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.cur .h ul{margin:4px 0 0;padding-left:18px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{min-height:52px;border-radius:10px;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.yn button.y{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.autohint{font-size:12px;color:var(--chip-ink);background:var(--chip);border-radius:6px;padding:5px 8px;margin-bottom:10px}

.plan{border-radius:12px;padding:14px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.plan.action{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.plan.urgent{border-color:var(--red-line);background:var(--red-bg);color:var(--red-ink)}
.plan .lab{color:inherit;opacity:.85}
.plan .pt{font:700 17px/1.4 var(--display);margin:4px 0 0;color:inherit}
.plan ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.plan ol li{margin:6px 0}
.plan ol b{font-weight:700}
.plan .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px}
.plan .meta a{color:inherit;font-weight:600}
.go{display:inline-block;margin-top:10px;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.copybox{display:block;width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px;font-size:13px}
.caveat{font-size:12px;color:var(--muted);margin:10px 0 14px;line-height:1.5}
.look h4{margin:12px 0 4px;font-size:13px}
.look ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.look li{margin:3px 0}
.src{padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.src:first-child{border-top:0}
.src span{display:block;font-size:12px;color:var(--muted)}
/* Tabs, emergency, calculators */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:0 0 6px}
.tabs button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.tabs button{font-size:13px}}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.em{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg)}
.tabs button.em.on{background:var(--red-ink);color:var(--bg);border-color:var(--red-ink)}
.icon-btn.sos{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg);font-weight:800}
.wtbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:10px}
.wtbar input{width:100%;font-size:20px;font-weight:700;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.wtbar .note{font-size:12px;color:var(--muted);line-height:1.35;max-width:150px}
.call{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:10px}
details.em{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red-ink);border-radius:12px;margin-bottom:8px}
details.em>summary{list-style:none;padding:13px 14px;min-height:50px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 16px var(--display)}
details.em>summary::-webkit-details-marker{display:none}
details.em>summary span{font:500 12px var(--sans);color:var(--muted);display:block;margin-top:2px}
details.em>summary::after{content:'+';color:var(--red-ink);font-size:20px}
details.em[open]>summary::after{content:'−'}
.em ol{margin:0;padding:0 14px 6px 34px;font-size:14.5px;line-height:1.5}
.em ol li{margin:6px 0}
.dose{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.unv{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:4px;padding:0 5px}
.em .meta{padding:0 14px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 12px}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.ctab th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-top:0}
.ctab td b{font-size:15px}
.chk{display:flex;flex-direction:column;gap:6px}
.askbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:10px;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.askrow{margin:4px 0 12px}
.fx-all{width:100%;min-height:56px;margin-top:14px;border-radius:12px;background:var(--accent);border:2px solid var(--accent);color:#fff;font:800 16px var(--display);padding:8px 12px;text-align:center}
.fx-all span{display:block;font:500 12.5px/1.35 var(--sans);opacity:.95;margin-top:3px}
#asksheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#asksheet[hidden]{display:none}
#asksheet .sh{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
#asksheet h3{margin:0;font:800 18px var(--display)}
#asksheet textarea{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:16px/1.4 var(--sans);background:var(--bg);color:var(--ink)}
#asksheet #askq{min-height:76px}
#asksheet #askprev{min-height:120px;font-size:12.5px;color:var(--muted)}
#asksheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#asksheet .acts a,#asksheet .acts button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;font:800 15px/1.2 var(--display);text-align:center;padding:4px 8px;text-decoration:none;border:2px solid var(--ink)}
#asksheet .acts .p1{background:var(--ink);color:var(--bg)}
#asksheet .acts .p2{background:var(--surface);color:var(--ink)}
#asksheet .x{justify-self:end;border:0;background:none;color:var(--muted);font-weight:700;font-size:14px;min-height:44px;padding:0 4px}
.handoff{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--ink);min-height:56px}
.handoff b{display:block;font:700 15px var(--display)}
.handoff span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.handoff i{font-style:normal;color:var(--accent);font-size:18px}
.tribar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.45}
.tribar b{display:block;font-weight:700}
.tribar .vbtn{color:inherit}
.cur.tricur{border-color:var(--warn-ink)}
.trihint{font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:6px 9px;margin-bottom:10px}
.step .qt small.trs{color:var(--warn-ink)}
.top .small{white-space:nowrap}
.srch{margin:2px 0 4px}
.srch input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#hits .mods{margin-top:8px}

.vbtn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;min-height:24px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:8px}
.gate h2{font-size:19px;margin-bottom:8px}
.gate ul{margin:0 0 16px;padding-left:20px;font-size:14.5px;line-height:1.55}
.gate li{margin:6px 0}
.gobtn{width:100%;min-height:52px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
@media (min-width:560px){.top h1{font-size:28px}}
/* v3: Unknown, basis, findings, assessment bar */
.seg button{min-width:40px}
.yn3{grid-template-columns:1fr 1fr .8fr}
.yn button.unk{font-size:14px;color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn-line)}
.bas{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid currentColor;opacity:.95;vertical-align:1px}
.b-un{color:var(--warn-ink);background:var(--warn-bg)}
.b-au{color:var(--chip-ink);background:var(--chip);border-color:var(--chip)}
.rev{font-size:12px;opacity:.85;margin-top:8px;line-height:1.4}
.qset{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}.qset .tg{min-height:44px;font-weight:700}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
a.pin{display:block;text-decoration:none}
.pin{min-height:60px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:700 16px var(--sans)}
.pin span{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:2px}
.pin.wide{grid-column:1/-1}
details.more{margin-top:10px;font-size:13px}details.more summary{cursor:pointer;opacity:.85}
.today{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.today h4{margin:12px 0 6px;font-size:14px}
.today .asab{display:flex;gap:8px}.today .asab .tg{flex:1;min-height:44px}
.today .tw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.today .la{font-size:14px;line-height:1.5}
.today .hob{display:flex;flex-wrap:wrap;gap:6px}
ul.hol{list-style:none;padding-left:0}ul.hol li{display:grid;grid-template-columns:28px 1fr;gap:6px;margin:6px 0;white-space:pre-line}ul.hol .ic{font-size:18px;line-height:1.3}
ul.hol li.warn{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:10px;padding:8px;font-weight:600}
.tb{margin:10px 0;padding:8px 10px;border:1px dashed var(--line);border-radius:10px}.tb ul{margin:6px 0 0;padding-left:18px}

.fx-sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(calc(100% - 56px - env(safe-area-inset-bottom,0px)));transition:transform .16s ease-out;will-change:transform}
.fx-sheet.open{transform:none}
.fx-handle{flex:none;position:relative;width:100%;height:calc(56px + env(safe-area-inset-bottom,0px));padding:0 16px env(safe-area-inset-bottom,0px);border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;touch-action:none}
.fx-sheet.open .fx-handle{height:56px;padding-bottom:0}
.fx-handle .grip{position:absolute;top:7px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--muted)}
.fx-handle .chev{color:var(--accent);font-size:16px}
.fx-body{flex:1;min-height:0;overflow:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.fx-sec{padding:12px 0;border-top:1px solid var(--line)}
.fx-sec:first-child{border-top:0;padding-top:0}
.fx-sec>.lab{margin-bottom:8px}
.fx-sec .path{margin:0}
.fx-sec .h ul{margin:0;padding-left:18px;font-size:15px;line-height:1.5}
.fx-tools{display:flex;flex-wrap:wrap;gap:8px}
.fx-tools button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;padding:0 14px}
.fx-tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fx-ret{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.fx-sheet{transition:none}}

/* Outpatient odontogenic antibiotic tiers (infection module). */
const ABX_TIERS='Tier 1: amoxicillin 500 mg TID or penicillin VK 500 mg QID (ADA 2019). Alternatives not in ADA 2019: amoxicillin-clavulanate 875/125 mg BID, and adding metronidazole 500 mg TID up front for severe or fascial spread (ADA adds it only on failure). Tier 2 — penicillin allergy without anaphylaxis, angioedema or hives: cephalexin 500 mg QID (ADA 2019) or cefuroxime 500 mg BID (not an ADA 2019 regimen). Tier 3 — anaphylaxis, angioedema or hives: azithromycin 500 mg day 1, then 250 mg days 2–5 (ADA 2019), plus metronidazole 500 mg TID; or moxifloxacin 400 mg daily (combination and moxifloxacin are not ADA 2019 regimens). Avoid oral clindamycin alone: >30% resistance in deep-space series (Long 2021) and C. difficile risk; ADA 2019 still lists it.';

 c:{q:'Taking an anticoagulant or antiplatelet?',yes:'nBleed',no:'d'},
 nBleed:{note:1,t:'Antithrombotic plan',get x(){return 'Low-bleed dental work (1–3 extractions, I&D): continue warfarin, DOACs and antiplatelets (CHEST 2022). Intermediate (>3 extractions, implants, grafts, biopsy): usually continue; local hemostasis. High (orthognathic, reconstruction, open trauma): plan with the prescriber (Allyn 2024). Heparin bridging is generally harmful; reserve for mechanical mitral valve, recent LV thrombus, or AF with recent stroke (2024 AHA/ACC). Warfarin: INR within 24 h (72 h if stable); '+(colleague()?'proceed if <4 (SDCEP). DOACs (SDCEP, UK): for higher-risk work, skip the morning dose of a twice-daily agent or delay a morning once-daily dose until 4 h after hemostasis.':'proceed if <3.5 (author’s protocol; SDCEP allows <4). DOACs: no interruption for extractions, alveoloplasty or routine implants (author’s protocol; SDCEP retimes one dose for higher-risk work).')+' Never stop dual antiplatelets after a stent without cardiology. Operate early. '+HEMO},src:'chest',next:'d'},
 d:{q:'Antiresorptive/antiangiogenic drug, or head-and-neck radiation to the site?',h:['Bisphosphonate, denosumab, bevacizumab, TKIs','Oncologic dosing carries far higher risk than osteoporosis dosing'],yes:'nBone',no:'d2'},
 d2:{q:'Taking an SGLT2 inhibitor or GLP-1 receptor agonist?',h:['SGLT2: -gliflozin (empagliflozin, dapagliflozin…)','GLP-1 RA: semaglutide, tirzepatide, liraglutide, dulaglutide'],yes:'nMeds',no:'e'},
 nMeds:{note:1,t:'SGLT2 / GLP-1',x:'SGLT2 inhibitor: hold 3–4 days before elective surgery (ketoacidosis risk); coordinate urgent care with the prescriber. '+GLP_POLICY.summary,src:'glp1',next:'e'},
 nBone:{note:1,t:'MRONJ / ORN risk',x:'Oncologic dosing (monthly zoledronate or denosumab/Xgeva, antiangiogenics): highest risk (about 1% and above) — avoid elective extractions and implants; coordinate with oncology. Osteoporosis dosing: low risk (bisphosphonates ~0.02–0.05%, denosumab ~0.3%); proceed with documented consent, atraumatic technique and primary closure. Risk rises with bisphosphonate use ≥4 years and with steroids. Denosumab (Prolia, every 6 months): operate about 3–4 months after the last dose and resume 6–8 weeks after surgery, with the prescriber; never let a dose lapse unplanned (rebound fractures) [verify: timing from AAOMS-cited review]. CTX testing does not predict MRONJ — not indicated. Bisphosphonate drug holidays are unproven (AAOMS 2022). Radiation: get the dose to the site from radiation oncology before surgery. Established exposed bone: MRONJ staging module; radiation details: Radiation & chemotherapy module.',src:'aaoms',next:'d2'},
 e:{q:'IV sedation or general anesthesia planned?',yes:'f',no:'oLocal'},
 oLocal:{out:'No exclusion found by this screen for local anesthesia in the office.',scr:'ASA class, labs, drug timing and procedure-specific risks beyond these steps. Search a finding for detail.',ex:'Confirm consent, alternatives (including no treatment), and after-hours contact.'},
 f:{q:'STOP-Bang ≥3 (intermediate or high OSA risk)?',auto:r=>r.sb==null?undefined:r.sb>=3,ah:r=>r.sb!=null?`STOP-Bang ${r.sb}/8 · ${r.sbCat} risk`:'',h:['Score it in the STOP-Bang box above to answer automatically'],yes:'oAir',no:'g'},
 g:{q:'Difficult-airway signs?',h:['Mallampati III–IV, limited opening or neck extension, short thyromental distance','Prior difficult airway or anesthesia complication'],yes:'oAir',no:'oSed'},
 oAir:{out:'Sedation needs a deliberate airway plan before booking.',tone:'action',src:'stopbang',go:'sed',ex:'Options: lighter sedation or local only, anesthesia or sleep consult, or a hospital setting. Confirm rescue airway equipment and capnography.'},
 oSed:{out:'No office-sedation exclusion found by this screen.',scr:'ASA class, fasting and GLP-1 timing — check them in Office sedation plan.',ex:'Confirm NPO, escort, monitoring with capnography, and rescue drugs and airway equipment.',go:'sed'}
 },
 look:[['History',['Allergy phenotype: rash vs anaphylaxis vs intolerance (latex, chlorhexidine, antibiotics, LA)','Exercise tolerance; recent hospitalization or new diagnoses','CKD/dialysis, liver disease with coagulopathy, steroids, immunosuppressants, chemotherapy']],['Exam',['Resting BP, HR, SpO₂; repeat abnormal values','ASA class from current ASA definitions','Airway: Mallampati, opening, neck mobility, dentition, BMI, neck size']]]},

{id:'dm',g:'Anesthesia & medical',title:'Diabetes',d:'A1C context · day-of meds · glucose on arrival',
 start:'nA1c',refs:['ada16','dm26','allyn','glp1','adahypo','filippi'],
 caveat:'Medication changes are the prescriber’s call. ADA 2026 fasting-surgery guidance is not a universal dental dose order.',
 nodes:{
 nA1c:{note:1,t:'A1C is context, not a gate',x:'ADA 2026: elective preoperative A1C goal <8% within 3 months, with individualized risk–benefit assessment. Do not postpone surgery based on A1C alone. Discuss optimization when timing allows; day-of glucose, symptoms, procedure size and urgency decide. Never delay urgent care for A1C.',src:'ada16',next:'b'},
 b:{q:'On insulin, a sulfonylurea or an SGLT2 inhibitor?',yes:'nMed',no:'c'},
 nMed:{note:1,t:'Individual medication plan',x:INSULIN_GUIDE,src:'ada16',next:'c'},
 c:{q:'Arrival glucose outside the individualized perioperative target (ADA: 100–180 mg/dL)?',yes:'oGlu',no:'oOk'},
 oGlu:{out:'Assess symptoms, glucose trend and the individualized plan before proceeding. <70: treat (Emergency → Hypoglycemia). Markedly high or unwell: discuss with the physician; assess for metabolic decompensation and reschedule elective care as indicated.',tone:'action',src:'ada16'},
 oOk:{out:'No diabetes-related reason to defer found by this screen. Recheck glucose after sedation; resume meds with eating.',scr:'Assumes arrival glucose was measured today. A1C informs risk discussion only.',src:'allyn',ex:'Poorly controlled diabetes or major surgery: consider antibiotics to support healing (Filippi).'}
 }},

{id:'htn',g:'Anesthesia & medical',title:'Hypertension',d:'Proceed, defer, or refer at chairside BP',
 start:'a',refs:['allyn'],
 caveat:'No validated BP cutoff exists for oral surgery; 180/110 is the accepted perioperative ceiling (Allyn 2024). Recheck after rest before deciding.',
 nodes:{
 a:{q:'Symptoms of end-organ damage?',h:['New headache, vision change, chest pain, shortness of breath, neuro deficit'],yes:'oEr',no:'b'},
 oEr:{out:'Stop. Hypertensive emergency workup: ED or 911.',tone:'urgent',src:'allyn'},
 b:{q:'BP still ≥180/110 after rest and recheck?',yes:'oDef',no:'oGo'},
 oDef:{out:'Defer elective surgery; refer to the physician (hypertensive urgency).',tone:'action',src:'allyn',ex:'Urgent infection or pain: control the source with the least invasive option and monitoring.'},
 oGo:{out:'No BP-based reason to defer found. Overall cardiovascular risk, not BP alone, sets the plan.',scr:'Cardiac history and functional capacity — see Pre-op clearance.',src:'allyn',ex:'Anxiety control helps; continue usual antihypertensives.'}
 }},

{id:'renal',g:'Anesthesia & medical',title:'Kidney disease & dialysis',d:'Timing · fistula arm · analgesics',
 start:'a',refs:['asaps','andersson','dialysis'],
 caveat:'Renally cleared drugs (some antibiotics, gabapentinoids) need dose checks with pharmacy or nephrology.',
 nodes:{
 a:{q:'ESRD not on regular dialysis?',yes:'oHosp',no:'b'},
 oHosp:{out:'ASA IV: physician/nephrology input before anything elective; hospital setting for surgery.',tone:'urgent',src:'asaps'},
 b:{q:'On hemodialysis?',yes:'nHd',no:'oCkd'},
 nHd:{note:1,t:'Hemodialysis',x:'Operate the day after dialysis (heparin cleared, uremia lowest). Coordinate the next dialysis and its anticoagulation with nephrology; do not defer necessary dialysis without that plan. Never use the shunt/fistula arm for BP or IV. Check platelets; local hemostasis.',src:'andersson',next:'oHd'},
 oHd:{out:'Plan for a non-dialysis day with local hemostasis.',scr:'Current potassium, platelets and access-arm precautions must still be confirmed.',src:'dialysis',ex:'Analgesia: avoid aspirin and NSAIDs; low-dose acetaminophen. ASA III.'},
 oCkd:{out:'No dialysis-related exclusion. Use renal dosing and avoid NSAIDs.',scr:'Current eGFR and potassium are not checked by this screen.',src:'dialysis',ex:'Confirm current eGFR and potassium if sedating.'}
 }},

{id:'liver',g:'Anesthesia & medical',title:'Liver disease',d:'History over INR · hemostasis',

 }},

{id:'preg',g:'Anesthesia & medical',title:'Pregnancy',d:'Treat now or defer · drugs to use and avoid',
 start:'a',refs:['preg','nsaidpreg'],
 caveat:'Coordinate analgesic choice with the obstetrician.',
 nodes:{
 a:{q:'Infection, pain or other urgent need?',yes:'oNow',no:'b'},
 oNow:{out:'Treat now, any trimester. Delay makes problems worse.',src:'preg',ex:'Radiographs are safe; abdominal/thyroid shields no longer recommended. LA with epinephrine is fine. Antibiotics: penicillin, amoxicillin, cephalosporins, clindamycin, metronidazole. Avoid nitrous oxide. No NSAIDs at ≥20 weeks (FDA).'},
 b:{q:'Elective major surgery (implants, grafting, sedation, third molars without disease)?',yes:'oDefer',no:'oRoutine'},
 oDefer:{out:'Defer until after delivery.',tone:'action',src:'preg',ex:'Per ACOG/ASA 775 on nonobstetric surgery, cited by ADA.'},
 oRoutine:{out:'Diagnostic and minor procedures can proceed in any trimester.',scr:'Obstetric complications or high-risk pregnancy — ask the obstetrician.',src:'preg',ex:'No NSAIDs at ≥20 weeks; avoid entirely at ≥30 weeks (FDA).'}
 }},

{id:'onc',g:'Anesthesia & medical',title:'Radiation & chemotherapy',d:'ORN prevention · pre-RT extractions · chemo timing',
 start:'therapy',refs:['orn','filippi','aaoms'],
 caveat:'Get the jaw dose map from radiation oncology. Antiresorptives → Pre-op (MRONJ).',
 nodes:{
 therapy:{q:'Jaw/head-and-neck radiation planned or previously received?',h:['Chemotherapy without relevant radiation: No leads directly to the chemotherapy question. Unknown remains unresolved.'],yes:'a',no:'c'},
 a:{q:'Radiation planned but not started?',yes:'oPre',no:'b'},
 oPre:{out:'Remove poor-prognosis teeth in the field ≥2 weeks before RT; don’t delay RT for fast tumors.',tone:'action',src:'orn',ex:'If extractions change the bite, do them before the mask is made. Start daily prescription fluoride.'},
 b:{q:'Prior jaw dose ≥50 Gy at the surgical site?',yes:'nOrn',no:'c'},
 nOrn:{note:1,t:'ORN high-risk zone',x:'Prefer endo/restoration over extraction; avoid implants unless nothing else restores function. If you must extract: atraumatic, smooth bone, primary closure. Optional: pentoxifylline 400 mg BID + tocopherol 1000 IU daily from ≥1 week before to ~4 weeks after; antibiotics before/after. HBO not routine (consider when a large jaw volume received >50 Gy).',src:'orn',next:'c'},
 c:{q:'On active chemotherapy?',yes:'oChemo',no:'oGo'},
 oChemo:{out:'Avoid oral surgery during chemo; if unavoidable, agree timing with oncology using current neutrophil and platelet counts.',tone:'action',src:'filippi',ex:'Antibiotics per findings. Most patients resume normal care after chemotherapy ends.'},
 oGo:{out:'No radiation- or chemotherapy-specific exclusion found by this screen. Standard care plus any risk steps listed here.',scr:'Antiresorptive exposure (MRONJ) — see Pre-op clearance.',src:'orn'}
 }},

{id:'steroid',g:'Anesthesia & medical',title:'Chronic steroids',d:'Adrenal-risk assessment · stress dosing',
 start:'a',refs:['giai','spsdent','steroid'],
 caveat:'Never withhold the usual steroid dose. Stress-dose amounts are set by the prescriber or endocrinology; this flow decides who needs cover and by which route.',
 nodes:{
 a:{q:'Known adrenal insufficiency (Addison’s, pituitary disease, or on hydrocortisone replacement)?',yes:'oAI',no:'b'},
 oAI:{out:'Adrenal insufficiency: give steroid cover. Agree the dose with endocrinology or the prescriber.',tone:'action',src:'spsdent',src2:'giai',ex:'Primary AI (UK SPS): extra glucocorticoid dose before the visit; for oral surgery, cover before and for 24 h after. Parenteral cover for GA, regional anesthesia or major surgery. The patient brings their emergency hydrocortisone kit. Collapse: SOS → Adrenal crisis.'},
 b:{q:'Adrenal-suppression risk from steroid use?',h:['Oral glucocorticoid ≥3–4 weeks above ~15–25 mg/day hydrocortisone-equivalent (≈ prednisone 4–6 mg/day), now or recently stopped','Also consider: high-dose inhaled or topical steroids, intra-articular injection in the past 2 months, a strong CYP3A4 inhibitor (e.g., ritonavir) with a steroid','Courses under 3–4 weeks: low concern (ESE/Endocrine Society 2024)'],yes:'c',no:'oNo'},
 oNo:{out:'Low adrenal-suppression risk by dose and duration: continue the usual dose; no extra cover.',scr:'Relies on a complete steroid history (all routes, recent courses). Unknown history is not low risk.',src:'giai',ex:'Seek advice if the patient becomes unwell or the case becomes major.'},
 c:{q:'HPA-axis recovery documented since (e.g., morning cortisol >10 µg/dL / 300 nmol/L)?',yes:'oRec',no:'d'},
 oRec:{out:'Documented recovery: continue the usual dose; no stress cover needed.',src:'giai',ex:'Treat new instability as possible adrenal crisis regardless.'},
 d:{q:'GA, regional anesthesia, major or prolonged surgery, unable to take oral intake, vomiting/diarrhea or unstable?',h:['IV sedation is not named in the 2024 guideline; treat a long or deep sedation case as moderate stress [verify]'],yes:'oPar',no:'oOral'},
 oPar:{out:'At risk, moderate–major stress: parenteral stress-dose glucocorticoid (e.g., IV hydrocortisone at induction), per the prescriber or anesthesia.',tone:'action',src:'giai',ex:'Continue the usual dose. Not tested for adrenal insufficiency = give cover (R3.1). Hypotension, vomiting or collapse: SOS → Adrenal crisis.'},
 oOral:{out:'At risk, minor stress under local: oral stress-dose cover; dose per the prescriber.',tone:'action',src:'giai',ex:'Continue the usual dose. Untested patients exposed to stress get cover (ESE/Endocrine Society 2024, R3.1A). Escalate to parenteral cover if the patient vomits or becomes unstable.'}
 }},

{id:'pain',g:'Post-op & complications',title:'Post-op analgesia',d:'NSAID first · when an opioid is allowed',
 start:'a',refs:['ada24','apapFDA','nsaidpreg','dialysis','liNsaid','mtxLbl','tramLbl'],
 caveat:'ADA 2024 suggests against adding corticosteroids for pain after surgical extraction. Daily max: ibuprofen 2400 mg, naproxen sodium 1100 mg, acetaminophen 4000 mg (all sources).',
 nodes:{
 a:{q:'NSAID contraindicated?',h:['Pregnancy ≥20 weeks (FDA)','Kidney disease or dialysis','Anticoagulant or antiplatelet: SDCEP advises acetaminophen rather than NSAIDs','Lithium or methotrexate: NSAIDs raise their levels — acetaminophen, or an NSAID only as agreed with the prescriber','NSAID allergy, active GI bleed or ulcer, or prescriber advice to avoid'],yes:'oApap',no:'b'},
 oApap:{out:'Acetaminophen 1000 mg per dose maximum; recommend ≤3000 mg/day, absolute ceiling 4000 mg/day from all products (lower if clinically indicated).',src:'ada24',ex:'If inadequate, reassess the cause and confirm opioid eligibility separately: do not use this pathway to bypass CNS-medication, existing-opioid or other contraindication checks.'},
 b:{q:'NSAID + acetaminophen expected to fail, or already failed?',h:['e.g., difficult surgical extraction','Severe pain at 72 h: examine for a complication first'],yes:'c',no:'oFirst'},
 oFirst:{out:'Ibuprofen 400 mg or naproxen sodium 440 mg, alone or with acetaminophen 500 mg.',src:'ada24',ex:'Scheduled dosing for the first days. No “just in case” opioid.'},
 c:{q:'On a benzodiazepine, gabapentinoid, other CNS-active drug, or opioids already?',yes:'oNoOp',no:'oOp'},
 oNoOp:{out:'No opioid. Maximize NSAID + acetaminophen and re-examine for a complication.',tone:'action',src:'ada24'},
 oOp:{out:'If an opioid is clinically indicated after reassessment, select and document the exact drug/formulation, strength, dose, interval and quantity. Reconcile all acetaminophen-containing products; do not add duplicate acetaminophen automatically.',tone:'action',src:'ada24',ex:'Lowest dose, fewest tablets, rarely >3 days. Informed consent; counsel on storage and disposal. On an SSRI or SNRI: not tramadol (serotonin syndrome, seizures; label).'}
 }},

{id:'calltri',g:'Post-op & complications',title:'Post-op phone call triage',d:'Staff script · 911, come in now, same day, or reassure',
 start:'a',refs:['mcgill','hsdm','secrets','andersson'],
 caveat:'For the person taking the call. Ask each question as written. Any doubt: the surgeon calls back. Document time, symptoms, advice given and who called back.',
 nodes:{
 a:{q:'Trouble breathing or swallowing, swelling spreading under the jaw, into the neck or to the eye, chest pain, cannot be woken, or hives with lip, tongue or throat swelling?',h:['Ask: “Are you having any trouble breathing or swallowing?”','Ask: “Is the swelling moving down your neck or up to your eye?”','After IV sedation: very hard to wake = emergency'],yes:'o911',no:'b'},
 o911:{out:'Call 911 now for these emergency symptoms. Then tell the surgeon.',tone:'urgent',src:'secrets',ex:'Stay on the line until help is arranged. Do not wait for a callback.'},
 b:{q:'Bleeding that keeps going after 30 minutes of firm pressure?',h:['Coach first: sit upright, wipe out clots, bite firmly on fresh folded gauze or a moist black tea bag for 30 minutes, no peeking','Oozing or pink saliva for 1–2 days is normal'],yes:'b2',no:'c'},
 b2:{q:'Heavy (mouth filling, repeated large clots), on a blood thinner, or a bleeding disorder?',yes:'oBleedNow',no:'oBleedCall'},
 oBleedNow:{out:'Surgeon now. Come in now; after hours or no answer in 15 minutes, go to the emergency room.',tone:'urgent',src:'andersson',go:'bleed',ex:'Keep firm pressure on the way. Bring the medication list.'},
 oBleedCall:{out:'Surgeon calls back within the hour. Repeat 30 minutes of firm pressure (gauze or tea bag) meanwhile.',tone:'action',src:'mcgill',go:'bleed',ex:'Still bleeding after the second 30 minutes: come in, or the emergency room after hours.'},
 c:{q:'Fever over 100.4°F (38°C), swelling getting bigger after day 3, pus, or a bad taste with swelling?',yes:'oInf',no:'d'},
 oInf:{out:'Same-day visit for an infection check. Surgeon reviews before any antibiotic is called in.',tone:'action',src:'mcgill',go:'infection',ex:'Worse while waiting, trouble swallowing or opening, or swelling spreading: emergency room.'},
 d:{q:'After an extraction: pain getting worse after day 2–3, or throbbing toward the ear?',yes:'oDry',no:'e'},
 oDry:{out:'Visit within 24 hours (dry socket check).',tone:'action',src:'mcgill',go:'ao',ex:'Meanwhile: pain medicines as on the handout, unless the patient was told otherwise.'},
 e:{q:'Lip, chin or tongue still numb the day after surgery (local anesthetic worn off)?',yes:'oNum',no:'f'},
 oNum:{out:'Contact the surgeon promptly to establish mechanism, timing and sensory findings. A recent implant/foreign-body injury with possible ongoing nerve compression needs immediate assessment; do not wait for a routine review interval.',tone:'action',src:'mcgill',go:'nerve',ex:'Tell the patient: avoid biting or burning the numb area. Early assessment matters; some injuries are repaired.'},
 f:{q:'After an upper tooth removal or sinus lift: liquid coming out of the nose, air through the socket, or a nosebleed?',yes:'oOac',no:'g'},
 oOac:{out:'Visit within 1–2 days (sinus opening check). Sinus precautions now.',tone:'action',src:'mcgill',go:'oac',ex:'No nose blowing, sneeze with the mouth open, no straws or smoking. A steady nosebleed that pressure does not stop: emergency room.'},
 g:{q:'Full-arch: bridge loose, cracked or moving, or the bite feels uneven?',yes:'oArch',no:'h'},
 oArch:{out:'Visit within 1–2 days. Liquids and soft food only; do not remove the bridge.',tone:'action',src:'mcgill'},
 h:{q:'Rash or itching after starting a medicine, or vomiting and unable to keep fluids down?',h:['Rash with lip, tongue or throat swelling, or trouble breathing: that is the first question (911)'],yes:'oMed',no:'oOk'},
 oMed:{out:'Surgeon calls back today. Rash: identify the suspected medicine; if the rash began after the antibiotic, stop that antibiotic and contact the surgeon. Vomiting: sips of clear fluids; stop the opioid if taking one.',tone:'action',src:'hsdm',ex:'Unable to keep fluids down for more than 24 hours, dizzy, or not passing urine: come in or the emergency room.'},
 oOk:{out:'Expected healing. Reassure and review the handout.',src:'mcgill',ex:'Normal: swelling peaking on day 2–3, bruising, jaw stiffness, sore throat, mild oozing. Call back if anything gets worse or a new symptom appears.'}
 },
 look:[['Say at the start',['“I’m going to ask a few quick questions. Tell me yes or no.”','Confirm the procedure and date, and whether sedation was used.']],['Document',['Time of call, symptoms, advice given, who called back, follow-up booked.']]]},

{id:'ao',g:'Post-op & complications',title:'Dry socket',d:'Alveolar osteitis vs infection · treatment · prevention',
 start:'a',refs:['secrets','andersson','aotx','aoprev'],

 oOther:{out:'Look for another cause: retained root or sequestrum, fracture, infection, or referred pain.',tone:'action',src:'ada24'}

{id:'bleed',g:'Post-op & complications',title:'Post-op bleeding',d:'Local measures · TXA · when to escalate',
 start:'a',refs:['andersson','secrets','filippi','txa','chest'],
 caveat:'Do not stop anticoagulants to manage a socket bleed without the prescriber.',

{id:'lac',g:'Trauma',title:'Facial laceration',d:'Explore vs close · bites · lip, lid, ear · tetanus',

 b:{q:'Deep-structure injury suspected?',h:['Facial weakness with a wound lateral to a vertical line through the lateral canthus','Cheek wound on the tragus–mid-upper-lip line, or clear fluid (saliva) in the wound → parotid duct','Medial lower lid near the punctum (canaliculus), lid margin, tarsal plate, or globe'],yes:'oDeep',no:'c'},
 oDeep:{out:'Explore and repair the deep structure before skin closure (OR or the right service).',tone:'urgent',src:'fn72',src2:'lacaafp',ex:'Facial nerve: repair within 72 h, while distal branches still respond to a nerve stimulator; tension-free epineurial repair under magnification; graft if a gap (graft can wait 9–12 months). Weakness medial to the lateral-canthus line usually recovers without repair [verify]. Parotid duct: cannulate Stensen’s papilla and inject saline or methylene blue; leak in the wound = duct injury → repair over a stent; gland-only injury → layered closure and pressure dressing [verify]. Canaliculus, lid margin, tarsal plate, globe, or deeper than subcutaneous on the lid: ophthalmology/oculoplastics.'},
 c:{q:'Bite wound (dog, cat, human)?',yes:'nBite',no:'d'},
 nBite:{note:1,t:'Bite',x:'Irrigate copiously and debride devitalized tissue. Facial dog bites: close primarily (good blood supply, cosmesis); cat bites off the face often do better left open. Antibiotics for higher-risk wounds (cat or human bite, deep puncture, edema, immunocompromise, near bone or cartilage) and for primarily closed bites: amoxicillin-clavulanate 875/125 mg PO BID, about 3–7 days [verify]; penicillin allergy: clindamycin (+ ciprofloxacin or TMP-SMX for broader cover) or doxycycline. Rabies: bat, raccoon, skunk, fox, monkey, or stray/unobservable animal → PEP with the health department; owned dog or cat → 10-day observation. Report the bite per local rules [verify].',src:'lacaafp',next:'d'},
 d:{q:'Grossly contaminated, infected, or over ~24 h old?',h:['AAFP: head wounds may be closed up to 24 h after injury; no fixed golden period'],yes:'oDirty',no:'e'},
 oDirty:{out:'Clean and debride; close if clean after irrigation, otherwise pack and close in 3–5 days.',tone:'action',src:'lacaafp',ex:'Face usually still tolerates primary closure after debridement given its blood supply [verify]. Infected: open, drain, culture, antibiotics; delayed closure. Remove gravel/asphalt now (traumatic tattoo is hard to fix later). Tetanus: dirty/major wound column.'},
 e:{q:'Special site: lip through the vermilion, ear cartilage, eyelid skin, nose through-and-through, or tissue loss?',yes:'oSite',no:'oSimple'},
 oSite:{out:'Site-specific layered repair (see details).',tone:'action',src:'lacaafp',ex:'Lip: mark the vermilion border before injecting; first skin suture aligns the border; 3-0/4-0 absorbable to orbicularis and mucosa; 6-0/7-0 nylon skin. Through-and-through: mucosa, muscle, then skin. Ear: cover all cartilage; one bite of 6-0 polypropylene through skin and perichondrium; bolster/head wrap against hematoma. Eyelid skin only: 6-0 nylon (lid margin/tarsus → ophthalmology). Nose through-and-through: mucosa, cartilage, skin [verify]. Tissue loss/avulsion: conserve tissue, minimal debridement; local flap or plastics for large defects [verify].'},
 oSimple:{out:'Irrigate, anesthetize, and close in layers; sutures out at 3–5 days.',src:'lacaafp',ex:'Tap water or saline, 50–100 mL per cm of wound. Lidocaine with epinephrine is fine on the face (1:200,000 safe on nose and ear). Deep absorbable, then 5-0 or 6-0 nylon skin. Tissue adhesive: clean, linear, low-tension, <12 h, not on mucocutaneous junctions or hair. No routine systemic antibiotics for clean non-bite wounds; topical antibiotic ointment. Sun protection on the scar [verify].'}
 },

 oIntr:{out:'Intrusion: plan by apex stage and depth. Splint 4 weeks once repositioned.',tone:'action',src:'oep',ex:'Open apex: allow re-eruption; no movement in 4 weeks → orthodontic repositioning. Closed apex <3 mm: allow re-eruption; none in 8 weeks → reposition. 3–7 mm: orthodontic or surgical repositioning. >7 mm: surgical repositioning. Closed apex: pulp necrosis is expected; start root canal within 2 weeks.'},

{id:'arch',g:'Implants',title:'Full-arch',d:'Immediate vs delayed loading · v6 checklist',

 bx:{q:'Bruxism or heavy parafunction?',h:['History or partner report of grinding/clenching; morning jaw fatigue','Wear facets, fractured restorations, masseter hypertrophy'],yes:'nBx',no:'c'},
 nBx:{note:1,t:'Bruxism load control',x:'Bruxism roughly doubles implant failure odds (OR 2.2; J Oral Rehabil 2023). First: rigid cross-arch splint, flat provisional occlusion with no cantilever contact, short cantilevers, an extra implant if bone allows, night guard on the definitive prosthesis. Optional adjunct (Dr. Young protocol): botulinum toxin A to the masseters 2–3 weeks before surgery, so the effect peaks (~5–8 weeks; Chen 2023) through early osseointegration [verify: no full-arch trial tests this timing]. Dose as in the TMD module: Botox 100 U/2.5 mL, masseter only, 4 points per side, 25 U per side if toxin-naive, up to 40 U. Evidence for the adjunct is one retrospective series of 26 full-arch bruxers (0 vs 2 implant failures; Mijiritsky 2016). Off-label; consent as in the TMD module, including possible bone loss with repeated doses — avoid open-ended redosing.',src:'brux',next:'c'},
 o2:{out:'Delayed loading likely; confirm with the restorative team.',src:'iti13',go:'sinus',go2:'graft'},
 c:{q:'At surgery: each implant stable, with adequate distribution and AP spread?',yes:'o3',no:'o4'},
 o3:{out:'Immediate loading with a splinted provisional.',src:'iti13',ex:'Verify passive fit, cantilever limits and provisional occlusion.'},
 o4:{out:'Use the planned delayed-loading fallback.',tone:'action'}
 },
 look:[['1 · Patient (v6)',['ASA, anesthesia type; STOP-Bang if sedated','Smoking, HbA1c, anticoagulant plan, head/neck radiation','Antiresorptive/antiangiogenic: agent, route, duration → MRONJ risk consented','Consent: fixed vs overdenture vs denture; failure/conversion plan']],['2 · Prosthetic endpoint',['Restorative + lab approved setup: fixed vs overdenture; FP1/FP2 vs FP3','Transition line hidden; restorative space → planned reduction','Space: ≥13–15 mm acrylic hybrid; 8–10 mm monolithic zirconia; <7 mm crown & bridge only (board notes)']],['3 · Anatomy & plan',['CBCT merged with setup: sinus/nasal floor (max); IAN, mental loop, lingual concavity (mand)','Grafting: none / sinus / GBR; immediate vs delayed placement','AP spread, cantilever (≤1.5 × AP spread), guide: static / dynamic / freehand']],['4 · Configuration',['Maxilla fixed: 4 acceptable with good AP spread + rigid splint; 5–6 if soft bone, short AP spread or heavy load','Mandible fixed: 4 with good AP spread + rigid splint','Overdenture: maxilla ≥4; mandible 2 interforaminal minimum','Tilted posterior implants (17°/30°) to widen spread; plan one extra when bone quality is uncertain']],['5 · Loading go / no-go',['Record torque and ISQ per site against your preset threshold','Stability met, cross-arch splint, passive fit, no cantilever contact','No-go: denture, delayed fixed, add implant, or stage — record the reason']],['6 · Handoff',['Post-op instructions; soft diet; night guard if bruxism','Baseline probing + radiographs at delivery; risk-based recall','Photogrammetry/IOS accuracy check; who removes the prosthesis for cleaning']]]},

{id:'infection',g:'Dentoalveolar & acute',title:'Odontogenic infection',d:'Hospital vs office · antibiotics or not',
 start:'a',refs:['adaAbx','sdcepAbs','ludwig','lect','board'],
 red:'<b>Airway first.</b> Voice change, drooling, stridor, can’t swallow saliva, raised floor of mouth, severe trismus, or toxic appearance: emergency department now.',
 caveat:'ADA 2019 regimens are for immunocompetent adults. Antibiotics never replace source control.',
 nodes:{
 a:{q:'Airway threat or severe systemic illness?',h:['See the red box','Fever with tachycardia, hypotension, dehydration, lethargy'],yes:'oER',no:'b'},
 oER:{out:'Emergency / hospital care now.',tone:'urgent',src:'lect',src2:'ludwig',go:'dns',ex:'Airway stabilization before CT if the airway is threatened; do not lay an unstable patient flat for imaging. Anesthesia early (awake fiberoptic/video), pre-mark the cricothyrotomy site. IV ampicillin-sulbactam, or IV penicillin + metronidazole, or IV clindamycin 600 mg q6–8h + levofloxacin 750 mg q24h (clindamycin alone is not recommended: >30% resistance). Drain every involved space through a dependent incision; never needle-drain the lateral pharyngeal space. Culture.'},
 b:{q:'Admission trigger present?',h:['FAST: Fever, Airway, rapid Spread, Sick host (A1C >8, immunosuppressed), multiple Spaces, altered menTal status','Fascial spread: submandibular, sublingual, submental, masticator, lateral pharyngeal, periorbital','Ludwig’s angina, or failed outpatient treatment / non-compliance'],yes:'oER',no:'c'},
 c:{q:'Can you get source control today (drainage, extraction or pulp access)?',yes:'nSC',no:'oNoSC'},
 nSC:{note:1,t:'Source control',x:'Drain the collection and remove the source (extraction or pulp access) in the same visit.',next:'d'},
 oNoSC:{out:'Antibiotics now, plus urgent referral for source control.',tone:'action',src:'adaAbx',src2:'ludwig',ex:'Outpatient empiric tiers, 3–7 days. '+ABX_TIERS+' Recheck within 3 days.'},
 d:{q:'Systemic involvement (fever, malaise, lymphadenopathy), spreading cellulitis, incomplete drainage, or immunocompromise?',yes:'oAbx',no:'oNo'},
 oAbx:{out:'Source control plus antibiotics.',tone:'action',src:'adaAbx',src2:'ludwig',ex:'Outpatient empiric tiers, 3–7 days. '+ABX_TIERS+' Stop 24 h after symptoms resolve. Recheck within 3 days; escalate if worse. Failure: add metronidazole 500 mg TID or switch to amoxicillin-clavulanate 500/125 mg TID, 7 days.'},
 oNo:{out:'Source control alone. No antibiotics.',src:'adaAbx',ex:'Give return precautions: swallowing, breathing, spreading swelling, fever.'}
 },
 look:[['Exam',['Swelling distribution, fluctuance, mouth opening, tongue elevation','Diabetes, immunosuppression, pregnancy','Allergy phenotype, renal/hepatic function, interactions (e.g., warfarin)']],['Culture when',['Rapid spread, post-op or recurrent infection, no response to treatment','Immunocompromised host; osteomyelitis, actinomycosis, suspected fungal']],['Not improving? Check',['Wrong or missed space; source not removed — re-image','Hardware or foreign body','Non-compliance, wrong antibiotic, fungal infection in immunocompromised']],['Pitfalls',['Ciprofloxacin has no anaerobic cover — never for odontogenic infection','Cutaneous fistula: treat the tooth, not the tract','Submandibular mass without pus: think lymphoma, biopsy']]]},

{id:'dns',g:'Dentoalveolar & acute',title:'Deep neck space infection',d:'Airway first · CT reach · drain vs medical trial · necrotizing/mediastinal spread',
 start:'a',refs:['ludwig','dnmrad','lect','board'],
 red:'<b>Airway before imaging.</b> Stridor, drooling, can’t handle secretions, sitting upright to breathe, voice change, falling SpO₂, or rising tongue/floor of mouth: secure the airway first. Do not lay the patient flat for CT.',
 caveat:'Hospital consult flow for adults. Doses are adult IV starting regimens from one evidence-based review; adjust for renal function, allergy and local antibiogram, and narrow by culture.',
 nodes:{
 a:{q:'Airway compromise now or progressing?',h:['Stridor, drooling, pooling secretions, tripod/upright posture, muffled voice','Tongue elevation, firm floor of mouth, bilateral submandibular swelling (Ludwig’s)','Falling SpO₂ or rising work of breathing'],yes:'oAir',no:'b'},
 oAir:{out:'Secure the airway first, in the OR with anesthesia and a surgeon ready for a surgical airway.',tone:'urgent',src:'ludwig',ex:'Preferred: awake flexible endoscopic intubation, often nasal, patient seated, topical lidocaine, minimal sedation (e.g., small-dose ketamine). Avoid blind nasal or oral attempts and supraglottic devices. Severe edema or distorted anatomy: awake tracheostomy under local. Cricothyrotomy may be technically hard. Then re-enter this flow at imaging.'},
 b:{q:'Can the patient lie supine safely for CT?',yes:'nWork',no:'oNoCT'},
 oNoCT:{out:'Treat as an airway threat: secure the airway before CT.',tone:'urgent',src:'ludwig',ex:'Bedside ultrasound can look for a submandibular collection while the airway is managed. Start IV antibiotics now (regimens below once imaged, or ampicillin-sulbactam 3 g IV q6h if no allergy).'},
 nWork:{note:1,t:'Workup',x:'CT neck with IV contrast (CT + exam: sensitivity 95%, specificity 80%). Extend to CT chest with contrast if the infection reaches the retropharyngeal/danger space, carotid sheath or low neck, or with chest pain, dyspnea or a widened mediastinum [verify: threshold is consensus practice, not a guideline]. Labs: CBC, BMP, glucose (A1C if diabetic), lactate; blood cultures if septic. Culture pus at drainage.',src:'ludwig',next:'nAbx'},
 nAbx:{note:1,t:'Empiric IV antibiotics',x:'Immunocompetent: ampicillin-sulbactam 3 g q6h; or ceftriaxone 2 g q12h + metronidazole 500 mg q8h; or clindamycin 600 mg q6–8h + levofloxacin 750 mg q24h. Immunocompromised: cefepime 2 g q8h + metronidazole, or piperacillin-tazobactam 4.5 g q6h, or meropenem 2 g q8h. Add vancomycin 20 mg/kg (or linezolid 600 mg q12h) for MRSA risk (diabetes, IV drug use, dialysis, recent hospitalization, long-term care). Clindamycin alone is not recommended (>30% resistance). Dexamethasone 10 mg IV is commonly used for edema; evidence limited [verify].',src:'ludwig',next:'c'},
 c:{q:'Necrotizing infection, septic shock, or mediastinal extension?',h:['Crepitus, dusky or necrotic skin, pain out of proportion, gas tracking on CT','Hypotension or rising lactate despite fluids','Mediastinal fluid or gas on chest CT; chest pain, dyspnea'],yes:'oNec',no:'d'},
 oNec:{out:'Emergency OR: wide debridement and drainage, ICU care.',tone:'urgent',src:'dnmrad',ex:'Mediastinal extension: involve thoracic surgery; extent on chest CT (Endo type I above the carina, II below) guides cervical vs transthoracic drainage [verify]. Broad-spectrum regimen (immunocompromised row above) plus MRSA cover. Plan for prolonged intubation or tracheostomy and repeat imaging.'},
 d:{q:'Abscess on CT, fluctuance, or more than one space involved?',h:['Ludwig’s angina (bilateral submandibular, sublingual, submental) counts as multispace','High-risk spaces: lateral pharyngeal, retropharyngeal, danger space, carotid sheath'],yes:'oDrain',no:'e'},
 oDrain:{out:'OR incision and drainage of every involved space, and remove the source tooth in the same sitting.',tone:'action',src:'ludwig',ex:'Dependent incisions, drains, culture. Anticipate delayed extubation; discuss tracheostomy for extensive multispace disease. Continue IV antibiotics; narrow by culture.'},
 e:{q:'Single low-risk space, immunocompetent, airway stable, and source removable now?',h:['Low-risk: buccal, vestibular, canine, infraorbital, submental alone','Source: extraction or pulp access'],yes:'oMed',no:'oDrain'},
 oMed:{out:'Admit: IV antibiotics plus source removal; trial without open drainage.',tone:'action',src:'ludwig',ex:'Reassess at least daily. Drain if no improvement in 24–48 h, new fluctuance, or abscess on repeat CT [verify: timing is practice-based]. Early surgery may cut airway events (one 55-patient series: 2.9% vs 26.3%), so keep the threshold low.'}
 },
 look:[['Spread routes',['Mandibular molars below the mylohyoid → submandibular; above → sublingual','Lateral pharyngeal → retropharyngeal → danger space → posterior mediastinum','Carotid sheath involvement: watch for sentinel bleeding']],['Beyond the neck',['Lemierre syndrome: internal jugular thrombophlebitis with septic emboli (often Fusobacterium) — look for IJ thrombus on contrast CT, lung nodules','Descending necrotizing mediastinitis: chest pain, dyspnea, widened mediastinum; historic mortality up to ~40%, now ~5–14%','Periorbital swelling with ophthalmoplegia or proptosis: cavernous sinus thrombosis']],['Not improving at 48–72 h',['Missed space or undrained collection — repeat CT','Source tooth still present','Resistant organism: review cultures, MRSA risk, fungal in immunocompromised']],['Before discharge',['Afebrile, swallowing, airway stable, drains out or managed','Oral step-down by culture; follow-up within days']]]},

{id:'periimpl',g:'Implants',title:'Peri-implantitis',d:'Mucositis vs peri-implantitis · nonsurgical → surgical · explant',
 start:'a',refs:['efp','board'],
 caveat:'EFP S3 2023. Peri-implantitis is not curable; a treated implant is “stable peri-implantitis” and needs lifelong supportive care.',
 nodes:{
 a:{q:'Bleeding (more than one spot) or suppuration on gentle probing?',yes:'b',no:'oHealth'},
 oHealth:{out:'No bleeding or suppuration reported. Confirm symptoms, mobility and bone stability before assigning peri-implant health; continue appropriate supportive care.',src:'efp'},
 b:{q:'Bone loss beyond initial remodeling?',h:['Compare with the radiograph taken at loading','No baseline: probing depth ≥6 mm and bone ≥3 mm apical to the top of the intraosseous implant'],yes:'c',no:'oMuc'},
 oMuc:{out:'Peri-implant mucositis: biofilm control, then reassess in 2–3 months.',src:'efp',ex:'Oral hygiene instruction, professional mechanical cleaning, risk-factor control; modify the prosthesis if it blocks cleaning. Repeat if bleeding persists.'},
 c:{q:'Implant mobile or not worth keeping?',h:['Mobility, or ≥50% bone loss with little support left','Malposition or a prosthesis that cannot be made cleansable','Patient preference after counselling'],yes:'oExp',no:'nNS'},
 oExp:{out:'Remove the implant; plan site reconstruction and replacement.',tone:'action',src:'board'},
 nNS:{note:1,t:'Nonsurgical step first',x:'Oral hygiene instruction; control smoking, diabetes and periodontitis; clean, remove or modify the prosthesis; sub-marginal instrumentation with curettes and/or ultrasonics. EFP advises against: lasers, photodynamic therapy, local antimicrobials, routine systemic antibiotics, air polishing, desiccant gels, probiotics.',src:'efp',next:'d'},
 d:{q:'At re-evaluation: probing ≤5 mm, bleeding at ≤1 site, no suppuration?',yes:'oStable',no:'e'},
 oStable:{out:'Stable peri-implantitis: supportive peri-implant care.',src:'efp',ex:'Periodic probing and radiographs; reinforce home care.'},
 e:{q:'Can the patient keep adequate home care?',yes:'f',no:'oNoSurg'},
 oNoSurg:{out:'Do not operate yet. Repeat nonsurgical care and fix home care, or consider removal.',tone:'action',src:'efp'},
 f:{q:'Contained intraosseous defect ≥3 mm deep?',yes:'oRecon',no:'oAccess'},
 oRecon:{out:'Access flap with reconstructive therapy (bone graft ± membrane).',tone:'action',src:'efp',ex:'Remove the prosthesis if feasible. Mechanical decontamination (curettes; titanium brushes acceptable). Avoid as adjuncts: systemic antibiotics, Er:YAG, air polishing, chlorhexidine, photodynamic therapy. Implantoplasty: insufficient evidence. Reassess clinically at 6 months, radiographs at 12 months.'},
 oAccess:{out:'Access flap or resective surgery.',tone:'action',src:'efp',ex:'Same decontamination rules. Success: probing ≤5 mm, bleeding at ≤1 site, no suppuration, no further bone loss.'}
 }},

{id:'biopsy',g:'Pathology & pain',title:'Biopsy & specimens',d:'Incisional vs excisional · handling · results tracking',

 },

{id:'lacx',g:'Post-op & complications',title:'Local anesthetic complications',d:'Broken needle · methemoglobinemia · paresthesia · palsy · hematoma',
 start:'a',refs:['needle','methb','kodsi','malamed','last'],
 caveat:'Systemic toxicity (LAST) and anaphylaxis are on the SOS tab.',
 nodes:{
 a:{q:'Broken needle?',yes:'oNeedle',no:'b'},
 oNeedle:{out:'Visible: retrieve now with a fine hemostat. Not visible: tell the patient, image, and plan retrieval.',tone:'action',src:'needle',ex:'Do not explore blindly. Panoramic film confirms; CT/CBCT localizes. Prompt planned retrieval limits migration, pain and trismus. Prevention: no 30-gauge needle for IAN blocks, do not bend, do not insert to the hub.'},
 b:{q:'Cyanosis or SpO₂ ~85% that does not improve with O₂, after prilocaine or benzocaine?',yes:'oMet',no:'c'},
 oMet:{out:'Suspect methemoglobinemia. 100% O₂ and transfer to the ED.',tone:'urgent',src:'methb',ex:'Confirm with co-oximetry (pulse oximetry is unreliable). Methylene blue 1–2 mg/kg IV over 5 min if symptomatic or MetHb >25%; may repeat once. Ineffective or harmful in G6PD deficiency; caution with SSRIs.'},
 c:{q:'Perioral tingling, tinnitus, agitation, seizure or arrhythmia?',yes:'oLast',no:'d'},
 oLast:{out:'Local anesthetic systemic toxicity: stop injecting; open SOS → LAST.',tone:'urgent',src:'last'},
 d:{q:'Facial palsy (cannot close the eye) right after an IAN block?',yes:'oPalsy',no:'e'},
 oPalsy:{out:'Transient facial palsy from anesthetic reaching the parotid. Reassure; it resolves as the anesthetic wears off.',src:'malamed',ex:'Protect the eye until blink returns: lubricant and tape the lid closed. Persisting beyond the anesthetic duration: evaluate for another cause.'},
 e:{q:'Rapid swelling after the injection (hematoma)?',yes:'oHem',no:'f'},
 oHem:{out:'Firm pressure for at least 2 min, then ice.',src:'malamed',ex:'Expect bruising for 1–2 weeks. Expanding floor-of-mouth or neck swelling: airway first, ED.'},
 f:{q:'Numbness or altered sensation after the anesthetic should have worn off?',yes:'oPar',no:'oOther'},
 oPar:{out:'Map and document the deficit; recheck at 2 weeks.',tone:'action',src:'kodsi',go:'nerve',ex:'Over 85% resolve within 8 weeks. No improvement at 2 weeks: neurosensory testing / microsurgery evaluation. The lingual nerve is affected more often than the IAN. Some authors advise caution with 4% articaine or prilocaine for IAN blocks (controversial).'},
 oOther:{out:'Consider trismus, infection at the injection site, or allergy.',src:'malamed',ex:'True amide allergy is rare; consider the sulfite preservative in epinephrine-containing cartridges, or latex. Anaphylaxis: SOS tab.'}
 }},

 d:{q:'Persistent drainage, nonhealing socket, or bone changes suggesting infection?',yes:'oWork',no:'oReview'},
 oWork:{out:'Evaluate the dental source and extent of bone involvement.',tone:'action',src:'boneDx',src2:'auJaw',go:'infection',ex:'Imaging (author’s practice): panoramic radiograph first; CBCT or CT for extent and sequestra; MRI if marrow or soft-tissue spread is in question — choose with radiology. Host factors: record diabetes, immunosuppression, steroids, smoking and prior radiation; optimize with the physician. Antibiotics: stable patient → obtain bone or deep tissue for culture and histopathology before antibiotics where feasible; unstable or spreading → start empiric antibiotics per the Odontogenic infection pathway without waiting for sampling.'},

{id:'ods',g:'Dentoalveolar & acute',title:'Suspected odontogenic sinusitis',d:'Unilateral sinus symptoms · dental source · ENT coordination',

 nodes:{
 a:{q:'New vision change, diplopia, painful eye movement, or neurologic signs?',yes:'oED',no:'a2'},

 a2:{q:'Recent extraction with a sinus opening, sinus graft or implant at the site?',yes:'oOac',no:'b'},
 oOac:{out:'Assess for oroantral communication or graft- or implant-related sinus infection.',tone:'action',src:'odsTx',go:'oac',ex:'Then confirm sinusitis with ENT and plan source control together.'},
 b:{q:'ENT confirmed sinusitis and dental evaluation confirmed a plausible ipsilateral source?',yes:'oPlan',no:'c'},
 oPlan:{out:'Coordinate dental source control and sinus management with ENT.',tone:'action',src:'odsTx',ex:'Discuss treatment sequence with ENT and the patient. Check for a fistula, foreign material, or implant-related source. Sequence: dental source control first is reasonable when the dental source is clear and sinus symptoms are mild, with ENT informed; ENT first or combined when symptoms are severe or foreign material is in the sinus [verify against the management consensus].'},

 }},

{id:'osaref',g:'Anesthesia & medical',title:'Adult obstructive sleep apnea referral',d:'Suspected OSA · sleep testing · referral handoff',

function pedCard(e){const p=PEDS[e.id];

 if(p)return`<ol>${p.steps().map(x=>`<li>${x}</li>`).join('')}</ol><div class="meta">${p.src.map(srcLink).join('')}</div>`;
 return`<ol>${e.steps().map(x=>`<li>${x}</li>`).join('')}</ol><div class="meta">${e.src.map(srcLink).join('')}</div>`}

/* ===== Photo triage import =====

function parseTri(raw){
 let s=String(raw||'').trim();try{s=decodeURIComponent(s)}catch(e){}
 /* Accept the code alone or a whole pasted report: take the CT1 line, ignore backticks and surrounding text. */
 const hit=s.match(/CT1;[^\s`"'<>]*/i);s=hit?hit[0]:s.replace(/^.*?#?triage=/i,'').replace(/\s+/g,'');
 if(/^CT1;none$/i.test(s))return{err:'The report says nothing could be read from the photo (CT1;none). Answer the steps yourself.'};
 if(!/^CT1;/i.test(s))return{err:'Not a Compass triage code. It should start with CT1;'};
 const out={mods:{},asa:null,sb:null};let n=0;
 s.slice(4).split(';').filter(Boolean).forEach(part=>{const [k,v='']=part.split(':');const key=k.toLowerCase();
  if(key==='asa'){const a=v.toUpperCase().replace(/^ASA/,'');const map={'1':1,'I':1,'2':2,'II':2,'3':3,'III':3,'4':4,'IV':4,'5':5,'V':5};if(map[a])out.asa=map[a];return}
  if(key==='sb'){const b=parseInt(v,10);if(b>=0&&b<=8)out.sb=b;return}
  if(!TRI_MODS.includes(key))return;const m=M(key);
  v.split(',').forEach(t=>{const mm=/^([a-z][a-z0-9]*)([01])$/i.exec(t);if(!mm)return;const node=m.nodes[mm[1]];
   if(!node||!node.q)return;(out.mods[key]=out.mods[key]||{})[mm[1]]=mm[2]==='1';n++})});
 if(!n&&out.asa==null&&out.sb==null)return{err:'Code read, but it had no answers Compass recognizes.'};
 return out}
function triFor(id){const t=S.tri;if(!t||!TRI_MODS.includes(id))return{};const o={...(t.mods[id]||{})};
 if(id==='sed'&&t.asa!=null){if(o.a===undefined)o.a=t.asa>=4;if(o.b===undefined&&t.asa<4)o.b=t.asa===3}
 if(t.sb!=null&&t.sb>=3){if(id==='sed'&&o.c===undefined)o.c=true;if(id==='preop'&&o.f===undefined)o.f=true}
 if(t.sb!=null&&t.sb<3&&id==='preop'&&o.f===undefined)o.f=false;
 return o}
