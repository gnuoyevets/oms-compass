function kgVal(){return S.wtIn&&S.wtIn.src==='kg'?S.wtIn.raw:(S.wt??'')}
function lbVal(){return S.wtIn&&S.wtIn.src==='lb'?S.wtIn.raw:(S.wt?Math.round(S.wt*LB):'')}
function wtLine(){return S.wt?`${S.wt} kg (${Math.round(S.wt*LB)} lb)`:''}
function ptFields(s){const ag=s?'pf-age':'in-age';return`<label class="fld" for="${ag}">Age, years<input id="${ag}" data-pfn="age" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="y" value="${esc(S.pf.age??'')}"></label><label class="fld" for="in-wt${s}">Weight, kg<input id="in-wt${s}" data-wt inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="kg" value="${esc(kgVal())}"></label><label class="fld" for="in-lb${s}">or lb<input id="in-lb${s}" data-lb inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="lb" value="${esc(lbVal())}"></label>`}
function ptBar(note){return`<div class="wtbar pt">${ptFields('')}<div class="note">${S.wt?`<span class="wtx" id="wtx">${esc(wtLine())}</span> · `:''}${note}</div></div>`}
function lockWhy(){const a=ageNum();return a!=null?`age ${a} y`:`age not entered, weight ${S.wt} kg`}
function lockHTML(){return`<div class="plock" role="alert" id="plock"><span class="pb">PEDIATRIC LOCKOUT (&lt;12 YO / &lt;40 KG)</span><div>Adult non-pump IV sedation protocol is suppressed for patients under 12 years old (or &lt;40 kg). Follow AAP/AAPD weight-based pediatric sedation guidelines and PALS airway/equipment sizing.</div><div class="small" style="color:inherit;margin-top:6px">Triggered by ${esc(lockWhy())}. Local anesthetic maximums, maintenance fluids and SOS cards stay on and scale to ${S.wt?esc(wtLine()):'the entered weight'}. ${srcLink('aapdsed')}</div></div>`}
const LA_PEDS={'Lidocaine 2% + epi':4.4,'Mepivacaine 3% plain':4.4,'Articaine 4% + epi':7,'Bupivacaine 0.5% + epi':1.3};
/* AAPD absolute maximums for patients under 18 (applied instead of the adult caps). */
const LA_PEDS_CAP={'Lidocaine 2% + epi':300,'Mepivacaine 3% plain':300,'Articaine 4% + epi':500,'Bupivacaine 0.5% + epi':90};
function laKid(){const a=ageNum();return a!=null?a<18:pedsLock()}
/* Label age limits: articaine not recommended under 4 y; dental bupivacaine not recommended under 12 y. */
const LA_MINAGE={'Articaine 4% + epi':[4,'aapdla'],'Bupivacaine 0.5% + epi':[12,'bupilabel']};
function laRows(w,kid){const a=ageNum();return LA.map(([n,mgml,pk0,cap0])=>{const pk=kid&&LA_PEDS[n]!=null?LA_PEDS[n]:pk0,cap=kid&&LA_PEDS_CAP[n]!=null?LA_PEDS_CAP[n]:cap0;let mg=pk*w;const capped=cap!=null&&mg>cap;if(capped)mg=cap;
 const lim=LA_MINAGE[n],blocked=!!(lim&&a!=null&&a<lim[0]),ageQ=!!(lim&&a==null&&kid);
 return{n,pk,cap,mg:Math.round(mg),capped,carp:Math.floor(mg/(mgml*1.7)*10)/10,nolist:kid&&LA_PEDS[n]==null,blocked,ageQ,minAge:lim?lim[0]:null,limSrc:lim?lim[1]:null}})}
function fluids(w){return w?Math.round(w<=10?w*4:w<=20?40+(w-10)*2:60+(w-20)):null}

/* Practice mode: a device preference (not patient data). Author = Bayside/Dr. Young presets; Colleague = neutral. */
const PM_KEY='oms_compass_practice_mode';
/* Missing choice defaults to Colleague. Acknowledgment never infers Author; existing stored choices are preserved. */
function pmode(){if(S.pmOv)return S.pmOv;try{const v=localStorage.getItem(PM_KEY);if(v)return v==='author'?'author':'colleague'}catch(e){}return S.pm==='author'?'author':'colleague'}
function setPmode(v){S.pm=v==='author'?'author':'colleague';try{localStorage.setItem(PM_KEY,S.pm)}catch(e){}}
const colleague=()=>pmode()==='colleague';
function inOtherMode(fn){const o=S.pmOv;S.pmOv=colleague()?'author':'colleague';try{return fn()}finally{if(o)S.pmOv=o;else delete S.pmOv}}
function modeMatters(ids){const sig=()=>JSON.stringify(ids.map(id=>{const f=FX[id],p=fPlan(f);return[p.d,p.act,p.steps,p.author||null,fQs(f).map(q=>q.k)]}));return sig()!==inOtherMode(sig)}
function modeBarHTML(ids){if(ids&&!modeMatters(ids))return'';const c=colleague();return`<div class="mbar" role="group" aria-label="Practice mode"><span>Mode: <b>${c?'Colleague':'Author'}</b><span class="small"> · ${c?'guideline rules':'author protocols, labeled'}</span></span><button class="tg" data-pmsw aria-label="Switch to ${c?'Author':'Colleague'} mode">Switch to ${c?'Author':'Colleague'}</button></div>`}
function modeLines(P){const au=P.filter(({p})=>p.author).map(({p})=>authorText(p.author)),ap=P.filter(({p})=>!p.author&&p.basis==='au').map(({f})=>`${f.t}: author's practice (no guideline equivalent)`);
 return[`Practice mode: ${colleague()?'Colleague - guideline thresholds where guidance exists':'Author - author protocols applied where marked'}`,...(au.length||ap.length?['Departures from guidelines: '+[...au,...ap].join(' | ')]:['Departures from guidelines: none flagged in the included findings'])]}
function pmodeHTML(){const m=pmode();return`<div class="pmode" role="group" aria-label="Practice mode"><span class="pl">Mode</span>${[['author','Author'],['colleague','Colleague (Standard)']].map(([v,l])=>`<button class="tg${m===v?' on':''}" data-pm="${v}" aria-pressed="${m===v}">${l}</button>`).join('')}</div><p class="small pmdesc" id="pmdesc">${m==='colleague'?'<b>Colleague:</b> guideline rules where a guideline exists (warfarin INR &lt;4 and DOAC dose timing per SDCEP 2022). Author-only content with no guideline equivalent (no-pump sedation card, personal Ref notes) is folded and labeled, not replaced. Handouts are neutral.':'<b>Author:</b> applies the author’s protocols — warfarin INR &lt;3.5 and uninterrupted DOACs for dentoalveolar surgery, the no-pump sedation card — each labeled with where it differs from guidance.'}</p>${m==='colleague'?`<div class="ophset">${ophFieldHTML('oph-set')}<p class="small">On patient handouts, texts and QR pages. Saved on this device only.</p></div>`:''}`}
/* Colleague mode: author's-practice content sits behind a disclosure; guideline/evidence content stays visible. */
let AUN=0;
function auWrap(inner){if(!colleague())return inner;const id='au'+(++AUN);return`<button class="audisc" data-audisc="${id}" aria-expanded="false" aria-controls="${id}">+ Show Author’s Clinical Protocol</button><div class="auhid" id="${id}" hidden>${inner}</div>`}

/* Offline badge: lit once the service worker controls the page. */
function swOK(){try{return!!(navigator.serviceWorker&&navigator.serviceWorker.controller)}catch(e){return false}}
function offHTML(){return`<span class="offl" id="offl"${swOK()?'':' hidden'} title="Cached on this device; works without a connection"><i aria-hidden="true">●</i> Offline Ready</span>`}
function topHTML(btn){return`<div class="top">${S.view&&S.view!=='decide'?'<button class="icon-btn homebtn" data-home aria-label="Home">⌂</button>':''}<h1><span>✳</span> OMS Compass</h1><span class="small">${offHTML()}<b style="color:var(--warn-ink)">DRAFT</b> · ${btn?`<button class="vbtn" data-view="new" aria-label="What’s new in v${VER}">v${VER}</button>`:`v${VER}`}</span></div>`}

/* ===== Version, change log, disclaimer ===== */
const VER='3.25.0';
const CHANGES=[
{v:'3.25.0',d:'Nov 12, 2026',i:['Author mode: source-unverified content shows without the “Enable draft material” tap; it keeps its Unverified draft label and adds one line to the note. Colleague mode is unchanged.','Pre-op clearance, Author mode: “Healthy adult 18+ · No to all 6” answers the six screen questions in one tap, records ASA I and lifts the age hold on analgesia (the analgesic contraindication screen is still required). Any data input or photo triage that says otherwise stops it at that question.','Ask Claude (module, finding and Ref card screens): copies a de-identified prompt with your answers and the Compass text, then opens Claude or ChatGPT. Nothing clinical goes in the link. Compass calculates doses; the assistant explains.','The Pre-op results “No exclusion found by this screen” are labelled Screen result, not Unverified draft, in both modes: they report what the screen found and cite no recommendation.','Copied note: the “LA maximum: weight not entered” line is left out when no weight is entered.','Fix: on module screens the SOS button sat on top of the first chip since the Home button was added in v3.24.0; it is back in the top bar.']},
{v:'3.24.0',d:'Nov 12, 2026',i:['Sedation card: obese patients (weight >120% of ideal or BMI ≥30, needs height and sex) get Precedex on adjusted body weight and ketamine on ideal body weight; fixed doses unchanged; never above actual weight. Actual-weight doses and a 1:1 ketofol line (propofol 10 mg/mL 10 mL + ketamine 50 mg/mL 2 mL ≈ 8.3 mg/mL each) under More. Tagged verify.','Height in cm or feet + inches (they mirror each other); weight already takes kg or lb.','Home button (⌂) on every page: top bar of SOS, Calc, Ref, Patient and What’s new; module, finding and assessment headers.','Before-sedation handout: no smoking or vaping for at least 2 days before (was 12 hours), all four languages.']},
{v:'3.23.1',d:'Nov 6, 2026',i:['Consultation workspace removed (tab, Home card and its buttons). Kept from v3.23.0: the audit corrections, the draft gate for unverified content, office sedation from age 13, and every earlier feature.']},
{v:'3.23.0',d:'Nov 6, 2026',i:['New EMR-neutral consultation workspace: initial consultation, before-booking review and surgery-day confirmation; implants/full arch, mucosal lesions, jaw radiolucency, medical/anesthesia suitability and complete postoperative symptom review.','Reviewed text intake, case-specific medical and prosthetic-lab requests with owners/status/review points, state-specific source prompts for NY/CT/RI/MA/NH and a concise copy-ready EMR handoff. Clinical data stays in memory; no direct EMR connection, order entry or persistent task monitoring.','Corrected audited clinical branches, contradictory inputs and copied unanswered answers. Office sedation requires confirmed age 13 or older (weight 40 kg or more, if entered), with an adolescent note for 13–17; analgesia uses shared risk restrictions. Only content labelled Unverified draft and 12 specialty modules need explicit clinician draft selection; urgent outcomes always show in full.','Every baseline feature retained. Full node/path, preservation and browser acceptance checks added; software verification does not establish clinical validity. Full-text specialty-source review and real-device usability review remain pending.']},
{v:'3.22.1',d:'Nov 6, 2026',i:['Patient handouts condensed without removing any instruction, dose, time limit or warning (English 9% shorter; Español, Kriolu and 中文 5–6%). Pain Medication Instructions about a third shorter: same doses, timing, daily maximums, product warning and when to call. Every number in each shortened line was checked to still be there; call-us and 911 lines unchanged.','Implant, bone graft and sinus lift handout: added “Trouble breathing or swallowing: call 911” (all four languages), as on the extraction handout.']},
{v:'3.22.0',d:'Nov 6, 2026',i:['Send to patient: the share card now shows what the patient gets, with a tappable “Call the office” button, the call-us and 911 lines, and a QR code. The patient scans it with the phone camera to open that handout in their language on the patient page; nothing is sent from your phone and the link carries no patient details. Full text is folded under “Show full text”.','“Copy text for front desk” copies a short message (title, office phone, call-us and 911 lines, link) for the office line or texting system. “Share from my phone” stays, labelled as sending from your own number.','Medication precaution or age/weight limit recorded: no QR or link, because the patient page lists the general pain doses. Copy and share send the full text, which withholds them.','Office phone always included. Colleague mode asks once for “Your office phone” (Settings, or on the card) and saves it on this device; the QR page shows that number. Google review request removed from post-op text and the patient page’s post-op view; it stays in the day-7 message.','Patient page: “Call the office” bar stays at the top while scrolling; “All instructions and FAQs” link at the bottom of each page.','Pain instructions rewritten (extraction, implant and full-arch handouts, all four languages): “Pain Medication Instructions” — Advil 400 mg plus Tylenol 500 mg (one Extra Strength) together every 6 hours for the first 24–48 hours, then as needed; daily maximums ibuprofen 2,400 mg (only if directed) and acetaminophen 3,000 mg. Translations machine-drafted, pending native-speaker review.']},
{v:'3.21.1',d:'Nov 4, 2026',i:['Fix: typing age or weight in the Calc or SOS bar no longer closes the phone keyboard after the first digit (the first digit briefly triggered the pediatric lockout and redrew the page), so creatinine clearance, body weight and maintenance fluids now get their inputs.','Comma decimals accepted (80,5 kg; creatinine 1,0). Missing-input messages point to the bar at the top.']},
{v:'3.21.0',d:'Nov 4, 2026',i:['Pathology & pain: Oral mucosal lesion and Oral epithelial dysplasia are one pathway (first question: does a biopsy already show dysplasia?); Jaw lesion and Jaw radiolucency differential are one pathway (aggressive signs first, then the differential, then the biopsy plan). Old links still open the originals.','Pinned row: Photo triage replaces Sedation plan; it opens Claude with the triage prompt, and the code is pasted in Pre-op clearance. Sedation plan stays under Anesthesia & medical.']},
{v:'3.20.0',d:'Nov 4, 2026',i:['Search shows keyword matches: the matching sentence from any module, SOS card, Ref card or handout, with the words highlighted.','The app opens on Decide; a module left open last time is not reopened.','Photo triage prompt: red flags, ASA, recommendations and proceed read, and the CT1 code line is required even when a triage skill is used or nothing can be read.','Intraop checklist: All-on-X group (fiducials and scans, reduction and restorative space, low sinus, guide, torque, multi-unit abutments, conversion, post-op scans, records and soft diet).','Ref: 8 cards from your notes — asthma and COPD, pediatric and geriatric anesthesia, sedation pharmacology, neuromodulators, radiograph interpretation, non-odontogenic jaw lesions, oral cancer and neck, full-arch and digital workflow.','Calc: creatinine clearance, body weight for dosing (BMI, ideal, lean, adjusted), PADSS discharge score, DOAC time since last dose, ASA class helper, fasting insulin dose (ADA 2026).']},
{v:'3.19.0',d:'Nov 3, 2026',i:['Four new pathways (41 total): Salivary and submandibular swelling; Suspected jaw osteomyelitis; Suspected odontogenic sinusitis; Adult obstructive sleep apnea referral (separate from sedation screening). Each has an emergency branch, Unknown handling and a copyable note.','Jaw osteomyelitis: atypical lesion or numb lip/chin is asked first and routes to expedited imaging and biopsy (amber, not the emergency box); antiresorptive exposure defined; workup names a jaw imaging sequence (author’s practice), host factors and antibiotic timing.','Salivary: bilateral, viral or systemic swelling routes to medical evaluation; source labeled as referral criteria. Odontogenic sinusitis: recent sinus opening, graft or implant links to Oroantral communication; dental-first sequencing allowed when mild [verify].','Links to Odontogenic infection, MRONJ staging and Oroantral communication. New sources carry citation details marked not checked.']},
{v:'3.18.1',d:'Nov 3, 2026',i:['Fix: in the procedure view’s top open question, a number field (e.g. INR) no longer disappears after the first digit. Typing 3.6 recorded 3, which could show Proceed instead of Defer. The question now advances only when the entry is finished.']},
{v:'3.18.0',d:'Nov 3, 2026',i:['One disposition everywhere: the pre-op screen now feeds the overall result, so Assessment, the procedure view and the copied note show the same disposition, reason and next action. An unstable or unoptimized condition defers elective care but escalates urgent care (Refer / change setting: monitored or hospital setting). Unknown urgency stays provisional; an incomplete or Unknown screen keeps the result at Verify first.','SGLT2 readiness: dose-free days before the procedure day and whether the timing is confirmed. Confirmed ≥3 days (4 for ertugliflozin) before sedation, GA, major surgery or fasting → proceed. Missed hold: elective → defer; urgent → proceed with ketoacidosis monitoring (ADA 2026). Unconfirmed timing is not read as a completed hold. Local anesthesia with normal eating: guidance gap stated.','Procedure view: the overall disposition replaces the gate-only chip, and the highest-impact open question from the assessment can be answered in place, with what each answer changes.','Biopsy: copy-ready result follow-up block for the EHR with result owner (role), expected turnaround in days, overdue action and whether the patient was told. No calendar dates.']},
{v:'3.17.0',d:'Nov 3, 2026',i:['Three new findings (22 total). Sedation interactions: daily opioids, benzodiazepines, gabapentin/pregabalin (FDA boxed warning and 2019 breathing warning) and Paxlovid or other strong CYP3A4 inhibitors with midazolam.','Post-op prescribing check: SSRI/SNRI → no tramadol (label); lithium or methotrexate → acetaminophen first, NSAIDs only with the prescriber. Lithium or methotrexate now suppresses routine ibuprofen advice from other findings, as kidney and antithrombotic precautions already did.','Insulin & sulfonylureas: usual doses under local with normal eating; fasting needs a written plan from the prescriber (ADA 2026). Pump, premixed or concentrated insulin, or recurrent low blood sugar: individualized plan first.','Post-op analgesia pathway lists lithium/methotrexate under “NSAID contraindicated?” and warns against tramadol with SSRIs/SNRIs.','Lines checked only against secondary sources are marked [verify]: the US Paxlovid, methotrexate and tramadol labels and the ADA mealtime-insulin wording could not be opened from this environment.']},
{v:'3.16.1',d:'Nov 3, 2026',i:['Finding pages: the title and status no longer get cut off at the top on phones.','Unresolved panel: each answer’s outcome shows as its own row with a colored disposition; the panel note is one short line.','The practice-mode bar shows only where switching Author/Colleague changes the plan; Home keeps the switch.']},
{v:'3.16.0',d:'Nov 2, 2026 · approved for publication',i:['Clinical workflow review: separate insulin formulations and fasting context; synchronize GLP-1 escalation and maintenance risk; acetaminophen recommended 3000 mg/day, absolute 4000 mg/day ceiling from all products.','Negated/past context stays unticked. Multiple lab results remain visible and unselected until one is chosen. Acknowledgment no longer switches to Author mode.','Patient sharing now previews current text and carries medication precautions, version and translation draft status. Decision criteria are visible beside each question.']},
{v:'3.15.0',d:'Nov 2, 2026',i:['Read as a case: type or paste a short history in search (e.g., “72M on Eliquis, INR 2.6, 3 simple extractions under IV sedation”). Compass proposes findings, labs and context as tick boxes; nothing is recorded until you tap Add. Fixed rules on this phone, not AI; nothing is sent, and the typed text never enters notes. Negated (“denies”) and held (“stopped”) drugs start unticked; unrecognized drugs are listed, not ignored; units are never assumed.','Free-text questions: when no module matches every word, the closest modules are shown instead of “no entry”.','Imaging AI flag finding: record what radiograph or CBCT software flagged (periapical radiolucency, impaction, IAN proximity, sinus change, possible carotid calcification, TMJ change, other lesion). Nothing changes the plan until your own read confirms it; each flag links to the matching module. Compass does not read images and connects to no vendor.']},
{v:'3.14.1',d:'Nov 2, 2026',i:['Bottom bar fits on 320 px phones: “Assessment” no longer cut off; a count wraps to a second line when needed.']},
{v:'3.14.0',d:'Oct 31, 2026',i:['Post-op call triage pinned on Decide (six pins, two columns).','New module: Post-op phone call triage (Post-op & complications). A staff script, emergencies first: 911, come in now, same day, within 1–2 days, or reassure, with what to say meanwhile and links to the matching modules.','Third molars & extractions: “Nerve-risk X-ray signs” checklist (Rood & Shehab). Any of the three strongest signs (darkening, interruption, diversion) answers the panoramic-sign step Yes and suggests CBCT if it would change the approach; weaker signs or overlap alone leave the step to your judgment.']},
{v:'3.13.1',d:'Oct 31, 2026',i:['Fix: “Log to outcomes registry” did nothing when tapped. It now copies the CR1 line and shows the registry link.','On-call and Author/Colleague switches are back at the top of Decide, above the pinned row (one tap each). Full Settings stays at the bottom.']},
{v:'3.13.0',d:'Oct 31, 2026',i:['Option grids in Español, Kriolu and 中文 (machine-drafted; pending native-speaker review). They follow the Patient tab language and share in it.','Patient page: new “Choosing a treatment” section with the three option grids in all four languages; links like #ogimp-es open one directly.']},
{v:'3.12.0',d:'Oct 31, 2026',i:['Post-op handouts: “call us” and 911 lines come first, highlighted; each line has a pictogram. Same order in shared text and on the patient page.','Teach-back: 3 questions under each post-op handout, for the clinician (not shared). AHRQ method.','Option grids (English): wisdom tooth near the nerve (remove vs coronectomy), missing tooth (implant vs bridge vs leave the space), after extraction (graft vs heal on its own). On the Patient tab, shareable, and linked from the Extractions, Implants and Ridge augmentation plans.','Day-7 check-in message (English, Español) with the site’s review link. Patient page: review request is now a small link at the very bottom.','Author mode: “Log to outcomes registry” on plan cards copies a de-identified CR1 line for the Surgical Outcomes Registry.']},
{v:'3.11.0',d:'Oct 31, 2026',i:['Pinned row on Decide: Pre-op clearance, Sedation plan, Implants, Extractions, Post-op handouts. Settings moved to the bottom.','Pre-op clearance ends on one Today’s plan panel: ASA class (one tap), local anesthetic maximum for the entered weight, analgesic plan (acetaminophen first when an anticoagulant or antiplatelet is entered), patient handout buttons. All of it goes into Copy note. No new dose or threshold; content is reused from Calc and Post-op analgesia.','Yes and No buttons now carry equal weight (Yes was filled).','Photo triage and Data inputs chips show on the first question only, unless triage is loaded, inputs are set, or the current step reads entered data. Both stay in the drawer.','Plan cards: sources and review status folded under More.']},
{v:'3.10.0',d:'Oct 27, 2026',i:['Unresolved items are listed once per encounter and split into “Changes the plan” and “Also needed to finalize”. Each shows its next action (ask patient, examine, check records, obtain result, contact clinician, decide plan) and, where existing branches differ, what each answer would lead to. The plan stays visible and copyable while provisional.','Type a result in search — “INR 2.6”, “eGFR 28”, “platelets 45 k”, “A1c 8.2 %” — and confirm to record it. Units are chosen, never assumed; date and trend are never read from text. Replacing a result clears the answers that described the old one. eGFR is never used as CrCl.','Intraop checklist follows the encounter: Done, Pending or N/A per item; sedation, implant and specimen checks fold away when the entered anesthesia or procedure makes them not apply; one check per assessment finding; unresolved questions listed (checking never answers them). Checks reset when the plan facts they covered change.','New users start in Colleague mode; an existing Author setting is kept. Switch mode from the finding or assessment screen without losing entered facts. Copied notes name the mode and any departures from guidelines.']},
{v:'3.9.2',d:'Oct 27, 2026',i:['Search box now shows three examples: Eliquis, INR, dry socket (a drug, a lab and a topic).']},
{v:'3.9.1',d:'Oct 27, 2026',i:['TMJ arthrocentesis Ref card: injectate guidance revised after senior OMS faculty review. Steroid used sparingly (one or two injections per joint); hyaluronic acid flagged as off-label for the TMJ with significant initial inflammation; PRP (often at arthroscopy) added as an alternative, with a systematic review cited.']},
{v:'3.9.0',d:'Oct 27, 2026',i:['Patient FAQs now in Kriolu and 中文 (all 15, on the Patient tab and the patient page). Machine-drafted by Claude; pending native-speaker review, like the handout translations.','Front-desk QR sheets rebuilt: 4 codes per row in separate boxes with wide gaps (was 5, tightly packed), two pages per language, and Kriolu and 中文 pages added.']},
{v:'3.8.0',d:'Oct 26, 2026',i:['Seven new Ref cards: Filler complications & vision loss, Oral pathology chairside framework, Odontogenic cysts & tumors, GBR & narrow ridge, Implant biomechanics & restorative space, Orofacial pain red flags, Implant antibiotic prophylaxis. Built from your Lecture Pearls, Oral Pathology Pearls deck and Readwise notes, checked against published sources; single-source or unsettled lines tagged verify.','Ref cards with a verify line now show the Unverified draft label.']},
{v:'3.7.0',d:'Oct 26, 2026',i:['“Post-op” tab renamed “Patient”. Post-op instructions unchanged, now under a heading.','New Procedure FAQs (wisdom teeth, implants, bone graft, sinus lift, full-arch, IV sedation, biopsy, canine exposure) and Diagnosis FAQs (dry socket, tooth infection, numbness, sinus opening, TMD, MRONJ, peri-implantitis), English and Español; Kriolu and 中文 show English for now. Share by text like the handouts (practice phone added; neutral header in Colleague mode). Search finds them.','Patient page (/handouts/) now has the FAQs too, one link each (e.g. #fao-es).','“Patient FAQ” button on the plan screen of 16 matching modules (e.g. Dry socket, Nerve injury, TMD, Sinus lift) opens that FAQ on the Patient tab.']},
{v:'3.6.0',d:'Oct 25, 2026',i:['Chairside focus mode for every decision module: one question per screen, Yes (filled) and No (outlined) as full-width stacked buttons in the thumb zone, Unknown kept as a smaller third button.','Fixed 56 px header: back one step, module title, step counter (Step 2 of 3–5 when branches differ in length), red SOS badge. SOS from a module offers a way back with answers kept.','Back one step: header arrow, swipe right anywhere on the screen, or the phone’s own back gesture/button.','Criteria, your answers (tap to change), medical gate, red flags, photo triage, data inputs, look-fors, sources and reset moved into a swipe-up reference drawer; chips on screen open the right section.','Plan screen: Copy note and End session pinned at the bottom; long plans scroll inside the card.','High-contrast mode (black on white, all text ≥7:1, WCAG AAA) for operatory light: Settings or the drawer; turns on automatically if the phone asks for more contrast.']},
{v:'3.5.1',d:'Oct 25, 2026',i:['Readability: smallest text (verify tags, source badges, section labels, table headers) raised from 10–11 px to 12 px for chairside glare. Color contrast already meets WCAG AA in light and dark modes.']},
{v:'3.5.0',d:'Oct 25, 2026',i:['New module: Facial laceration (Hospital on-call). Bigger injury first; explore facial nerve, parotid duct, canaliculus and lid before closing; bites (antibiotics, rabies, facial closure); contaminated or late wounds; lip, ear, eyelid and nose repairs; simple layered closure. Tetanus per CDC 2026. Author-drafted lines tagged verify.']},
{v:'3.4.0',d:'Oct 24, 2026',i:['Approved by Steven after independent review. One reconciled assessment with conflicting instructions suppressed and unresolved alternatives visible.','Decisive unanswered questions, isolated approach comparisons with explicit Apply, in-memory change explanations, and copy-only consultation drafts.','Missing numeric INR stays provisional. New patient clears all clinical data, comparison state and change history. Software checks do not establish clinical validity.','Review fixes: age-restricted local anesthetic advice withholds only that drug; missing age no longer escalates; Author protocol shown in the reconciled plan.']},
{v:'3.3.3',d:'Oct 24, 2026',i:['Dose fixes: adult IM succinylcholine capped at 150 mg total (label); LAST lipid split at 70 kg (ASRA: >70 kg 100 mL bolus, then 250 mL over 15–20 min); IM midazolam for seizures under 13 kg is 0.2 mg/kg (verify); under-18 local anesthetic maximums use AAPD caps (lidocaine and mepivacaine 300 mg, articaine 500 mg).','New findings: inherited bleeding disorders (WFH), heart valve / IE / prosthetic joint (AHA 2021, ADA), pacemaker or ICD (APSF/ASA), buprenorphine (multisociety 2021), epinephrine interactions (TCAs, nonselective β-blockers, cocaine), organ transplant and immunosuppressants.','Home: on-call and Mode folded into one Settings row. SOS: jump chips to each card. Shorter search hint.']},
{v:'3.3.2',d:'Oct 24, 2026',i:['Photo triage works in any Claude account: the hand-off now carries a complete prompt (report sections, de-identification, unknown ≠ normal, and the exact CT1 code format with every step defined), so colleagues do not need the pre-op triage skill. If the skill is installed, Claude still uses it.','Paste box accepts the whole report: Compass finds the CT1 line itself. CT1;none explains that nothing was readable.']},
{v:'3.3.1',d:'Oct 24, 2026',i:['Pediatric SOS: a child (age <12, or <18 and <40 kg, or no age and <40 kg) gets PALS 2025 algorithms for cardiac arrest (2 → 4 J/kg, epinephrine 0.01 mg/kg, amiodarone 5 mg/kg, 15:2) and bradycardia (atropine 0.02 mg/kg, max 0.5 mg), plus pediatric oversedation, hypoglycemia, adrenal crisis, laryngospasm and bronchospasm doses. Chest pain, stroke and hypertensive crisis cards are suppressed with pediatric referral guidance.','LA calculator blocks drugs by label age: articaine under 4 y, dental bupivacaine under 12 y; asks for age when it is missing.','Diabetes: A1C no longer defers surgery on its own — it flags risk; day-of glucose, symptoms, procedure size and urgency decide. Compared unrounded (64 mmol/mol = 8.01%).','Chronic steroids: adrenal-risk assessment (ESE/Endocrine Society 2024): known AI → cover; ≥3–4 weeks above ~15–25 mg/day hydrocortisone-equivalent → oral cover for minor stress, parenteral for GA/major/unwell; unknown history = at risk.','Labs: explicit unit required (A1C, platelets), Unknown button on every number, unrounded comparisons, INR ≥10 (or ≥5 off warfarin) treated as possibly real with urgent same-day verification instead of “invalid”.','Assessment: decision-changing conflicts raise the overall action and stay listed as unresolved; each finding shows its steps and escalation on screen and in the copied note.','Practice mode: “Author” applies your protocols (INR <3.5, uninterrupted DOACs for dentoalveolar surgery) with applicability and the guideline difference shown; “Colleague” now applies SDCEP rules (INR <4, one-dose DOAC timing) and says what it does not replace.','Search: a brand that conflicts with an earlier choice (Xarelto after apixaban) is flagged, not silently ignored; ASA, Ecotrin, Bayer aspirin, acetylsalicylic acid find aspirin. “Add to assessment” sits under the recommendation.']},
{v:'3.3.0',d:'Oct 24, 2026',i:['Age and weight at the top of Calc and SOS, shared with the Assessment. Enter weight in kg or lb (kg = lb ÷ 2.20462, 1 decimal); both shown, e.g. 69.9 kg (154 lb).','Pediatric lockout: age <12 (or no age and weight <40 kg) hides the adult no-pump IV sedation table and the Office sedation screen. LA maximums, 4-2-1 fluids and SOS cards stay on and scale to weight; SOS flags fixed adult doses. Under 18, LA maximums use the AAPD pediatric table (lidocaine and mepivacaine 4.4 mg/kg).','Practice mode on Home (remembered on this device): Author (Bayside) or Colleague (Standard). Colleague hides the Dr. Young/Bayside handout presets (neutral header, no phone or review link) and folds author’s-practice content behind “+ Show Author’s Clinical Protocol”.','Copy de-identified note now pastes as four blocks — History · Findings & risk · Anesthesia & limits · Plan & alerts — with LA cartridge limits and an NSAID–anticoagulant alert. Plain text for Dentrix, Epic and PCHC.','Content: IE prophylaxis pediatric doses; GLP-1 split into day-of GI symptoms (defer) vs higher-risk features (24 h clear liquids or local ± N₂O, no routine 1-week hold — Kindel 2024); antithrombotic local hemostatic bundle with TXA; warfarin INR <3.5 and DOACs uninterrupted for dentoalveolar surgery (author’s practice, labeled); MRONJ incidence by regimen, denosumab timing (verify), CTX not indicated; three-tier outpatient odontogenic antibiotics.','“● Offline Ready” in the header once the app is cached for offline use.']},
{v:'3.2.0',d:'Oct 23, 2026',i:['New module: Deep neck space infection (hospital consult). Airway first, CT neck ± chest, empiric IV antibiotics by host, necrotizing/mediastinal spread, drain vs medical trial; Lemierre, mediastinitis and cavernous sinus thrombosis look-fors. Listed under Hospital on-call.','Odontogenic infection: emergency outcome now links to the new module; IV clindamycin is paired with levofloxacin (clindamycin alone not recommended, >30% resistance — Long et al. 2021).']},
{v:'3.1.0',d:'Oct 23, 2026',i:['Medical gate: a colour-coded block at the top of procedure modules summarizes Pre-op clearance answers (red = defer elective, amber = address first or unknown, green = no exclusion hit — never a clearance). Taps through to Pre-op clearance and the Assessment.','Hospital on-call switch on Home (remembered on this device): on shows ER/trauma, fractures, dentoalveolar trauma and infection first; off hides facial trauma triage and mandible fracture from the list. Search still finds everything.','Intraop checklist: second tab in the Assessment drawer, plus an Intraop button in the bottom bar. Time-out, sedation, pause points and sign-out, with jumps to Bleeding, Displaced root, Sinus opening, Nerve, Calc and SOS. Memory only; New patient clears it.','Yes / No / ? step buttons are now 44 px tall.']},
{v:'3.0.0',d:'Oct 23, 2026',i:['Findings: search a drug (brand or generic), lab or prior treatment to see what changes, a provisional action, what it depends on, targeted questions, and sources. 12 findings: DOACs, warfarin, antiplatelets, antiresorptives/antiangiogenics, GLP-1 RA, SGLT2, chronic steroids, H&N radiation/chemo, INR, platelets, HbA1c, kidney disease.','Search fix: “Eliquis” and other brands now reach antithrombotic guidance; typos tolerated; a miss now says “No Compass entry — not the same as no surgical implications.”','Unknown answer on every yes/no step. Unknown halts the path at “verify first”; it is never read as No.','Screen outcomes reworded so short screens no longer read as clearance (e.g., “No office-sedation exclusion found by this screen”), with what the screen did not cover.','Basis label on every plan: Guideline / label, Evidence-informed, Author’s practice, Unverified draft (descriptive, not evidence grades); source check dates shown.','Assessment: add findings, shared context (age, weight, procedure, anesthesia, urgency), overall most-restrictive action, unresolved items, curated conflicts, de-identified copy. Memory only; New patient clears everything.','Photo triage: link import removed (no clinical data in URLs). Paste the CT1 code instead.','Post-op analgesia: anticoagulant/antiplatelet added to “NSAID contraindicated?” (SDCEP advises acetaminophen). Copied notes no longer include the date.']},
{v:'2.14.0',d:'Oct 23, 2026',i:['Photo triage → Pre-op clearance: the triage report’s “Open in Compass” link (or its pasted CT1 code) pre-fills Pre-op clearance and Office sedation (ASA class, STOP-Bang, airway). Each pre-filled step is a suggestion tagged verify; the path stops until you tap Yes or No, so no plan appears from triage alone. Copied plan notes mark steps confirmed or changed from triage. The code carries only yes/no flags and scores, no identifiers.']},
{v:'2.13.1',d:'Oct 23, 2026',i:['Handouts streamlined (~22% fewer words, all four languages): related lines merged (bleeding, swelling, cleaning, pain, normal findings), extraction 18→13 items, pre-sedation 10→7, IV sedation 8→7. No instructions removed. Compass Post-op tab and patient handouts page (Dr. Young and Bayside) verified identical.']},
{v:'2.13.0',d:'Oct 23, 2026',i:['New handout: Before IV sedation (EN/ES/Kriolu/中文) — no solids 8 h, clear liquids until 2 h (ASA 2023), GLP-1 and blood thinner disclosure, no smoking 12 h, no cannabis 3 days, escort, clothing, illness.','Extraction handout additions (from Bayside surgical instructions): tea bag for bleeding, ice 36 h then moist heat, sit up 1 min before standing, high-protein diet, nausea steps, normal findings (bruising, trismus, sore throat, bony edges, cracked lips), dissolving stitches, dry socket signs.','OTC pain regimen on extraction, implant and full-arch handouts: ibuprofen 400 mg q6h + Tylenol 500–1,000 mg q6h, may take together, Tylenol ≤3,000 mg/day, contraindications, no duplicate acetaminophen; opioid only if insufficient (ADA 2024: non-opioid first line).','Implant handout: ice 36 h then heat; no rinsing day of surgery, then Peridex twice daily + salt water after meals; no chewing on implant side 3–4 weeks; denture out as much as possible, no eating with it until adjusted.']},

{v:'2.11.0',d:'Oct 23, 2026',i:['Handouts: added Kriolu (Cape Verdean, Santiago variant) and Mandarin (Simplified Chinese) to all four handouts — translations pending native-speaker review.','Handouts: no smoking or vaping — extraction ≥72 h (ideally 1 week); implant/graft and full-arch ≥2 weeks, quitting best (full-arch had no smoking line before). Dr. Young protocol.','Extraction handout: soft foods 2 weeks; no hard, crunchy or seedy food 3 weeks (was 3 and 5 days). Dr. Young protocol.']},
{v:'2.10.3',d:'Oct 23, 2026',i:['Botulinum toxin: TMD and full-arch now use Dr. Young protocol — Botox 100 U/2.5 mL, masseter only, 4 points per side, 25 U per side if toxin-naive, titrate to 40 U; every 3–4 months; 2–3 weeks before full-arch surgery (timing tagged verify). Sources: Chen 2023 meta-analysis, Gkioka 2024 review.']},
{v:'2.10.2',d:'Oct 23, 2026',i:['Handouts: no salt-water rinses when Augma Shield was used for grafting (extraction and implant/graft handouts, English and Spanish).']},

const ACK='omsCompassAck';

function gate(go){
 app.innerHTML=`${topHTML(0)}
 <div class="gate"><h2>Before you use Compass</h2><ul>
 <li>A clinician-review draft for decision support by dental and OMS clinicians.</li>
 <li>Not an institutional protocol or the standard of care. It does not replace your judgment, your institution’s policies or current guidelines.</li>
 <li>Check every dose against the drug label and your crash-cart concentrations.</li>
 <li>Enter no patient identifiers. Nothing you type is saved.</li></ul>
 <button class="gobtn" data-ack>I understand</button></div>`;
 app.querySelector('[data-ack]').addEventListener('click',e=>{e.stopPropagation();try{localStorage.setItem(ACK,'1')}catch(x){}go()},{once:true});
}
