 return`<details class="box decision-tools" id="compare-panel"${S.compare?' open':''}><summary>Compare approaches · hypothetical</summary><div class="inner"><p class="small">Preview only. Real context and copied notes stay unchanged until you select Apply. A different approach does not establish clinical eligibility.</p><div class="chips">${options.map(([v,l])=>`<button class="tg${S.compare===v?' on':''}" data-cmp="${v}" aria-pressed="${S.compare===v}">${l}</button>`).join('')}</div>${S.compare==='staged'?`<p>Staging alone does not lower bleeding risk. Surgical extractions, implants and grafts remain higher-risk.</p><button class="tg" data-cmpqualify aria-pressed="${!!S.compareEligible}">I confirm each visit qualifies as 1–3 simple extractions / low-risk care</button>`:''}${hyp?`<div class="cmp-result"><h4>Hypothetical · ${esc(disposition(m))} → ${esc(disposition(hyp))}${hyp.prov?' · provisional':''}</h4>${rows.length?rows.map(({f,p})=>`<p><b>${esc(f.t)}</b><br>${escV(p.act)}</p>${p.steps.length?`<ul>${p.steps.map(x=>`<li>${escV(x)}</li>`).join('')}</ul>`:''}`).join(''):'<p>No changed finding action or essential step among the selected findings.</p>'}${hyp.conf.filter(c=>!m.conf.some(o=>o.t===c.t)).map(c=>`<p><b>Changed overlap:</b> ${escV(c.t)}</p>`).join('')}${rows.flatMap(({p})=>p.esc).filter(x=>!m.P.some(o=>o.p.esc.includes(x))).map(x=>`<p><b>Changed escalation:</b> ${escV(x)}</p>`).join('')}${hyp.miss.length?`<p><b>Still unresolved:</b> ${hyp.miss.map(esc).join('; ')}</p>`:''}<p class="small">Only the ${Object.keys(patch).map(k=>esc(CTXQ[k].q)).join(', ')} input changes. Other questions stay unanswered unless already entered.</p><button class="gobtn" data-cmpapply>Apply these context changes</button></div>`:S.compare?'<p class="small">No lower-risk result is calculated until you confirm the procedure actually meets that definition.</p>':''}</div></details>`;
}

function fieldLabel(k){if(k.startsWith('finding:'))return'Finding: '+(FX[k.slice(8)]?.t||'updated');if(k.startsWith('screen:'))return'Pre-op / pathway answer';if(CTXQ[k])return CTXQ[k].q;for(const f of FIND){const q=f.qs.find(q=>q.k===k||q.unitSel===k);if(q)return q.q+(q.unitSel===k?' unit':'')}return k==='comparison applied'?'Approach comparison applied':k==='mode'?'Practice mode':k==='case text'?'Read as a case':'Clinical context'}

 const changed=m.P.filter(x=>{const o=old.P.find(y=>y.f.id===x.f.id);return!o||JSON.stringify([o.p.d,o.p.act,o.p.steps])!==JSON.stringify([x.p.d,x.p.act,x.p.steps])}).map(x=>x.f.t.split(' (')[0]);

 S.changes=S.changes||[];const last=S.changes.at(-1);if(last?.key===k){item.from=last.from;S.changes.pop()}S.changes.push(item);S.changes=S.changes.slice(-5);

const RULES=[
 {when:A=>A.some(x=>ANTITHROMB.includes(x))&&S.ans.preop?.c===false,raise:'investigate',t:'An antithrombotic is in the assessment, but the pre-op screen says none. Reconcile the medication list and screen.'},
 {when:A=>A.some(x=>['antires','rad'].includes(x))&&S.ans.preop?.d===false,raise:'investigate',t:'Bone-risk treatment is in the assessment, but the pre-op screen says no exposure. Reconcile the screen.'},
 {when:A=>A.some(x=>['glp1','sglt2'].includes(x))&&S.ans.preop?.d2===false,raise:'investigate',t:'GLP-1/SGLT2 medication is in the assessment, but the pre-op screen says neither. Reconcile the screen.'},
 {when:()=>['sed','ga'].includes(S.pf.anes)&&S.ans.preop?.e===false,raise:'investigate',t:'The context plans sedation/GA, but the pre-op screen says local only. Re-run the anesthesia screen.'},
 {when:()=>Object.keys(S.lkc||{}).length>0,raise:'investigate',t:()=>Object.values(S.lkc).map(x=>`Lookup conflict: “${x.hit}” suggests ${x.nextL}, but ${x.prevL} is selected — confirm which the patient takes.`).join(' ')},
 {when:A=>A.includes('antiplatelet')&&(A.includes('doac')||A.includes('warfarin'))&&S.pf.ap==='n',raise:'investigate',t:'An antiplatelet is listed, but the anticoagulant card says “no antiplatelet” — reconcile the medication list.'},
 {when:A=>A.includes('antiplatelet')&&(A.includes('doac')||A.includes('warfarin'))&&BLEEDP.includes(S.pf.proc),raise:'investigate',t:'Anticoagulant + antiplatelet: higher bleeding risk than either alone. Consult the prescriber about the combination before procedures likely to bleed.',src:'sdcepFull'},
 {when:A=>A.includes('doac')&&A.includes('warfarin'),raise:'investigate',t:'Both a DOAC and warfarin are listed — confirm the medication list (data check).'},
 {when:(A,P)=>A.some(x=>ANTITHROMB.includes(x))&&(A.includes('renal')||P.some(p=>p.tags.includes('bleedrisk'))),raise:'investigate',t:'Antithrombotic plus another bleeding risk (renal impairment, low platelets or unexplained raised INR). SDCEP lists these as compounding risks — consult the prescriber/physician.',src:'sdcepFull'},
 {when:A=>A.some(x=>ANTITHROMB.includes(x))||A.includes('renal'),t:A=>`Analgesia: avoid NSAIDs (${[A.some(x=>ANTITHROMB.includes(x))?'antithrombotic — SDCEP advises acetaminophen':'',A.includes('renal')?'kidney disease':''].filter(Boolean).join('; ')}). The Post-op analgesia module’s NSAID first line does not apply.`,src:'sdcepFull'},
 {when:A=>A.includes('antires')&&(A.includes('steroid')||S.pf.arSteroid==='y'),t:'Corticosteroids are associated with increased MRONJ risk (AAOMS 2022). Include in consent for bone surgery.',src:'aaoms'},
 {when:A=>A.includes('antires')&&A.includes('rad'),raise:'investigate',t:'Antiresorptive plus jaw radiation: exposed bone in an irradiated field falls outside the MRONJ definition. Get the site dose; manage as possible ORN with radiation oncology.',src:'aaoms'},
 {when:A=>A.includes('glp1')&&A.includes('sglt2')&&['sed','ga'].includes(S.pf.anes),raise:'modify',t:'GLP-1 RA usually continues; SGLT2 inhibitor is held ≥3–4 days. Coordinate one plan with the prescriber.',src:'glp1'},
 {when:A=>A.includes('warfarin')&&A.includes('inr')&&S.pf.inrOn&&S.pf.inrOn!=='war',raise:'investigate',t:'Warfarin is listed, but the INR card says the patient is not on warfarin — reconcile.'}];
function asmtModel(){prune();const A=S.asmt||[];const raw=A.map(id=>({f:FX[id],p:baseFindingPlan(FX[id])}));const reconciled=reconcilePlans(raw,A),P=reconciled.P;
 const worst=P.reduce((w,x)=>!w||DRANK[x.p.d]>DRANK[w.p.d]?x:w,null);
 const miss=[...new Set([...P.flatMap(x=>x.p.miss),...reconciled.miss])];
 const hit=RULES.filter(r=>r.when(A,P.map(x=>x.p)));const conf=[...hit.map(r=>({t:typeof r.t==='function'?r.t(A):r.t,src:r.src,raise:r.raise})),...reconciled.conf];
 /* Decision-changing conflicts raise the overall disposition and stay listed as unresolved until the inputs change. */
 let od=worst?worst.p.d:null,why=worst?worst.f.t.split(' (')[0]:'';
 conf.filter(c=>c.raise).forEach(c=>{if(od&&DRANK[c.raise]>DRANK[od]){od=c.raise;why='a listed conflict'}miss.push('Resolve conflict: '+c.t)});
 /* The pre-op screen is a disposition source like any finding, so Assessment, the procedure gate and the note agree. */
 const gd=gateDisp();let src=worst?'finding':null;
 if(od&&why==='a listed conflict')src='conflict';
 if(gd){if(!od||DRANK[gd.d]>DRANK[od]){od=gd.d;why=gd.why;src='gate'}miss.unshift(...gd.miss.filter(x=>!(x.startsWith('Urgency')&&miss.includes('Urgency'))))}
 const unres=conf.some(c=>c.raise)||reconciled.miss.length>0;
 const act=src==='gate'?gd.act:src==='conflict'?'Resolve the listed conflicts before finalizing the plan.':worst?worst.p.act:'';
 return{A,P,worst,od,why,act,gd,miss:[...new Set(miss)],conf,suppressed:reconciled.suppressed,sections:planSections(P),prov:unres||P.some(x=>x.p.prov)||!!gd?.prov}}

const FXR={};
function fxRemain(m,id){const k=m.id+'.'+id;if(FXR[k])return FXR[k];
 const f=(x,d)=>{if(!x||d>40)return[0,0];const z=m.nodes[x];if(!z||z.out)return[0,0];if(z.note)return f(z.next,d+1);const a=f(z.yes,d+1),b=f(z.no,d+1);return[1+Math.min(a[0],b[0]),1+Math.max(a[1],b[1])]};
 return FXR[k]=f(id,0)}
function fxCount(m,w){if(m.id==='sed'&&!adultSedationEligible())return'Confirm age ≥13';
 const done=w.steps.filter(s=>!s.note&&s.val!==undefined&&s.val!=='u').length;
 if(w.out)return`Plan · ${done} step${done===1?'':'s'} answered`;
 if(w.unk)return`Step ${done+1} · paused (unknown)`;
 if(w.cur){const [lo,hi]=fxRemain(m,w.cur.id);return`Step ${done+1} of ${lo===hi?done+hi:(done+lo)+'–'+(done+hi)}`}
 return''}
