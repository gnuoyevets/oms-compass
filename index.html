<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OMS Compass</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f7f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a19" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: one phone column. Home = grouped decision list. Module = red flags → inputs → yes/no path → plan card → collapsed look-fors and sources. */
:root{
 --bg:#f5f7f3;--surface:#ffffff;--ink:#17312e;--muted:#5a6b67;--line:#dfe5de;--soft:#e9f0e8;
 --accent:#0f6a5e;--accent-ink:#ffffff;--chip:#dcebe3;--chip-ink:#1f5245;
 --warn-bg:#fff4e2;--warn-line:#ecd2a6;--warn-ink:#6f4f1c;
 --red-bg:#fbece8;--red-line:#ebc1b5;--red-ink:#8b3322;
 --ok-bg:#e8f3ea;--ok-line:#c4dcc8;--ok-ink:#25563a;
 --display:'Manrope','DM Sans',system-ui,-apple-system,sans-serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--soft:#1d2f2d;
 --accent:#4fb8a5;--accent-ink:#06211d;--chip:#21403a;--chip-ink:#bfe3d7;
 --warn-bg:#2e2412;--warn-line:#5a4520;--warn-ink:#f0cf92;
 --red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;
 --ok-bg:#16301f;--ok-line:#2c5539;--ok-ink:#a9dcb7;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--soft:#1d2f2d;
 --accent:#4fb8a5;--accent-ink:#06211d;--chip:#21403a;--chip-ink:#bfe3d7;
 --warn-bg:#2e2412;--warn-line:#5a4520;--warn-ink:#f0cf92;
 --red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;
 --ok-bg:#16301f;--ok-line:#2c5539;--ok-ink:#a9dcb7;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.3px;text-wrap:balance;margin:0}
.lab{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

/* Home */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 14px}
.top h1{font-size:24px;font-weight:800}
.top h1 span{color:var(--accent)}
.group{margin:16px 0 6px}
.mods{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;min-height:56px}
.mod:first-child{border-top:0}
.mod:hover{background:var(--soft)}
.mod b{display:block;font:700 15.5px var(--display)}
.mod span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.mod i{font-style:normal;color:var(--accent);font-size:18px}
.foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6}

/* Module */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar h2{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h2 .dtag{white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;padding:0 12px;color:var(--accent);font-weight:600;font-size:13px}
.icon-btn.back{font-size:20px;padding:0}
.red{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.red b{font-weight:700}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.box>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:46px;font-weight:600;font-size:14px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:'+';color:var(--accent);font-size:18px;line-height:1}
details.box[open]>summary::after{content:'−'}
details.box>summary em{font-style:normal;font-weight:600;font-size:12px;color:var(--accent);margin-left:auto}
.inner{padding:0 14px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:7px 11px;font-size:13px;min-height:36px;color:var(--muted)}
.tg.on{background:var(--chip);border-color:var(--chip);color:var(--chip-ink);font-weight:700}
.calc{margin-top:10px;font-size:13px;font-weight:600;color:var(--chip-ink);background:var(--chip);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}

.path{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.step .qt{font-size:13px;line-height:1.4;color:var(--muted)}
.step .qt small{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.notechip{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.cur{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px}
.cur .q{font:700 17px/1.4 var(--display);margin:4px 0 6px}
.cur .h{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.cur .h ul{margin:4px 0 0;padding-left:18px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{min-height:52px;border-radius:10px;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.yn button.y{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.autohint{font-size:12px;color:var(--chip-ink);background:var(--chip);border-radius:6px;padding:5px 8px;margin-bottom:10px}

.plan{border-radius:12px;padding:14px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.plan.action{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.plan.urgent{border-color:var(--red-line);background:var(--red-bg);color:var(--red-ink)}
.plan .lab{color:inherit;opacity:.85}
.plan .pt{font:700 17px/1.4 var(--display);margin:4px 0 0;color:inherit}
.plan ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.plan ol li{margin:6px 0}
.plan ol b{font-weight:700}
.plan .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px}
.plan .meta a{color:inherit;font-weight:600}
.go{display:inline-block;margin-top:10px;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.copybox{display:block;width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px;font-size:13px}
.caveat{font-size:12px;color:var(--muted);margin:10px 0 14px;line-height:1.5}
.look h4{margin:12px 0 4px;font-size:13px}
.look ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.look li{margin:3px 0}
.src{padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.src:first-child{border-top:0}
.src span{display:block;font-size:12px;color:var(--muted)}
/* Tabs, emergency, calculators */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:0 0 6px}
.tabs button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.tabs button{font-size:13px}}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.em{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg)}
.tabs button.em.on{background:var(--red-ink);color:var(--bg);border-color:var(--red-ink)}
.icon-btn.sos{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg);font-weight:800}
.wtbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:10px}
.wtbar input{width:100%;font-size:20px;font-weight:700;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.wtbar .note{font-size:12px;color:var(--muted);line-height:1.35;max-width:150px}
.call{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:10px}
details.em{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red-ink);border-radius:12px;margin-bottom:8px}
details.em>summary{list-style:none;padding:13px 14px;min-height:50px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 16px var(--display)}
details.em>summary::-webkit-details-marker{display:none}
details.em>summary span{font:500 12px var(--sans);color:var(--muted);display:block;margin-top:2px}
details.em>summary::after{content:'+';color:var(--red-ink);font-size:20px}
details.em[open]>summary::after{content:'−'}
.em ol{margin:0;padding:0 14px 6px 34px;font-size:14.5px;line-height:1.5}
.em ol li{margin:6px 0}
.dose{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.unv{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:4px;padding:0 5px}
.em .meta{padding:0 14px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 12px}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.ctab th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-top:0}
.ctab td b{font-size:15px}
.chk{display:flex;flex-direction:column;gap:6px}
.handoff{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--ink);min-height:56px}
.handoff b{display:block;font:700 15px var(--display)}
.handoff span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.handoff i{font-style:normal;color:var(--accent);font-size:18px}
.tribar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.45}
.tribar b{display:block;font-weight:700}
.tribar .vbtn{color:inherit}
.cur.tricur{border-color:var(--warn-ink)}
.trihint{font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:6px 9px;margin-bottom:10px}
.step .qt small.trs{color:var(--warn-ink)}
.top .small{white-space:nowrap}
.srch{margin:2px 0 4px}
.srch input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#hits .mods{margin-top:8px}

.vbtn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;min-height:24px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:8px}
.gate h2{font-size:19px;margin-bottom:8px}
.gate ul{margin:0 0 16px;padding-left:20px;font-size:14.5px;line-height:1.55}
.gate li{margin:6px 0}
.gobtn{width:100%;min-height:52px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
@media (min-width:560px){.top h1{font-size:28px}}
/* v3: Unknown, basis, findings, assessment bar */
.seg button{min-width:40px}
.yn3{grid-template-columns:1fr 1fr .8fr}
.yn button.unk{font-size:14px;color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn-line)}
.bas{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid currentColor;opacity:.95;vertical-align:1px}
.b-un{color:var(--warn-ink);background:var(--warn-bg)}
.b-au{color:var(--chip-ink);background:var(--chip);border-color:var(--chip)}
.rev{font-size:11px;opacity:.85;margin-top:8px;line-height:1.4}
.nomatch{margin-top:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.nomatch b{display:block;margin-bottom:2px}
.fcls{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.disp{border-radius:12px;padding:12px 14px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink);margin-bottom:10px}
.disp.d-mod,.disp.d-inv{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.disp.d-ref,.disp.d-def{border-color:var(--red-line);background:var(--red-bg);color:var(--red-ink)}
.disp .lab{color:inherit;opacity:.85}
.disp .pt{font:600 16px/1.45 var(--sans);margin-top:4px;color:inherit}
.disp.big .pt{font-size:16.5px}
.dtag{display:inline-block;font:800 12px var(--display);letter-spacing:.3px;text-transform:uppercase;border:1.5px solid currentColor;border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.dtag.sm{font-size:10.5px;margin-right:6px}
.dtag.d-ok{color:var(--ok-ink)}.dtag.d-mod,.dtag.d-inv{color:var(--warn-ink)}.dtag.d-ref,.dtag.d-def{color:var(--red-ink)}
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.fsec ul,.fsec ol{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.fsec li{margin:4px 0}
.fsec.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.fsec.warn .lab,.fsec.warn .small{color:inherit}
.fq{padding:10px 0;border-top:1px solid var(--line)}
.fq:first-of-type{border-top:0}
.fql{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink)}
.fql small{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin-left:4px}
.fqh{font-size:12px;color:var(--muted);margin:-3px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .tg{min-height:44px;padding:8px 12px;font-size:13.5px;text-align:left;color:var(--ink)}
.chips .tg.unkb{color:var(--warn-ink);border-style:dashed}
.chips .tg.on.unkb{background:var(--warn-bg);border-color:var(--warn-ink);border-style:solid}
.numrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.numrow input,.numrow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:16px;color:var(--ink);min-height:44px;font-variant-numeric:tabular-nums;width:100%}
.numrow select{width:auto;max-width:190px}
.unitlab{font-size:13px;color:var(--muted)}
.quote{font-size:13.5px;line-height:1.5;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:4px 0}
.fact{margin:12px 0}
.gobtn:disabled{opacity:.6}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.arow:first-of-type{border-top:0}
.alink{text-align:left;background:none;border:0;padding:4px 0;min-height:44px}
.alink b{display:block;font:700 14.5px var(--display)}
.alink span.dtag{display:inline-block}
.bar h2 #fmini{display:block;line-height:1}
.bar h2 #fmini .dtag{font-size:10px;margin-top:3px}
.ctxsum{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.alink span{display:block;font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
body.hasbar .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);max-width:680px;margin:0 auto}
.abar[hidden],body.kb .abar{display:none}
.abtn{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink);padding:0 14px}
.abtn b{color:var(--accent)}
.abtn.np{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg)}
.abtn.np.arm,.icon-btn.newpt{background:var(--red-ink);color:var(--bg);border-color:var(--red-ink)}

/* Outpatient odontogenic antibiotic tiers (infection module). */
const ABX_TIERS='Tier 1: amoxicillin 500 mg TID or penicillin VK 500 mg QID (ADA 2019). Alternatives not in ADA 2019: amoxicillin-clavulanate 875/125 mg BID, and adding metronidazole 500 mg TID up front for severe or fascial spread (ADA adds it only on failure). Tier 2 — penicillin allergy without anaphylaxis, angioedema or hives: cephalexin 500 mg QID (ADA 2019) or cefuroxime 500 mg BID (not an ADA 2019 regimen). Tier 3 — anaphylaxis, angioedema or hives: azithromycin 500 mg day 1, then 250 mg days 2–5 (ADA 2019), plus metronidazole 500 mg TID; or moxifloxacin 400 mg daily (combination and moxifloxacin are not ADA 2019 regimens). Avoid oral clindamycin alone: >30% resistance in deep-space series (Long 2021) and C. difficile risk; ADA 2019 still lists it.';
/* Shared local hemostatic bundle (preop note + antithrombotic findings). */
const HEMO='Local hemostatic bundle: oxidized cellulose or collagen plug in the socket, figure-of-8 sutures, 30 min firm gauze pressure, and tranexamic acid 4.8–5% as a rinse or soaked gauze (a 500 mg tablet crushed in 10 mL sterile water ≈ 5%; off-label, compounded).';

{id:'dm',g:'Anesthesia & medical',title:'Diabetes',d:'A1C context · day-of meds · glucose on arrival',

 nodes:{
 nA1c:{note:1,t:'A1C is context, not a gate',x:'A recent A1C ≥8% marks higher infection and healing risk: tell the patient, involve the physician when elective timing allows, and plan glucose checks. A1C alone does not cancel surgery; the day-of glucose, symptoms, procedure size and urgency decide. Never delay urgent care for A1C. [verify: ADA 2026 Section 16 wording not retrieved]',src:'dm26',next:'b'},
 b:{q:'On insulin, a sulfonylurea or an SGLT2 inhibitor?',yes:'nMed',no:'c'},
 nMed:{note:1,t:'Day-of medications',x:'Evening before: long-acting insulin ~75% of usual. Morning of surgery: 50% of long/intermediate insulin; hold oral agents. SGLT2 inhibitor: stop 3–4 days before. Book early morning.',src:'allyn',next:'c'},
 c:{q:'Arrival glucose outside 80–180 mg/dL?',yes:'oGlu',no:'oOk'},
 oGlu:{out:'Correct before proceeding. <70: treat (Emergency → Hypoglycemia). Markedly high: discuss with the physician; reschedule elective care.',tone:'action',src:'allyn'},
 oOk:{out:'No diabetes-related reason to defer found by this screen. Recheck glucose after sedation; resume meds with eating.',scr:'Assumes arrival glucose was measured today. A1C informs risk discussion only.',src:'allyn',ex:'Poorly controlled diabetes or major surgery: consider antibiotics to support healing (Filippi).'}
 }},

{id:'steroid',g:'Anesthesia & medical',title:'Chronic steroids',d:'Adrenal-risk assessment · stress dosing',

 oAI:{out:'Adrenal insufficiency: give steroid cover. Agree the dose with endocrinology or the prescriber.',tone:'action',src:'spsdent',src2:'giai',ex:'Primary AI (UK SPS): extra glucocorticoid dose before the visit; for oral surgery, cover before and for 24 h after. Parenteral cover for GA, regional anesthesia or major surgery. The patient brings their emergency hydrocortisone kit. Collapse: SOS → Adrenal crisis.'},
 b:{q:'Adrenal-suppression risk from steroid use?',h:['Oral glucocorticoid ≥3–4 weeks above ~15–25 mg/day hydrocortisone-equivalent (≈ prednisone 4–6 mg/day), now or recently stopped','Also consider: high-dose inhaled or topical steroids, intra-articular injection in the past 2 months, a strong CYP3A4 inhibitor (e.g., ritonavir) with a steroid','Courses under 3–4 weeks: low concern (ESE/Endocrine Society 2024)'],yes:'c',no:'oNo'},
 oNo:{out:'Low adrenal-suppression risk by dose and duration: continue the usual dose; no extra cover.',scr:'Relies on a complete steroid history (all routes, recent courses). Unknown history is not low risk.',src:'giai',ex:'Seek advice if the patient becomes unwell or the case becomes major.'},
 c:{q:'HPA-axis recovery documented since (e.g., morning cortisol >10 µg/dL / 300 nmol/L)?',yes:'oRec',no:'d'},
 oRec:{out:'Documented recovery: continue the usual dose; no stress cover needed.',src:'giai',ex:'Treat new instability as possible adrenal crisis regardless.'},
 d:{q:'GA, regional anesthesia, major or prolonged surgery, unable to take oral intake, vomiting/diarrhea or unstable?',h:['IV sedation is not named in the 2024 guideline; treat a long or deep sedation case as moderate stress [verify]'],yes:'oPar',no:'oOral'},
 oPar:{out:'At risk, moderate–major stress: parenteral stress-dose glucocorticoid (e.g., IV hydrocortisone at induction), per the prescriber or anesthesia.',tone:'action',src:'giai',ex:'Continue the usual dose. Not tested for adrenal insufficiency = give cover (R3.1). Hypotension, vomiting or collapse: SOS → Adrenal crisis.'},
 oOral:{out:'At risk, minor stress under local: oral stress-dose cover; dose per the prescriber.',tone:'action',src:'giai',ex:'Continue the usual dose. Untested patients exposed to stress get cover (ESE/Endocrine Society 2024, R3.1A). Escalate to parenteral cover if the patient vomits or becomes unstable.'}
 }},

{id:'pain',g:'Post-op & complications',title:'Post-op analgesia',d:'NSAID first · when an opioid is allowed',

{id:'lac',g:'Trauma',title:'Facial laceration',d:'Explore vs close · bites · lip, lid, ear · tetanus',
 start:'a',refs:['lacaafp','tetcdc','bitewk','fn72','atls'],
 red:'<b>Test the facial nerve before local anesthetic.</b> Explore before closing: facial weakness, saliva in the wound, cheek wound on the tragus–mid-upper-lip line, medial lower lid, lid margin.',

 nodes:{
 a:{q:'Part of a bigger injury: life threat, facial fracture, globe injury, or head injury with LOC?',h:['Step-off, malocclusion, diplopia, enophthalmos, CSF leak','Wound over a fracture is an open fracture'],yes:'oBig',no:'b'},
 oBig:{out:'Primary survey and fractures first; close the skin with (or after) definitive repair.',tone:'urgent',src:'atls',go:'trauma',go2:'mandfx',ex:'Temporize: irrigate, moist saline dressing, pressure for bleeding. Tetanus per Look-fors.'},
 b:{q:'Deep-structure injury suspected?',h:['Facial weakness with a wound lateral to a vertical line through the lateral canthus','Cheek wound on the tragus–mid-upper-lip line, or clear fluid (saliva) in the wound → parotid duct','Medial lower lid near the punctum (canaliculus), lid margin, tarsal plate, or globe'],yes:'oDeep',no:'c'},
 oDeep:{out:'Explore and repair the deep structure before skin closure (OR or the right service).',tone:'urgent',src:'fn72',src2:'lacaafp',ex:'Facial nerve: repair within 72 h, while distal branches still respond to a nerve stimulator; tension-free epineurial repair under magnification; graft if a gap (graft can wait 9–12 months). Weakness medial to the lateral-canthus line usually recovers without repair [verify]. Parotid duct: cannulate Stensen’s papilla and inject saline or methylene blue; leak in the wound = duct injury → repair over a stent; gland-only injury → layered closure and pressure dressing [verify]. Canaliculus, lid margin, tarsal plate, globe, or deeper than subcutaneous on the lid: ophthalmology/oculoplastics.'},
 c:{q:'Bite wound (dog, cat, human)?',yes:'nBite',no:'d'},
 nBite:{note:1,t:'Bite',x:'Irrigate copiously and debride devitalized tissue. Facial dog bites: close primarily (good blood supply, cosmesis); cat bites off the face often do better left open. Antibiotics for higher-risk wounds (cat or human bite, deep puncture, edema, immunocompromise, near bone or cartilage) and for primarily closed bites: amoxicillin-clavulanate 875/125 mg PO BID, about 3–7 days [verify]; penicillin allergy: clindamycin (+ ciprofloxacin or TMP-SMX for broader cover) or doxycycline. Rabies: bat, raccoon, skunk, fox, monkey, or stray/unobservable animal → PEP with the health department; owned dog or cat → 10-day observation. Report the bite per local rules [verify].',src:'lacaafp',next:'d'},
 d:{q:'Grossly contaminated, infected, or over ~24 h old?',h:['AAFP: head wounds may be closed up to 24 h after injury; no fixed golden period'],yes:'oDirty',no:'e'},
 oDirty:{out:'Clean and debride; close if clean after irrigation, otherwise pack and close in 3–5 days.',tone:'action',src:'lacaafp',ex:'Face usually still tolerates primary closure after debridement given its blood supply [verify]. Infected: open, drain, culture, antibiotics; delayed closure. Remove gravel/asphalt now (traumatic tattoo is hard to fix later). Tetanus: dirty/major wound column.'},
 e:{q:'Special site: lip through the vermilion, ear cartilage, eyelid skin, nose through-and-through, or tissue loss?',yes:'oSite',no:'oSimple'},
 oSite:{out:'Site-specific layered repair (see details).',tone:'action',src:'lacaafp',ex:'Lip: mark the vermilion border before injecting; first skin suture aligns the border; 3-0/4-0 absorbable to orbicularis and mucosa; 6-0/7-0 nylon skin. Through-and-through: mucosa, muscle, then skin. Ear: cover all cartilage; one bite of 6-0 polypropylene through skin and perichondrium; bolster/head wrap against hematoma. Eyelid skin only: 6-0 nylon (lid margin/tarsus → ophthalmology). Nose through-and-through: mucosa, cartilage, skin [verify]. Tissue loss/avulsion: conserve tissue, minimal debridement; local flap or plastics for large defects [verify].'},
 oSimple:{out:'Irrigate, anesthetize, and close in layers; sutures out at 3–5 days.',src:'lacaafp',ex:'Tap water or saline, 50–100 mL per cm of wound. Lidocaine with epinephrine is fine on the face (1:200,000 safe on nose and ear). Deep absorbable, then 5-0 or 6-0 nylon skin. Tissue adhesive: clean, linear, low-tension, <12 h, not on mucocutaneous junctions or hair. No routine systemic antibiotics for clean non-bite wounds; topical antibiotic ointment. Sun protection on the scar [verify].'}
 },

 caveat:'Based on IADT 2020 (via AAPD 2025 and published summaries). AAE issued updated US guidelines in Apr 2026 (J Endod); full text not yet reviewed here. Record photos, pulp tests, tetanus status, and radiographs from 2+ angles; CBCT when it changes management.',

 e:{q:'Replanted at the scene, or extraoral dry time ≤60 min (or kept in milk, saline, saliva or HBSS)?',yes:'oRep',no:'oLate'},
 oRep:{out:'Replant and splint. Closed apex: root canal within 2 weeks. Open apex: watch for revascularization.',tone:'action',src:'aapdav',ex:'Rinse the root with saline; do not scrub. LA without vasoconstrictor; irrigate the socket, remove clot gently; replant with light pressure; confirm on radiograph. Flexible passive splint 2 weeks (rigid 4 weeks with alveolar fracture). Amoxicillin or penicillin 7 days; chlorhexidine twice daily 2 weeks; tetanus check; soft diet. Closed apex: start root canal (calcium hydroxide) within 2 weeks, before the splint comes off. Review at 2 weeks, then 1, 3, 6 and 12 months, then yearly for 5 years.'},
 oLate:{out:'Dry >60 min: usually still replant to keep bone; expect ankylosis and replacement resorption.',tone:'action',src:'aapdav',ex:'Wipe non-viable tissue off the root with gauze. Root canal before replantation or within 2 weeks. Same splint, antibiotics, chlorhexidine and tetanus steps. Growing patient: plan decoronation when infraocclusion appears; implant after growth.'},
 f:{q:'Several teeth moving together as a segment (alveolar fracture)?',yes:'oAlv',no:'g'},

 g:{q:'Tooth displaced (extruded, laterally luxated or intruded)?',yes:'h',no:'k'},
 h:{q:'Intruded?',yes:'oIntr',no:'oLux'},
 oIntr:{out:'Intrusion: plan by apex stage and depth. Splint 4 weeks once repositioned.',tone:'action',src:'oep',ex:'Open apex: allow re-eruption; no movement in 4 weeks → orthodontic repositioning. Closed apex <3 mm: allow re-eruption; none in 8 weeks → reposition. 3–7 mm: orthodontic or surgical repositioning. >7 mm: surgical repositioning. Closed apex: pulp necrosis is expected; start root canal within 2 weeks.'},
 oLux:{out:'Reposition under LA and splint: extrusion 2 weeks, lateral luxation 4 weeks.',tone:'action',src:'iadtfx',ex:'Lateral luxation: free the apex from its bony lock first. Closed apex: assess the pulp at 2 weeks; signs of necrosis → root canal with calcium hydroxide. Open apex: watch for revascularization. Soft diet; chlorhexidine.'},
 k:{q:'Root fracture on radiographs (2+ angles or CBCT)?',yes:'oRoot',no:'l'},
 oRoot:{out:'Reposition the coronal fragment; flexible splint 4 weeks (cervical third: up to 4 months).',tone:'action',src:'oep',ex:'Most heal. If the coronal segment becomes necrotic, treat only that segment endodontically.'},
 l:{q:'Crown fracture exposing the pulp?',yes:'oPulp',no:'oMinor'},
 oPulp:{out:'Keep the pulp alive: partial (Cvek) pulpotomy, especially with an open apex.',tone:'action',src:'oep',ex:'Remove 1–2 mm of pulp; rinse with 1–5% NaOCl; hemostasis within 5 min (if not, go deeper); MTA or Biodentine ≥2 mm; glass ionomer; composite or bond the fragment.'},
 oMinor:{out:'Concussion, subluxation or enamel–dentin fracture: conservative care and follow-up.',src:'oep',ex:'Bond the fragment or restore with composite; cover exposed dentin. Subluxation: optional flexible splint up to 2 weeks for comfort. Soft diet 1–2 weeks. An early negative pulp test alone is not a reason to start a root canal.'}
 },

function walk(m){

  /* Triage answers are suggestions only: the walk stops on them until the clinician taps. */

function pedCard(e){const p=PEDS[e.id];
 if(typeof p==='string')return`<div class="pref"><b>Pediatric: adult card suppressed.</b> ${esc(p)}</div>`;
 if(p)return`<ol>${p.steps().map(x=>`<li>${x}</li>`).join('')}</ol><div class="meta">${p.src.map(srcLink).join('')}</div>`;
 return`<ol>${e.steps().map(x=>`<li>${x}</li>`).join('')}</ol><div class="meta">${e.src.map(srcLink).join('')}</div>`}

 <div class="call">Any emergency: call for help, stop the procedure, 100% O₂, monitors on. Call 911 early.</div>

const TRI_MODS=['preop','sed'];
function parseTri(raw){
 let s=String(raw||'').trim();try{s=decodeURIComponent(s)}catch(e){}
 /* Accept the code alone or a whole pasted report: take the CT1 line, ignore backticks and surrounding text. */
 const hit=s.match(/CT1;[^\s`"'<>]*/i);s=hit?hit[0]:s.replace(/^.*?#?triage=/i,'').replace(/\s+/g,'');
 if(/^CT1;none$/i.test(s))return{err:'The report says nothing could be read from the photo (CT1;none). Answer the steps yourself.'};
 if(!/^CT1;/i.test(s))return{err:'Not a Compass triage code. It should start with CT1;'};
 const out={mods:{},asa:null,sb:null};let n=0;
 s.slice(4).split(';').filter(Boolean).forEach(part=>{const [k,v='']=part.split(':');const key=k.toLowerCase();
  if(key==='asa'){const a=v.toUpperCase().replace(/^ASA/,'');const map={'1':1,'I':1,'2':2,'II':2,'3':3,'III':3,'4':4,'IV':4,'5':5,'V':5};if(map[a])out.asa=map[a];return}
  if(key==='sb'){const b=parseInt(v,10);if(b>=0&&b<=8)out.sb=b;return}
  if(!TRI_MODS.includes(key))return;const m=M(key);
  v.split(',').forEach(t=>{const mm=/^([a-z][a-z0-9]*)([01])$/i.exec(t);if(!mm)return;const node=m.nodes[mm[1]];
   if(!node||!node.q)return;(out.mods[key]=out.mods[key]||{})[mm[1]]=mm[2]==='1';n++})});
 if(!n&&out.asa==null&&out.sb==null)return{err:'Code read, but it had no answers Compass recognizes.'};
 return out}

 if(t.sb!=null&&t.sb>=3){if(id==='sed'&&o.c===undefined)o.c=true;if(id==='preop'&&o.f===undefined)o.f=true}
 if(t.sb!=null&&t.sb<3&&id==='preop'&&o.f===undefined)o.f=false;

{v:'3.5.0',d:'Oct 25, 2026',i:['New module: Facial laceration (Hospital on-call). Bigger injury first; explore facial nerve, parotid duct, canaliculus and lid before closing; bites (antibiotics, rabies, facial closure); contaminated or late wounds; lip, ear, eyelid and nose repairs; simple layered closure. Tetanus per CDC 2026. Author-drafted lines tagged verify.']},
{v:'3.4.0',d:'Oct 24, 2026',i:['Approved by Steven after independent review. One reconciled assessment with conflicting instructions suppressed and unresolved alternatives visible.','Decisive unanswered questions, isolated approach comparisons with explicit Apply, in-memory change explanations, and copy-only consultation drafts.','Missing numeric INR stays provisional. New patient clears all clinical data, comparison state and change history. Software checks do not establish clinical validity.','Review fixes: age-restricted local anesthetic advice withholds only that drug; missing age no longer escalates; Author protocol shown in the reconciled plan.']},
{v:'3.3.3',d:'Oct 24, 2026',i:['Dose fixes: adult IM succinylcholine capped at 150 mg total (label); LAST lipid split at 70 kg (ASRA: >70 kg 100 mL bolus, then 250 mL over 15–20 min); IM midazolam for seizures under 13 kg is 0.2 mg/kg (verify); under-18 local anesthetic maximums use AAPD caps (lidocaine and mepivacaine 300 mg, articaine 500 mg).','New findings: inherited bleeding disorders (WFH), heart valve / IE / prosthetic joint (AHA 2021, ADA), pacemaker or ICD (APSF/ASA), buprenorphine (multisociety 2021), epinephrine interactions (TCAs, nonselective β-blockers, cocaine), organ transplant and immunosuppressants.','Home: on-call and Mode folded into one Settings row. SOS: jump chips to each card. Shorter search hint.']},
{v:'3.3.2',d:'Oct 24, 2026',i:['Photo triage works in any Claude account: the hand-off now carries a complete prompt (report sections, de-identification, unknown ≠ normal, and the exact CT1 code format with every step defined), so colleagues do not need the pre-op triage skill. If the skill is installed, Claude still uses it.','Paste box accepts the whole report: Compass finds the CT1 line itself. CT1;none explains that nothing was readable.']},
{v:'3.3.1',d:'Oct 24, 2026',i:['Pediatric SOS: a child (age <12, or <18 and <40 kg, or no age and <40 kg) gets PALS 2025 algorithms for cardiac arrest (2 → 4 J/kg, epinephrine 0.01 mg/kg, amiodarone 5 mg/kg, 15:2) and bradycardia (atropine 0.02 mg/kg, max 0.5 mg), plus pediatric oversedation, hypoglycemia, adrenal crisis, laryngospasm and bronchospasm doses. Chest pain, stroke and hypertensive crisis cards are suppressed with pediatric referral guidance.','LA calculator blocks drugs by label age: articaine under 4 y, dental bupivacaine under 12 y; asks for age when it is missing.','Diabetes: A1C no longer defers surgery on its own — it flags risk; day-of glucose, symptoms, procedure size and urgency decide. Compared unrounded (64 mmol/mol = 8.01%).','Chronic steroids: adrenal-risk assessment (ESE/Endocrine Society 2024): known AI → cover; ≥3–4 weeks above ~15–25 mg/day hydrocortisone-equivalent → oral cover for minor stress, parenteral for GA/major/unwell; unknown history = at risk.','Labs: explicit unit required (A1C, platelets), Unknown button on every number, unrounded comparisons, INR ≥10 (or ≥5 off warfarin) treated as possibly real with urgent same-day verification instead of “invalid”.','Assessment: decision-changing conflicts raise the overall action and stay listed as unresolved; each finding shows its steps and escalation on screen and in the copied note.','Practice mode: “Author” applies your protocols (INR <3.5, uninterrupted DOACs for dentoalveolar surgery) with applicability and the guideline difference shown; “Colleague” now applies SDCEP rules (INR <4, one-dose DOAC timing) and says what it does not replace.','Search: a brand that conflicts with an earlier choice (Xarelto after apixaban) is flagged, not silently ignored; ASA, Ecotrin, Bayer aspirin, acetylsalicylic acid find aspirin. “Add to assessment” sits under the recommendation.']},
{v:'3.3.0',d:'Oct 24, 2026',i:['Age and weight at the top of Calc and SOS, shared with the Assessment. Enter weight in kg or lb (kg = lb ÷ 2.20462, 1 decimal); both shown, e.g. 69.9 kg (154 lb).','Pediatric lockout: age <12 (or no age and weight <40 kg) hides the adult no-pump IV sedation table and the Office sedation screen. LA maximums, 4-2-1 fluids and SOS cards stay on and scale to weight; SOS flags fixed adult doses. Under 18, LA maximums use the AAPD pediatric table (lidocaine and mepivacaine 4.4 mg/kg).','Practice mode on Home (remembered on this device): Author (Bayside) or Colleague (Standard). Colleague hides the Dr. Young/Bayside handout presets (neutral header, no phone or review link) and folds author’s-practice content behind “+ Show Author’s Clinical Protocol”.','Copy de-identified note now pastes as four blocks — History · Findings & risk · Anesthesia & limits · Plan & alerts — with LA cartridge limits and an NSAID–anticoagulant alert. Plain text for Dentrix, Epic and PCHC.','Content: IE prophylaxis pediatric doses; GLP-1 split into day-of GI symptoms (defer) vs higher-risk features (24 h clear liquids or local ± N₂O, no routine 1-week hold — Kindel 2024); antithrombotic local hemostatic bundle with TXA; warfarin INR <3.5 and DOACs uninterrupted for dentoalveolar surgery (author’s practice, labeled); MRONJ incidence by regimen, denosumab timing (verify), CTX not indicated; three-tier outpatient odontogenic antibiotics.','“● Offline Ready” in the header once the app is cached for offline use.']},
{v:'3.2.0',d:'Oct 23, 2026',i:['New module: Deep neck space infection (hospital consult). Airway first, CT neck ± chest, empiric IV antibiotics by host, necrotizing/mediastinal spread, drain vs medical trial; Lemierre, mediastinitis and cavernous sinus thrombosis look-fors. Listed under Hospital on-call.','Odontogenic infection: emergency outcome now links to the new module; IV clindamycin is paired with levofloxacin (clindamycin alone not recommended, >30% resistance — Long et al. 2021).']},
{v:'3.1.0',d:'Oct 23, 2026',i:['Medical gate: a colour-coded block at the top of procedure modules summarizes Pre-op clearance answers (red = defer elective, amber = address first or unknown, green = no exclusion hit — never a clearance). Taps through to Pre-op clearance and the Assessment.','Hospital on-call switch on Home (remembered on this device): on shows ER/trauma, fractures, dentoalveolar trauma and infection first; off hides facial trauma triage and mandible fracture from the list. Search still finds everything.','Intraop checklist: second tab in the Assessment drawer, plus an Intraop button in the bottom bar. Time-out, sedation, pause points and sign-out, with jumps to Bleeding, Displaced root, Sinus opening, Nerve, Calc and SOS. Memory only; New patient clears it.','Yes / No / ? step buttons are now 44 px tall.']},
{v:'3.0.0',d:'Oct 23, 2026',i:['Findings: search a drug (brand or generic), lab or prior treatment to see what changes, a provisional action, what it depends on, targeted questions, and sources. 12 findings: DOACs, warfarin, antiplatelets, antiresorptives/antiangiogenics, GLP-1 RA, SGLT2, chronic steroids, H&N radiation/chemo, INR, platelets, HbA1c, kidney disease.','Search fix: “Eliquis” and other brands now reach antithrombotic guidance; typos tolerated; a miss now says “No Compass entry — not the same as no surgical implications.”','Unknown answer on every yes/no step. Unknown halts the path at “verify first”; it is never read as No.','Screen outcomes reworded so short screens no longer read as clearance (e.g., “No office-sedation exclusion found by this screen”), with what the screen did not cover.','Basis label on every plan: Guideline / label, Evidence-informed, Author’s practice, Unverified draft (descriptive, not evidence grades); source check dates shown.','Assessment: add findings, shared context (age, weight, procedure, anesthesia, urgency), overall most-restrictive action, unresolved items, curated conflicts, de-identified copy. Memory only; New patient clears everything.','Photo triage: link import removed (no clinical data in URLs). Paste the CT1 code instead.','Post-op analgesia: anticoagulant/antiplatelet added to “NSAID contraindicated?” (SDCEP advises acetaminophen). Copied notes no longer include the date.']},
{v:'2.14.0',d:'Oct 23, 2026',i:['Photo triage → Pre-op clearance: the triage report’s “Open in Compass” link (or its pasted CT1 code) pre-fills Pre-op clearance and Office sedation (ASA class, STOP-Bang, airway). Each pre-filled step is a suggestion tagged verify; the path stops until you tap Yes or No, so no plan appears from triage alone. Copied plan notes mark steps confirmed or changed from triage. The code carries only yes/no flags and scores, no identifiers.']},
{v:'2.13.1',d:'Oct 23, 2026',i:['Handouts streamlined (~22% fewer words, all four languages): related lines merged (bleeding, swelling, cleaning, pain, normal findings), extraction 18→13 items, pre-sedation 10→7, IV sedation 8→7. No instructions removed. Compass Post-op tab and patient handouts page (Dr. Young and Bayside) verified identical.']},
{v:'2.13.0',d:'Oct 23, 2026',i:['New handout: Before IV sedation (EN/ES/Kriolu/中文) — no solids 8 h, clear liquids until 2 h (ASA 2023), GLP-1 and blood thinner disclosure, no smoking 12 h, no cannabis 3 days, escort, clothing, illness.','Extraction handout additions (from Bayside surgical instructions): tea bag for bleeding, ice 36 h then moist heat, sit up 1 min before standing, high-protein diet, nausea steps, normal findings (bruising, trismus, sore throat, bony edges, cracked lips), dissolving stitches, dry socket signs.','OTC pain regimen on extraction, implant and full-arch handouts: ibuprofen 400 mg q6h + Tylenol 500–1,000 mg q6h, may take together, Tylenol ≤3,000 mg/day, contraindications, no duplicate acetaminophen; opioid only if insufficient (ADA 2024: non-opioid first line).','Implant handout: ice 36 h then heat; no rinsing day of surgery, then Peridex twice daily + salt water after meals; no chewing on implant side 3–4 weeks; denture out as much as possible, no eating with it until adjusted.']},
{v:'2.12.2',d:'Oct 23, 2026',i:['Bayside review button now opens the Bayside Google review form directly (g.page review link) instead of the Maps profile.']},

{v:'2.12.0',d:'Oct 23, 2026',i:['Handouts: “LLC” removed from the practice name in the review request.','Post-op tab: Dr. Young / Bayside switch — shared handout text names that practice and uses its Google link. Patient handouts page: /handouts/?site=bayside gives the Bayside version.']},
{v:'2.11.1',d:'Oct 23, 2026',i:['Handouts: Google review request (Steven H. Young, DDS, OMS) added to the end of every shared handout and to the patient handouts page, in all four languages.']},
{v:'2.11.0',d:'Oct 23, 2026',i:['Handouts: added Kriolu (Cape Verdean, Santiago variant) and Mandarin (Simplified Chinese) to all four handouts — translations pending native-speaker review.','Handouts: no smoking or vaping — extraction ≥72 h (ideally 1 week); implant/graft and full-arch ≥2 weeks, quitting best (full-arch had no smoking line before). Dr. Young protocol.','Extraction handout: soft foods 2 weeks; no hard, crunchy or seedy food 3 weeks (was 3 and 5 days). Dr. Young protocol.']},
{v:'2.10.3',d:'Oct 23, 2026',i:['Botulinum toxin: TMD and full-arch now use Dr. Young protocol — Botox 100 U/2.5 mL, masseter only, 4 points per side, 25 U per side if toxin-naive, titrate to 40 U; every 3–4 months; 2–3 weeks before full-arch surgery (timing tagged verify). Sources: Chen 2023 meta-analysis, Gkioka 2024 review.']},
{v:'2.10.2',d:'Oct 23, 2026',i:['Handouts: no salt-water rinses when Augma Shield was used for grafting (extraction and implant/graft handouts, English and Spanish).']},

const ACK='omsCompassAck';

function gate(go){
 app.innerHTML=`${topHTML(0)}
 <div class="gate"><h2>Before you use Compass</h2><ul>
 <li>A clinician-review draft for decision support by dental and OMS clinicians.</li>
 <li>Not an institutional protocol or the standard of care. It does not replace your judgment, your institution’s policies or current guidelines.</li>
 <li>Check every dose against the drug label and your crash-cart concentrations.</li>
 <li>Enter no patient identifiers. Nothing you type is saved.</li></ul>
 <button class="gobtn" data-ack>I understand</button></div>`;
 app.querySelector('[data-ack]').addEventListener('click',e=>{e.stopPropagation();try{localStorage.setItem(ACK,'1')}catch(x){}go()},{once:true});
}
