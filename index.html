{id:"ext",src:["mcgill"],t:{"en":"After tooth removal","es":"Después de una extracción dental","kea":"Dipôs di tira denti","zh":"拔牙后须知"},i:{
en:["Bleeding: bite firmly on the gauze for 30 minutes. Oozing for 1–2 days is normal. Heavy bleeding: sit upright and bite on fresh folded gauze, or a moistened black tea bag, for 30–60 minutes.","Swelling: ice the cheek 20 minutes on, 20 off, for 36 hours, then switch to moist heat. Swelling peaks on day 2–3. Sleep with your head raised for 2 nights.","First 24 hours: no rinsing, spitting or straws. They can pull out the blood clot.","No smoking or vaping for at least 72 hours, ideally 1 week. It raises the risk of a painful dry socket.","From day 2: rinse gently with warm salt water (½ teaspoon in 1 cup) after meals and at bedtime. Brush gently. Augma Shield graft: use only the prescribed rinse, no salt water.","Diet: soft foods for 2 weeks; no hard, crunchy or seedy foods (nuts, chips, popcorn) for 3 weeks. Eat protein, do not skip meals, and drink plenty of fluids.","Pain (adults): ibuprofen 400 mg (two 200 mg tablets) every 6 hours with food, plus Tylenol 500–1,000 mg every 6 hours — taking them together is fine — for 2–3 days. No more than 3,000 mg of Tylenol a day. Start before the numbness wears off. Use a prescribed opioid only if needed.","Skip ibuprofen with kidney disease, stomach ulcers, a blood thinner, pregnancy, or an aspirin or ibuprofen allergy. Skip Tylenol with liver disease, heavy drinking, or if your prescription pill already contains acetaminophen (for example, Percocet).","Finish any antibiotic; if you get a rash, stop it and call us. No alcohol for 24 hours or while taking opioids. Sit up for 1 minute before standing.","Nausea: nothing by mouth for 1 hour, then sip ginger ale or tea.","Normal: bruising (day 2–3), jaw stiffness, sore throat, sharp bony edges, and dry lip corners (use Vaseline). Stitches dissolve; the socket fills in over about 1 month.","Call us: bleeding that pressure does not stop; pain or swelling worse after day 3, or throbbing pain toward the ear (dry socket); fever over 100.4°F (38°C); pus or bad taste; numbness the next day.","Trouble breathing or swallowing: call 911."],
es:["Sangrado: muerda firmemente la gasa por 30 minutos. Es normal un poco de sangrado leve por 1–2 días. Si sangra mucho: siéntese derecho y muerda una gasa limpia doblada, o una bolsita de té negro humedecida, por 30–60 minutos.","Hinchazón: hielo en la mejilla 20 minutos sí y 20 no por 36 horas; después, calor húmedo. La hinchazón es mayor el día 2–3. Duerma con la cabeza elevada por 2 noches.","Primeras 24 horas: no se enjuague, no escupa y no use popotes (pajillas). Pueden desprender el coágulo.","No fume ni vapee por al menos 72 horas, idealmente 1 semana. Aumenta el riesgo de alveolitis seca, que es muy dolorosa.","Desde el día 2: enjuáguese suavemente con agua tibia con sal (½ cucharadita en 1 taza) después de comer y al acostarse. Cepíllese con cuidado. Injerto Augma Shield: use solo el enjuague recetado, sin agua con sal.","Dieta: comidas blandas por 2 semanas; nada duro, crujiente ni con semillas (nueces, papitas, palomitas) por 3 semanas. Coma proteína, no se salte comidas y tome muchos líquidos.","Dolor (adultos): ibuprofeno 400 mg (2 tabletas de 200 mg) cada 6 horas con comida, más Tylenol 500–1,000 mg cada 6 horas —puede tomarlos juntos— por 2–3 días. Máximo 3,000 mg de Tylenol al día. Empiece antes de que se pase la anestesia. Use un opioide recetado solo si es necesario.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado, bebe mucho alcohol o su pastilla recetada ya contiene acetaminofén (por ejemplo, Percocet).","Termine el antibiótico; si le sale un sarpullido, suspéndalo y llámenos. No tome alcohol por 24 horas ni mientras tome opioides. Siéntese 1 minuto antes de ponerse de pie.","Náuseas: nada por la boca durante 1 hora; luego tome sorbos de ginger ale o té.","Es normal: moretones (día 2–3), rigidez de la mandíbula, dolor de garganta, bordes de hueso filosos y comisuras secas (use vaselina). Los puntos se disuelven solos; el alvéolo se rellena en aproximadamente 1 mes.","Llámenos si tiene: sangrado que no para con presión; dolor o hinchazón que empeora después del día 3, o dolor pulsátil hacia el oído (alveolitis seca); fiebre de más de 100.4°F (38°C); pus o mal sabor; adormecimiento al día siguiente.","Dificultad para respirar o tragar: llame al 911."],
kea:["Sangi: morde firmi na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal. Si sangi txeu: senta direitu i morde un gaza linpu dobradu, o un saketa di xá pretu moladu, pa 30–60 minutu.","Inxason: jelu na fasi 20 minutu, tira 20, duranti 36 ora; dipôs, kalor úmidu. Inxason ta fika más grandi na dia 2–3. Dormi ku kabesa altu pa 2 noti.","Purmeru 24 ora: ka bu lava boka, ka bu kuspi i ka bu uza palinha. Es kuzas pode tira kuágulu.","Ka bu fuma nen uza vape pa pelo menus 72 ora, midjór 1 simana. Ta aumenta risku di alvéolu seku, ki ta dói txeu.","A partir di dia 2: lava boka divagarinhu ku agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi i óra di bai dormi. Skova ku kuidadu. Enxertu Augma Shield: uza só rémédiu di lava boka ki nu pasa-bu, sen agu ku sal.","Kumida: kumida mol pa 2 simana; nada duru, ki ta stala o ku simenti (nozis, xips, pipoka) pa 3 simana. Kumi proteína, ka bu salta kumida i bebe txeu líkidu.","Dor (adultu): ibuprofénu 400 mg (2 kumprimidu di 200 mg) di 6 en 6 ora ku kumida, i Tylenol 500–1,000 mg di 6 en 6 ora — bu pode toma-s djuntu — pa 2–3 dia. Másimu 3,000 mg di Tylenol pa dia. Kumesa antis di anestezia pasa. Uza opioidi di reseita só si é nesesáriu.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma anti-koagulanti, si bu sta grávida o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu, si bu ta bebe txeu, o si bu rémédiu di reseita dja ten asetaminofénu (pur izénplu Percocet).","Toma antibiótiku ti kaba; si bu tene manxa na pele, para i txoma-nu. Ka bu bebe álkool pa 24 ora nen enkuantu bu ta toma opioidi. Senta 1 minutu antis di labanta.","Nóziu: nada na boka pa 1 ora; dipôs bebe golinhu di ginger ale o xá.","É normal: manxa roxu (dia 2–3), kexada duru, garganta dodu, pontas di osu fínu i kantu di boka seku (poi vazelina). Pontu ta dizolve sozinhu; buraku ta intxi na más o menus 1 mês.","Txoma-nu si: sangi ki ka ta para ku prison; dor o inxason ki ta piora dipôs di dia 3, o dor ki ta latejá pa ladu di orelha (alvéolu seku); febri más di 100.4°F (38°C); pus o gostu mau; dormensia na dia sigínti.","Si bu tene difikuldadi di rispira o di ingoli: txoma 911."],
zh:["出血：用力咬住纱布30分钟。1–2天内有少量渗血属正常现象。出血较多时：坐直，用力咬住折叠的干净纱布或浸湿的红茶包30–60分钟。","肿胀：头36小时在脸颊冷敷，敷20分钟、停20分钟；之后改为湿热敷。肿胀在第2–3天最明显。睡觉时垫高头部，持续2晚。","头24小时：不要漱口、吐口水或用吸管，以免血块脱落。","至少72小时内不要吸烟或吸电子烟，最好1周。吸烟会增加疼痛的干槽症风险。","从第2天起：饭后和睡前用温盐水（1杯水加½茶匙盐）轻轻漱口。轻轻刷牙。植入Augma Shield的：只用处方漱口水，不要用盐水。","饮食：吃软食2周；3周内不要吃硬的、脆的或有籽的食物（坚果、薯片、爆米花）。多吃蛋白质，不要不吃饭，多喝水。","止痛（成人）：布洛芬400毫克（200毫克片剂2片），每6小时一次，随餐服用；加泰诺（Tylenol）500–1,000毫克，每6小时一次。两种药可同时服用，持续2–3天。泰诺每天最多3,000毫克。在麻药消退前开始服用。仅在必要时服用处方阿片类药物。","以下情况不要服用布洛芬：肾病、胃溃疡、服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。以下情况不要服用泰诺：肝病、大量饮酒，或处方药已含对乙酰氨基酚（例如Percocet）。","如开了抗生素，请服完全程；出现皮疹请停药并致电我们。24小时内及服用阿片类药物期间不要饮酒。起身前先坐1分钟。","恶心：1小时内不要经口进食任何东西；之后小口喝姜汁汽水或茶。","正常现象：淤青（第2–3天）、下颌僵硬、喉咙痛、尖锐骨边、嘴角干裂（可涂凡士林）。缝线会自行溶解；拔牙窝约1个月长满。","出现以下情况请致电我们：按压止不住的出血；第3天后疼痛或肿胀加重，或向耳朵方向的跳痛（干槽症）；发烧超过100.4°F（38°C）；有脓或口中异味；第二天仍然麻木。","呼吸或吞咽困难：请拨打911。"]}},
{id:"imp",src:["mcgill"],t:{"en":"After implant, bone graft or sinus lift surgery","es":"Después de implantes, injerto óseo o elevación de seno","kea":"Dipôs di implanti, enxertu di osu o levantamentu di seiu","zh":"种植牙、植骨或上颌窦提升术后须知"},i:{
en:["Bleeding: bite on the gauze for 30 minutes. Oozing for 1–2 days is normal.","Swelling: ice 20 minutes on, 20 off, for 36 hours, then moist heat. Sleep with your head raised for 2 nights.","Do not touch the site with your tongue or fingers, or pull your lip to look.","Diet: do not chew on the implant side for 3–4 weeks, or longer if we tell you. Implants on both sides: soft foods for 3–4 weeks. No hard or crunchy food.","Surgery day: no rinsing or spitting. From the next morning: prescribed rinse (Peridex) twice a day for 30 seconds, plus warm salt water (½ teaspoon in 1 cup) after meals. Brush gently. Augma Shield graft: prescribed rinse only, no salt water.","Denture or flipper: leave it out as much as possible. It must not press on the site. Do not eat with it until we adjust it.","Small sand-like graft granules may come out for a few days. This is normal.","Sinus lift: do not blow your nose for 1 week. Sneeze with your mouth open. No straws. No flying for 2 weeks.","No smoking or vaping for at least 2 weeks — quitting is best. Smoking raises the risk that the implant or graft fails.","Pain (adults): ibuprofen 400 mg (two 200 mg tablets) every 6 hours with food, plus Tylenol 500–1,000 mg every 6 hours — taking them together is fine — for 2–3 days. No more than 3,000 mg of Tylenol a day. Start before the numbness wears off. Use a prescribed opioid only if needed.","Skip ibuprofen with kidney disease, stomach ulcers, a blood thinner, pregnancy, or an aspirin or ibuprofen allergy. Skip Tylenol with liver disease, heavy drinking, or if your prescription pill already contains acetaminophen (for example, Percocet).","Finish any antibiotic. If you get a rash, stop it and call us.","Call us: bleeding that will not stop; pain or swelling worse after day 3; fever; pus; a loose healing cap; exposed graft or membrane; air or fluid passing between your mouth and nose; numbness the next day."],
es:["Sangrado: muerda la gasa por 30 minutos. Es normal un poco de sangrado leve por 1–2 días.","Hinchazón: hielo 20 minutos sí y 20 no por 36 horas; después, calor húmedo. Duerma con la cabeza elevada por 2 noches.","No toque la zona con la lengua ni los dedos, ni jale el labio para mirar.","Dieta: no mastique del lado del implante por 3–4 semanas, o más si se lo indicamos. Implantes en ambos lados: comidas blandas por 3–4 semanas. Nada duro ni crujiente.","Día de la cirugía: no se enjuague ni escupa. Desde la mañana siguiente: enjuague recetado (Peridex) dos veces al día por 30 segundos, más agua tibia con sal (½ cucharadita en 1 taza) después de comer. Cepíllese con cuidado. Injerto Augma Shield: solo el enjuague recetado, sin agua con sal.","Dentadura o puente removible: déjelo fuera lo más posible. No debe presionar la zona. No coma con él hasta que lo ajustemos.","Pueden salir pequeños gránulos del injerto, como arena, por unos días. Es normal.","Elevación de seno: no se suene la nariz por 1 semana. Estornude con la boca abierta. No use popotes. No viaje en avión por 2 semanas.","No fume ni vapee por al menos 2 semanas; lo mejor es dejarlo. Fumar aumenta el riesgo de que fallen el implante o el injerto.","Dolor (adultos): ibuprofeno 400 mg (2 tabletas de 200 mg) cada 6 horas con comida, más Tylenol 500–1,000 mg cada 6 horas —puede tomarlos juntos— por 2–3 días. Máximo 3,000 mg de Tylenol al día. Empiece antes de que se pase la anestesia. Use un opioide recetado solo si es necesario.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado, bebe mucho alcohol o su pastilla recetada ya contiene acetaminofén (por ejemplo, Percocet).","Termine el antibiótico. Si le sale un sarpullido, suspéndalo y llámenos.","Llámenos si tiene: sangrado que no para; dolor o hinchazón que empeora después del día 3; fiebre; pus; un tornillo de cicatrización flojo; injerto o membrana expuestos; paso de aire o líquido entre la boca y la nariz; adormecimiento al día siguiente."],
kea:["Sangi: morde na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal.","Inxason: jelu 20 minutu, tira 20, duranti 36 ora; dipôs, kalor úmidu. Dormi ku kabesa altu pa 2 noti.","Ka bu toka na lugar ku língua o ku dedu, nen ka bu puxa lábiu pa djobe.","Kumida: ka bu mastiga di ladu di implanti pa 3–4 simana, o más si nu fla-bu. Implanti na dos ladu: kumida mol pa 3–4 simana. Nada duru nen ki ta stala.","Dia di sirurjia: ka bu lava boka nen ka bu kuspi. A partir di palmanhan sigínti: rémédiu di lava boka (Peridex) 2 bes pa dia pa 30 sigundu, i agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi. Skova ku kuidadu. Enxertu Augma Shield: só rémédiu di lava boka, sen agu ku sal.","Dentadura o ponti di tira-poi: dexa-l fora más ki bu pode. E ka debe karga riba di lugar. Ka bu kumi ku el ti nu djusta-l.","Pode sai pedasinhu pikinoti di enxertu, sima areia, duranti uns dia. É normal.","Levantamentu di seiu: ka bu asua naris pa 1 simana. Spirra ku boka abertu. Ka bu uza palinha. Ka bu bua di avion pa 2 simana.","Ka bu fuma nen uza vape pa pelo menus 2 simana; midjór é dexa di bes. Fuma ta aumenta risku di implanti o enxertu fadja.","Dor (adultu): ibuprofénu 400 mg (2 kumprimidu di 200 mg) di 6 en 6 ora ku kumida, i Tylenol 500–1,000 mg di 6 en 6 ora — bu pode toma-s djuntu — pa 2–3 dia. Másimu 3,000 mg di Tylenol pa dia. Kumesa antis di anestezia pasa. Uza opioidi di reseita só si é nesesáriu.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma anti-koagulanti, si bu sta grávida o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu, si bu ta bebe txeu, o si bu rémédiu di reseita dja ten asetaminofénu (pur izénplu Percocet).","Toma antibiótiku ti kaba. Si bu tene manxa na pele, para i txoma-nu.","Txoma-nu si: sangi ki ka ta para; dor o inxason ki ta piora dipôs di dia 3; febri; pus; tanpa di kikatrizason mole; enxertu o membrana diskubertu; ar o líkidu ta pasa entri boka ku naris; dormensia na dia sigínti."],
zh:["出血：咬住纱布30分钟。1–2天内有少量渗血属正常现象。","肿胀：头36小时冷敷，敷20分钟、停20分钟；之后改为湿热敷。睡觉时垫高头部，持续2晚。","不要用舌头或手指碰触伤口，也不要拉开嘴唇查看。","饮食：3–4周内不要用种植体一侧咀嚼，如我们另有指示则更久。两侧都有种植体：吃软食3–4周。不要吃硬的或脆的食物。","手术当天：不要漱口或吐口水。从第二天早上起：每天2次用处方漱口水（Peridex）含漱30秒，饭后加用温盐水（1杯水加½茶匙盐）漱口。轻轻刷牙。植入Augma Shield的：只用处方漱口水，不要用盐水。","假牙或临时活动牙：尽量不戴，不能压到手术部位。在我们调整好之前，不要戴着它吃东西。","几天内可能会有像细沙一样的植骨颗粒掉出来，这是正常的。","上颌窦提升术：1周内不要擤鼻涕。打喷嚏时张开嘴。不要用吸管。2周内不要乘坐飞机。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体或植骨失败的风险。","止痛（成人）：布洛芬400毫克（200毫克片剂2片），每6小时一次，随餐服用；加泰诺（Tylenol）500–1,000毫克，每6小时一次。两种药可同时服用，持续2–3天。泰诺每天最多3,000毫克。在麻药消退前开始服用。仅在必要时服用处方阿片类药物。","以下情况不要服用布洛芬：肾病、胃溃疡、服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。以下情况不要服用泰诺：肝病、大量饮酒，或处方药已含对乙酰氨基酚（例如Percocet）。","如开了抗生素，请服完全程。出现皮疹请停药并致电我们。","出现以下情况请致电我们：出血不止；第3天后疼痛或肿胀加重；发烧；有脓；愈合帽松动；植骨材料或膜外露；口腔与鼻腔之间有空气或液体相通；第二天仍有麻木。"]}},
{id:"arch",src:["mcgill"],t:{"en":"After full-arch (fixed teeth same day) surgery","es":"Después de cirugía de arcada completa (dientes fijos el mismo día)","kea":"Dipôs di sirurjia di arkada interu (denti fixu na mesmu dia)","zh":"全口种植（当天固定牙）术后须知"},i:{
en:["First 2 days: gauze, ice and head raised, as for any oral surgery.","Your new teeth are temporary and fixed in place. Do not try to remove them.","Diet: liquids and very soft food for the first 2 weeks, then fork-tender food until we clear you (usually about 3 months). Do not bite into hard food with your front teeth.","Clean under the bridge twice a day with a water flosser on its lowest setting, starting about day 7. Use the rinse we prescribed.","Do not smoke or vape for at least 2 weeks. Quitting for good is best. Smoking raises the risk that the implants fail.","Pain (adults): ibuprofen 400 mg (two 200 mg tablets) every 6 hours with food, plus Tylenol 500–1,000 mg every 6 hours — taking them together is fine — for 2–3 days. No more than 3,000 mg of Tylenol a day. Start before the numbness wears off. Use a prescribed opioid only if needed.","Skip ibuprofen with kidney disease, stomach ulcers, a blood thinner, pregnancy, or an aspirin or ibuprofen allergy. Skip Tylenol with liver disease, heavy drinking, or if your prescription pill already contains acetaminophen (for example, Percocet).","Your speech and bite will feel different for a few weeks. This is normal. Wear your night guard every night if we gave you one.","Call us: a loose, cracked or moving bridge; a bite that feels uneven or hurts on one spot; swelling, pus or fever.","Keep every follow-up visit. They protect the implants while they heal."],
es:["Primeros 2 días: gasa, hielo y cabeza elevada, como en cualquier cirugía oral.","Sus dientes nuevos son provisionales y están fijos. No intente quitarlos.","Dieta: líquidos y comida muy blanda las primeras 2 semanas; después, comida que se pueda partir con un tenedor hasta que le demos el alta (por lo general unos 3 meses). No muerda comida dura con los dientes de enfrente.","Limpie debajo del puente dos veces al día con un irrigador de agua en su nivel más bajo, a partir del día 7 aproximadamente. Use el enjuague recetado.","No fume ni use cigarrillos electrónicos (vapeo) por al menos 2 semanas. Lo mejor es dejar de fumar por completo. Fumar aumenta el riesgo de que fallen los implantes.","Dolor (adultos): ibuprofeno 400 mg (2 tabletas de 200 mg) cada 6 horas con comida, más Tylenol 500–1,000 mg cada 6 horas —puede tomarlos juntos— por 2–3 días. Máximo 3,000 mg de Tylenol al día. Empiece antes de que se pase la anestesia. Use un opioide recetado solo si es necesario.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado, bebe mucho alcohol o su pastilla recetada ya contiene acetaminofén (por ejemplo, Percocet).","Su forma de hablar y su mordida se sentirán diferentes por unas semanas; es normal. Use su protector nocturno todas las noches si le dimos uno.","Llámenos si: el puente está flojo, roto o se mueve; la mordida se siente dispareja o duele en un punto; tiene hinchazón, pus o fiebre.","Asista a todas sus citas de control. Protegen los implantes mientras sanan."],
kea:["Purmeru 2 dia: gaza, jelu i kabesa altu, sima na kualker sirurjia di boka.","Bu denti novu é provizóriu i é fixu. Ka bu tenta tira-s.","Kumida: líkidu i kumida mutu mol duranti 2 purmeru simana; dipôs, kumida ki garfu ta parti fásil ti nu da-bu alta (normalmenti uns 3 mês). Ka bu morde kumida duru ku denti di frenti.","Linpa baxu di ponti 2 bes pa dia ku un irigador di agu na nível más baxu, a partir más o menus di dia 7. Uza rémédiu di lava boka ki nu pasa-bu.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 2 simana. Midjór é dexa di fuma di bes. Fuma ta aumenta risku di implanti fadja.","Dor (adultu): ibuprofénu 400 mg (2 kumprimidu di 200 mg) di 6 en 6 ora ku kumida, i Tylenol 500–1,000 mg di 6 en 6 ora — bu pode toma-s djuntu — pa 2–3 dia. Másimu 3,000 mg di Tylenol pa dia. Kumesa antis di anestezia pasa. Uza opioidi di reseita só si é nesesáriu.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma anti-koagulanti, si bu sta grávida o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu, si bu ta bebe txeu, o si bu rémédiu di reseita dja ten asetaminofénu (pur izénplu Percocet).","Bu manera di papia i bu mordida ta xinti diferenti pa algun simana; é normal. Uza bu protetor di noti tudu noti si nu da-bu un.","Txoma-nu si: ponti sta mole, rakadu o ta mexe; mordida ta xinti dizigual o ta dói na un pontu; inxason, pus o febri.","Ben pa tudu bu konsulta di kontrolu. Es ta proteje implantis enkuantu es ta kura."],
zh:["头2天：与其他口腔手术一样，咬纱布、冷敷并垫高头部。","您的新牙是临时的，并且是固定的。不要试图自行取下。","饮食：头2周吃流质和非常软的食物；之后吃用叉子就能轻松分开的软食，直到我们通知您可以恢复正常饮食（通常约3个月）。不要用前牙咬硬的食物。","大约从第7天起，每天2次用冲牙器（调到最低档）清洁牙桥下方。使用我们开的漱口水。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体失败的风险。","止痛（成人）：布洛芬400毫克（200毫克片剂2片），每6小时一次，随餐服用；加泰诺（Tylenol）500–1,000毫克，每6小时一次。两种药可同时服用，持续2–3天。泰诺每天最多3,000毫克。在麻药消退前开始服用。仅在必要时服用处方阿片类药物。","以下情况不要服用布洛芬：肾病、胃溃疡、服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。以下情况不要服用泰诺：肝病、大量饮酒，或处方药已含对乙酰氨基酚（例如Percocet）。","几周内您说话和咬合的感觉会有所不同，这是正常的。如果我们给了您夜间护牙套，请每晚佩戴。","出现以下情况请致电我们：牙桥松动、破裂或移动；咬合不平或某一点疼痛；肿胀、有脓或发烧。","请按时参加每次复诊。复诊可在愈合期间保护种植体。"]}},
{id:"presed",src:["fast","glp1"],t:{"en":"Before IV sedation","es":"Antes de la sedación intravenosa","kea":"Antis di sedason na veia","zh":"静脉镇静前须知"},i:{
en:["Food: no solid food, milk or gum for 8 hours before your appointment.","Clear liquids are OK until 2 hours before: water, apple juice, black coffee or tea (no milk). Then nothing.","Medicines: ask us which of your usual medicines to take, and take them with a sip of water. Tell us if you take a blood thinner or a weekly diabetes or weight-loss injection (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity).","No smoking for 12 hours and no cannabis (smoked, vaped or edible) for 3 days before.","A responsible adult must come with you, stay in the office, and drive you home. No driving or machinery until the next morning.","Wear loose sleeves that roll up above the elbow, and flat shoes. Remove contacts, jewelry and dentures. No nail polish or heavy makeup.","If you get sick before your appointment (cold, fever, vomiting), call us."],
es:["Comida: nada de comida sólida, leche ni chicle durante 8 horas antes de su cita.","Puede tomar líquidos claros hasta 2 horas antes: agua, jugo de manzana, café o té negro (sin leche). Después, nada.","Medicinas: pregúntenos cuáles de sus medicinas habituales debe tomar y tómelas con un sorbo de agua. Avísenos si toma un anticoagulante o usa una inyección semanal para la diabetes o para bajar de peso (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity).","No fume por 12 horas ni use cannabis (fumado, vapeado o comestible) por 3 días antes.","Un adulto responsable debe acompañarlo, quedarse en la oficina y llevarlo a casa. No maneje ni use maquinaria hasta la mañana siguiente.","Use mangas holgadas que se puedan subir por encima del codo y zapatos bajos. Quítese lentes de contacto, joyas y dentaduras. Sin esmalte de uñas ni mucho maquillaje.","Si se enferma antes de su cita (resfriado, fiebre, vómitos), llámenos."],
kea:["Kumida: nada di kumida sólidu, leti o txikleti duranti 8 ora antis di bu konsulta.","Líkidu klaru é dretu ti 2 ora antis: agu, sumu di masan, kafé o xá pretu (sen leti). Dipôs, nada.","Rémédiu: purgunta-nu kal di bu rémédiu di kada dia ki bu debe toma, i toma-s ku un golinhu di agu. Fla-nu si bu ta toma anti-koagulanti o un injeson di simana pa diabetis o pa perde pézu (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity).","Ka bu fuma pa 12 ora i ka bu uza kanábis (fumadu, vape o kumida) pa 3 dia antis.","Un adultu rasponsável ten ki ben ku bu, fika na ofisina i leba-bu kasa. Ka bu kondus nen uza mákina ti palmanhan sigínti.","Bisti manga largu ki ta subi riba di kotovelu i sapatu baxu. Tira lenti di kontatu, joia i dentadura. Sen verniz di unha nen txeu maquiaji.","Si bu fika duenti antis di bu konsulta (konstipason, febri, vómitu), txoma-nu."],
zh:["饮食：预约前8小时内不要吃固体食物、喝牛奶或嚼口香糖。","术前2小时之前可以喝清澈的液体：水、苹果汁、黑咖啡或清茶（不加牛奶）。之后什么都不要喝。","药物：请问我们平时的药物中哪些要照常服用，并用一小口水送服。如果您服用抗凝血药，或每周注射一次治疗糖尿病或减重的药物（Ozempic、Wegovy、Mounjaro、Zepbound、Trulicity），请告诉我们。","术前12小时内不要吸烟；术前3天内不要使用大麻（吸食、电子烟或食用）。","必须由一名负责任的成年人陪同前来，留在诊所并开车送您回家。到第二天早上之前不要开车或操作机器。","穿袖子能卷到手肘以上的宽松衣服和平底鞋。取下隐形眼镜、首饰和假牙。不要涂指甲油或浓妆。","如果您在预约前生病（感冒、发烧、呕吐），请致电我们。"]}},
{id:"sed",src:["hsdm"],t:{"en":"After IV sedation","es":"Después de la sedación intravenosa","kea":"Dipôs di sedason na veia","zh":"静脉镇静后须知"},i:{
en:["A responsible adult must take you home and stay with you for the rest of the day (at least 4 hours).","Until tomorrow morning: no driving, machinery, cooking on the stove, or important decisions or signing documents. No alcohol for 24 hours. Do not drive while taking opioid pain medicine.","Do not care for young children alone today.","Start with sips of clear fluids, then light food. For nausea, take small sips; ginger ale can help.","Rest with your head raised. You may feel sleepy or forgetful today.","A small bruise at the IV site is normal. Call us for a red, painful streak or swelling in the arm.","Call 911: trouble breathing, cannot be woken, or chest pain."],
es:["Un adulto responsable debe llevarlo a casa y quedarse con usted el resto del día (al menos 4 horas).","Hasta mañana por la mañana: no maneje, no use maquinaria, no cocine en la estufa, ni tome decisiones importantes o firme documentos. No tome alcohol por 24 horas. No maneje mientras tome analgésicos opioides.","No cuide solo a niños pequeños hoy.","Empiece con sorbos de líquidos claros y luego comida ligera. Si tiene náuseas, tome sorbos pequeños; el ginger ale puede ayudar.","Descanse con la cabeza elevada. Puede sentirse con sueño u olvidadizo hoy.","Es normal un pequeño moretón donde estuvo el suero. Llámenos si hay una línea roja y dolorosa o hinchazón en el brazo.","Llame al 911 si: le cuesta respirar, no se puede despertar o tiene dolor en el pecho."],
kea:["Un adultu rasponsável ten ki leba-bu kasa i fika ku bu resta di dia (pelo menus 4 ora).","Ti amanhan di palmanhan: ka bu kondus, ka bu uza mákina, ka bu kuzinha na fogon, nen ka bu toma disizon importanti o sina dokumentu. Ka bu bebe álkool pa 24 ora. Ka bu kondus enkuantu bu sta ta toma rémédiu pa dor opioidi.","Oji ka bu toma konta di mininu pikinoti sozinhu.","Kumesa ku golinhu di líkidu klaru, dipôs kumida leve. Si bu sta ku nóziu, bebe golinhu pikinoti; ginger ale pode djuda.","Diskansa ku kabesa altu. Oji bu pode xinti ku sonu o skesedu.","Un manxa roxu pikinoti na lugar di soru é normal. Txoma-nu si bu tene un risku burmedju ki ta dói o inxason na brasu.","Txoma 911 si: difikuldadi di rispira, ka ta kunsigi korda, o dor na pextu."],
zh:["必须由一名负责任的成年人送您回家，并在当天余下时间陪伴您（至少4小时）。","到明天早上之前：不要开车、操作机器、用炉灶做饭，也不要做重要决定或签署文件。24小时内不要饮酒。服用阿片类止痛药期间不要开车。","今天不要独自照顾幼儿。","先小口喝清澈的液体，再吃清淡的食物。如有恶心，请小口慢喝；姜汁汽水可能有帮助。","休息时垫高头部。今天您可能会感到困倦或健忘。","静脉输液处有小块淤青是正常的。如手臂出现发红、疼痛的条纹或肿胀，请致电我们。","请拨打911：呼吸困难、叫不醒，或胸痛。"]}}];
const HO_FOR={extraction:'ext',ao:'ext',implant:'imp',graft:'imp',sinus:'imp',arch:'arch',sed:'sed'};
const HO_NEUTRAL='Oral & Maxillofacial Surgery — Patient Instructions';
function hoText(h,l){if(colleague())return`${HO_NEUTRAL}\n\n${h.t[l]}\n\n${h.i[l].map(x=>'• '+x.replace('[office phone]','your surgeon’s office')).join('\n')}`;
 const ph=HO_SITES[S.site||'young'].ph;return `${h.t[l]}\n\n${h.i[l].map(x=>'• '+x.replace('[office phone]',ph)).join('\n')}\n\n${HO_UI[l].ph}: ${ph}\n\n${HO_UI[l].rv.replace('{biz}',HO_SITES[S.site||'young'].n)}\n${HO_SITES[S.site||'young'].u}`}
function hoHTML(){const l=S.lang||'en';
 return `${HANDOUTS_LIVE?'':'<div class="red"><b>DRAFT — pending Dr. Young’s review.</b> Not linked in the app yet. Approve to make them visible in the app.</div>'}
 ${colleague()?`<div class="lab" id="ho-neutral" style="margin-bottom:8px">${esc(HO_NEUTRAL)}</div>`:`<div class="toggles" id="ho-site" style="margin-bottom:6px">${[['young','Dr. Young'],['bayside','Bayside']].map(([c,n])=>`<button class="tg${(S.site||'young')===c?' on':''}" data-site="${c}" aria-pressed="${(S.site||'young')===c}">${n}</button>`).join('')}</div>`}
 <div class="toggles" style="margin-bottom:10px">${HO_LANGS.map(([c,n])=>`<button class="tg${l===c?' on':''}" data-lang="${c}" lang="${c}" aria-pressed="${l===c}">${n}</button>`).join('')}</div>
 ${HO.map(h=>`<details class="box" id="ho-${h.id}"${S.hoOpen===h.id?' open':''}><summary>${esc(h.t[l])}</summary><div class="inner look"><ul>${h.i[l].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="go" data-share="${h.id}">${HO_UI[l].sh} ↗</button> <span class="small">${h.src.map(srcLink).join(' · ')}</span></div></details>`).join('')}
 <textarea id="copybox" class="copybox" hidden aria-label="Handout text"></textarea><p class="caveat">Plain-language drafts written from published patient instructions; edit to match your practice.</p>`}
async function shareHO(id,btn){const h=HO.find(x=>x.id===id),l=S.lang||'en',t=hoText(h,l);
 try{if(navigator.share){await navigator.share({title:h.t[l],text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t);btn.textContent=HO_UI[l].cp}catch(e){showCopy(t)}}

/* ===== Feedback (hidden until an address is set) ===== */
const FEEDBACK='zeniths-raised-7a@icloud.com';
function fbHTML(where){if(!FEEDBACK)return'';const sub=encodeURIComponent(`OMS Compass v${VER} · ${where}`),body=encodeURIComponent(`Module/section: ${where}\nVersion: v${VER}\n\nWhat looks wrong or is missing:\n\n(No patient identifiers, please.)`);
 return`<p class="caveat"><a href="mailto:${FEEDBACK}?subject=${sub}&body=${body}">Report a problem or suggest a change ↗</a></p>`}

/* ===== Search across modules, SOS and Ref ===== */
let IDX=null;
function idx(){if(IDX)return IDX;const strip=t=>String(t).replace(/<[^>]+>/g,' ');
 IDX=[...MODS.map(m=>({k:'mod',id:m.id,t:m.title,sub:m.g,x:[m.title,m.d,m.red||'',m.caveat,JSON.stringify(m.nodes),JSON.stringify(m.look||'')].join(' ').toLowerCase()})),
  ...EMS.map(e=>({k:'em',id:e.id,t:e.t,sub:'SOS',x:[e.t,e.s,strip(e.steps().join(' '))].join(' ').toLowerCase()})),
  ...REF.map(r=>({k:'ref',id:r.t,t:r.t,sub:'Ref',x:[r.t,r.k,r.i.join(' ')].join(' ').toLowerCase()})),
  ...(HANDOUTS_LIVE?HO.map(h=>({k:'ho',id:h.id,t:h.t.en,sub:'Patient handout',x:(h.t.en+' '+h.i.en.join(' ')).toLowerCase()})):[])];return IDX}
function hitsHTML(q){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);const fh=findHitsHTML(q);
 const hits=idx().filter(e=>terms.every(t=>e.x.includes(t))).sort((a,b)=>(terms.every(t=>b.t.toLowerCase().includes(t))-terms.every(t=>a.t.toLowerCase().includes(t))));
 if(!hits.length)return fh||NOMATCH(q);
 return`${fh}${fh?'<div class="lab group">Modules · SOS · reference</div>':''}<div class="mods">${hits.slice(0,25).map(h=>`<button class="mod" ${h.k==='mod'?`data-open="${h.id}"`:h.k==='em'?`data-em="${h.id}"`:h.k==='ho'?`data-ho="${h.id}"`:`data-reff="${esc(h.id)}"`}><div><b>${esc(h.t)}</b><span>${esc(h.sub)}</span></div><i aria-hidden="true">›</i></button>`).join('')}</div>`}
/* ===== Basis labels (descriptive, not evidence grades) ===== */
const BASIS={gl:'Guideline / label',ev:'Evidence-informed',au:'Author’s practice',un:'Unverified draft'};
const BASIS_RANK={gl:0,ev:1,au:2,un:3};
const SRC_GL=['acc','chest','glp1','glp1k','aapdsed','aapdla','palsca','palsbr','flumaped','glucaped','bupilabel','giai','parcare','aha25','aha25s','anaph','brady','adahypo','asaps','fast','asamon','preg','nsaidpreg','orn','ada24','atls','dysp','aha','adaPro','sdcep','sdcepFull','sdcepDoac','aaoms','third','iti18','iti13','adaAbx','sdcepAbs','oralca','rcs','bmj','choke','aaem','aha26','efp','aapdav','iadtfx','aae26','dctmd','dcscore','asthma','apsf','nalox','fluma','d50','ntg','dant','epipen','sglt2','sux','wfhdent','kohan','tetcdc'];
const SRC_AU=['mysed','fa6','mynotes','lect','board'];
const SRC_UN=['binder'];
function basisOf(keys,text){
 const ks=(keys||[]).filter(Boolean);let b=ks.length?'gl':'un';
 ks.forEach(k=>{const v=SRC_GL.includes(k)?'gl':SRC_AU.includes(k)?'au':SRC_UN.includes(k)?'un':'ev';if(BASIS_RANK[v]>BASIS_RANK[b])b=v});
 if(/\[verify/.test(text||''))b='un';return b}
function basisChip(b){return`<span class="bas b-${b}" title="Descriptive label, not an evidence grade">${esc(BASIS[b])}</span>`}
function reviewLine(keys){const ks=(keys||[]).filter((k,i,a)=>k&&SRC[k]&&a.indexOf(k)===i);
 const chk=ks.filter(k=>SRC[k].chk).map(k=>`${SRC[k].n.split(' · ')[0]} ${SRC[k].chk}`);
 return`Source check: ${chk.length?chk.join('; ')+(chk.length<ks.length?'; others not recorded':''):'dates not recorded'}. Independent clinician review: not recorded.`}

/* ===== Findings: medication, lab or history → surgical implications =====
 One source of truth: findings reuse module nodes (link) and SRC. Patient facts live in S.pf (memory only).
 Shared context facts: proc, anes, urg, age. Unknown ('u') is never read as normal or negative. */
const DISP={proceed:['Proceed','ok'],modify:['Proceed with changes','mod'],investigate:['Verify first','inv'],refer:['Refer / change setting','ref'],defer:['Defer elective care','def']};
const DRANK={proceed:0,modify:1,investigate:2,refer:3,defer:4};
const CTXQ={
 proc:{q:'Planned procedure',opts:[['none','No bleeding expected (exam, impressions, infiltration)'],['low','1–3 simple extractions, I&D, small wound'],['high','Surgical/complex or >3 extractions, implants, grafts, biopsy, flaps'],['major','Major surgery (orthognathic, resection, open fracture)']],help:'Bleeding-risk tiers follow SDCEP 2022.'},
 anes:{q:'Anesthesia',opts:[['la','Local only'],['sed','IV sedation'],['ga','General anesthesia']]},
 urg:{q:'Urgency',opts:[['el','Elective'],['urg','Urgent (infection, pain)']]}};
const CTXL={proc:{none:'no bleeding expected',low:'low bleeding risk (1–3 simple extractions)',high:'higher bleeding risk (surgical/implant/graft/biopsy)',major:'major surgery'},anes:{la:'local only',sed:'IV sedation',ga:'general anesthesia'},urg:{el:'elective',urg:'urgent'}};
const BLEEDP=['low','high','major'];
const has=v=>v!==undefined&&v!==''&&v!=='u';
const YN=[['y','Yes'],['n','No']];
const pfNum=k=>{const v=String(S.pf[k]??'').trim();return /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(v)&&Number.isFinite(+v)?+v:null};

/* Shared rule helpers */
function needCtx(p,c,k,why){if(!has(c[k])){p.miss.push(`${CTXQ[k].q}${why?' — '+why:''}`);p.prov=true;return false}return true}
function mk(){return{d:'proceed',prov:false,act:'',steps:[],esc:[],miss:[],assume:[],basis:'gl',src:[],tags:[]}}
const BLEED_ESC='Bleeding not controlled by firm pressure and local measures → Post-op bleeding pathway. Airway threat or expanding floor-of-mouth swelling → 911.';

const FIND=[
{id:'doac',kind:'Medication',t:'DOAC (apixaban, rivaroxaban, dabigatran, edoxaban)',cls:'Direct oral anticoagulant',
 syn:['apixaban','eliquis','rivaroxaban','xarelto','dabigatran','pradaxa','edoxaban','savaysa','lixiana','doac','noac','direct oral anticoagulant','anticoagulant','blood thinner'],
 preset:{apixaban:{doacAg:'api'},eliquis:{doacAg:'api'},rivaroxaban:{doacAg:'riv'},xarelto:{doacAg:'riv'},dabigatran:{doacAg:'dab'},pradaxa:{doacAg:'dab'},edoxaban:{doacAg:'edo'},savaysa:{doacAg:'edo'},lixiana:{doacAg:'edo'}},
 what:['More oozing after surgery; local hemostasis matters more than stopping the drug.','Stopping a DOAC raises thrombotic risk. Continue it for dentoalveolar surgery (author’s practice; SDCEP retimes one dose for higher-risk work).','Analgesia: acetaminophen rather than NSAIDs.'],
 ctx:['proc'],
 qs:[{k:'doacAg',q:'Which DOAC?',opts:[['api','Apixaban (Eliquis) · twice daily'],['dab','Dabigatran (Pradaxa) · twice daily'],['riv','Rivaroxaban (Xarelto) · once daily'],['edo','Edoxaban (Savaysa) · once daily']]},
  {k:'doacTime',q:'Once-daily dose taken…',opts:[['am','Morning'],['pm','Evening']],when:()=>colleague()&&['riv','edo'].includes(S.pf.doacAg)&&S.pf.proc==='high'},
  {k:'ap',q:'Also on an antiplatelet (including OTC aspirin)?',opts:YN,when:()=>BLEEDP.includes(S.pf.proc)}],
 link:[['preop','nBleed'],['bleed',null]],
 plan(c){const p=mk();p.src=['sdcepFull'];p.esc=[BLEED_ESC];
  if(!needCtx(p,c,'proc','major surgery is planned with the prescriber')){p.d='modify';p.act='Confirm the planned procedure before choosing a DOAC timing plan.';return p}
  if(c.proc==='none'){p.act='No change. Treatment unlikely to cause bleeding.';return p}
  p.steps.push('Treat early in the day; limit the first treatment area.',HEMO,'Analgesia: acetaminophen rather than NSAIDs (SDCEP).');
  if(c.proc==='low'){p.act='Continue without interruption.'}
  else if(c.proc==='high'&&!colleague()){p.d='modify';p.basis='au';p.author='doac';p.src=['chest','sdcepFull','sdcepDoac'];
   p.act='Continue the DOAC without interruption (author’s protocol). Rely on the local hemostatic bundle.';
   p.steps.push('Stage multiple extractions where possible.')}
  else if(c.proc==='high'){p.d='modify';p.src=['sdcepDoac','sdcepFull'];
   const ag=c.doacAg,bid=['api','dab'].includes(ag),qd=['riv','edo'].includes(ag);
   const BID='Twice-daily agent: skip the morning dose; take the evening dose at the usual time, no earlier than 4 h after hemostasis.',
    AM='Once-daily, taken in the morning: delay that dose until 4 h after hemostasis; next dose as usual.',
    PM='Once-daily, taken in the evening: no change; that day’s dose at the usual time, no earlier than 4 h after hemostasis.';
   if(bid)p.act=BID;else if(qd&&c.doacTime==='am')p.act=AM;else if(qd&&c.doacTime==='pm')p.act=PM;
   else{p.prov=true;p.act='Retime one dose (SDCEP); the change depends on the agent and dosing time.';
    if(!has(ag))p.miss.push('Which DOAC (twice- vs once-daily)');else p.miss.push('Morning vs evening dosing');p.steps.unshift(BID,AM,PM)}
   p.steps.push('One-dose timing change, not a stop. Confirm with the patient; ask the prescriber if unsure.','Stage multiple extractions where possible.')}
  else{p.d='refer';p.src=['chest','allyn'];p.basis='gl';p.act='Plan any interruption with the prescriber; timing depends on agent and renal function.';p.miss.push('Renal function (CrCl), if interruption is planned');p.steps=['Heparin bridging is generally harmful; reserve it for specific high-risk cases (2024 AHA/ACC).']}
  if(c.ap==='y'){p.d=DRANK[p.d]<2?'investigate':p.d;p.tags.push('combo');p.steps.unshift('Anticoagulant + antiplatelet: higher bleeding risk. Consult the prescriber about the combination before procedures likely to bleed (SDCEP §9).');if(!p.src.includes('sdcepFull'))p.src.push('sdcepFull')}
  else if(!has(c.ap)&&BLEEDP.includes(c.proc)){p.miss.push('Antiplatelet co-therapy, including OTC aspirin');p.prov=true}
  return p}},

{id:'warfarin',kind:'Medication',t:'Warfarin (Coumadin, Jantoven)',cls:'Vitamin K antagonist',
 syn:['warfarin','coumadin','jantoven','vka','vitamin k antagonist'],
 what:['Bleeding risk tracks the INR; dental surgery proceeds without interruption when a recent INR is below 3.5.','INR <3.5 is the author’s threshold, stricter than SDCEP’s <4 — not a general lab cutoff.','Analgesia: acetaminophen rather than NSAIDs.'],
 ctx:['proc'],
 qs:[{k:'inr',q:'Most recent INR',type:'num',unit:'INR (ratio, no unit)',mode:'decimal',when:()=>S.pf.proc!=='none'},
  {k:'inrAge',q:'INR measured…',opts:[['d1','Within 24 h'],['d3','25–72 h ago'],['old','More than 72 h ago']],when:()=>S.pf.proc!=='none'},
  {k:'stable',q:'Stable? No weekly INR checks and no INR >4 in the last 2 months',opts:YN,when:()=>S.pf.inrAge==='d3'&&S.pf.proc!=='none'},
  {k:'ap',q:'Also on an antiplatelet (including OTC aspirin)?',opts:YN,when:()=>BLEEDP.includes(S.pf.proc)}],
 link:[['preop','nBleed'],['bleed',null]],
 plan(c){const p=mk();p.src=['sdcepFull'];p.esc=[BLEED_ESC];
  if(!needCtx(p,c,'proc','decides whether an INR is needed')){p.d='investigate';p.act='Continue warfarin. Get a recent INR before any procedure likely to bleed.';return p}
  if(c.proc==='none'){p.act='No change. Treatment unlikely to cause bleeding.';return p}
  const v=pfNum('inr'),MX=inrMax(),au=!colleague();
  if(c.inr==='u'){p.d='investigate';p.prov=true;p.act='INR unknown: not assumed in range. Get an INR within 24 h of surgery (72 h if stable).';p.miss.push('INR value (unknown)');return p}
  if(c.inr!==undefined&&c.inr!==''&&(v==null||v<0.5)){p.d='investigate';p.prov=true;p.act='INR entry is not a usable number (below 0.5 or not numeric). Re-enter it.';p.miss.push('Valid INR value');return p}
  if(v==null){p.d='investigate';p.prov=true;p.act='Get an INR, ideally within 24 h of surgery (up to 72 h if stable).';p.miss.push('INR value and date');return p}
  if(v>=10){p.d='refer';p.prov=true;p.tags.push('bleedrisk');p.act=`INR ${v}: treat as possibly real — verify urgently today. No surgery. Contact the anticoagulation clinic or prescriber now; ask about bleeding.`;p.steps=['Repeat or confirm the result with the lab the same day (a typo or sample error is possible, but do not assume one).','Active bleeding, head injury or very high INR with symptoms: emergency department. [verify: reversal thresholds per CHEST VKA guidance]'];p.miss.push('Urgent verification of INR '+v);return p}
  if(v>=MX){p.d='defer';p.basis=au?'au':'gl';if(au)p.author='inr';p.act=`INR ${v} (≥${MX}): delay invasive treatment until INR is below ${MX}. Inform the anticoagulation clinic or prescriber.`;p.steps=[au?'Author’s threshold 3.5; SDCEP allows dental treatment below 4.':'SDCEP threshold (Colleague mode).','Urgent need: refer to a hospital or secondary-care setting.'];if(v>=5)p.steps.unshift('INR ≥5: contact the prescriber today (dose review). [verify]');return p}

  const fresh=c.inrAge==='d1'||(c.inrAge==='d3'&&c.stable==='y');
  if(!fresh){p.d='investigate';p.prov=!has(c.inrAge)||(c.inrAge==='d3'&&!has(c.stable));
   p.act=`INR ${v} is below ${MX}, but ${!has(c.inrAge)?'its date is not entered':c.inrAge==='old'?'it is more than 72 h old':'it is 25–72 h old in a patient not confirmed stable'}. Repeat within 24 h.`;
   if(!has(c.inrAge))p.miss.push('Date of the INR');if(c.inrAge==='d3'&&!has(c.stable))p.miss.push('INR stability (weekly checks? INR >4 in 2 months?)');return p}

{id:'plt',kind:'Lab',t:'Platelet count (thrombocytopenia)',cls:'Hematology lab',

const copyState=v=>JSON.parse(JSON.stringify(v));
function withPatientState(patch,fn){

/* An exclusion suppresses advice; it does not invent a replacement prescription. */
function reconcilePlans(raw,A){
 const P=raw.map(({f,p})=>({f,p:{...p,steps:[...p.steps],miss:[...p.miss],src:[...p.src]}})),suppressed=[],miss=[],conf=[];
 const nsaid=A.includes('renal')||A.includes('tx')||A.includes('bleeddx')||A.some(id=>ANTITHROMB.includes(id));
 const reason=nsaid?'Existing kidney, transplant, bleeding-disorder or antithrombotic precautions take precedence over routine NSAID advice.':'';
 const a=ageNum(),bupiRestricted=a==null||a<12,artRestricted=a==null||a<4;
 for(const row of P){
  const keep=(text,part)=>{
   let why='',src=[],raise=false;
   if(nsaid&&/scheduled ibuprofen|ibuprofen \+|NSAID first.line/i.test(text)&&!/avoid|rather than|no aspirin|only if/i.test(text)){why=reason;src=A.includes('renal')?['nkfpain']:A.includes('bleeddx')?['wfhdent']:['sdcepFull'];raise=true}
   /* Label age limits only withhold the restricted drug; the remaining steps stand, so no disposition change. */
   if(/bupivacaine/i.test(text)&&bupiRestricted){why=a==null?'Age not entered; bupivacaine option withheld (label: not under age 12). Enter age to show it.':'Existing local-anesthetic age restriction excludes dental bupivacaine below age 12.';src=['aapdla']}
   if(/articaine/i.test(text)&&artRestricted){why=a==null?'Age not entered; articaine option withheld (label: not under age 4). Enter age to show it.':'Existing local-anesthetic age restriction excludes articaine below age 4.';src=['aapdla']}
   if(!why)return true;
   suppressed.push({fid:row.f.id,text,part,reason:why,src});
   if(!row.p.src.includes(src[0]))row.p.src.push(...src);
   if(raise){miss.push('Confirm a patient-specific alternative to the suppressed advice: '+row.f.t);conf.push({t:why+' Agree an alternative before finalizing.',raise:'investigate',src:src[0]})}
   return false;
  };
  if(!keep(row.p.act,'action'))row.p.act='The source action conflicts with another entered precaution. Agree a patient-specific plan before proceeding.';
  row.p.steps=row.p.steps.filter(text=>keep(text,'step'));
 }
 return{P,suppressed,miss:[...new Set(miss)],conf:conf.filter((c,i,a)=>a.findIndex(x=>x.t===c.t)===i)};
}
function sectionFor(id,text){
 if(/bleeding not controlled|follow.up|recheck|reassess|contact.*if|non.healing|after.hours/i.test(text))return 'Follow-up / escalation';
 if(/analges|ibuprofen|acetaminophen|NSAID|opioid|buprenorphine|tablets|maintenance dose/i.test(text))return 'Medication / analgesia';
 if(/sedat|anesthe|airway|aspiration|capnography|fasting|oral cover|parenteral|induction/i.test(text)||['glp1','steroid','cied','epix'].includes(id))return 'Anesthesia / monitoring';
 return 'Procedure / setting';
}
function planSections(P){const sections={};
 for(const {f,p} of P)for(const [text,escalation] of [[p.act,false],...p.steps.map(x=>[x,false]),...p.esc.map(x=>[x,true])]){
  if(!text)continue;const section=escalation?'Follow-up / escalation':sectionFor(f.id,text);
  const list=sections[section]??(sections[section]=[]),old=list.find(x=>x.text===text);
  if(old){old.findings.push(f.id);old.src=[...new Set([...old.src,...p.src])];continue}
  list.push({text,findings:[f.id],src:[...p.src],basis:p.basis,provisional:p.prov});
 }
 return sections;
}

 return`<div class="fsec reconciled"><div class="lab">One reconciled plan</div>${m.P.filter(x=>x.p.author).map(({p})=>`<div class="small"><b>Author’s protocol:</b> ${esc(AUTHOR[p.author].rule)} — guidance: ${esc(AUTHOR[p.author].guide)}</div>`).join('')}${m.prov?'<p class="small">Conditional until the named questions and conflicts are resolved.</p>':''}${order.map(k=>m.sections[k]?.length?`<h3>${esc(k)}</h3><ul>${m.sections[k].map(x=>`<li>${escV(x.text)} <span class="small">${x.findings.map(id=>esc(FX[id].t.split(' (')[0])).join(' · ')} ${basisChip(x.basis)}</span></li>`).join('')}</ul>`:'').join('')}</div>${m.suppressed.length?`<details class="box"><summary>Advice suppressed · ${m.suppressed.length}</summary><div class="inner"><p class="small">Suppression is not a replacement prescription. Where an alternative is requested, agree it with the appropriate clinician.</p>${m.suppressed.map(x=>`<p><b>${esc(FX[x.fid].t)}</b><br>Suppressed: ${escV(x.text)}<br><b>Why:</b> ${esc(x.reason)} ${x.src.map(srcLink).join(' ')}</p>`).join('')}</div></details>`:''}`;
}

/* Enumerate existing option branches. Numeric data is requested, never invented. */
function rankQuestions(ids){
 const seen=new Set(),out=[];
 for(const id of ids){const f=FX[id];if(!f)continue;
  for(const q of fQs(f)){
   if(has(S.pf[q.k])&&(!q.unitSel||has(S.pf[q.unitSel])))continue;
   if(seen.has(q.k))continue;seen.add(q.k);
   const r={q,fid:id,score:1,reason:'Required context remains unresolved.',choices:[]};
   if(q.optional){r.score=0;r.reason='Optional: '+q.q.replace(/^[^(]*\(|\)$/g,'')+'.'}
   else if(q.type==='num'){r.score=3;r.reason='A reported numeric value and unit are required; no test value is assumed.'}
   else{
    r.choices=q.opts.map(([value,label])=>{const m=modelFor(ids,{[q.k]:value});return{value,label,d:m.od,provisional:m.prov,key:outcomeKey(m)}});
    const dispos=new Set(r.choices.map(x=>x.d)),plans=new Set(r.choices.map(x=>x.key));
    if(dispos.size>1){r.score=5;r.reason='The listed answers can change the overall disposition.'}
    else if(plans.size>1){r.score=4;r.reason='The listed answers can change an essential step or precaution.'}
    else r.reason='The current branches give the same plan; this fact is still required to finalize.';
   }
   out.push(r);
  }
 }
 return out.sort((a,b)=>b.score-a.score);
}
function nextQuestionHTML(m){const r=rankQuestions(m.A).find(x=>!x.q.optional);if(!r)return'';
 return`<div class="fsec question-next"><div class="lab">Next decisive question</div><p>${esc(r.reason)}</p>${['proc','anes','urg'].includes(r.q.k)?`<p><b>${esc(r.q.q)}</b> — answer under Context above.</p>`:qHTML(r.q).replace(/ (id|for)="(question|pf)-/g,' $1="next-$2-')}<button class="go" data-question="${r.q.k}" data-qfid="${r.fid}">Open finding and details ›</button></div>`;
}
function changeConditionsHTML(ids){const rows=rankQuestions(ids).filter(r=>r.choices.length&&r.score>=4).slice(0,3);

}
