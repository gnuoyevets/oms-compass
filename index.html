<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OMS Compass</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f7f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a19" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: one phone column. Home = grouped decision list. Module = red flags → inputs → yes/no path → plan card → collapsed look-fors and sources. */
:root{
 --bg:#f5f7f3;--surface:#ffffff;--ink:#17312e;--muted:#5a6b67;--line:#dfe5de;--soft:#e9f0e8;
 --accent:#0f6a5e;--accent-ink:#ffffff;--chip:#dcebe3;--chip-ink:#1f5245;
 --warn-bg:#fff4e2;--warn-line:#ecd2a6;--warn-ink:#6f4f1c;
 --red-bg:#fbece8;--red-line:#ebc1b5;--red-ink:#8b3322;
 --ok-bg:#e8f3ea;--ok-line:#c4dcc8;--ok-ink:#25563a;
 --display:'Manrope','DM Sans',system-ui,-apple-system,sans-serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--soft:#1d2f2d;
 --accent:#4fb8a5;--accent-ink:#06211d;--chip:#21403a;--chip-ink:#bfe3d7;
 --warn-bg:#2e2412;--warn-line:#5a4520;--warn-ink:#f0cf92;
 --red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;
 --ok-bg:#16301f;--ok-line:#2c5539;--ok-ink:#a9dcb7;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1a19;--surface:#162423;--ink:#e6efeb;--muted:#9db0aa;--line:#28403c;--soft:#1d2f2d;
 --accent:#4fb8a5;--accent-ink:#06211d;--chip:#21403a;--chip-ink:#bfe3d7;
 --warn-bg:#2e2412;--warn-line:#5a4520;--warn-ink:#f0cf92;
 --red-bg:#341a15;--red-line:#6a3226;--red-ink:#f2b2a2;
 --ok-bg:#16301f;--ok-line:#2c5539;--ok-ink:#a9dcb7;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.3px;text-wrap:balance;margin:0}
.lab{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

/* Home */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 14px}
.top h1{font-size:24px;font-weight:800}
.top h1 span{color:var(--accent)}
.group{margin:16px 0 6px}
.mods{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;min-height:56px}
.mod:first-child{border-top:0}
.mod:hover{background:var(--soft)}
.mod b{display:block;font:700 15.5px var(--display)}
.mod span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.mod i{font-style:normal;color:var(--accent);font-size:18px}
.foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.6}

/* Module */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar h2{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:44px;padding:0 12px;color:var(--accent);font-weight:600;font-size:13px}
.icon-btn.back{font-size:20px;padding:0}
.red{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.red b{font-weight:700}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.box>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:46px;font-weight:600;font-size:14px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:'+';color:var(--accent);font-size:18px;line-height:1}
details.box[open]>summary::after{content:'−'}
details.box>summary em{font-style:normal;font-weight:600;font-size:12px;color:var(--accent);margin-left:auto}
.inner{padding:0 14px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:7px 11px;font-size:13px;min-height:36px;color:var(--muted)}
.tg.on{background:var(--chip);border-color:var(--chip);color:var(--chip-ink);font-weight:700}
.calc{margin-top:10px;font-size:13px;font-weight:600;color:var(--chip-ink);background:var(--chip);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}

.path{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.step .qt{font-size:13px;line-height:1.4;color:var(--muted)}
.step .qt small{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;min-height:34px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}
.notechip{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.cur{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px}
.cur .q{font:700 17px/1.4 var(--display);margin:4px 0 6px}
.cur .h{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.cur .h ul{margin:4px 0 0;padding-left:18px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{min-height:52px;border-radius:10px;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.yn button.y{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.autohint{font-size:12px;color:var(--chip-ink);background:var(--chip);border-radius:6px;padding:5px 8px;margin-bottom:10px}

.plan{border-radius:12px;padding:14px;border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.plan.action{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.plan.urgent{border-color:var(--red-line);background:var(--red-bg);color:var(--red-ink)}
.plan .lab{color:inherit;opacity:.85}
.plan .pt{font:700 17px/1.4 var(--display);margin:4px 0 0;color:inherit}
.plan ol{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.plan ol li{margin:6px 0}
.plan ol b{font-weight:700}
.plan .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px}
.plan .meta a{color:inherit;font-weight:600}
.go{display:inline-block;margin-top:10px;border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.copybox{display:block;width:100%;min-height:140px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px;font-size:13px}
.caveat{font-size:12px;color:var(--muted);margin:10px 0 14px;line-height:1.5}
.look h4{margin:12px 0 4px;font-size:13px}
.look ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5;color:var(--muted)}
.look li{margin:3px 0}
.src{padding:8px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.src:first-child{border-top:0}
.src span{display:block;font-size:12px;color:var(--muted)}
/* Tabs, emergency, calculators */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin:0 0 6px}
.tabs button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.tabs button{font-size:13px}}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button.em{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg)}
.tabs button.em.on{background:var(--red-ink);color:var(--bg);border-color:var(--red-ink)}
.icon-btn.sos{color:var(--red-ink);border-color:var(--red-line);background:var(--red-bg);font-weight:800}
.wtbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:10px}
.wtbar input{width:100%;font-size:20px;font-weight:700;padding:10px 12px;border:2px solid var(--accent);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.wtbar .note{font-size:12px;color:var(--muted);line-height:1.35;max-width:150px}
.call{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:10px}
details.em{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red-ink);border-radius:12px;margin-bottom:8px}
details.em>summary{list-style:none;padding:13px 14px;min-height:50px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 16px var(--display)}
details.em>summary::-webkit-details-marker{display:none}
details.em>summary span{font:500 12px var(--sans);color:var(--muted);display:block;margin-top:2px}
details.em>summary::after{content:'+';color:var(--red-ink);font-size:20px}
details.em[open]>summary::after{content:'−'}
.em ol{margin:0;padding:0 14px 6px 34px;font-size:14.5px;line-height:1.5}
.em ol li{margin:6px 0}
.dose{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.unv{display:inline-block;margin-left:4px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:4px;padding:0 5px}
.em .meta{padding:0 14px 12px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px 12px}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
.ctab th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-top:0}
.ctab td b{font-size:15px}
.chk{display:flex;flex-direction:column;gap:6px}
.handoff{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--ink);min-height:56px}
.handoff b{display:block;font:700 15px var(--display)}
.handoff span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.handoff i{font-style:normal;color:var(--accent);font-size:18px}
.top .small{white-space:nowrap}
.srch{margin:2px 0 4px}
.srch input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#hits .mods{margin-top:8px}

.vbtn{border:0;background:none;padding:0;font:inherit;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;min-height:24px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:8px}
.gate h2{font-size:19px;margin-bottom:8px}
.gate ul{margin:0 0 16px;padding-left:20px;font-size:14.5px;line-height:1.55}
.gate li{margin:6px 0}
.gobtn{width:100%;min-height:52px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
@media (min-width:560px){.top h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===== Sources (checked Oct 21, 2026) ===== */
const SRC={
acc:{n:'AHA/ACC perioperative cardiovascular guideline (Thompson et al.)',v:'2024 · replaces 2014',u:'https://www.acc.org/Latest-in-Cardiology/ten-points-to-remember/2024/09/23/04/15/2024-aha-acc-perioperative-guideline-gl'},

litfl:{n:'LITFL · Laryngospasm',v:'Succinylcholine 0.1–0.5 / 1–2 mg/kg IV; 3–4 mg/kg IM',u:'https://litfl.com/laryngospasm/'},

brady:{n:'AHA · Adult bradycardia algorithm',v:'2025 CPR & ECC guidelines',u:'https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Accessible/Algorithm-ACLS-Bradycardia-LngDscrp-250725-Ed.pdf'},

asaps:{n:'ASA Physical Status Classification',v:'Approved 2014; examples updated',u:'https://asahq.org/resources/clinical-information/asa-physical-status-classification-system'},
fast:{n:'ASA preoperative fasting guideline (2023 modular update of 2017)',v:'Anesthesiology 2023 · summary',u:'https://www.consultant360.com/exclusive/updated-guidelines-address-preoperative-fasting-elective-procedures'},
asamon:{n:'ASA Standards for Basic Anesthetic Monitoring',v:'Capnography for moderate/deep sedation',u:'https://beckersasc.com/anesthesia/asas-standards-revision-focusing-on-ventilation-methods-set-to-take-effect.html'},
mysed:{n:'Your Chairside Sedation Card — No-Pump (ASA I–III)',v:'Oct 7, 2026 · personal protocol; doses not label-verified',u:'https://docs.google.com/document/d/1_me16BdLXlR7RPbVQZq1Ar4XKjt43jNKUcixff7S948/edit'},
dm26:{n:'Perioperative diabetes care in 2026 (NYSORA, ADA-aligned)',v:'A1C >8% → consider postponing',u:'https://nysora.com/?p=66496'},
filippi:{n:'Filippi, Saccardin & Kühl · Advanced Oral Surgery (textbook)',v:'Your Readwise highlights',u:'https://read.readwise.io/'},
andersson:{n:'Andersson, Kahnberg & Pogrel · Oral and Maxillofacial Surgery (textbook)',v:'Dialysis timing · Readwise',u:'https://read.readwise.io/'},

const PHQ=['Nervous, anxious, on edge','Can’t stop or control worrying','Little interest or pleasure','Down, depressed, hopeless'];
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
function R(id){
 const i=S.inp[id]||{},r={};
 if(i.sbTouched){const on=SB.filter(([k])=>i['sb_'+k]).map(([k])=>k);r.sb=on.length;const stop=['s','t','o','p'].filter(k=>on.includes(k)).length;
  r.sbCat=r.sb>=5?'high':r.sb>=3?((stop>=2&&['g','b','n'].some(k=>on.includes(k)))?'high':'intermediate'):'low'}
 r.rbh=num(i.rbh);r.wall=num(i.wall);r.mem=num(i.mem);r.septum=i.septum||'';
 const p=[i.p1,i.p2,i.p3].map(num),f=[i.f1,i.f2,i.f3].map(num),days=num(i.days);
 if(p.every(v=>v!=null)){r.cpi=Math.round(p.reduce((a,b)=>a+b,0)/3*10);
  if(f.every(v=>v!=null)&&days!=null){const isc=Math.round(f.reduce((a,b)=>a+b,0)/3*10);
   const pts=(days<=1?0:days===2?1:days<=5?2:3)+(isc<30?0:isc<50?1:isc<70?2:3);
   r.grade=r.cpi===0?'0':pts>=5?'IV':pts>=3?'III':r.cpi>=50?'II':'I'}}
 const q=[i.q0,i.q1,i.q2,i.q3].map(num);if(q.every(v=>v!=null)){r.phq=q.reduce((a,b)=>a+b,0);r.phqBand=r.phq>=9?'severe':r.phq>=6?'moderate':r.phq>=3?'mild':'normal'}
 r.si=!!i.si;const op=num(i.open);
 r.joint=!!(i.lock||(op!=null&&op<25&&i.u25)||(i.arth&&i.diet&&op!=null&&op<30&&r.cpi!=null&&r.cpi>50));
 return r;
}
function walk(m){
 const r=R(m.id),a=S.ans[m.id]||{},steps=[];let id=m.start,guard=0;
 while(id&&guard++<40){const n=m.nodes[id];if(!n)break;
  if(n.note){steps.push({id,n,note:true});id=n.next;continue}
  if(n.out)return{steps,out:n,r};
  const auto=n.auto?n.auto(r):undefined,man=a[id],val=man!==undefined?man:auto;
  steps.push({id,n,val,auto:man===undefined&&auto!==undefined});
  if(val===undefined)return{steps,cur:{id,n},r};
  id=val?n.yes:n.no}
 return{steps,r};
}

function calcHTML(){
 const w=S.wt;
 const la=LA.map(([n,mgml,pk,cap])=>{if(!w)return`<tr><td>${n}</td><td>${pk} mg/kg${cap?` · max ${cap} mg`:''}</td><td>–</td></tr>`;
  let mg=pk*w;const capped=cap!=null&&mg>cap;if(capped)mg=cap;const carp=Math.floor(mg/(mgml*1.7)*10)/10;
  return`<tr><td>${n}</td><td><b>${Math.round(mg)} mg</b>${capped?' (cap)':''}</td><td><b>${carp}</b></td></tr>`}).join('');
 const rc=S.rcri||{},rn=Object.values(rc).filter(Boolean).length,rr=['0.4%','0.9%','6.6%','≥11%'][Math.min(rn,3)];
 const mf=w?(w<=10?w*4:w<=20?40+(w-10)*2:60+(w-20)):null;
 return `<div class="wtbar"><label class="fld" for="in-wt">Weight, kg<input id="in-wt" data-wt inputmode="decimal" placeholder="kg" value="${esc(w??'')}"></label><div class="note">Shared with the Emergency tab.</div></div>
 ${sedHTML()}
 <details class="box" open><summary>Local anesthetic maximum <em>1.7 mL cartridges</em></summary><div class="inner"><table class="ctab"><tr><th>Agent</th><th>Max dose</th><th>Carps</th></tr>${la}</table>
 <p class="caveat" style="margin:10px 0 0">Combining agents: doses add; stay under the lower ceiling. Cardiac patients: the classic 0.04 mg epinephrine cap (≈2 carps 1:100k) lacks research support; a systematic review found up to 4 carps 1:100k well tolerated with monitoring. Recent MI, decompensated heart failure or significant arrhythmia: physician consult first. ${srcLink('epicat')} Reduce for elderly, liver disease, and children. ${srcLink('malamed')}</p></div></details>
 <details class="box"><summary>Revised Cardiac Risk Index <em>${rn}/6</em></summary><div class="inner"><div class="chk">${RCRI.map((t,k)=>`<button class="tg${rc[k]?' on':''}" data-rc="${k}" aria-pressed="${!!rc[k]}" style="text-align:left">${esc(t)}</button>`).join('')}</div>
 <div class="calc">RCRI ${rn} · major cardiac event ≈ ${rr} (Lee 1999)</div><p class="caveat" style="margin:10px 0 0">Most OMS cases are low-risk surgery. Testing only when poor functional capacity and elevated risk would change management (2024 AHA/ACC). ${srcLink('lee')} ${srcLink('acc')}</p></div></details>
 <details class="box"><summary>Maintenance fluids <em>4-2-1</em></summary><div class="inner"><div class="calc">${mf!=null?`${Math.round(mf)} mL/h`:'Enter weight'}</div><p class="caveat" style="margin:10px 0 0">Holliday–Segar: 4 mL/kg/h for the first 10 kg, 2 for the next 10, 1 per kg after. NPO deficit ≈ rate × hours fasting.</p></div></details>`;
}

en:['Bite firmly on the gauze for 30 minutes. Some oozing for 1–2 days is normal.','Heavy bleeding: fold clean gauze, place it on the site and bite firmly for 1 hour. Still bleeding? Call us.','Ice the cheek 20 minutes on, 20 minutes off, for the first 2 days. Swelling is worst on day 2–3.','Keep your head raised on pillows for 2 nights.','First 24 hours: no rinsing, spitting or straws. They can pull out the blood clot.','Do not smoke or vape for at least 72 hours, ideally 1 week. Smoking slows healing and raises the risk of a painful dry socket.','From day 2: rinse gently with warm salt water (½ teaspoon in 1 cup) after meals. If we grafted the socket with Augma Shield, skip the salt water and use only the rinse we prescribed.','Soft foods for 2 weeks. No hard, crunchy or seedy food (nuts, chips, popcorn, seeds) for 3 weeks. Drink plenty of fluids.','Take pain medicine as directed. Start before the numbness wears off. Finish any antibiotic.','No alcohol for 24 hours, or while taking opioid pain medicine.','Call us: bleeding that will not stop with pressure; pain or swelling getting worse after day 3; fever over 100.4°F (38°C); bad taste or pus; numb lip, chin or tongue the next day.','Trouble breathing or swallowing: call 911.'],
es:['Muerda firmemente la gasa durante 30 minutos. Es normal un poco de sangrado leve por 1–2 días.','Sangrado abundante: doble una gasa limpia, colóquela sobre la herida y muerda firme por 1 hora. ¿Sigue sangrando? Llámenos.','Aplique hielo en la mejilla 20 minutos sí y 20 minutos no durante los primeros 2 días. La hinchazón es mayor el día 2–3.','Duerma con la cabeza elevada sobre almohadas durante 2 noches.','Primeras 24 horas: no se enjuague, no escupa y no use popotes (pajillas). Esto puede desprender el coágulo.','No fume ni use cigarrillos electrónicos (vapeo) por al menos 72 horas, idealmente 1 semana. Fumar retrasa la cicatrización y aumenta el riesgo de alveolitis seca, que es muy dolorosa.','Desde el día 2: enjuáguese suavemente con agua tibia con sal (½ cucharadita en 1 taza) después de comer. Si injertamos el alvéolo con Augma Shield, no use agua con sal; use solo el enjuague recetado.','Comidas blandas por 2 semanas. Nada duro, crujiente ni con semillas (nueces, papitas, palomitas, semillas) por 3 semanas. Tome muchos líquidos.','Tome el medicamento para el dolor según las indicaciones. Empiece antes de que se pase la anestesia. Termine el antibiótico si se lo recetaron.','No tome alcohol por 24 horas, ni mientras tome analgésicos opioides.','Llámenos si tiene: sangrado que no para con presión; dolor o hinchazón que empeora después del día 3; fiebre de más de 100.4°F (38°C); mal sabor o pus; labio, mentón o lengua adormecidos al día siguiente.','Dificultad para respirar o tragar: llame al 911.'],
kea:["Morde firmi na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal.","Si sangi txeu: dobra un gaza linpu, poi-l riba di ferida i morde firmi pa 1 ora. Inda sa ta sangra? Txoma-nu.","Poi jelu na fasi 20 minutu, tira 20 minutu, duranti 2 purmeru dia. Inxason ta fika más grandi na dia 2–3.","Dormi ku kabesa altu na almofada pa 2 noti.","Purmeru 24 ora: ka bu lava boka, ka bu kuspi i ka bu uza palinha. Es kuzas pode tira kuágulu di sangi.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 72 ora, midjór 1 simana. Fuma ta atraza kura i ta aumenta risku di alvéolu seku, ki ta dói txeu.","A partir di dia 2: lava boka divagarinhu ku agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi. Si nu poi enxertu na buraku ku Augma Shield, ka bu uza agu ku sal; uza só rémédiu di lava boka ki nu pasa-bu.","Kumida mol pa 2 simana. Nada duru, ki ta stala o ku simenti (nozis, xips, pipoka, simenti) pa 3 simana. Bebe txeu líkidu.","Toma rémédiu pa dor sima nu fla-bu. Kumesa antis di anestezia pasa. Si nu pasa-bu antibiótiku, toma-l ti kaba.","Ka bu bebe álkool pa 24 ora, nen enkuantu bu sta ta toma rémédiu pa dor opioidi.","Txoma-nu si: sangi ki ka ta para ku prison; dor o inxason ki sta ta piora dipôs di dia 3; febri más di 100.4°F (38°C); gostu mau o pus; lábiu, kexu o língua dormenti na dia sigínti.","Si bu tene difikuldadi di rispira o di ingoli: txoma 911."],
zh:["用力咬住纱布30分钟。1–2天内有少量渗血属正常现象。","出血较多时：将干净纱布折叠，放在伤口上用力咬住1小时。仍在出血？请致电我们。","头2天在脸颊冷敷，敷20分钟、停20分钟。肿胀在第2–3天最明显。","睡觉时用枕头垫高头部，持续2晚。","头24小时内：不要漱口、吐口水或用吸管，以免血块脱落。","至少72小时内不要吸烟或吸电子烟，最好1周。吸烟会减慢愈合，并增加疼痛的干槽症风险。","从第2天起：饭后用温盐水（1杯水加½茶匙盐）轻轻漱口。如果我们在拔牙窝植入了Augma Shield，请不要用盐水，只用我们开的漱口水。","吃软食2周。3周内不要吃硬的、脆的或有籽的食物（坚果、薯片、爆米花、种子）。多喝水。","按医嘱服用止痛药。在麻药消退前开始服用。如开了抗生素，请服完全程。","24小时内不要饮酒；服用阿片类止痛药期间也不要饮酒。","出现以下情况请致电我们：按压后仍止不住的出血；第3天后疼痛或肿胀加重；发烧超过100.4°F（38°C）；口中有异味或有脓；第二天嘴唇、下巴或舌头仍然麻木。","呼吸或吞咽困难：请拨打911。"]}},
{id:'imp',src:['mcgill'],t:{en:'After implant, bone graft or sinus lift surgery',es:'Después de implantes, injerto óseo o elevación de seno',kea:"Dipôs di implanti, enxertu di osu o levantamentu di seiu",zh:"种植牙、植骨或上颌窦提升术后须知"},i:{
en:['Bite on the gauze for 30 minutes. Some oozing for 1–2 days is normal.','Ice 20 minutes on, 20 off, for 2 days. Keep your head raised for 2 nights.','Do not chew on the surgery side. Do not touch the site with your tongue or fingers, or pull your lip to look.','Soft foods until we tell you otherwise. No hard or crunchy food.','Brush your other teeth normally. Use the rinse we prescribed, or warm salt water from day 2.','If we grafted with Augma Shield: do not rinse with salt water. Use only the rinse we prescribed.','Wear a denture or flipper only as we instructed. It must not press on the surgery site.','Small sand-like graft granules may come out for a few days. This is normal.','Sinus lift: do not blow your nose for at least 1 week. Sneeze with your mouth open. No flying for 2 weeks. No straws.','Do not smoke or vape for at least 2 weeks. Quitting for good is best. Smoking raises the risk that the implant or graft fails.','Call us: bleeding that will not stop; pain or swelling getting worse after day 3; fever; pus; a loose healing cap; exposed graft or membrane; air or fluid passing between your mouth and nose; numbness the next day.'],
es:['Muerda la gasa durante 30 minutos. Es normal un poco de sangrado leve por 1–2 días.','Hielo 20 minutos sí y 20 no durante 2 días. Duerma con la cabeza elevada por 2 noches.','No mastique del lado de la cirugía. No toque la zona con la lengua ni los dedos, ni jale el labio para mirar.','Comidas blandas hasta que le indiquemos lo contrario. Nada duro ni crujiente.','Cepille sus otros dientes normalmente. Use el enjuague recetado, o agua tibia con sal desde el día 2.','Si usamos un injerto Augma Shield: no se enjuague con agua con sal. Use solo el enjuague recetado.','Use su dentadura o puente removible solo como le indicamos. No debe presionar la zona operada.','Pueden salir pequeños gránulos del injerto, como arena, por unos días. Es normal.','Elevación de seno: no se suene la nariz por al menos 1 semana. Estornude con la boca abierta. No viaje en avión por 2 semanas. No use popotes.','No fume ni use cigarrillos electrónicos (vapeo) por al menos 2 semanas. Lo mejor es dejar de fumar por completo. Fumar aumenta el riesgo de que fallen el implante o el injerto.','Llámenos si tiene: sangrado que no para; dolor o hinchazón que empeora después del día 3; fiebre; pus; un tornillo de cicatrización flojo; injerto o membrana expuestos; paso de aire o líquido entre la boca y la nariz; adormecimiento al día siguiente.'],
kea:["Morde na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal.","Jelu 20 minutu, tira 20, duranti 2 dia. Dormi ku kabesa altu pa 2 noti.","Ka bu mastiga di ladu di sirurjia. Ka bu toka na lugar ku língua o ku dedu, nen ka bu puxa lábiu pa djobe.","Kumida mol ti nu fla-bu otu kuza. Nada duru nen ki ta stala.","Skova kes otu denti normal. Uza rémédiu di lava boka ki nu pasa-bu, o agu mornu ku sal a partir di dia 2.","Si nu poi enxertu ku Augma Shield: ka bu lava boka ku agu ku sal. Uza só rémédiu di lava boka ki nu pasa-bu.","Uza dentadura o ponti di tira-poi só sima nu fla-bu. E ka debe karga riba di lugar di sirurjia.","Pode sai pedasinhu pikinoti di enxertu, sima areia, duranti uns dia. É normal.","Levantamentu di seiu: ka bu asua naris pa pelo menus 1 simana. Spirra ku boka abertu. Ka bu bua di avion pa 2 simana. Ka bu uza palinha.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 2 simana. Midjór é dexa di fuma di bes. Fuma ta aumenta risku di implanti o enxertu fadja.","Txoma-nu si: sangi ki ka ta para; dor o inxason ki sta ta piora dipôs di dia 3; febri; pus; tanpa di kikatrizason mole; enxertu o membrana diskubertu; ar o líkidu ta pasa entri boka ku naris; dormensia na dia sigínti."],
zh:["咬住纱布30分钟。1–2天内有少量渗血属正常现象。","冷敷2天，敷20分钟、停20分钟。睡觉时垫高头部，持续2晚。","不要用手术侧咀嚼。不要用舌头或手指碰触伤口，也不要拉开嘴唇查看。","吃软食，直到我们另行通知。不要吃硬的或脆的食物。","其他牙齿照常刷牙。使用我们开的漱口水，或从第2天起用温盐水漱口。","如果我们使用了Augma Shield植骨：不要用盐水漱口，只用我们开的漱口水。","只按我们的指示佩戴假牙或临时活动牙，不能压到手术部位。","几天内可能会有像细沙一样的小颗粒植骨材料掉出来，这是正常的。","上颌窦提升术：至少1周内不要擤鼻涕。打喷嚏时张开嘴。2周内不要乘坐飞机。不要用吸管。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体或植骨失败的风险。","出现以下情况请致电我们：出血不止；第3天后疼痛或肿胀加重；发烧；有脓；愈合帽松动；植骨材料或膜外露；口腔与鼻腔之间有空气或液体相通；第二天仍有麻木。"]}},
{id:'arch',src:['mcgill'],t:{en:'After full-arch (fixed teeth same day) surgery',es:'Después de cirugía de arcada completa (dientes fijos el mismo día)',kea:"Dipôs di sirurjia di arkada interu (denti fixu na mesmu dia)",zh:"全口种植（当天固定牙）术后须知"},i:{
en:['First 2 days: gauze, ice and head raised, as for any oral surgery.','Your new teeth are temporary and fixed in place. Do not try to remove them.','Diet: liquids and very soft food for the first 2 weeks, then fork-tender food until we clear you (usually about 3 months). Do not bite into hard food with your front teeth.','Clean under the bridge twice a day with a water flosser on its lowest setting, starting about day 7. Use the rinse we prescribed.','Do not smoke or vape for at least 2 weeks. Quitting for good is best. Smoking raises the risk that the implants fail.','Your speech and bite will feel different for a few weeks. This is normal.','Wear your night guard every night if we gave you one.','Call us: a loose, cracked or moving bridge; a bite that feels uneven or hurts on one spot; swelling, pus or fever.','Keep every follow-up visit. They protect the implants while they heal.'],
es:['Primeros 2 días: gasa, hielo y cabeza elevada, como en cualquier cirugía oral.','Sus dientes nuevos son provisionales y están fijos. No intente quitarlos.','Dieta: líquidos y comida muy blanda las primeras 2 semanas; después, comida que se pueda partir con un tenedor hasta que le demos el alta (por lo general unos 3 meses). No muerda comida dura con los dientes de enfrente.','Limpie debajo del puente dos veces al día con un irrigador de agua en su nivel más bajo, a partir del día 7 aproximadamente. Use el enjuague recetado.','No fume ni use cigarrillos electrónicos (vapeo) por al menos 2 semanas. Lo mejor es dejar de fumar por completo. Fumar aumenta el riesgo de que fallen los implantes.','Su forma de hablar y su mordida se sentirán diferentes por unas semanas. Es normal.','Use su protector nocturno todas las noches si le dimos uno.','Llámenos si: el puente está flojo, roto o se mueve; la mordida se siente dispareja o duele en un punto; tiene hinchazón, pus o fiebre.','Asista a todas sus citas de control. Protegen los implantes mientras sanan.'],
kea:["Purmeru 2 dia: gaza, jelu i kabesa altu, sima na kualker sirurjia di boka.","Bu denti novu é provizóriu i é fixu. Ka bu tenta tira-s.","Kumida: líkidu i kumida mutu mol duranti 2 purmeru simana; dipôs, kumida ki garfu ta parti fásil ti nu da-bu alta (normalmenti uns 3 mês). Ka bu morde kumida duru ku denti di frenti.","Linpa baxu di ponti 2 bes pa dia ku un irigador di agu na nível más baxu, a partir más o menus di dia 7. Uza rémédiu di lava boka ki nu pasa-bu.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 2 simana. Midjór é dexa di fuma di bes. Fuma ta aumenta risku di implanti fadja.","Bu manera di papia i bu mordida ta xinti diferenti pa algun simana. É normal.","Uza bu protetor di noti tudu noti si nu da-bu un.","Txoma-nu si: ponti sta mole, rakadu o ta mexe; mordida ta xinti dizigual o ta dói na un pontu; inxason, pus o febri.","Ben pa tudu bu konsulta di kontrolu. Es ta proteje implantis enkuantu es ta kura."],
zh:["头2天：与其他口腔手术一样，咬纱布、冷敷并垫高头部。","您的新牙是临时的，并且是固定的。不要试图自行取下。","饮食：头2周吃流质和非常软的食物；之后吃用叉子就能轻松分开的软食，直到我们通知您可以恢复正常饮食（通常约3个月）。不要用前牙咬硬的食物。","大约从第7天起，每天2次用冲牙器（调到最低档）清洁牙桥下方。使用我们开的漱口水。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体失败的风险。","几周内您说话和咬合的感觉会有所不同，这是正常的。","如果我们给了您夜间护牙套，请每晚佩戴。","出现以下情况请致电我们：牙桥松动、破裂或移动；咬合不平或某一点疼痛；肿胀、有脓或发烧。","请按时参加每次复诊。复诊可在愈合期间保护种植体。"]}},
{id:'sed',src:['hsdm'],t:{en:'After IV sedation',es:'Después de la sedación intravenosa',kea:"Dipôs di sedason na veia",zh:"静脉镇静后须知"},i:{
en:['A responsible adult must take you home and stay with you for the rest of the day (at least 4 hours).','Until tomorrow morning: no driving, machinery, cooking on the stove, or important decisions or signing documents.','No alcohol for 24 hours. Do not drive while taking opioid pain medicine.','Do not care for young children alone today.','Start with sips of clear fluids, then light food. For nausea, take small sips; ginger ale can help.','Rest with your head raised. You may feel sleepy or forgetful today.','A small bruise at the IV site is normal. Call us for a red, painful streak or swelling in the arm.','Call 911: trouble breathing, cannot be woken, or chest pain.'],
es:['Un adulto responsable debe llevarlo a casa y quedarse con usted el resto del día (al menos 4 horas).','Hasta mañana por la mañana: no maneje, no use maquinaria, no cocine en la estufa, ni tome decisiones importantes o firme documentos.','No tome alcohol por 24 horas. No maneje mientras tome analgésicos opioides.','No cuide solo a niños pequeños hoy.','Empiece con sorbos de líquidos claros y luego comida ligera. Si tiene náuseas, tome sorbos pequeños; el ginger ale puede ayudar.','Descanse con la cabeza elevada. Puede sentirse con sueño u olvidadizo hoy.','Es normal un pequeño moretón donde estuvo el suero. Llámenos si hay una línea roja y dolorosa o hinchazón en el brazo.','Llame al 911 si: le cuesta respirar, no se puede despertar o tiene dolor en el pecho.'],
kea:["Un adultu rasponsável ten ki leba-bu kasa i fika ku bu resta di dia (pelo menus 4 ora).","Ti amanhan di palmanhan: ka bu kondus, ka bu uza mákina, ka bu kuzinha na fogon, nen ka bu toma disizon importanti o sina dokumentu.","Ka bu bebe álkool pa 24 ora. Ka bu kondus enkuantu bu sta ta toma rémédiu pa dor opioidi.","Oji ka bu toma konta di mininu pikinoti sozinhu.","Kumesa ku golinhu di líkidu klaru, dipôs kumida leve. Si bu sta ku nóziu, bebe golinhu pikinoti; ginger ale pode djuda.","Diskansa ku kabesa altu. Oji bu pode xinti ku sonu o skesedu.","Un manxa roxu pikinoti na lugar di soru é normal. Txoma-nu si bu tene un risku burmedju ki ta dói o inxason na brasu.","Txoma 911 si: difikuldadi di rispira, ka ta kunsigi korda, o dor na pextu."],
zh:["必须由一名负责任的成年人送您回家，并在当天余下时间陪伴您（至少4小时）。","到明天早上之前：不要开车、操作机器、用炉灶做饭，也不要做重要决定或签署文件。","24小时内不要饮酒。服用阿片类止痛药期间不要开车。","今天不要独自照顾幼儿。","先小口喝清澈的液体，再吃清淡的食物。如有恶心，请小口慢喝；姜汁汽水可能有帮助。","休息时垫高头部。今天您可能会感到困倦或健忘。","静脉输液处有小块淤青是正常的。如手臂出现发红、疼痛的条纹或肿胀，请致电我们。","请拨打911：呼吸困难、叫不醒，或胸痛。"]}}];
const HO_FOR={extraction:'ext',ao:'ext',implant:'imp',graft:'imp',sinus:'imp',arch:'arch',sed:'sed'};
function hoText(h,l){return `${h.t[l]}\n\n${h.i[l].map(x=>'• '+x.replace('[office phone]',PHONE)).join('\n')}\n\n${HO_UI[l].ph}: ${PHONE}\n\n${HO_UI[l].rv.replace('{biz}',HO_SITES[S.site||'young'].n)}\n${HO_SITES[S.site||'young'].u}`}
function hoHTML(){const l=S.lang||'en';
 return `${HANDOUTS_LIVE?'':'<div class="red"><b>DRAFT — pending Dr. Young’s review.</b> Not linked in the app yet. Approve to make them visible in the app.</div>'}
 <div class="toggles" style="margin-bottom:6px">${[['young','Dr. Young'],['bayside','Bayside']].map(([c,n])=>`<button class="tg${(S.site||'young')===c?' on':''}" data-site="${c}" aria-pressed="${(S.site||'young')===c}">${n}</button>`).join('')}</div>
 <div class="toggles" style="margin-bottom:10px">${HO_LANGS.map(([c,n])=>`<button class="tg${l===c?' on':''}" data-lang="${c}" lang="${c}" aria-pressed="${l===c}">${n}</button>`).join('')}</div>
 ${HO.map(h=>`<details class="box" id="ho-${h.id}"${S.hoOpen===h.id?' open':''}><summary>${esc(h.t[l])}</summary><div class="inner look"><ul>${h.i[l].map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="go" data-share="${h.id}">${HO_UI[l].sh} ↗</button> <span class="small">${h.src.map(srcLink).join(' · ')}</span></div></details>`).join('')}
 <textarea id="copybox" class="copybox" hidden aria-label="Handout text"></textarea><p class="caveat">Plain-language drafts written from published patient instructions; edit to match your practice.</p>`}
async function shareHO(id,btn){const h=HO.find(x=>x.id===id),l=S.lang||'en',t=hoText(h,l);
 try{if(navigator.share){await navigator.share({title:h.t[l],text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t);btn.textContent=HO_UI[l].cp}catch(e){showCopy(t)}}

/* ===== Feedback (hidden until an address is set) ===== */
const FEEDBACK='zeniths-raised-7a@icloud.com';
function fbHTML(where){if(!FEEDBACK)return'';const sub=encodeURIComponent(`OMS Compass v${VER} · ${where}`),body=encodeURIComponent(`Module/section: ${where}\nVersion: v${VER}\n\nWhat looks wrong or is missing:\n\n(No patient identifiers, please.)`);
 return`<p class="caveat"><a href="mailto:${FEEDBACK}?subject=${sub}&body=${body}">Report a problem or suggest a change ↗</a></p>`}

/* ===== Search across modules, SOS and Ref ===== */
let IDX=null;
function idx(){if(IDX)return IDX;const strip=t=>String(t).replace(/<[^>]+>/g,' ');
 IDX=[...MODS.map(m=>({k:'mod',id:m.id,t:m.title,sub:m.g,x:[m.title,m.d,m.red||'',m.caveat,JSON.stringify(m.nodes),JSON.stringify(m.look||'')].join(' ').toLowerCase()})),
  ...EMS.map(e=>({k:'em',id:e.id,t:e.t,sub:'SOS',x:[e.t,e.s,strip(e.steps().join(' '))].join(' ').toLowerCase()})),
  ...REF.map(r=>({k:'ref',id:r.t,t:r.t,sub:'Ref',x:[r.t,r.k,r.i.join(' ')].join(' ').toLowerCase()})),
  ...(HANDOUTS_LIVE?HO.map(h=>({k:'ho',id:h.id,t:h.t.en,sub:'Patient handout',x:(h.t.en+' '+h.i.en.join(' ')).toLowerCase()})):[])];return IDX}
function hitsHTML(q){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
 const hits=idx().filter(e=>terms.every(t=>e.x.includes(t))).sort((a,b)=>(terms.every(t=>b.t.toLowerCase().includes(t))-terms.every(t=>a.t.toLowerCase().includes(t))));
 if(!hits.length)return'<p class="caveat">No match.</p>';
 return`<div class="mods">${hits.slice(0,25).map(h=>`<button class="mod" ${h.k==='mod'?`data-open="${h.id}"`:h.k==='em'?`data-em="${h.id}"`:h.k==='ho'?`data-ho="${h.id}"`:`data-reff="${esc(h.id)}"`}><div><b>${esc(h.t)}</b><span>${esc(h.sub)}</span></div><i aria-hidden="true">›</i></button>`).join('')}</div>`}

const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escV=v=>esc(v).replace(/ ?\[verify(?:: ([^\]]+))?\]/g,(m,why)=>(why?` (${why})`:'')+UNV);
const M=id=>MODS.find(m=>m.id===id);
function home(){
 S.mod=null;S.view='decide';try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}const ORDER=['Start here','Anesthesia & medical','Dentoalveolar & acute','Post-op & complications','Trauma','Implants','Pathology & pain'];const groups=[...new Set(MODS.map(m=>m.g))].sort((x,y)=>ORDER.indexOf(x)-ORDER.indexOf(y));
 app.innerHTML=`<div class="top"><h1><span>✳</span> OMS Compass</h1><span class="small"><b style="color:var(--warn-ink)">DRAFT</b> · <button class="vbtn" data-view="new" aria-label="What’s new in v${VER}">v${VER}</button></span></div>`+tabsHTML('decide')+
 `<div class="srch"><input id="in-q" data-q type="search" enterkeyhint="search" autocomplete="off" placeholder="Search everything — e.g. avulsion, Dantrium, sinus" aria-label="Search everything" value="${esc(S.q||'')}"></div><div id="hits">${S.q?hitsHTML(S.q):''}</div><div id="groups"${S.q?' hidden':''}>`+
 groups.map(g=>`<div class="lab group">${esc(g)}</div><div class="mods">${MODS.filter(m=>m.g===g).map(m=>`<button class="mod" data-open="${m.id}"><div><b>${esc(m.title)}</b><span>${esc(m.d)}</span></div><i aria-hidden="true">›</i></button>`).join('')}</div>`).join('')+`</div>`+
 `<p class="foot">Coverage map: AAOMS Parameters of Care (2023). Clinician-review draft for decision support. Answer the questions; the plan appears when the path settles. Nothing you enter is saved. No patient identifiers.<br><b>Shared for colleague discussion.</b> Not an institutional protocol or standard of care; follow your institution’s policies and current guidelines.</p>`+fbHTML('Home');
 window.scrollTo(0,0);
}
function inputsHTML(m){
 const i=S.inp[m.id]||{};
 const out=[];
 if((m.inputs||[]).includes('stopbang'))out.push(`<details class="box"><summary>STOP-Bang <em>if sedating</em></summary><div class="inner"><div class="toggles">${SB.map(([k,t])=>`<button class="tg${i['sb_'+k]?' on':''}" data-sb="${k}" aria-pressed="${!!i['sb_'+k]}">${esc(t)}</button>`).join('')}</div><div class="calc" id="calc-sb"></div></div></details>`);
 if((m.inputs||[]).includes('cbct'))out.push(`<details class="box" open><summary>CBCT at the site <em>answers bone-height steps</em></summary><div class="inner"><div class="grid3">
  <label class="fld" for="in-rbh">Residual bone height, mm<input id="in-rbh" data-in="rbh" inputmode="decimal" value="${esc(i.rbh??'')}"></label>
  <label class="fld" for="in-wall">Lateral wall, mm<input id="in-wall" data-in="wall" inputmode="decimal" value="${esc(i.wall??'')}"></label>
  <label class="fld" for="in-mem">Membrane, mm<input id="in-mem" data-in="mem" inputmode="decimal" value="${esc(i.mem??'')}"></label>
  <label class="fld" for="in-septum">Septum at site<select id="in-septum" data-in="septum"><option value="">–</option><option value="no"${i.septum==='no'?' selected':''}>No</option><option value="yes"${i.septum==='yes'?' selected':''}>Yes</option></select></label></div></div></details>`);
 if((m.inputs||[]).includes('tmd')){
  const sel=(k,max)=>`<select id="in-${k}" data-in="${k}"><option value="">–</option>${Array.from({length:max+1},(_,n)=>`<option${String(i[k])===String(n)?' selected':''}>${n}</option>`).join('')}</select>`;
  const cb=(k,t)=>`<button class="tg${i[k]?' on':''}" data-flag="${k}" aria-pressed="${!!i[k]}">${t}</button>`;
  out.push(`<details class="box"><summary>Scores: GCPS · PHQ-4 · joint <em>optional</em></summary><div class="inner">
  <div class="sub">GCPS pain, 0–10 (last 30 days)</div><div class="grid3"><label class="fld" for="in-p1">Now${sel('p1',10)}</label><label class="fld" for="in-p2">Worst${sel('p2',10)}</label><label class="fld" for="in-p3">Average${sel('p3',10)}</label></div>
  <div class="sub">Interference, 0–10 · disability days</div><div class="grid3"><label class="fld" for="in-f1">Daily life${sel('f1',10)}</label><label class="fld" for="in-f2">Social${sel('f2',10)}</label><label class="fld" for="in-f3">Work${sel('f3',10)}</label></div>
  <div class="grid3" style="margin-top:8px"><label class="fld" for="in-days">Days kept from activity${sel('days',30)}</label></div>
  <div class="sub">PHQ-4, 0–3 (last 2 weeks)</div><div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr))">${PHQ.map((t,n)=>`<label class="fld" for="in-q${n}">${t}${sel('q'+n,3)}</label>`).join('')}</div>
  <div class="toggles" style="margin-top:8px">${cb('si','Suicidal ideation')}</div>
  <div class="sub">Joint</div><div class="grid3"><label class="fld" for="in-open">Max opening, mm<input id="in-open" data-in="open" inputmode="numeric" value="${esc(i.open??'')}"></label></div>
  <div class="toggles" style="margin-top:8px">${cb('lock','Closed lock affects eating')}${cb('u25','Under 25')}${cb('arth','Joint pain')}${cb('diet','Diet restricted')}</div>
  <div class="calc" id="calc-tmd"></div></div></details>`)}
 return out.join('');
}
function srcLink(k){const s=SRC[k];return s?`<a href="${s.u}" target="_blank" rel="noopener">${esc(s.n.split(' · ')[0])} ↗</a>`:''}
function flowHTML(m){
 const w=walk(m),r=w.r,parts=[];
 const notes=w.steps.filter(s=>s.note);
 parts.push('<div class="path">'+w.steps.map(s=>{
  if(s.note)return`<div class="notechip">＋ ${esc(s.n.t)}</div>`;
  if(s.val===undefined)return'';
  return`<div class="step"><div class="qt">${esc(s.n.q)}${s.auto?'<small>auto</small>':''}</div><div class="seg"><button class="${s.val?'on':''}" data-a="${s.id}" data-v="1">Yes</button><button class="${s.val===false?'on':''}" data-a="${s.id}" data-v="0">No</button></div></div>`}).join('')+'</div>');
 if(w.cur){const n=w.cur.n,ah=n.ah?n.ah(r):'';
  parts.push(`<div class="cur"><div class="lab">Next question</div><div class="q">${esc(n.q)}</div>${ah?`<div class="autohint">${esc(ah)}</div>`:''}${n.h?`<div class="h"><ul>${n.h.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="yn"><button class="y" data-a="${w.cur.id}" data-v="1">Yes</button><button data-a="${w.cur.id}" data-v="0">No</button></div></div>`)}
 if(w.out){const o=w.out,items=[];
  if(o.ex)items.push(`<li>${escV(o.ex)}</li>`);
  notes.forEach(s=>items.push(`<li><b>${esc(s.n.t)}:</b> ${escV(s.n.x)}${s.n.src?` <span class="small">(${esc(SRC[s.n.src].n.split(' · ')[0])})</span>`:''}</li>`));
  const srcs=[o.src,o.src2,...notes.map(s=>s.n.src)].filter((v,i,a)=>v&&a.indexOf(v)===i);
  const go=[o.go,o.go2].filter(Boolean).map(g=>`<button class="go" data-open="${g}">Open ${esc(M(g).title)} ›</button>`).join(' ');
  parts.push(`<div class="plan ${o.tone||''}"><div class="lab">${o.tone==='urgent'?'Stop · act now':o.tone==='action'?'Plan · with conditions':'Plan'}</div><div class="pt">${esc(o.out)}</div>${items.length?`<ol>${items.join('')}</ol>`:''}${go?`<div>${go}</div>`:''}${srcs.length?`<div class="meta">${srcs.map(srcLink).join('')}</div>`:''}<button class="go" data-copy>Copy plan for the note</button>${HANDOUTS_LIVE&&HO_FOR[m.id]?` <button class="go" data-ho="${HO_FOR[m.id]}">Patient handout ›</button>`:''}<textarea id="copybox" class="copybox" hidden aria-label="Plan text"></textarea></div>`)}
 return parts.join('');
}
function calcs(m){
 const r=R(m.id);const sb=document.getElementById('calc-sb');
 if(sb){sb.hidden=r.sb==null;sb.textContent=r.sb!=null?`STOP-Bang ${r.sb}/8 · ${r.sbCat} OSA risk`:''}
 const t=document.getElementById('calc-tmd');
 if(t){const bits=[];if(r.cpi!=null)bits.push(`CPI ${r.cpi}`);if(r.grade)bits.push(`GCPS grade ${r.grade}`);if(r.phq!=null)bits.push(`PHQ-4 ${r.phq} (${r.phqBand})`);if(r.joint)bits.push('severe joint limitation');t.hidden=!bits.length;t.textContent=bits.join(' · ')}
}
function refresh(){const m=M(S.mod);document.getElementById('flow').innerHTML=flowHTML(m);calcs(m)}
function open(id){
 const m=M(id);if(!m)return home();S.mod=id;
 app.innerHTML=`<div class="bar"><button class="icon-btn back" data-home aria-label="All decisions">‹</button><h2>${esc(m.title)}</h2><button class="icon-btn sos" data-view="emergency" aria-label="Emergency">SOS</button><button class="icon-btn" data-reset>Reset</button></div>
 ${m.red?`<div class="red">${m.red}</div>`:''}
 ${id==='preop'?handoffHTML():''}
 ${inputsHTML(m)}
 <div id="flow"></div>
 <p class="caveat">${esc(m.caveat)}</p>
 ${m.look?`<details class="box"><summary>What to look for</summary><div class="inner look">${m.look.map(([h,l])=>`<h4>${esc(h)}</h4><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div></details>`:''}
 ${m.refs.length?`<details class="box"><summary>Sources <em>${m.refs.length}</em></summary><div class="inner">${m.refs.map(k=>{const s=SRC[k];return`<div class="src"><a href="${s.u}" target="_blank" rel="noopener">${esc(s.n)}</a><span>${esc(s.v)}</span></div>`}).join('')}</div></details>`:''}${fbHTML(m.title)}`;
 refresh();window.scrollTo(0,0);
 try{history.replaceState(null,'','#'+id)}catch(e){}
}

function planText(m,w){const L=[`OMS Compass · ${m.title} · ${new Date().toLocaleDateString()}`];
 w.steps.forEach(s=>{if(s.note)return;L.push(`- ${s.n.q} ${s.val?'Yes':'No'}${s.auto?' (from entered data)':''}`)});
 if(w.out){L.push(`Plan: ${w.out.out}`);if(w.out.ex)L.push(w.out.ex);w.steps.filter(s=>s.note).forEach(s=>L.push(`${s.n.t}: ${s.n.x}`))}
 L.push('Decision support only; clinician judgment applies.');return L.join('\n')}
function showCopy(t){const x=document.getElementById('copybox');if(!x)return;x.hidden=false;x.value=t;x.focus();x.select()}
/* ===== Events ===== */
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view)return view(b.dataset.view);
 if(b.dataset.asa){S.asa=b.dataset.asa==='3'?'3':'12';return rebody()}
 if(b.dataset.rc!=null){const rc=S.rcri=S.rcri||{};rc[b.dataset.rc]=!rc[b.dataset.rc];return rebody()}
 if(b.dataset.open)return open(b.dataset.open);
 if(b.dataset.em){S.emOpen=b.dataset.em;view('emergency');const d=document.getElementById('em-'+b.dataset.em);d&&d.scrollIntoView({block:'start'});return}
 if(b.dataset.reff){S.refq=b.dataset.reff;return view('ref')}
 if(b.dataset.ho){S.hoOpen=b.dataset.ho;view('handouts');const d=document.getElementById('ho-'+b.dataset.ho);d&&d.scrollIntoView({block:'start'});return}
 if(b.dataset.lang){S.lang=b.dataset.lang;return rebody()}
 if(b.dataset.site){S.site=b.dataset.site;return rebody()}
 if(b.dataset.share)return shareHO(b.dataset.share,b);
 if(b.hasAttribute('data-home')){try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}return home()}
 const id=S.mod;if(!id)return;
 if(b.hasAttribute('data-copy')){const m=M(id),w=walk(m),t=planText(m,w);try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied'},()=>showCopy(t))}catch(x){showCopy(t)}return}
 if(b.hasAttribute('data-reset')){S.ans[id]={};S.inp[id]={};return open(id)}
 if(b.dataset.a){const a=S.ans[id]=S.ans[id]||{};const v=b.dataset.v==='1';a[b.dataset.a]=v;refresh();
  if(!b.closest('.path')){const f=document.getElementById('flow').lastElementChild;f&&f.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
 const i=S.inp[id]=S.inp[id]||{};
 if(b.dataset.sb){const k='sb_'+b.dataset.sb;i[k]=!i[k];i.sbTouched=true;b.classList.toggle('on',i[k]);b.setAttribute('aria-pressed',i[k]);refresh();return}
 if(b.dataset.flag){const k=b.dataset.flag;i[k]=!i[k];b.classList.toggle('on',i[k]);b.setAttribute('aria-pressed',i[k]);refresh();return}
});
app.addEventListener('input',e=>{const el=e.target;if(el.hasAttribute('data-q')){S.q=el.value.trim();const h=document.getElementById('hits'),g=document.getElementById('groups');h.innerHTML=S.q?hitsHTML(S.q):'';g.hidden=!!S.q;return}if(el.hasAttribute('data-refq')){S.refq=el.value;return rebody()}if(el.hasAttribute('data-wt')){const v=num(el.value);S.wt=v&&v>0&&v<400?v:null;return rebody()}if(!el.dataset.in||!S.mod)return;const i=S.inp[S.mod]=S.inp[S.mod]||{};i[el.dataset.in]=el.value;refresh()});
app.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.in&&S.mod){const i=S.inp[S.mod]=S.inp[S.mod]||{};i[el.dataset.in]=el.value;refresh()}});

const start=(location.hash||'').slice(1);
const go=()=>start==='emergency'||start==='calc'||start==='ref'||start==='new'||start==='handouts'?view(start):M(start)?open(start):home();
acked()?go():gate(go);
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>

</body></html>
