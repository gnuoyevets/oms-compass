{id:"ext",src:["mcgill"],t:{"en":"After tooth removal","es":"Después de una extracción dental","kea":"Dipôs di tira denti","zh":"拔牙后须知"},i:{
en:["Bleeding: bite firmly on the gauze for 30 minutes. Oozing for 1–2 days is normal. If heavier, sit up and bite on fresh folded gauze or a damp black tea bag for 30–60 minutes.","Swelling: ice the cheek 20 minutes on, 20 off, for 36 hours, then moist heat. It peaks on day 2–3. Sleep with your head raised for 2 nights.","First 24 hours: no rinsing, spitting or straws; they can dislodge the blood clot.","No smoking or vaping for at least 72 hours, ideally 1 week; it raises the risk of a painful dry socket.","From day 2: rinse gently with warm salt water (½ teaspoon in 1 cup) after meals and at bedtime, and brush gently. Augma Shield graft: prescribed rinse only, no salt water.","Diet: soft foods for 2 weeks; nothing hard, crunchy or seedy (nuts, chips, popcorn) for 3 weeks. Eat protein, don’t skip meals, and drink plenty of fluids.","Pain Medication Instructions\nFirst 24–48 hours: take both together every 6 hours, with food or a snack, ideally starting before the numbness wears off:\n• Advil (ibuprofen) 400 mg — two 200 mg tablets\n• Tylenol (acetaminophen) 500 mg — one Extra Strength tablet\nAfter that, take them only as needed for pain.\nDaily maximum: ibuprofen 2,400 mg (only if your surgeon directs); acetaminophen 3,000 mg.\nDo not add other products containing ibuprofen, NSAIDs or acetaminophen without asking us.\nCall us if pain gets much worse after improving, or the medicines do not help enough.","Skip ibuprofen with kidney disease, stomach ulcers, a blood thinner, pregnancy, or an aspirin or ibuprofen allergy. Skip Tylenol with liver disease, heavy drinking, or if your prescription pill already contains acetaminophen (for example, Percocet).","Finish any antibiotic; if you get a rash, stop it and call us. No alcohol for 24 hours or while taking opioids. Sit up for 1 minute before standing.","Nausea: nothing by mouth for 1 hour, then sip ginger ale or tea.","Normal: bruising (day 2–3), stiff jaw, sore throat, sharp bony edges, dry lip corners (use Vaseline). Stitches dissolve; the socket fills in over about 1 month.","Call us: bleeding that pressure won’t stop; pain or swelling worse after day 3, or throbbing pain toward the ear (dry socket); fever over 100.4°F (38°C); pus or bad taste; numbness the next day.","Trouble breathing or swallowing: call 911."],
es:["Sangrado: muerda firmemente la gasa por 30 minutos. Un sangrado leve por 1–2 días es normal. Si sangra más: siéntese derecho y muerda gasa limpia doblada o una bolsita de té negro húmeda por 30–60 minutos.","Hinchazón: hielo en la mejilla 20 minutos sí y 20 no por 36 horas; después, calor húmedo. La hinchazón es mayor el día 2–3. Duerma con la cabeza elevada por 2 noches.","Primeras 24 horas: no se enjuague, no escupa y no use popotes (pajillas). Pueden desprender el coágulo.","No fume ni vapee por al menos 72 horas, idealmente 1 semana. Aumenta el riesgo de alveolitis seca, que es muy dolorosa.","Desde el día 2: enjuáguese suavemente con agua tibia con sal (½ cucharadita en 1 taza) después de comer y al acostarse. Cepíllese con cuidado. Injerto Augma Shield: use solo el enjuague recetado, sin agua con sal.","Dieta: comidas blandas por 2 semanas; nada duro, crujiente ni con semillas (nueces, papitas, palomitas) por 3 semanas. Coma proteína, no se salte comidas y tome muchos líquidos.","Instrucciones para los medicamentos para el dolor\nPrimeras 24–48 horas: tome ambos juntos cada 6 horas, con comida o un refrigerio, de preferencia antes de que se pase la anestesia:\n• Advil (ibuprofeno) 400 mg — 2 tabletas de 200 mg\n• Tylenol (acetaminofén) 500 mg — 1 tableta Extra Strength\nDespués, tómelos solo si los necesita para el dolor.\nMáximo al día: ibuprofeno 2,400 mg (solo si su cirujano lo indica); acetaminofén 3,000 mg.\nNo tome otros productos con ibuprofeno, antiinflamatorios (AINE) o acetaminofén sin consultarnos.\nLlámenos si el dolor empeora mucho después de mejorar, o si los medicamentos no alivian lo suficiente.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado, bebe mucho alcohol o su pastilla recetada ya contiene acetaminofén (por ejemplo, Percocet).","Termine el antibiótico; si le sale un sarpullido, suspéndalo y llámenos. No tome alcohol por 24 horas ni mientras tome opioides. Siéntese 1 minuto antes de ponerse de pie.","Náuseas: nada por la boca durante 1 hora; luego tome sorbos de ginger ale o té.","Es normal: moretones (día 2–3), rigidez de la mandíbula, dolor de garganta, bordes de hueso filosos y comisuras secas (use vaselina). Los puntos se disuelven solos; el alvéolo se rellena en aproximadamente 1 mes.","Llámenos si tiene: sangrado que no para con presión; dolor o hinchazón que empeora después del día 3, o dolor pulsátil hacia el oído (alveolitis seca); fiebre de más de 100.4°F (38°C); pus o mal sabor; adormecimiento al día siguiente.","Dificultad para respirar o tragar: llame al 911."],
kea:["Sangi: morde firmi na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal. Si sangi txeu: senta direitu i morde un gaza linpu dobradu, o un saketa di xá pretu moladu, pa 30–60 minutu.","Inxason: jelu na fasi 20 minutu, tira 20, duranti 36 ora; dipôs, kalor úmidu. Inxason ta fika más grandi na dia 2–3. Dormi ku kabesa altu pa 2 noti.","Purmeru 24 ora: ka bu lava boka, ka bu kuspi i ka bu uza palinha. Es kuzas pode tira kuágulu.","Ka bu fuma nen uza vape pa pelo menus 72 ora, midjór 1 simana. Ta aumenta risku di alvéolu seku, ki ta dói txeu.","A partir di dia 2: lava boka divagarinhu ku agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi i óra di bai dormi. Skova ku kuidadu. Enxertu Augma Shield: uza só rémédiu di lava boka ki nu pasa-bu, sen agu ku sal.","Kumida: kumida mol pa 2 simana; nada duru, ki ta stala o ku simenti (nozis, xips, pipoka) pa 3 simana. Kumi proteína, ka bu salta kumida i bebe txeu líkidu.","Instruson pa rémédiu di dor\nPurmeru 24–48 ora: toma es dos djuntu di 6 en 6 ora, ku kumida o un lanxi, midjór antis di anestezia pasa:\n• Advil (ibuprofénu) 400 mg — 2 kumprimidu di 200 mg\n• Tylenol (asetaminofénu) 500 mg — 1 kumprimidu Extra Strength\nDipôs, toma-s só si bu mesté pa dor.\nMásimu pa dia: ibuprofénu 2,400 mg (só si bu sirurjion manda); asetaminofénu 3,000 mg.\nKa bu toma otu rémédiu ku ibuprofénu, anti-inflamatóriu (AINE) o asetaminofénu sen purgunta-nu.\nTxoma-nu si dor fika txeu más pior dipôs di dja midjora, o si rémédiu ka ta tira dor sufisienti.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma anti-koagulanti, si bu sta grávida o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu, si bu ta bebe txeu, o si bu rémédiu di reseita dja ten asetaminofénu (pur izénplu Percocet).","Toma antibiótiku ti kaba; si bu tene manxa na pele, para i txoma-nu. Ka bu bebe álkool pa 24 ora nen enkuantu bu ta toma opioidi. Senta 1 minutu antis di labanta.","Nóziu: nada na boka pa 1 ora; dipôs bebe golinhu di ginger ale o xá.","É normal: manxa roxu (dia 2–3), kexada duru, garganta dodu, pontas di osu fínu i kantu di boka seku (poi vazelina). Pontu ta dizolve sozinhu; buraku ta intxi na más o menus 1 mês.","Txoma-nu si: sangi ki ka ta para ku prison; dor o inxason ki ta piora dipôs di dia 3, o dor ki ta latejá pa ladu di orelha (alvéolu seku); febri más di 100.4°F (38°C); pus o gostu mau; dormensia na dia sigínti.","Si bu tene difikuldadi di rispira o di ingoli: txoma 911."],
zh:["出血：用力咬住纱布30分钟。1–2天内少量渗血属正常。出血较多：坐直，咬住折叠的干净纱布或浸湿的红茶包30–60分钟。","肿胀：头36小时在脸颊冷敷，敷20分钟、停20分钟；之后改为湿热敷。肿胀在第2–3天最明显。睡觉时垫高头部，持续2晚。","头24小时：不要漱口、吐口水或用吸管，以免血块脱落。","至少72小时内不要吸烟或吸电子烟，最好1周。吸烟会增加疼痛的干槽症风险。","从第2天起：饭后和睡前用温盐水（1杯水加½茶匙盐）轻轻漱口。轻轻刷牙。植入Augma Shield的：只用处方漱口水，不要用盐水。","饮食：吃软食2周；3周内不要吃硬的、脆的或有籽的食物（坚果、薯片、爆米花）。多吃蛋白质，不要不吃饭，多喝水。","止痛药服用说明\n术后头24–48小时：每6小时同时服用以下两种药，随餐或配点心，最好在麻药消退前开始：\n• 雅维（Advil，布洛芬）400毫克——200毫克片剂2片\n• 泰诺（Tylenol，对乙酰氨基酚）500毫克——加强型（Extra Strength）1片\n之后仅在疼痛时按需服用。\n每日最大剂量：布洛芬2,400毫克（仅在手术医生指示时）；对乙酰氨基酚3,000毫克。\n未经我们同意，不要另外服用含布洛芬、其他非甾体抗炎药（NSAID）或对乙酰氨基酚的药物。\n如疼痛好转后又明显加重，或药物止痛效果不够，请致电我们。","以下情况不要服用布洛芬：肾病、胃溃疡、服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。以下情况不要服用泰诺：肝病、大量饮酒，或处方药已含对乙酰氨基酚（例如Percocet）。","如开了抗生素，请服完全程；出现皮疹请停药并致电我们。24小时内及服用阿片类药物期间不要饮酒。起身前先坐1分钟。","恶心：1小时内不要经口进食任何东西；之后小口喝姜汁汽水或茶。","正常现象：淤青（第2–3天）、下颌僵硬、喉咙痛、尖锐骨边、嘴角干裂（可涂凡士林）。缝线会自行溶解；拔牙窝约1个月长满。","出现以下情况请致电我们：按压止不住的出血；第3天后疼痛或肿胀加重，或向耳朵方向的跳痛（干槽症）；发烧超过100.4°F（38°C）；有脓或口中异味；第二天仍然麻木。","呼吸或吞咽困难：请拨打911。"]}},
{id:"imp",src:["mcgill"],t:{"en":"After implant, bone graft or sinus lift surgery","es":"Después de implantes, injerto óseo o elevación de seno","kea":"Dipôs di implanti, enxertu di osu o levantamentu di seiu","zh":"种植牙、植骨或上颌窦提升术后须知"},i:{
en:["Bleeding: bite on the gauze for 30 minutes. Oozing for 1–2 days is normal.","Swelling: ice 20 minutes on, 20 off, for 36 hours, then moist heat. Sleep with your head raised for 2 nights.","Don’t touch the site with your tongue or fingers, or pull your lip to look.","Diet: don’t chew on the implant side for 3–4 weeks, or longer if we say. Implants on both sides: soft foods for 3–4 weeks. Nothing hard or crunchy.","Surgery day: no rinsing or spitting. From the next morning: Peridex rinse for 30 seconds twice a day, plus warm salt water (½ teaspoon in 1 cup) after meals; brush gently. Augma Shield graft: prescribed rinse only, no salt water.","Denture or flipper: leave it out as much as possible; it must not press on the site. Don’t eat with it until we adjust it.","Small sand-like graft granules may come out for a few days. This is normal.","Sinus lift: don’t blow your nose for 1 week. Sneeze with your mouth open. No straws. No flying for 2 weeks.","No smoking or vaping for at least 2 weeks (quitting is best); it raises the risk that the implant or graft fails.","Pain Medication Instructions\nFirst 24–48 hours: take both together every 6 hours, with food or a snack, ideally starting before the numbness wears off:\n• Advil (ibuprofen) 400 mg — two 200 mg tablets\n• Tylenol (acetaminophen) 500 mg — one Extra Strength tablet\nAfter that, take them only as needed for pain.\nDaily maximum: ibuprofen 2,400 mg (only if your surgeon directs); acetaminophen 3,000 mg.\nDo not add other products containing ibuprofen, NSAIDs or acetaminophen without asking us.\nCall us if pain gets much worse after improving, or the medicines do not help enough.","Skip ibuprofen with kidney disease, stomach ulcers, a blood thinner, pregnancy, or an aspirin or ibuprofen allergy. Skip Tylenol with liver disease, heavy drinking, or if your prescription pill already contains acetaminophen (for example, Percocet).","Finish any antibiotic; if you get a rash, stop it and call us.","Call us: bleeding that won’t stop; pain or swelling worse after day 3; fever; pus; a loose healing cap; exposed graft or membrane; air or fluid passing between mouth and nose; numbness the next day.","Trouble breathing or swallowing: call 911."],
es:["Sangrado: muerda la gasa por 30 minutos. Es normal un poco de sangrado leve por 1–2 días.","Hinchazón: hielo 20 minutos sí y 20 no por 36 horas; después, calor húmedo. Duerma con la cabeza elevada por 2 noches.","No toque la zona con la lengua ni los dedos, ni jale el labio para mirar.","Dieta: no mastique del lado del implante por 3–4 semanas, o más si se lo indicamos. Implantes en ambos lados: comidas blandas por 3–4 semanas. Nada duro ni crujiente.","Día de la cirugía: no se enjuague ni escupa. Desde la mañana siguiente: enjuague recetado (Peridex) dos veces al día por 30 segundos, más agua tibia con sal (½ cucharadita en 1 taza) después de comer. Cepíllese con cuidado. Injerto Augma Shield: solo el enjuague recetado, sin agua con sal.","Dentadura o puente removible: déjelo fuera lo más posible. No debe presionar la zona. No coma con él hasta que lo ajustemos.","Pueden salir pequeños gránulos del injerto, como arena, por unos días. Es normal.","Elevación de seno: no se suene la nariz por 1 semana. Estornude con la boca abierta. No use popotes. No viaje en avión por 2 semanas.","No fume ni vapee por al menos 2 semanas; lo mejor es dejarlo. Fumar aumenta el riesgo de que fallen el implante o el injerto.","Instrucciones para los medicamentos para el dolor\nPrimeras 24–48 horas: tome ambos juntos cada 6 horas, con comida o un refrigerio, de preferencia antes de que se pase la anestesia:\n• Advil (ibuprofeno) 400 mg — 2 tabletas de 200 mg\n• Tylenol (acetaminofén) 500 mg — 1 tableta Extra Strength\nDespués, tómelos solo si los necesita para el dolor.\nMáximo al día: ibuprofeno 2,400 mg (solo si su cirujano lo indica); acetaminofén 3,000 mg.\nNo tome otros productos con ibuprofeno, antiinflamatorios (AINE) o acetaminofén sin consultarnos.\nLlámenos si el dolor empeora mucho después de mejorar, o si los medicamentos no alivian lo suficiente.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado, bebe mucho alcohol o su pastilla recetada ya contiene acetaminofén (por ejemplo, Percocet).","Termine el antibiótico. Si le sale un sarpullido, suspéndalo y llámenos.","Llámenos si tiene: sangrado que no para; dolor o hinchazón que empeora después del día 3; fiebre; pus; un tornillo de cicatrización flojo; injerto o membrana expuestos; paso de aire o líquido entre la boca y la nariz; adormecimiento al día siguiente.","Dificultad para respirar o tragar: llame al 911."],
kea:["Sangi: morde na gaza pa 30 minutu. Un bokadinhu di sangi pa 1–2 dia é normal.","Inxason: jelu 20 minutu, tira 20, duranti 36 ora; dipôs, kalor úmidu. Dormi ku kabesa altu pa 2 noti.","Ka bu toka na lugar ku língua o ku dedu, nen ka bu puxa lábiu pa djobe.","Kumida: ka bu mastiga di ladu di implanti pa 3–4 simana, o más si nu fla-bu. Implanti na dos ladu: kumida mol pa 3–4 simana. Nada duru nen ki ta stala.","Dia di sirurjia: ka bu lava boka nen ka bu kuspi. A partir di palmanhan sigínti: rémédiu di lava boka (Peridex) 2 bes pa dia pa 30 sigundu, i agu mornu ku sal (½ kudjer di xá na 1 kopu) dipôs di kumi. Skova ku kuidadu. Enxertu Augma Shield: só rémédiu di lava boka, sen agu ku sal.","Dentadura o ponti di tira-poi: dexa-l fora más ki bu pode. E ka debe karga riba di lugar. Ka bu kumi ku el ti nu djusta-l.","Pode sai pedasinhu pikinoti di enxertu, sima areia, duranti uns dia. É normal.","Levantamentu di seiu: ka bu asua naris pa 1 simana. Spirra ku boka abertu. Ka bu uza palinha. Ka bu bua di avion pa 2 simana.","Ka bu fuma nen uza vape pa pelo menus 2 simana; midjór é dexa di bes. Fuma ta aumenta risku di implanti o enxertu fadja.","Instruson pa rémédiu di dor\nPurmeru 24–48 ora: toma es dos djuntu di 6 en 6 ora, ku kumida o un lanxi, midjór antis di anestezia pasa:\n• Advil (ibuprofénu) 400 mg — 2 kumprimidu di 200 mg\n• Tylenol (asetaminofénu) 500 mg — 1 kumprimidu Extra Strength\nDipôs, toma-s só si bu mesté pa dor.\nMásimu pa dia: ibuprofénu 2,400 mg (só si bu sirurjion manda); asetaminofénu 3,000 mg.\nKa bu toma otu rémédiu ku ibuprofénu, anti-inflamatóriu (AINE) o asetaminofénu sen purgunta-nu.\nTxoma-nu si dor fika txeu más pior dipôs di dja midjora, o si rémédiu ka ta tira dor sufisienti.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma anti-koagulanti, si bu sta grávida o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu, si bu ta bebe txeu, o si bu rémédiu di reseita dja ten asetaminofénu (pur izénplu Percocet).","Toma antibiótiku ti kaba. Si bu tene manxa na pele, para i txoma-nu.","Txoma-nu si: sangi ki ka ta para; dor o inxason ki ta piora dipôs di dia 3; febri; pus; tanpa di kikatrizason mole; enxertu o membrana diskubertu; ar o líkidu ta pasa entri boka ku naris; dormensia na dia sigínti.","Si bu tene difikuldadi di rispira o di ingoli: txoma 911."],
zh:["出血：咬住纱布30分钟。1–2天内有少量渗血属正常现象。","肿胀：头36小时冷敷，敷20分钟、停20分钟；之后改为湿热敷。睡觉时垫高头部，持续2晚。","不要用舌头或手指碰触伤口，也不要拉开嘴唇查看。","饮食：3–4周内不要用种植体一侧咀嚼，如我们另有指示则更久。两侧都有种植体：吃软食3–4周。不要吃硬的或脆的食物。","手术当天：不要漱口或吐口水。从第二天早上起：每天2次用处方漱口水（Peridex）含漱30秒，饭后加用温盐水（1杯水加½茶匙盐）漱口。轻轻刷牙。植入Augma Shield的：只用处方漱口水，不要用盐水。","假牙或临时活动牙：尽量不戴，不能压到手术部位。在我们调整好之前，不要戴着它吃东西。","几天内可能会有像细沙一样的植骨颗粒掉出来，这是正常的。","上颌窦提升术：1周内不要擤鼻涕。打喷嚏时张开嘴。不要用吸管。2周内不要乘坐飞机。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体或植骨失败的风险。","止痛药服用说明\n术后头24–48小时：每6小时同时服用以下两种药，随餐或配点心，最好在麻药消退前开始：\n• 雅维（Advil，布洛芬）400毫克——200毫克片剂2片\n• 泰诺（Tylenol，对乙酰氨基酚）500毫克——加强型（Extra Strength）1片\n之后仅在疼痛时按需服用。\n每日最大剂量：布洛芬2,400毫克（仅在手术医生指示时）；对乙酰氨基酚3,000毫克。\n未经我们同意，不要另外服用含布洛芬、其他非甾体抗炎药（NSAID）或对乙酰氨基酚的药物。\n如疼痛好转后又明显加重，或药物止痛效果不够，请致电我们。","以下情况不要服用布洛芬：肾病、胃溃疡、服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。以下情况不要服用泰诺：肝病、大量饮酒，或处方药已含对乙酰氨基酚（例如Percocet）。","如开了抗生素，请服完全程。出现皮疹请停药并致电我们。","出现以下情况请致电我们：出血不止；第3天后疼痛或肿胀加重；发烧；有脓；愈合帽松动；植骨材料或膜外露；口腔与鼻腔之间有空气或液体相通；第二天仍有麻木。","呼吸或吞咽困难：请拨打911。"]}},
{id:"arch",src:["mcgill"],t:{"en":"After full-arch (fixed teeth same day) surgery","es":"Después de cirugía de arcada completa (dientes fijos el mismo día)","kea":"Dipôs di sirurjia di arkada interu (denti fixu na mesmu dia)","zh":"全口种植（当天固定牙）术后须知"},i:{
en:["First 2 days: gauze, ice and head raised, as for any oral surgery.","Your new teeth are temporary and fixed in place. Don’t try to remove them.","Diet: liquids and very soft food for 2 weeks, then fork-tender food until we clear you (usually about 3 months). Don’t bite hard food with your front teeth.","From about day 7: clean under the bridge twice a day with a water flosser on its lowest setting. Use the prescribed rinse.","No smoking or vaping for at least 2 weeks (quitting for good is best); it raises the risk that the implants fail.","Pain Medication Instructions\nFirst 24–48 hours: take both together every 6 hours, with food or a snack, ideally starting before the numbness wears off:\n• Advil (ibuprofen) 400 mg — two 200 mg tablets\n• Tylenol (acetaminophen) 500 mg — one Extra Strength tablet\nAfter that, take them only as needed for pain.\nDaily maximum: ibuprofen 2,400 mg (only if your surgeon directs); acetaminophen 3,000 mg.\nDo not add other products containing ibuprofen, NSAIDs or acetaminophen without asking us.\nCall us if pain gets much worse after improving, or the medicines do not help enough.","Skip ibuprofen with kidney disease, stomach ulcers, a blood thinner, pregnancy, or an aspirin or ibuprofen allergy. Skip Tylenol with liver disease, heavy drinking, or if your prescription pill already contains acetaminophen (for example, Percocet).","Speech and bite feel different for a few weeks; this is normal. Wear your night guard every night if we gave you one.","Call us: a loose, cracked or moving bridge; an uneven bite or one sore spot; swelling, pus or fever.","Keep every follow-up visit; they protect the implants while they heal."],
es:["Primeros 2 días: gasa, hielo y cabeza elevada, como en cualquier cirugía oral.","Sus dientes nuevos son provisionales y están fijos. No intente quitarlos.","Dieta: líquidos y comida muy blanda las primeras 2 semanas; después, comida que se pueda partir con un tenedor hasta que le demos el alta (por lo general unos 3 meses). No muerda comida dura con los dientes de enfrente.","Limpie debajo del puente dos veces al día con un irrigador de agua en su nivel más bajo, a partir del día 7 aproximadamente. Use el enjuague recetado.","No fume ni use cigarrillos electrónicos (vapeo) por al menos 2 semanas. Lo mejor es dejar de fumar por completo. Fumar aumenta el riesgo de que fallen los implantes.","Instrucciones para los medicamentos para el dolor\nPrimeras 24–48 horas: tome ambos juntos cada 6 horas, con comida o un refrigerio, de preferencia antes de que se pase la anestesia:\n• Advil (ibuprofeno) 400 mg — 2 tabletas de 200 mg\n• Tylenol (acetaminofén) 500 mg — 1 tableta Extra Strength\nDespués, tómelos solo si los necesita para el dolor.\nMáximo al día: ibuprofeno 2,400 mg (solo si su cirujano lo indica); acetaminofén 3,000 mg.\nNo tome otros productos con ibuprofeno, antiinflamatorios (AINE) o acetaminofén sin consultarnos.\nLlámenos si el dolor empeora mucho después de mejorar, o si los medicamentos no alivian lo suficiente.","No tome ibuprofeno si tiene enfermedad de los riñones o úlceras de estómago, toma un anticoagulante, está embarazada o es alérgico a la aspirina o al ibuprofeno. No tome Tylenol si tiene enfermedad del hígado, bebe mucho alcohol o su pastilla recetada ya contiene acetaminofén (por ejemplo, Percocet).","Su forma de hablar y su mordida se sentirán diferentes por unas semanas; es normal. Use su protector nocturno todas las noches si le dimos uno.","Llámenos si: el puente está flojo, roto o se mueve; la mordida se siente dispareja o duele en un punto; tiene hinchazón, pus o fiebre.","Asista a todas sus citas de control. Protegen los implantes mientras sanan."],
kea:["Purmeru 2 dia: gaza, jelu i kabesa altu, sima na kualker sirurjia di boka.","Bu denti novu é provizóriu i é fixu. Ka bu tenta tira-s.","Kumida: líkidu i kumida mutu mol duranti 2 purmeru simana; dipôs, kumida ki garfu ta parti fásil ti nu da-bu alta (normalmenti uns 3 mês). Ka bu morde kumida duru ku denti di frenti.","Linpa baxu di ponti 2 bes pa dia ku un irigador di agu na nível más baxu, a partir más o menus di dia 7. Uza rémédiu di lava boka ki nu pasa-bu.","Ka bu fuma nen ka bu uza sigaru eletróniku (vape) pa pelo menus 2 simana. Midjór é dexa di fuma di bes. Fuma ta aumenta risku di implanti fadja.","Instruson pa rémédiu di dor\nPurmeru 24–48 ora: toma es dos djuntu di 6 en 6 ora, ku kumida o un lanxi, midjór antis di anestezia pasa:\n• Advil (ibuprofénu) 400 mg — 2 kumprimidu di 200 mg\n• Tylenol (asetaminofénu) 500 mg — 1 kumprimidu Extra Strength\nDipôs, toma-s só si bu mesté pa dor.\nMásimu pa dia: ibuprofénu 2,400 mg (só si bu sirurjion manda); asetaminofénu 3,000 mg.\nKa bu toma otu rémédiu ku ibuprofénu, anti-inflamatóriu (AINE) o asetaminofénu sen purgunta-nu.\nTxoma-nu si dor fika txeu más pior dipôs di dja midjora, o si rémédiu ka ta tira dor sufisienti.","Ka bu toma ibuprofénu si bu ten duénsa di rin o úlsera na stómagu, si bu ta toma anti-koagulanti, si bu sta grávida o si bu é alérjiku a aspirina o ibuprofénu. Ka bu toma Tylenol si bu ten duénsa di fígadu, si bu ta bebe txeu, o si bu rémédiu di reseita dja ten asetaminofénu (pur izénplu Percocet).","Bu manera di papia i bu mordida ta xinti diferenti pa algun simana; é normal. Uza bu protetor di noti tudu noti si nu da-bu un.","Txoma-nu si: ponti sta mole, rakadu o ta mexe; mordida ta xinti dizigual o ta dói na un pontu; inxason, pus o febri.","Ben pa tudu bu konsulta di kontrolu. Es ta proteje implantis enkuantu es ta kura."],
zh:["头2天：与其他口腔手术一样，咬纱布、冷敷并垫高头部。","您的新牙是临时的，并且是固定的。不要试图自行取下。","饮食：头2周吃流质和非常软的食物；之后吃用叉子就能轻松分开的软食，直到我们通知您可以恢复正常饮食（通常约3个月）。不要用前牙咬硬的食物。","大约从第7天起，每天2次用冲牙器（调到最低档）清洁牙桥下方。使用我们开的漱口水。","至少2周内不要吸烟或吸电子烟，最好彻底戒烟。吸烟会增加种植体失败的风险。","止痛药服用说明\n术后头24–48小时：每6小时同时服用以下两种药，随餐或配点心，最好在麻药消退前开始：\n• 雅维（Advil，布洛芬）400毫克——200毫克片剂2片\n• 泰诺（Tylenol，对乙酰氨基酚）500毫克——加强型（Extra Strength）1片\n之后仅在疼痛时按需服用。\n每日最大剂量：布洛芬2,400毫克（仅在手术医生指示时）；对乙酰氨基酚3,000毫克。\n未经我们同意，不要另外服用含布洛芬、其他非甾体抗炎药（NSAID）或对乙酰氨基酚的药物。\n如疼痛好转后又明显加重，或药物止痛效果不够，请致电我们。","以下情况不要服用布洛芬：肾病、胃溃疡、服用抗凝血药、怀孕，或对阿司匹林或布洛芬过敏。以下情况不要服用泰诺：肝病、大量饮酒，或处方药已含对乙酰氨基酚（例如Percocet）。","几周内您说话和咬合的感觉会有所不同，这是正常的。如果我们给了您夜间护牙套，请每晚佩戴。","出现以下情况请致电我们：牙桥松动、破裂或移动；咬合不平或某一点疼痛；肿胀、有脓或发烧。","请按时参加每次复诊。复诊可在愈合期间保护种植体。"]}},
{id:"presed",src:["fast","glp1"],t:{"en":"Before IV sedation","es":"Antes de la sedación intravenosa","kea":"Antis di sedason na veia","zh":"静脉镇静前须知"},i:{
en:["No solid food, milk or gum for 8 hours before your appointment.","Clear liquids (water, apple juice, black coffee or tea, no milk) are OK until 2 hours before. Then nothing.","Medicines: ask us which usual medicines to take, with a sip of water. Tell us if you take a blood thinner or a weekly diabetes or weight-loss shot (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity).","No smoking or vaping for at least 2 days and no cannabis (smoked, vaped or edible) for 3 days before.","A responsible adult must come with you, stay in the office, and drive you home. No driving or machinery for at least 24 hours after sedation.","Wear loose sleeves that roll above the elbow, and flat shoes. Remove contacts, jewelry and dentures. No nail polish or heavy makeup.","Sick before your appointment (cold, fever, vomiting)? Call us."],
es:["Comida: nada de comida sólida, leche ni chicle durante 8 horas antes de su cita.","Puede tomar líquidos claros hasta 2 horas antes: agua, jugo de manzana, café o té negro (sin leche). Después, nada.","Medicinas: pregúntenos cuáles de sus medicinas habituales debe tomar y tómelas con un sorbo de agua. Avísenos si toma un anticoagulante o usa una inyección semanal para la diabetes o para bajar de peso (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity).","No fume ni vapee por al menos 2 días, ni use cannabis (fumado, vapeado o comestible) por 3 días antes.","Un adulto responsable debe acompañarlo, quedarse en la oficina y llevarlo a casa. No maneje ni use maquinaria durante al menos 24 horas después de la sedación.","Use mangas holgadas que se puedan subir por encima del codo y zapatos bajos. Quítese lentes de contacto, joyas y dentaduras. Sin esmalte de uñas ni mucho maquillaje.","Si se enferma antes de su cita (resfriado, fiebre, vómitos), llámenos."],
kea:["Kumida: nada di kumida sólidu, leti o txikleti duranti 8 ora antis di bu konsulta.","Líkidu klaru é dretu ti 2 ora antis: agu, sumu di masan, kafé o xá pretu (sen leti). Dipôs, nada.","Rémédiu: purgunta-nu kal di bu rémédiu di kada dia ki bu debe toma, i toma-s ku un golinhu di agu. Fla-nu si bu ta toma anti-koagulanti o un injeson di simana pa diabetis o pa perde pézu (Ozempic, Wegovy, Mounjaro, Zepbound, Trulicity).","Ka bu fuma nen uza vape pa pelo menus 2 dia, i ka bu uza kanábis (fumadu, vape o kumida) pa 3 dia antis.","Un adultu rasponsável ten ki ben ku bu, fika na ofisina i leba-bu kasa. Ka bu kondus nen uza mákina pa pelo menus 24 ora dipôs di sedason.","Bisti manga largu ki ta subi riba di kotovelu i sapatu baxu. Tira lenti di kontatu, joia i dentadura. Sen verniz di unha nen txeu maquiaji.","Si bu fika duenti antis di bu konsulta (konstipason, febri, vómitu), txoma-nu."],
zh:["饮食：预约前8小时内不要吃固体食物、喝牛奶或嚼口香糖。","术前2小时之前可以喝清澈的液体：水、苹果汁、黑咖啡或清茶（不加牛奶）。之后什么都不要喝。","药物：请问我们平时的药物中哪些要照常服用，并用一小口水送服。如果您服用抗凝血药，或每周注射一次治疗糖尿病或减重的药物（Ozempic、Wegovy、Mounjaro、Zepbound、Trulicity），请告诉我们。","术前至少2天内不要吸烟或吸电子烟；术前3天内不要使用大麻（吸食、电子烟或食用）。","必须由一名负责任的成年人陪同前来，留在诊所并开车送您回家。镇静后至少24小时内不要开车或操作机器。","穿袖子能卷到手肘以上的宽松衣服和平底鞋。取下隐形眼镜、首饰和假牙。不要涂指甲油或浓妆。","如果您在预约前生病（感冒、发烧、呕吐），请致电我们。"]}},
{id:"sed",src:["hsdm"],t:{"en":"After IV sedation","es":"Después de la sedación intravenosa","kea":"Dipôs di sedason na veia","zh":"静脉镇静后须知"},i:{
en:["A responsible adult must take you home and stay with you the rest of the day (at least 4 hours).","For at least 24 hours: no driving, machinery, stove cooking, important decisions or signing documents. No alcohol for 24 hours, and no driving while taking opioid pain medicine.","Do not care for young children alone today.","Start with sips of clear fluids, then light food. Nausea: small sips; ginger ale can help.","Rest with your head raised. Feeling sleepy or forgetful today is normal.","A small bruise at the IV site is normal. Call us for a red, painful streak or swelling in the arm.","Call 911: trouble breathing, cannot be woken, or chest pain."],
es:["Un adulto responsable debe llevarlo a casa y quedarse con usted el resto del día (al menos 4 horas).","Durante al menos 24 horas después de la sedación intravenosa: no maneje, no use maquinaria, no cocine en la estufa, ni tome decisiones importantes o firme documentos. No tome alcohol por 24 horas. No maneje mientras tome analgésicos opioides.","No cuide solo a niños pequeños hoy.","Empiece con sorbos de líquidos claros y luego comida ligera. Si tiene náuseas, tome sorbos pequeños; el ginger ale puede ayudar.","Descanse con la cabeza elevada. Puede sentirse con sueño u olvidadizo hoy.","Es normal un pequeño moretón donde estuvo el suero. Llámenos si hay una línea roja y dolorosa o hinchazón en el brazo.","Llame al 911 si: le cuesta respirar, no se puede despertar o tiene dolor en el pecho."],
kea:["Un adultu rasponsável ten ki leba-bu kasa i fika ku bu resta di dia (pelo menus 4 ora).","Pa pelo menus 24 ora dipôs di sedason na veia: ka bu kondus, ka bu uza mákina, ka bu kuzinha na fogon, nen ka bu toma disizon importanti o sina dokumentu. Ka bu bebe álkool pa 24 ora. Ka bu kondus enkuantu bu sta ta toma rémédiu pa dor opioidi.","Oji ka bu toma konta di mininu pikinoti sozinhu.","Kumesa ku golinhu di líkidu klaru, dipôs kumida leve. Si bu sta ku nóziu, bebe golinhu pikinoti; ginger ale pode djuda.","Diskansa ku kabesa altu. Oji bu pode xinti ku sonu o skesedu.","Un manxa roxu pikinoti na lugar di soru é normal. Txoma-nu si bu tene un risku burmedju ki ta dói o inxason na brasu.","Txoma 911 si: difikuldadi di rispira, ka ta kunsigi korda, o dor na pextu."],
zh:["必须由一名负责任的成年人送您回家，并在当天余下时间陪伴您（至少4小时）。","静脉镇静后至少24小时内：不要开车、操作机器、用炉灶做饭，也不要做重要决定或签署文件。24小时内不要饮酒。服用阿片类止痛药期间不要开车。","今天不要独自照顾幼儿。","先小口喝清澈的液体，再吃清淡的食物。如有恶心，请小口慢喝；姜汁汽水可能有帮助。","休息时垫高头部。今天您可能会感到困倦或健忘。","静脉输液处有小块淤青是正常的。如手臂出现发红、疼痛的条纹或肿胀，请致电我们。","请拨打911：呼吸困难、叫不醒，或胸痛。"]}}];
/* ===== Patient FAQs: procedures and diagnoses (EN/ES/Kriolu/中文; a language missing from FAQ_LANGS shows English). Each item is [question, answer]. ===== */
const FAQ_LANGS=['en','es','kea','zh'];
const FAQ=[
{id:"fwis",k:"proc",src:["third"],t:{"en":"Wisdom teeth removal","es":"Extracción de muelas del juicio","kea":"Tira denti di juízu","zh":"拔除智齿"},i:{
en:[["Why remove them?","Wisdom teeth often lack room to come in. They can cause infection, decay or gum disease in the tooth next to them, or cysts. We recommend removal when there is a problem now or a high chance of one later."],["Is there a best age?","Usually the late teens or early twenties. Roots are shorter and bone is softer, so healing is faster and nerve risk is lower."],["Will I be awake?","You choose with us: local numbing only, or IV sedation so you are relaxed and remember little."],["How long is recovery?","Swelling peaks on day 2–3. Most people return to school or work in 3–5 days. Soft food for about 2 weeks."],["What are the risks?","Swelling, bruising and dry socket are the most common. Lower teeth sit near a nerve; numbness of the lip, chin or tongue can occur and is usually temporary. Upper teeth sit near the sinus. We will review your own risk from your X-rays."]],
es:[["¿Por qué sacarlas?","Las muelas del juicio a menudo no tienen espacio para salir. Pueden causar infección, caries o enfermedad de las encías en la muela de al lado, o quistes. Recomendamos sacarlas cuando ya hay un problema o hay mucha probabilidad de que lo haya."],["¿Hay una edad ideal?","Por lo general, al final de la adolescencia o a principios de los 20 años. Las raíces son más cortas y el hueso más blando, así que se sana más rápido y hay menos riesgo para el nervio."],["¿Estaré despierto?","Usted decide con nosotros: solo anestesia local, o sedación intravenosa para estar relajado y recordar poco."],["¿Cuánto dura la recuperación?","La hinchazón es mayor el día 2–3. La mayoría vuelve a la escuela o al trabajo en 3–5 días. Comida blanda por unas 2 semanas."],["¿Cuáles son los riesgos?","Lo más común es hinchazón, moretones y alveolitis seca. Las muelas de abajo están cerca de un nervio; puede haber adormecimiento del labio, la barbilla o la lengua, que por lo general es temporal. Las de arriba están cerca del seno. Revisaremos su riesgo en sus radiografías."]],
kea:[["Pamodi ki nu ta tira-s?","Txeu bes denti di juízu ka ten spasu pa nase. Es pode djunta infeson, kári o duensa di jenjiva na denti di ladu, o kistu. Nu ta rakomenda tira-s ora ki dja ten un prubléma, o si ten txeu xansi di ten un dipôs."],["Ten un idadi midjór?","Normalmenti na fin di adoleséncia o na komésu di 20 anu. Raís é más kurtu i osu é más mol, entón ta kura más rápidu i risku pa nérvu é más baxu."],["N ta fika korda?","Bu ta disidi ku nos: só aneztezia lokal, o sedason na veia pa bu fika rilaxadu i lembra pouku."],["Kantu tenpu ta leba pa rekupera?","Inxason ta fika más grandi na dia 2–3. Má párti di genti ta volta pa skóla o trabadju na 3–5 dia. Kumida mol pa más o menus 2 simana."],["Kuze ki é risku?","Kuza más kumun é inxason, manxa roxu i alvéolu seku. Denti di baxu sta pertu di un nérvu; lábiu, kexu o língua pode fika dromidu, má normalmenti é pa un tenpu só. Denti di riba sta pertu di seiu. Nu ta odja bu risku na bu raio-X."]],
zh:[["为什么要拔除？","智齿常常没有足够的空间长出来。它们可能引起感染、邻牙龋坏或牙周病，或形成囊肿。如果现在已有问题，或将来很可能出现问题，我们建议拔除。"],["有最佳年龄吗？","通常是十几岁后期或二十出头。这时牙根较短、骨质较软，愈合更快，神经受损的风险也更低。"],["我会是清醒的吗？","您可以和我们一起决定：只用局部麻醉，或用静脉镇静让您放松，术后几乎不记得过程。"],["恢复需要多久？","肿胀在第2–3天最明显。大多数人3–5天后可以回到学校或工作。吃软食约2周。"],["有哪些风险？","最常见的是肿胀、淤青和干槽症。下颌智齿靠近神经，可能出现嘴唇、下巴或舌头麻木，通常是暂时的。上颌智齿靠近上颌窦。我们会根据您的X光片评估您的个人风险。"]]}},
{id:"fimp",k:"proc",src:["iti18"],t:{"en":"Dental implants","es":"Implantes dentales","kea":"Implanti dentáriu","zh":"种植牙"},i:{
en:[["What is an implant?","A small titanium or zirconia post placed in the jawbone. It acts like a tooth root and holds a crown, bridge or denture."],["Does it hurt?","Most people say it hurts less than a tooth removal. Over-the-counter pain medicine is usually enough for 2–3 days."],["How long until I get my tooth?","The bone usually needs about 2–6 months to bond to the implant. Sometimes a temporary tooth is placed the same day. Your plan depends on bone quality and how firm the implant is at surgery."],["How long do implants last?","Most last many years. Daily cleaning, regular checkups and not smoking give the best chance."],["Who is at higher risk of problems?","People who smoke, have poorly controlled diabetes, grind their teeth, or have past gum disease. Tell us about bone or cancer medicines and head and neck radiation."]],
es:[["¿Qué es un implante?","Un pequeño poste de titanio o zirconio que se coloca en el hueso. Funciona como la raíz de un diente y sostiene una corona, un puente o una dentadura."],["¿Duele?","La mayoría dice que duele menos que una extracción. Por lo general bastan analgésicos sin receta por 2–3 días."],["¿Cuánto falta para tener mi diente?","El hueso suele tardar unos 2–6 meses en unirse al implante. A veces se coloca un diente provisional el mismo día. Su plan depende de la calidad del hueso y de qué tan firme quede el implante en la cirugía."],["¿Cuánto duran los implantes?","La mayoría dura muchos años. Limpiarlos a diario, ir a sus controles y no fumar da la mejor probabilidad."],["¿Quién tiene más riesgo de problemas?","Las personas que fuman, tienen diabetes mal controlada, aprietan o rechinan los dientes, o han tenido enfermedad de las encías. Avísenos si toma medicinas para los huesos o el cáncer, o si recibió radiación en la cabeza o el cuello."]],
kea:[["Kuze ki é un implanti?","Un pinu pikinoti di titániu o zirkóniu ki ta poi na osu di kexada. E ta funsiona sima raís di denti i e ta sigura un koroa, un ponti o un dentadura."],["E ta dói?","Má párti di genti ta fla ma e ta dói ménus ki tira un denti. Normalmenti rémédiu pa dor sen reseta pa 2–3 dia ta txiga."],["Kantu tenpu ti N ten nha denti?","Osu normalmenti ta mesté más o menus 2–6 mês pa djunta ku implanti. Às bes ta poi un denti provizóriu na mesmu dia. Bu planu ta dipende di kualidadi di osu i di kantu firmi implanti fika na sirurjia."],["Kantu tenpu implanti ta dura?","Má párti ta dura txeu anu. Linpa-s tudu dia, bai konsulta di kontrolu i ka fuma ta da midjór xansi."],["Kenha ki ten más risku di prubléma?","Algen ki ta fuma, ki ten diabetis mal kontroladu, ki ta raspa o apérta denti, o ki dja tevi duensa di jenjiva. Fla-nu si bu ta toma rémédiu pa osu o pa kánser, o si bu dja toma radiason na kabesa o na pesku."]],
zh:[["什么是种植体？","一种放入颌骨中的小型钛或氧化锆柱体。它的作用像牙根，用来支撑牙冠、牙桥或假牙。"],["会痛吗？","大多数人说比拔牙还不痛。通常服用非处方止痛药2–3天就足够。"],["多久才能装上牙齿？","骨头通常需要约2–6个月与种植体结合。有时可以在手术当天装上临时牙。具体方案取决于骨质以及手术时种植体的稳固程度。"],["种植牙能用多久？","大多数能使用很多年。每天清洁、定期复查、不吸烟，效果最好。"],["哪些人更容易出现问题？","吸烟、糖尿病控制不佳、磨牙或紧咬牙，或曾有牙周病的人。如果您在服用骨质药物或抗癌药物，或头颈部接受过放疗，请告诉我们。"]]}},
{id:"fgraft",k:"proc",src:["mcgill"],t:{"en":"Bone grafting and socket preservation","es":"Injerto óseo y preservación del alvéolo","kea":"Enxertu di osu i preservason di alvéolu","zh":"植骨与牙槽窝保存"},i:{
en:[["Why do I need a graft?","After a tooth is removed, the bone shrinks. A graft keeps or rebuilds bone so an implant can be placed later."],["Where does the graft come from?","It may be your own bone, donor bone, animal bone, or a synthetic material. Donor and animal grafts are processed and sterilized. We will tell you which we used."],["Is it normal for grains to come out?","Yes. A few sand-like grains in the first days are normal. Call us if a large amount comes out or the site opens wide."],["How long does it take to heal?","Usually about 3–6 months before an implant, depending on the size of the graft."]],
es:[["¿Por qué necesito un injerto?","Después de sacar un diente, el hueso se encoge. El injerto mantiene o reconstruye el hueso para poder colocar un implante más adelante."],["¿De dónde viene el injerto?","Puede ser hueso propio, hueso de donante, hueso de origen animal o un material sintético. Los de donante y origen animal se procesan y esterilizan. Le diremos cuál usamos."],["¿Es normal que salgan granitos?","Sí. Unos granitos como arena en los primeros días es normal. Llámenos si sale mucho o la herida se abre bastante."],["¿Cuánto tarda en sanar?","Por lo general unos 3–6 meses antes del implante, según el tamaño del injerto."]],
kea:[["Pamodi N mesté un enxertu?","Dipôs di tira un denti, osu ta diminui. Enxertu ta manti o ta torna fazi osu pa pode poi un implanti más tardi."],["Di undi ki enxertu ta ben?","Pode ser bu própi osu, osu di un doador, osu di orijen animal o un material sintétiku. Kel di doador i di animal ta ser tratadu i sterilizadu. Nu ta fla-bu kal ki nu uza."],["É normal sai graunzinhu?","Sin. Uns graunzinhu sima areia na purmeru dia é normal. Txoma-nu si sai txeu o si feridu abri txeu."],["Kantu tenpu ta leba pa kura?","Normalmenti más o menus 3–6 mês antis di implanti, dipendi di tamanhu di enxertu."]],
zh:[["为什么需要植骨？","拔牙后骨头会萎缩。植骨可以保留或重建骨量，以便以后放置种植体。"],["植骨材料从哪里来？","可能是您自己的骨头、捐献者的骨头、动物来源的骨头，或人工合成材料。捐献者和动物来源的材料都经过处理和灭菌。我们会告诉您用的是哪一种。"],["有颗粒掉出来正常吗？","正常。头几天掉出少量像细沙一样的颗粒是正常的。如果掉出很多或伤口明显裂开，请致电我们。"],["需要多久愈合？","通常约3–6个月后可以放种植体，取决于植骨的大小。"]]}},
{id:"fsinus",k:"proc",src:["pjet","testori"],t:{"en":"Sinus lift","es":"Elevación de seno","kea":"Levantamentu di seiu","zh":"上颌窦提升术"},i:{
en:[["What is a sinus lift?","The sinus is an air space above the upper back teeth. When bone there is too thin, we gently lift the sinus lining and add bone graft so an implant has enough support."],["Will it affect my breathing or nose?","A stuffy nose or a little blood from the nose for a few days is common. Follow the sinus precautions in your instructions: do not blow your nose and sneeze with your mouth open."],["How long before the implant?","Sometimes the implant goes in the same day. Otherwise the graft heals for several months first."],["When should I call?","Call for fever, worsening sinus pain or pressure after day 3, thick bad-smelling nasal drainage, or graft grains coming from your nose."]],
es:[["¿Qué es una elevación de seno?","El seno es un espacio con aire arriba de las muelas de arriba. Si el hueso ahí es muy delgado, levantamos con cuidado la membrana del seno y ponemos injerto para que el implante tenga apoyo."],["¿Afectará mi nariz o mi respiración?","Es común tener la nariz tapada o sangrar un poco por la nariz unos días. Siga las precauciones de seno de sus instrucciones: no se suene la nariz y estornude con la boca abierta."],["¿Cuánto falta para el implante?","A veces el implante se coloca el mismo día. Si no, el injerto sana primero por varios meses."],["¿Cuándo debo llamar?","Llame si tiene fiebre, dolor o presión del seno que empeora después del día 3, secreción nasal espesa con mal olor, o granitos del injerto saliendo por la nariz."]],
kea:[["Kuze ki é levantamentu di seiu?","Seiu é un spasu ku ar riba di denti di trás di riba. Ora ki osu la é mutu finu, nu ta lebanta ku kuidadu membrana di seiu i nu ta poi enxertu di osu pa implanti ten apoiu sufisienti."],["E ta afeta nha nariz o nha rispirason?","Nariz intupidu o un bokadinhu di sangi na nariz pa alguns dia é kumun. Sigi kuidadu di seiu di bu instruson: ka bu asua nariz i spirra ku boka abértu."],["Kantu tenpu ti implanti?","Às bes implanti ta poi na mesmu dia. Si ka sta asin, enxertu ta kura purmeru pa alguns mês."],["Kuandu N debe txoma?","Txoma si bu tene febri, dor o presan na seiu ki ta piora dipôs di dia 3, katarru grosu ku txeru mau, o graunzinhu di enxertu ta sai na nariz."]],
zh:[["什么是上颌窦提升术？","上颌窦是上后牙上方的一个含气空腔。当那里的骨头太薄时，我们会轻轻抬起上颌窦的黏膜并植入骨粉，使种植体有足够的支撑。"],["会影响我的鼻子或呼吸吗？","几天内鼻塞或鼻子少量出血很常见。请遵守术后须知中的上颌窦注意事项：不要擤鼻涕，打喷嚏时张开嘴。"],["多久之后可以放种植体？","有时种植体在同一天放入。否则需要先让植骨愈合几个月。"],["什么时候应该打电话？","如果发烧、第3天后上颌窦疼痛或压迫感加重、鼻涕浓稠有异味，或有植骨颗粒从鼻子出来，请致电我们。"]]}},
{id:"farch",k:"proc",src:["fa6","schwarz"],t:{"en":"Full-arch implants (teeth in a day)","es":"Implantes de arcada completa (dientes en un día)","kea":"Implanti di arkada interu (denti na un dia)","zh":"全口种植（当天戴牙）"},i:{
en:[["What happens on surgery day?","Remaining failing teeth are removed and usually 4–6 implants are placed. In most cases a fixed temporary bridge is attached the same day."],["Can I take the teeth out?","No. They are fixed to the implants. Only we remove them, for checks and cleaning."],["When do I get my final teeth?","After the implants heal, usually about 3–6 months. Until then, follow the soft diet so the implants are not overloaded."],["Will it look and feel natural?","Speech and bite feel different for a few weeks, then most people adapt. The final bridge is shaped to your face and smile."],["How do I keep them for life?","Clean under the bridge daily, wear a night guard if we give you one, do not smoke, and keep every maintenance visit."]],
es:[["¿Qué pasa el día de la cirugía?","Se sacan los dientes que están fallando y por lo general se colocan 4–6 implantes. En la mayoría de los casos se fija un puente provisional el mismo día."],["¿Puedo quitarme los dientes?","No. Están fijos a los implantes. Solo nosotros los quitamos, para revisar y limpiar."],["¿Cuándo recibo mis dientes definitivos?","Cuando sanen los implantes, por lo general en unos 3–6 meses. Mientras tanto, siga la dieta blanda para no sobrecargar los implantes."],["¿Se verán y sentirán naturales?","El habla y la mordida se sienten diferentes por unas semanas; después la mayoría se acostumbra. El puente final se diseña según su cara y su sonrisa."],["¿Cómo los cuido de por vida?","Limpie debajo del puente cada día, use el protector nocturno si se lo damos, no fume y no falte a sus citas de mantenimiento."]],
kea:[["Kuze ki ta kontise na dia di sirurjia?","Nu ta tira denti ki sta ta fadja i normalmenti nu ta poi 4–6 implanti. Na má párti di kazu, nu ta fixa un ponti provizóriu na mesmu dia."],["N pode tira nha denti?","Nau. Es sta fixu na implanti. Só nos ki ta tira-s, pa djobe i pa linpa."],["Kuandu ki N ta ten nha denti definitivu?","Dipôs di implanti kura, normalmenti más o menus 3–6 mês. Ti la, sigi kumida mol pa ka sobrekarega implanti."],["E ta parse i e ta xinti natural?","Fala i mordida ta xinti diferenti pa alguns simana; dipôs má párti di genti ta kustuma. Ponti final ta fazedu di akordu ku bu fasi i bu sorizu."],["Modi ki N ta kuida dels pa tudu vida?","Linpa baxu di ponti tudu dia, uza protetor di noti si nu da-bu un, ka bu fuma i ka bu falta nenhun konsulta di manutenson."]],
zh:[["手术当天会做什么？","拔除剩余的坏牙，通常放入4–6颗种植体。大多数情况下当天会固定一副临时牙桥。"],["我可以自己取下这些牙吗？","不可以。它们固定在种植体上。只有我们会取下来做检查和清洁。"],["什么时候能装上永久牙？","种植体愈合后，通常约3–6个月。在此之前请遵守软食要求，以免种植体负担过重。"],["看起来和感觉会自然吗？","几周内说话和咬合会感觉不同，之后大多数人会适应。永久牙桥会根据您的脸型和笑容设计。"],["如何让它们用一辈子？","每天清洁牙桥下方，如果我们给了您夜间护牙套请戴上，不吸烟，并按时参加每次维护复诊。"]]}},
{id:"fsed",k:"proc",src:["fast","parcare"],t:{"en":"IV sedation","es":"Sedación intravenosa","kea":"Sedason na veia","zh":"静脉镇静"},i:{
en:[["Is IV sedation general anesthesia?","No. Medicine through a small IV in your arm makes you deeply relaxed and drowsy. You breathe on your own, and most people remember little of the procedure."],["How am I monitored?","We check your breathing, oxygen level, heart rate and blood pressure throughout, with emergency equipment ready."],["Why can’t I eat beforehand?","An empty stomach lowers the risk of food or liquid entering the lungs. Follow the fasting times on your “Before IV sedation” sheet."],["Why do I need a driver?","Sedation affects judgment and reaction time for the rest of the day, even if you feel fine. A responsible adult must take you home."],["Who should tell us more before sedation?","Tell us about sleep apnea, heart or lung disease, pregnancy, past anesthesia problems, and all medicines, especially blood thinners and weekly diabetes or weight-loss injections."]],
es:[["¿La sedación intravenosa es anestesia general?","No. La medicina por un pequeño suero en el brazo lo relaja mucho y le da sueño. Usted respira solo, y la mayoría recuerda poco del procedimiento."],["¿Cómo me vigilan?","Revisamos su respiración, nivel de oxígeno, pulso y presión arterial todo el tiempo, con equipo de emergencia listo."],["¿Por qué no puedo comer antes?","Con el estómago vacío hay menos riesgo de que comida o líquido pase a los pulmones. Siga los horarios de ayuno de su hoja “Antes de la sedación intravenosa”."],["¿Por qué necesito quien me lleve?","La sedación afecta el juicio y los reflejos el resto del día, aunque se sienta bien. Un adulto responsable debe llevarlo a casa."],["¿Qué debo contarles antes de la sedación?","Avísenos si tiene apnea del sueño, enfermedad del corazón o de los pulmones, embarazo, problemas con anestesia antes, y todas sus medicinas, sobre todo anticoagulantes e inyecciones semanales para la diabetes o para bajar de peso."]],
kea:[["Sedason na veia é aneztezia jeral?","Nau. Rémédiu pa un soru pikinoti na brasu ta poi-bu mutu rilaxadu i ku sonu. Bu ta rispira sozinhu, i má párti di genti ta lembra pouku di prusedimentu."],["Modi ki nu ta vijia-bu?","Nu ta vijia bu rispirason, nível di oxijéniu, batimentu di korason i tenson tudu tenpu, ku material di emerjénsia prontu."],["Pamodi N ka pode kumi antis?","Ku stómagu bazíu ten ménus risku di kumida o líkidu entra na pulmon. Sigi oráriu di jejun na bu fodja “Antis di sedason na veia”."],["Pamodi N mesté algen pa leba-m?","Sedason ta afeta juízu i riflexu pa resta di dia, mesmu si bu xinti dretu. Un adultu rasponsável ten ki leba-bu kasa."],["Kuze ki N debe fla-nu antis di sedason?","Fla-nu si bu ten apneia di sonu, duensa di korason o di pulmon, gravidés, prubléma ku aneztezia antis, i tudu bu rémédiu, prinsipalmenti anti-koagulanti i injeson di simana pa diabetis o pa perde pézu."]],
zh:[["静脉镇静是全身麻醉吗？","不是。通过手臂上的小静脉针给药，让您深度放松、昏昏欲睡。您自己呼吸，大多数人对手术过程记得很少。"],["你们如何监测我？","整个过程中我们会监测您的呼吸、血氧、心率和血压，并备好急救设备。"],["为什么术前不能吃东西？","空腹可以降低食物或液体进入肺部的风险。请遵守《静脉镇静前须知》上的禁食时间。"],["为什么需要有人送我回家？","即使您感觉良好，镇静也会影响当天余下时间的判断力和反应速度。必须由一名负责任的成年人送您回家。"],["镇静前需要告诉你们哪些情况？","如果您有睡眠呼吸暂停、心脏或肺部疾病、怀孕、以前麻醉出过问题，请告诉我们，并告知所有用药，尤其是抗凝血药和每周注射一次的糖尿病或减重药物。"]]}},
{id:"fbx",k:"proc",src:["usc","dysp"],t:{"en":"Biopsy","es":"Biopsia","kea":"Biópsia","zh":"活检"},i:{
en:[["What is a biopsy?","We remove a small piece of tissue, or the whole spot if it is small, and send it to a pathologist who examines it under a microscope."],["Does it mean I have cancer?","No. Most mouth biopsies are not cancer. A biopsy is the only way to know for sure what a spot is."],["What is recovery like?","Mild soreness for a few days. Stitches usually dissolve in 1–2 weeks. Avoid spicy, hot or crunchy food near the site."],["When will I get results?","Usually in about 1–2 weeks. We will contact you to explain them and the next steps. Call us if you have not heard from us in 2 weeks."]],
es:[["¿Qué es una biopsia?","Sacamos un pedacito de tejido, o toda la lesión si es pequeña, y lo enviamos a un patólogo que lo examina con microscopio."],["¿Significa que tengo cáncer?","No. La mayoría de las biopsias de la boca no son cáncer. La biopsia es la única forma de saber con certeza qué es una lesión."],["¿Cómo es la recuperación?","Un poco de dolor por unos días. Los puntos por lo general se disuelven en 1–2 semanas. Evite comida picante, caliente o crujiente cerca de la zona."],["¿Cuándo tendré los resultados?","Por lo general en 1–2 semanas. Lo llamaremos para explicarle los resultados y los siguientes pasos. Llámenos si no sabe de nosotros en 2 semanas."]],
kea:[["Kuze ki é un biópsia?","Nu ta tira un pedasinhu di tesidu, o tudu feridu si e pikinoti, i nu ta manda-l pa un patologista ki ta djobe-l ku mikroskópiu."],["Kel-li ta signifika ma N ten kánser?","Nau. Má párti di biópsia di boka ka é kánser. Biópsia é úniku manera di sabe ku sertéza kuze ki un feridu é."],["Modi ki rekuperason ta ser?","Un bokadinhu di dor pa alguns dia. Pontu normalmenti ta dizolve na 1–2 simana. Evita kumida pikanti, kenti o ki ta stala pertu di lugar."],["Kuandu ki N ta ten rezultadu?","Normalmenti na 1–2 simana. Nu ta kontata-bu pa splika rezultadu i prósimu pasu. Txoma-nu si bu ka obi nada di nos na 2 simana."]],
zh:[["什么是活检？","我们切取一小块组织（如果病变很小，就整个切除），送给病理医生在显微镜下检查。"],["这是否表示我得了癌症？","不是。大多数口腔活检结果都不是癌症。活检是确切知道病变性质的唯一方法。"],["恢复情况如何？","几天内会有轻微疼痛。缝线通常在1–2周内自行溶解。避免在伤口附近吃辛辣、过烫或酥脆的食物。"],["什么时候能拿到结果？","通常约1–2周。我们会联系您解释结果和下一步。如果2周内没有收到我们的消息，请致电我们。"]]}},
{id:"fcan",k:"proc",src:["goodson","kademani"],t:{"en":"Exposure of an impacted canine","es":"Exposición de un canino retenido","kea":"Diskubri un denti kaninu prezu","zh":"阻生尖牙开窗术"},i:{
en:[["Why is this needed?","The eye tooth (canine) is stuck in the bone and will not come in on its own. We uncover it so your orthodontist can guide it into place."],["What happens during surgery?","We uncover the tooth and usually attach a small bracket with a thin chain. The chain is tied to your braces."],["How long does it take to come in?","Your orthodontist moves the tooth slowly, usually over several months to a year."],["When should I call?","Call us or your orthodontist if the chain or bracket comes loose, or for swelling or fever after day 3."]],
es:[["¿Por qué se necesita?","El colmillo (canino) está atrapado en el hueso y no saldrá solo. Lo descubrimos para que su ortodoncista lo guíe a su lugar."],["¿Qué pasa en la cirugía?","Descubrimos el diente y por lo general pegamos un pequeño bracket con una cadenita delgada. La cadenita se amarra a los frenos."],["¿Cuánto tarda en salir?","Su ortodoncista mueve el diente poco a poco, por lo general en varios meses a un año."],["¿Cuándo debo llamar?","Llámenos a nosotros o a su ortodoncista si la cadenita o el bracket se suelta, o si hay hinchazón o fiebre después del día 3."]],
kea:[["Pamodi ki kel-li ta mesté?","Denti kaninu sta prezu na osu i e ka ta nase sozinhu. Nu ta diskubri-l pa bu ortodontista pode gia-l pa se lugar."],["Kuze ki ta kontise na sirurjia?","Nu ta diskubri denti i normalmenti nu ta pega un braket pikinoti ku un korentinha finu. Korentinha ta maradu na bu aparedju."],["Kantu tenpu e ta leba pa nase?","Bu ortodontista ta move denti divagarinhu, normalmenti na alguns mês ti un anu."],["Kuandu N debe txoma?","Txoma-nu, o bu ortodontista, si korentinha o braket solta, o si bu tene inxason o febri dipôs di dia 3."]],
zh:[["为什么需要做这个？","尖牙（犬齿）被卡在骨头里，自己长不出来。我们把它暴露出来，让您的正畸医生把它引导到正确位置。"],["手术中会做什么？","我们暴露牙齿，通常会粘上一个小托槽，连着一条细链子。链子会绑在您的牙套上。"],["多久能长出来？","正畸医生会慢慢移动这颗牙，通常需要几个月到一年。"],["什么时候应该打电话？","如果链子或托槽松脱，或第3天后出现肿胀或发烧，请致电我们或您的正畸医生。"]]}},
{id:"fao",k:"dx",src:["aotx","aoprev"],t:{"en":"Dry socket","es":"Alveolitis seca (alvéolo seco)","kea":"Alvéolu seku","zh":"干槽症"},i:{
en:[["What is a dry socket?","The blood clot in the socket breaks down or is lost too early, leaving bone exposed. It is irritated bone, not an infection."],["What does it feel like?","Pain that gets worse instead of better, usually 2–4 days after removal. It often spreads to the ear. There may be a bad taste or smell."],["Who gets it?","It is most common after lower wisdom teeth. Smoking, vaping and a hard removal raise the risk."],["How is it treated?","We gently clean the socket and may place a soothing medicated dressing. Pain usually eases within a day. Antibiotics are usually not needed."],["How long does it last?","With care, most heal over 1–2 weeks. It does not cause lasting harm."]],
es:[["¿Qué es la alveolitis seca?","El coágulo del alvéolo se deshace o se pierde antes de tiempo y el hueso queda expuesto. Es hueso irritado, no una infección."],["¿Cómo se siente?","Dolor que empeora en vez de mejorar, por lo general 2–4 días después de la extracción. A menudo se extiende al oído. Puede haber mal sabor o mal olor."],["¿A quién le da?","Es más común después de sacar muelas del juicio de abajo. Fumar, vapear y una extracción difícil aumentan el riesgo."],["¿Cómo se trata?","Limpiamos el alvéolo con cuidado y podemos poner un apósito con medicina que calma. El dolor suele bajar en un día. Por lo general no se necesitan antibióticos."],["¿Cuánto dura?","Con cuidado, la mayoría sana en 1–2 semanas. No deja daño permanente."]],
kea:[["Kuze ki é alvéolu seku?","Kuágulu di sangi na buraku di denti ta dizfazi o ta pérde antis di tenpu, i osu ta fika diskubértu. É osu irritadu, ka é infeson."],["Modi ki ta xinti?","Dor ki ta piora en vez di midjora, normalmenti 2–4 dia dipôs di tira denti. Txeu bes e ta bai ti uvidu. Pode ten gostu o txeru mau."],["Kenha ki ta panha-l?","É más kumun dipôs di tira denti di juízu di baxu. Fuma, uza vape i un ekstrason difísil ta aumenta risku."],["Modi ki ta trata-l?","Nu ta linpa buraku ku kuidadu i nu pode poi un pensu ku rémédiu ki ta kalma. Dor normalmenti ta baxa na un dia. Normalmenti ka ta mesté antibiótiku."],["Kantu tenpu e ta dura?","Ku kuidadu, má párti ta kura na 1–2 simana. E ka ta dexa stragu permanenti."]],
zh:[["什么是干槽症？","拔牙窝里的血块过早分解或脱落，使骨头暴露。这是骨头受刺激，不是感染。"],["是什么感觉？","疼痛不但没有减轻反而加重，通常在拔牙后2–4天出现，常放射到耳朵。可能有怪味或口臭。"],["哪些人容易得？","最常见于拔除下颌智齿后。吸烟、吸电子烟和拔牙难度大都会增加风险。"],["怎么治疗？","我们会轻轻清洗拔牙窝，并可能放入有舒缓作用的药物敷料。疼痛通常在一天内减轻。一般不需要抗生素。"],["会持续多久？","经过处理，大多数在1–2周内愈合，不会留下永久损害。"]]}},
{id:"finf",k:"dx",src:["adaAbx","sdcepAbs"],t:{"en":"Tooth infection and facial swelling","es":"Infección dental e hinchazón de la cara","kea":"Infeson di denti i inxason na fasi","zh":"牙齿感染与面部肿胀"},i:{
en:[["Why do I need a procedure, not just antibiotics?","Antibiotics do not reach the source. The infection returns unless the tooth is treated (root canal or removal) and any pus is drained."],["Are antibiotics always needed?","No. They help when infection is spreading or you have a fever. If prescribed, take them exactly as directed."],["How fast will I improve?","Most people feel better within 2–3 days of treatment. Swelling can take a week to go away."],["When is it an emergency?","Go to the emergency room or call 911 for trouble breathing or swallowing, swelling under the tongue or in the neck, an eye swelling shut, or a high fever with feeling very ill."]],
es:[["¿Por qué necesito un procedimiento y no solo antibióticos?","Los antibióticos no llegan al origen. La infección regresa si no se trata el diente (endodoncia o extracción) y no se drena el pus."],["¿Siempre se necesitan antibióticos?","No. Ayudan cuando la infección se está extendiendo o tiene fiebre. Si se los recetan, tómelos tal como se indica."],["¿Qué tan rápido mejoraré?","La mayoría se siente mejor en 2–3 días después del tratamiento. La hinchazón puede tardar una semana en bajar."],["¿Cuándo es una emergencia?","Vaya a la sala de emergencias o llame al 911 si tiene dificultad para respirar o tragar, hinchazón debajo de la lengua o en el cuello, un ojo que se cierra por la hinchazón, o fiebre alta y se siente muy mal."]],
kea:[["Pamodi N mesté un prusedimentu i ka só antibiótiku?","Antibiótiku ka ta txiga na orijen. Infeson ta volta si denti ka trata (tratamentu di kanal o ekstrason) i si pus ka drena."],["Sénpri ta mesté antibiótiku?","Nau. Es ta djuda ora ki infeson sta ta spadja o bu tene febri. Si nu pasa-bu, toma-s sima nu fla."],["Kantu rápidu N ta midjora?","Má párti di genti ta xinti midjór na 2–3 dia dipôs di tratamentu. Inxason pode leba un simana pa bai."],["Kuandu ki é emerjénsia?","Bai pa urjénsia o txoma 911 si bu ten difikuldadi pa rispira o pa ingoli, inxason baxu di língua o na pesku, un odju ki ta fitxa ku inxason, o febri altu i bu sta ta xinti mutu mal."]],
zh:[["为什么需要做治疗，而不只是吃抗生素？","抗生素到达不了感染的源头。除非治疗这颗牙（根管治疗或拔牙）并把脓液引流出来，否则感染会复发。"],["一定需要抗生素吗？","不一定。当感染正在扩散或您发烧时，抗生素才有帮助。如果开了抗生素，请严格按照医嘱服用。"],["多快会好转？","大多数人在治疗后2–3天内感觉好转。肿胀可能需要一周才消退。"],["什么情况属于紧急情况？","如果呼吸或吞咽困难、舌下或颈部肿胀、眼睛肿到睁不开，或高烧并感到非常不适，请去急诊室或拨打911。"]]}},
{id:"fnerve",k:"dx",src:["meyer","kodsi"],t:{"en":"Numbness after surgery","es":"Adormecimiento después de la cirugía","kea":"Dormênsia dipôs di sirurjia","zh":"术后麻木"},i:{
en:[["Why is my lip, chin or tongue still numb?","A nerve near the surgery was bruised or stretched. This can happen even when surgery goes well."],["Will it come back?","Most numbness improves over weeks to months. Permanent numbness is uncommon."],["What should I do?","Take care not to bite or burn the numb area. Tell us right away. We will test the feeling and follow you closely."],["What if it is not improving?","If feeling has not started to return within the first few months, we may send you to a nerve specialist. Some nerves can be repaired, and earlier referral gives the best chance."]],
es:[["¿Por qué sigo con el labio, la barbilla o la lengua dormidos?","Un nervio cerca de la cirugía se golpeó o se estiró. Esto puede pasar aunque la cirugía salga bien."],["¿Volverá la sensibilidad?","La mayoría mejora en semanas o meses. El adormecimiento permanente es poco común."],["¿Qué debo hacer?","Cuídese de no morder ni quemar la zona dormida. Avísenos de inmediato. Revisaremos la sensibilidad y le daremos seguimiento de cerca."],["¿Y si no mejora?","Si la sensibilidad no empieza a volver en los primeros meses, podemos enviarlo con un especialista en nervios. Algunos nervios se pueden reparar, y referirlo a tiempo da la mejor probabilidad."]],
kea:[["Pamodi nha lábiu, kexu o língua inda sta dromidu?","Un nérvu pertu di sirurjia fika magoadu o stikadu. Kel-li pode kontise mesmu si sirurjia kóre dretu."],["Sensason ta volta?","Má párti di dormênsia ta midjora na simana o mês. Dormênsia permanenti ka é kumun."],["Kuze ki N debe fazi?","Toma kuidadu pa ka morde nen kema lugar dromidu. Fla-nu logu. Nu ta testa sensason i nu ta akonpanha-bu di pertu."],["I si ka midjora?","Si sensason ka kumesa volta na purmeru mês, nu pode manda-bu pa un spesialista di nérvu. Alguns nérvu pode ser reparadu, i manda sedu ta da midjór xansi."]],
zh:[["为什么我的嘴唇、下巴或舌头还是麻木的？","手术附近的一条神经受到挫伤或牵拉。即使手术很顺利也可能发生。"],["感觉会恢复吗？","大多数麻木会在几周到几个月内好转。永久性麻木并不常见。"],["我该怎么做？","小心不要咬伤或烫伤麻木的部位。请立即告诉我们。我们会检查感觉并密切随访。"],["如果没有好转怎么办？","如果头几个月内感觉没有开始恢复，我们可能会转诊您去看神经专科医生。有些神经可以修复，越早转诊机会越大。"]]}},
{id:"foac",k:"dx",src:["andersson"],t:{"en":"Sinus opening after an upper tooth removal","es":"Comunicación con el seno después de sacar un diente de arriba","kea":"Komunikason ku seiu dipôs di tira un denti di riba","zh":"拔上牙后口腔与上颌窦相通"},i:{
en:[["What happened?","The roots of upper back teeth can sit right next to the sinus. Removing the tooth can leave a small opening between the mouth and the sinus."],["Will it close?","Small openings usually close on their own. Larger ones are closed with a small procedure, often the same day."],["What precautions should I take?","For 2 weeks: do not blow your nose, sneeze with your mouth open, no straws, no smoking, and no flying unless we say it is OK."],["When should I call?","Call if liquid comes out of your nose when you drink, air passes between mouth and nose, or you have bad-smelling nasal drainage or worsening sinus pain."]],
es:[["¿Qué pasó?","Las raíces de las muelas de arriba pueden estar junto al seno. Al sacar el diente puede quedar una pequeña comunicación entre la boca y el seno."],["¿Se cerrará?","Las comunicaciones pequeñas suelen cerrarse solas. Las grandes se cierran con un pequeño procedimiento, a menudo el mismo día."],["¿Qué precauciones debo tomar?","Por 2 semanas: no se suene la nariz, estornude con la boca abierta, no use popotes (pajillas), no fume, y no viaje en avión a menos que le digamos que puede."],["¿Cuándo debo llamar?","Llame si sale líquido por la nariz al beber, pasa aire entre la boca y la nariz, o tiene secreción nasal con mal olor o dolor del seno que empeora."]],
kea:[["Kuze ki kontise?","Raís di denti di trás di riba pode sta mésmu djuntu di seiu. Ora ki ta tira denti, pode fika un abértura pikinoti entri boka i seiu."],["E ta fitxa?","Abértura pikinoti normalmenti ta fitxa sozinhu. Kes más grandi ta fitxadu ku un prusedimentu pikinoti, txeu bes na mesmu dia."],["Ki kuidadu N debe toma?","Pa 2 simana: ka bu asua nariz, spirra ku boka abértu, ka bu uza palinha, ka bu fuma, i ka bu viaja di avion a ménus ki nu fla ma bu pode."],["Kuandu N debe txoma?","Txoma si líkidu ta sai na nariz ora ki bu bebe, ar ta pasa entri boka i nariz, o bu tene katarru ku txeru mau o dor di seiu ki ta piora."]],
zh:[["发生了什么？","上后牙的牙根可能紧贴上颌窦。拔牙后，口腔和上颌窦之间可能留下一个小开口。"],["它会自己闭合吗？","小的开口通常会自行闭合。较大的开口需要做一个小手术关闭，常在同一天完成。"],["我需要注意什么？","2周内：不要擤鼻涕，打喷嚏时张开嘴，不要用吸管，不要吸烟，除非我们同意，否则不要乘坐飞机。"],["什么时候应该打电话？","如果喝水时液体从鼻子流出、口腔和鼻子之间有气流通过、鼻涕有异味或上颌窦疼痛加重，请致电我们。"]]}},
{id:"ftmd",k:"dx",src:["rcs","bmj"],t:{"en":"Jaw joint and muscle pain (TMD)","es":"Dolor de la articulación y los músculos de la mandíbula (TTM)","kea":"Dor na juntura i músklu di kexada (DTM)","zh":"颞下颌关节及咀嚼肌疼痛（TMD）"},i:{
en:[["What is TMD?","Pain or clicking in the jaw joint (TMJ) and chewing muscles. It is common and usually not serious."],["Will it get better?","Most people improve with simple self-care over weeks to months. It can come and go, often with stress or clenching."],["What helps?","Soft food, small bites, no gum. Warm or cool packs. Keep teeth apart and jaw relaxed. Gentle stretches we show you. Short-term pain relievers if safe for you."],["What else can be done?","A night guard, physical therapy, and help with stress, sleep or clenching. Surgery is rarely needed."],["When should I call?","Call if your jaw locks open or closed, your bite suddenly changes, or pain is severe or getting worse."]],
es:[["¿Qué es el TTM?","Dolor o chasquidos en la articulación de la mandíbula (ATM) y los músculos de masticar. Es común y por lo general no es grave."],["¿Va a mejorar?","La mayoría mejora con cuidados sencillos en semanas o meses. Puede ir y venir, a menudo con estrés o al apretar los dientes."],["¿Qué ayuda?","Comida blanda, bocados pequeños, nada de chicle. Compresas tibias o frías. Mantenga los dientes separados y la mandíbula relajada. Estiramientos suaves que le enseñemos. Analgésicos por poco tiempo si son seguros para usted."],["¿Qué más se puede hacer?","Un protector nocturno, fisioterapia y ayuda con el estrés, el sueño o el hábito de apretar. La cirugía rara vez se necesita."],["¿Cuándo debo llamar?","Llame si la mandíbula se traba abierta o cerrada, la mordida cambia de repente, o el dolor es fuerte o empeora."]],
kea:[["Kuze ki é DTM?","Dor o stalu na juntura di kexada (ATM) i na músklu di mastiga. É kumun i normalmenti ka é gravi."],["E ta midjora?","Má párti di genti ta midjora ku kuidadu simplis na simana o mês. E pode bai i volta, txeu bes ku stresi o ora ki bu ta apérta denti."],["Kuze ki ta djuda?","Kumida mol, pedasu pikinoti, nada di txikleti. Kompresa mornu o friu. Manti denti separadu i kexada rilaxadu. Stiramentu suavi ki nu ta mostra-bu. Rémédiu pa dor pa pouku tenpu si e sigur pa bo."],["Kuze más ki pode fazedu?","Un protetor di noti, fizioterapia i djuda ku stresi, sonu o kustumi di apérta denti. Sirurjia raramenti ta mesté."],["Kuandu N debe txoma?","Txoma si bu kexada trava abértu o fitxadu, bu mordida muda di repenti, o dor sta forti o ta piora."]],
zh:[["什么是TMD？","颞下颌关节（TMJ）和咀嚼肌的疼痛或弹响。这很常见，通常并不严重。"],["会好转吗？","大多数人通过简单的自我护理，在几周到几个月内好转。症状可能时好时坏，常与压力或紧咬牙有关。"],["什么方法有帮助？","吃软食，小口进食，不嚼口香糖。热敷或冷敷。保持上下牙分开、下颌放松。做我们教您的轻柔伸展运动。如果对您安全，可短期服用止痛药。"],["还有其他治疗吗？","夜间护牙套、物理治疗，以及帮助处理压力、睡眠或紧咬牙问题。很少需要手术。"],["什么时候应该打电话？","如果下颌卡住张不开或合不上、咬合突然改变，或疼痛剧烈或加重，请致电我们。"]]}},
{id:"fmronj",k:"dx",src:["aaoms"],t:{"en":"Bone medicines and jaw bone health (MRONJ)","es":"Medicinas para los huesos y salud del hueso de la mandíbula (MRONJ)","kea":"Rémédiu pa osu i saúdi di osu di kexada (MRONJ)","zh":"骨质药物与颌骨健康（MRONJ）"},i:{
en:[["What is MRONJ?","Exposed jaw bone that does not heal for more than 8 weeks in someone who takes, or took, certain bone or cancer medicines."],["Which medicines?","Bone medicines such as Fosamax (alendronate), Boniva, Reclast or Zometa (zoledronic acid), Prolia or Xgeva (denosumab), and some cancer drugs that block blood vessel growth."],["How likely is it?","At osteoporosis doses the risk is low. It is higher with the stronger doses used for cancer."],["Should I stop my medicine before surgery?","Do not stop it on your own. These medicines protect you from fractures or cancer problems. Your prescribing doctor and surgeon will decide together."],["How can I lower my risk?","Tell every dentist about these medicines. Get needed dental work done before starting them when possible, and keep up with cleanings and good home care. Report any exposed bone, sore spot or loose tooth."]],
es:[["¿Qué es la MRONJ?","Hueso expuesto en la mandíbula que no sana por más de 8 semanas en alguien que toma, o tomó, ciertas medicinas para los huesos o el cáncer."],["¿Qué medicinas?","Medicinas para los huesos como Fosamax (alendronato), Boniva, Reclast o Zometa (ácido zoledrónico), Prolia o Xgeva (denosumab), y algunos medicamentos para el cáncer que bloquean el crecimiento de vasos sanguíneos."],["¿Qué tan probable es?","Con las dosis para la osteoporosis el riesgo es bajo. Es mayor con las dosis más fuertes que se usan para el cáncer."],["¿Debo dejar mi medicina antes de la cirugía?","No la deje por su cuenta. Estas medicinas lo protegen de fracturas o de problemas del cáncer. Su médico y su cirujano lo decidirán juntos."],["¿Cómo bajo mi riesgo?","Avísele a todo dentista que toma estas medicinas. Si es posible, hágase el trabajo dental necesario antes de empezarlas, y mantenga sus limpiezas y buena higiene en casa. Avise si ve hueso expuesto, una llaga o un diente flojo."]],
kea:[["Kuze ki é MRONJ?","Osu di kexada diskubértu ki ka ta kura pa más di 8 simana na algen ki ta toma, o ki dja toma, sertu rémédiu pa osu o pa kánser."],["Kal rémédiu?","Rémédiu pa osu sima Fosamax (alendronatu), Boniva, Reclast o Zometa (ásidu zoledróniku), Prolia o Xgeva (denosumab), i alguns rémédiu pa kánser ki ta bloka krisimentu di vazu di sangi."],["Kal ki é xansi?","Ku dóza pa osteoporozi, risku é baxu. E é más altu ku dóza más forti ki ta uza pa kánser."],["N debe para nha rémédiu antis di sirurjia?","Ka bu para-l pa bu konta. Es rémédiu ta proteje-bu di fratura o di prubléma di kánser. Bu médiku i bu sirurjion ta disidi djuntu."],["Modi ki N ta baxa nha risku?","Fla tudu dentista ma bu ta toma es rémédiu. Si da, fazi trabadju dentáriu ki bu mesté antis di kumesa-s, i manti bu linpéza i bon igiéne na kaza. Fla-nu si bu odja osu diskubértu, un feridu o un denti moli."]],
zh:[["什么是MRONJ？","正在或曾经使用某些骨质药物或抗癌药物的人，颌骨外露且超过8周不愈合。"],["哪些药物？","骨质药物，例如Fosamax（阿仑膦酸钠）、Boniva、Reclast或Zometa（唑来膦酸）、Prolia或Xgeva（地舒单抗），以及一些抑制血管生长的抗癌药物。"],["发生的可能性有多大？","以治疗骨质疏松的剂量使用时，风险很低。用于癌症的较强剂量风险较高。"],["手术前需要停药吗？","不要自行停药。这些药物能保护您避免骨折或癌症相关问题。您的处方医生和外科医生会一起决定。"],["如何降低风险？","告诉每一位牙医您在用这些药物。如果可能，在开始用药前完成需要的牙科治疗，并定期洁牙、在家做好口腔清洁。如发现骨头外露、溃疡或牙齿松动，请告诉我们。"]]}},
{id:"fperi",k:"dx",src:["efp"],t:{"en":"Gum disease around implants (peri-implantitis)","es":"Enfermedad de las encías alrededor de implantes (periimplantitis)","kea":"Duensa di jenjiva na volta di implanti (periimplantiti)","zh":"种植体周围炎（种植牙周围的牙龈疾病）"},i:{
en:[["What is peri-implantitis?","Infection and inflammation of the gum around an implant, with loss of the bone that holds it. Caught early (gum only), it is easier to reverse."],["What are the signs?","Bleeding when brushing, swelling, pus, bad taste, gum pulling back, or a loose implant crown. It may not hurt."],["What raises the risk?","Plaque buildup, past gum disease, smoking, diabetes, and missing checkups."],["How is it treated?","Deep cleaning around the implant, sometimes with antiseptic rinses or antibiotics. If bone is lost, surgery may clean and reshape or regrow bone. Rarely, the implant must be removed."],["How do I prevent it?","Clean around implants daily with a brush and floss or water flosser. Keep regular cleanings, usually every 3–6 months, as we advise. Do not smoke."]],
es:[["¿Qué es la periimplantitis?","Infección e inflamación de la encía alrededor de un implante, con pérdida del hueso que lo sostiene. Si se detecta temprano (solo en la encía), es más fácil revertirla."],["¿Cuáles son las señales?","Sangrado al cepillarse, hinchazón, pus, mal sabor, encía que se retrae, o una corona sobre implante floja. Puede no doler."],["¿Qué aumenta el riesgo?","Acumulación de placa, enfermedad de las encías antes, fumar, diabetes y faltar a los controles."],["¿Cómo se trata?","Limpieza profunda alrededor del implante, a veces con enjuagues antisépticos o antibióticos. Si hay pérdida de hueso, una cirugía puede limpiar y remodelar o regenerar el hueso. Rara vez hay que retirar el implante."],["¿Cómo la prevengo?","Limpie alrededor de los implantes cada día con cepillo e hilo dental o irrigador de agua. Vaya a sus limpiezas, por lo general cada 3–6 meses, según le indiquemos. No fume."]],
kea:[["Kuze ki é periimplantiti?","Infeson i inflamason di jenjiva na volta di un implanti, ku pérda di osu ki ta sigura-l. Si ta diskubri sedu (só na jenjiva), é más fásil di inverte."],["Kuze ki é sinal?","Sangi ora ki bu skova, inxason, pus, gostu mau, jenjiva ki ta baxa, o un koroa di implanti moli. Pode ka dói."],["Kuze ki ta aumenta risku?","Pláka akumuladu, duensa di jenjiva antis, fuma, diabetis i falta konsulta di kontrolu."],["Modi ki ta trata-l?","Linpéza fundu na volta di implanti, às bes ku lava boka antisétiku o antibiótiku. Si dja pérde osu, un sirurjia pode linpa i modela o torna kria osu. Raramenti ta mesté tira implanti."],["Modi ki N ta preveni-l?","Linpa na volta di implanti tudu dia ku skova i fiu dental o irigador di agu. Bai bu linpéza, normalmenti di 3 en 3 o di 6 en 6 mês, sima nu fla-bu. Ka bu fuma."]],
zh:[["什么是种植体周围炎？","种植体周围牙龈的感染和炎症，并伴有支撑种植体的骨头流失。如果早期发现（只累及牙龈），较容易逆转。"],["有哪些迹象？","刷牙时出血、肿胀、流脓、口中有怪味、牙龈退缩，或种植牙冠松动。可能不痛。"],["什么会增加风险？","牙菌斑堆积、曾有牙周病、吸烟、糖尿病，以及不按时复查。"],["怎么治疗？","深度清洁种植体周围，有时配合抗菌漱口水或抗生素。如果有骨流失，可能需要手术清理、修整或再生骨头。极少数情况下需要取出种植体。"],["如何预防？","每天用牙刷和牙线或冲牙器清洁种植体周围。按我们的建议定期洁牙，通常每3–6个月一次。不要吸烟。"]]}}];

function patientMedicationRisk(){const ids=new Set([...(S.asmt||[]),...(S.fid?[S.fid]:[])]),a=ageNum();
 /* Lithium or methotrexate on the prescribing check (or not yet answered No) withholds routine NSAID dosing, as in the clinician plan. */
 const rxN=ids.has('rxint')&&(S.pf.rxLi!=='n'||S.pf.rxMtx!=='n');
 const organ=Object.keys(S.ans.liver||{}).length>0,pregnancy=Object.keys(S.ans.preg||{}).length>0;
 const nsaid=pregnancy||['renal','tx','bleeddx','doac','warfarin','antiplatelet'].some(id=>ids.has(id))||rxN||S.ans.preop?.c===true||S.ans.pain?.a===true;
 return{nsaid,organ,withhold:organ||nsaid||ids.has('bupe')||(a!=null&&a<18)||(S.wt!=null&&S.wt<50)}
}
function hoItems(h,l){const risk=patientMedicationRisk(),u=PATIENT_UI[l]||PATIENT_UI.en;
 const xs=h.i[l].map((t,k)=>({t:risk.withhold&&k===HO_PAIN_INDEX[h.id]?u.meds+(risk.nsaid?' '+u.nsaid:''):t,ic:(HO_ICON[h.id]||[])[k]||'',w:HO_WARN(t)}));return[...xs.filter(x=>x.w),...xs.filter(x=>!x.w)]}

}
/* What the card shows and the short text says: title, call line, up to 3 call-us/911 lines, link. */
function patientExport(){const e=S.hoExport;if(!e)return null;const l=S.lang||'en',ph=officePh();let L=l,t='',warn=[];
 const h=HO.find(x=>x.id===e.id),f=FAQ.find(x=>x.id===e.id),g=e.kind==='grid'?OG.find(x=>x.id===e.id):null;
 if(g){L=g.t[l]?l:'en';t=g.t[L]}else if(h){t=h.t[l];warn=hoItems(h,l).filter(x=>x.w).slice(0,3).map(x=>({ic:x.ic,t:x.t.replace('[office phone]',ph||'your surgeon’s office')}))}else if(f){L=faqL(l);t=f.t[L]}else return null;
 /* A recorded medication precaution or age/weight limit withholds the general pain doses; the patient page shows them, so no link or QR. */
 const hold=!!h&&patientMedicationRisk().withhold;
 return{l,L,t,ph,warn,hold,url:patientURL(e.id,l)}}
function patientShortText(){const x=patientExport();if(!x)return'';const P=PT[x.l]||PT.en;

/* Text that leaves the app: the short message, or the full text (no link) when doses are withheld. */

 const need=x.ph?'':`<div class="red" id="oph-need"><b>Add your office phone first.</b> Every patient message carries a number to call. Saved on this device only.<div style="margin-top:8px">${ophFieldHTML('oph-in')}</div></div>`;

 const qr=!x.ph?'':x.hold?`<p class="small" id="qr-held"><b>No QR or link for this patient.</b> The patient page lists the general pain doses, and a medication precaution or age/weight limit is recorded. Send the full text (it withholds them) and give the written medication plan.</p>`:`<div class="qrwrap">${qrSVG(x.url,'QR code: opens these instructions on the patient’s phone')}<p class="small">Patient scans with the phone camera. Opens in ${esc(ln)}, with every handout and FAQ one tap away. Nothing is sent from your phone; the link carries no patient details.</p></div>`;
 const btns=x.ph?`<button class="gobtn" data-patient-confirm>Copy ${x.hold?'full text':'text'} for front desk</button><button class="go" data-patient-share>Share from my phone ↗</button>`:'';
 return`<section class="box inner" id="patient-export-preview" role="region" aria-label="Patient export preview"><h3>Send to patient</h3>${need}${card}${qr}${btns}<button class="go" data-patient-cancel>${esc(u.cancel)}</button><p class="small">Check language, practice phone, medication precautions and doses. Translations need fluent-speaker review. “Share from my phone” sends from your own number.</p><details class="more"><summary>Show full text</summary><textarea class="copybox" rows="12" readonly aria-label="Patient export text">${esc(x.hold?patientFullText():patientShortText()+'\n\n— Full text —\n\n'+patientFullText())}</textarea></details></section>`}

 if(/\[verify/.test(text||''))b='un';return b}

function condHTML(it){const g=condGroups(it);if(!g)return condText(it)?`<span class="cond">${esc(condText(it))}</span>`:'';
 return`<ul class="condr">${g.map(([d,ls])=>`<li>${d?`<span class="dtag sm d-${DISP[d][1]}">${esc(DISP[d][0])}</span>`:'<span class="dtag sm">No finding action</span>'}<span>${esc(ls.join(' / '))}</span></li>`).join('')}</ul>`}
function condText(it){const r=it.r;if(!it.q||!r)return'';
 if(it.after)return`Can change the plan once “${it.after}” is known; no answer is assumed.`;
 if(it.q.type==='num')return'No value is assumed; the reported result'+(it.q.unitSel?' and unit set':' sets')+' the plan.';
 if(!r.choices.length)return'';const g=new Map();
 r.choices.forEach(c=>{const ds=it.fids.map(id=>c.pd&&c.pd[id]).filter(Boolean),d=ds.length?ds.reduce((a,b)=>DRANK[b]>DRANK[a]?b:a):c.d,l=d?DISP[d][0]:'No finding action';g.set(l,[...(g.get(l)||[]),c.label.split(' (')[0].split(' · ')[0]])});

const itemLab=it=>it.q?it.q.q.replace(/[?…]$/,''):it.t.replace(/^Resolve conflict: /,'Resolve conflict: ').replace(/^(Resolve conflict: [^.]*\.).*$/,'$1');

 const li=it=>`<li>${actChip(it.act)}${it===inline?`<span class="small">${esc(itemCtx(it))}</span>${qHTML(it.q).replace(/ (id|for)="(question|pf)-/g,' $1="next-$2-')}`:`<b>${esc(itemLab(it))}</b>${it.unk?' <span class="small">(marked Unknown)</span>':''}${itemCtx(it)?` <span class="small">· ${esc(itemCtx(it))}</span>`:''}`}${it.dec?condHTML(it):''}${it.q&&where==='asmt'?((['proc','anes','urg'].includes(it.k)?`<button class="go" data-ctxq="${it.k}">Answer under Context ›</button>`:`<button class="go" data-question="${it.k}" data-qfid="${it.fids[0]}">${it===inline?'Open finding':'Answer'} ›</button>`)):''}</li>`;

 {k:'a1c',re:/^(?:a1c|hba1c|hb a1c|hgb ?a1c|hemoglobin a1c)$/,name:'HbA1c',fid:()=>'a1c',unitSel:'a1cU',stale:['a1cAge'],units:[[/^%$/,'pct'],[/^mmol ?\/ ?mol$/,'mmol']]},

 const name=m[1].trim().replace(/\s+/g,' '),tail=m[3].trim();
 if(/^(crcl|cr cl|creatinine clearance)$/.test(name))return{crcl:m[2]};
 const L=LABCAP.find(x=>x.re.test(name));if(!L)return null;
 if(/^[,.\d]/.test(m[3]))return{L,bad:true};

 if(L.unitSel){const u=L.units.find(([re])=>re.test(tail));if(u)unit=u[1];else if(tail)extra=tail}

function labCapHTML(q){const r=parseLab(q);if(!r)return'';
 if(r.crcl)return`<div class="labcap" role="note"><div class="lab">CrCl ${esc(r.crcl)} · not recorded</div><p class="small">Compass has no CrCl field, and it never converts CrCl to or from eGFR. The DOAC finding asks for CrCl when an interruption is planned.</p></div>`;
 if(r.bad)return`<div class="labcap" role="note"><div class="lab">${esc(r.L.name)} · not recorded</div><p class="small">Type the number without commas or spaces (e.g., ${r.L.k==='plt'?'“platelets 45 k” or “platelets 45000 /µL”':'“'+esc(r.L.name)+' 2.6”'}).</p></div>`;

 return`<div class="labcap" role="group" aria-label="Record ${esc(L.name)} result"><div class="lab">Record this result? · not yet recorded</div><div class="lv">${esc(L.name)} ${esc(r.v)}${st.unit?' '+esc(unitName(L,st.unit)):''}</div>
 ${L.unitSel?`<p class="small">${r.unit?'Unit as typed.':'<b>Choose the unit as reported</b> — it is never assumed.'}</p>${r.unit?'':`<div class="chips">${q0.units.map(([v,l])=>`<button class="tg${st.unit===v?' on':''}" data-labu="${v}" aria-pressed="${st.unit===v}">${esc(l)}</button>`).join('')}</div>`}`:`<p class="small">Unit: ${esc(L.unit)}</p>`}

 /* Findings, clause by clause, with negation and past-use checks. */
 const seen=new Set(items.filter(i=>i.kind==='f').map(i=>i.id));
 t.replace(/\bhead (?:and|&) neck\b|\bh ?& ?n\b/g,'head neck').split(/[,;\n]|\s\+\s|\band\b|\. /).map(x=>x.trim()).filter(Boolean).forEach(cl=>{

 const before=planBeforeEdit(),cleared=[];S.asmt=S.asmt||[];const addF=id=>{if(!S.asmt.includes(id))S.asmt.push(id)};
 sel.filter(i=>i.kind==='ctx').forEach(i=>{S.pf[i.k]=i.v});
 sel.filter(i=>i.kind==='f').forEach(i=>{addF(i.id);applyPreset(i.id,i.hit)});
 sel.filter(i=>i.kind==='lab').forEach(i=>{const r=i.r,L=r.L,st=labState(r);if(!st.same){const cl=L.stale.filter(k=>S.pf[k]!==undefined);cl.forEach(k=>{delete S.pf[k];cleared.push(k)});S.pf[L.k]=r.v;if(L.unitSel)S.pf[L.unitSel]=r.unit;if(S.lkc)delete S.lkc[L.k]}addF(L.fid())});
 S.q='';delete S.casePick;delete S.labPick;recordPlanEdit(before,'case text',cleared);S.atab='find';asmtView()}
